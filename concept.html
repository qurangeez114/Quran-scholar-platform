<script>
const SB_URL='https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';

const ETH=new Set(['am','ti']);
let F=[],C=null,EV=[],SEC=[],langs=new Set(['en']);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}
async function load(){
  F=await(await fetch(`${SB_URL}/rest/v1/concept_facets?concept_slug=eq.${CONCEPT}&select=*&order=facet,sura,aya`,{headers:HDR})).json();
  C=(await(await fetch(`${SB_URL}/rest/v1/concepts?slug=eq.${CONCEPT}&select=*`,{headers:HDR})).json())[0]||null;
  EV=await(await fetch(`${SB_URL}/rest/v1/concept_evaluation?concept_slug=eq.${CONCEPT}&select=*&order=id`,{headers:HDR})).json();

  if(C)document.getElementById('question').innerHTML='<b>Question:</b> '+C.question;
  buildLangs();renderSummary();renderSections();renderEval();
  if(!F.length){document.getElementById('cols').innerHTML='<div class="loading">Qur\u2019an verse columns not yet added for this concept. Sections above are available.</div>';return;}
  render();
}
function buildLangs(){const s=new Set();F.forEach(r=>Object.keys(r.translations||{}).forEach(k=>s.add(k)));const c=document.getElementById('langchips');c.innerHTML='';
  const allBtn=document.createElement('button');
  const syncAllBtn=()=>{allBtn.classList.toggle('active', s.size>0 && [...s].every(l=>langs.has(l)));};
  allBtn.className='qbtn';allBtn.textContent='All';
  allBtn.onclick=()=>{
    const allSelected=[...s].every(l=>langs.has(l));
    if(allSelected){langs=new Set(['en']);}else{langs=new Set(s);}
    buildLangs();render();
  };
  c.appendChild(allBtn);
  [...s].sort().forEach(l=>{const b=document.createElement('button');b.className='qbtn'+(langs.has(l)?' active':'');b.textContent=LN[l]||l;
    b.onclick=()=>{if(langs.has(l)){if(langs.size>1)langs.delete(l);}else langs.add(l);b.classList.toggle('active',langs.has(l));syncAllBtn();render();};c.appendChild(b);});
  syncAllBtn();
}
let SPEAK_CARDS=[];
function speakCard(idx){
  if(!('speechSynthesis' in window)){toast('Speech not supported on this browser');return;}
  window.speechSynthesis.cancel();
  const card=SPEAK_CARDS[idx];if(!card)return;
  const parts=[];
  if(card.arabic)parts.push({text:card.arabic,lang:'ar-SA'});
  const firstLang=[...langs][0]||'en';
  const t=(card.translations||{})[firstLang];
  if(t)parts.push({text:t,lang:firstLang==='ar'?'ar-SA':(firstLang+'-'+firstLang.toUpperCase())});
  if(!parts.length && card.note)parts.push({text:card.note,lang:'en-US'});
  let i=0;
  const speakNext=()=>{
    if(i>=parts.length)return;
    const u=new SpeechSynthesisUtterance(parts[i].text);
    u.lang=parts[i].lang;u.rate=0.9;
    u.onend=()=>{i++;speakNext();};
    window.speechSynthesis.speak(u);
  };
  speakNext();
}
function toggleHighlight(idx, el){
  const key='hl_'+CONCEPT+'_'+idx;
  const on = localStorage.getItem(key)==='1';
  if(on){localStorage.removeItem(key); el.closest('.verse-card').style.background='#FFF'; el.classList.remove('active');}
  else{localStorage.setItem(key,'1'); el.closest('.verse-card').style.background='#FFF8D6'; el.classList.add('active');}
}
function shareCard(idx){
  const card=SPEAK_CARDS[idx];if(!card)return;
  const firstLang=[...langs][0]||'en';
  const text=(card.role?card.role+' -- ':'')+(card.arabic||'')+'\n'+((card.translations||{})[firstLang]||'')+(card.note?'\n'+card.note:'');
  if(navigator.share){navigator.share({title:C?C.name:'Concept',text:text,url:location.href}).catch(()=>{});}
  else{navigator.clipboard.writeText(text);toast('Copied to share');}
}
function saveToNotes(idx){
  const card=SPEAK_CARDS[idx];if(!card)return;
  const key='notes_'+CONCEPT;
  let notes=[];try{notes=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){}
  const firstLang=[...langs][0]||'en';
  notes.push({role:card.role,arabic:card.arabic,translation:(card.translations||{})[firstLang],note:card.note,sura:card.sura,aya:card.aya,saved_at:new Date().toISOString()});
  localStorage.setItem(key, JSON.stringify(notes));
  toast('Saved to notes ('+notes.length+')');
}
function render(){
  const facets=[...new Set(F.map(r=>r.facet))];const wrap=document.getElementById('cols');wrap.innerHTML='';
  SPEAK_CARDS=[];
  facets.forEach(fa=>{const vs=F.filter(r=>r.facet===fa);const col=document.createElement('div');col.className='col';
    const color=vs[0].highlight_color||'#9E9E9E';
    let h='<div class="fac-header" style="background:'+color+'">'+(vs[0].facet_label||fa)+'</div>';
    vs.forEach(v=>{const key=v.sura+':'+v.aya;
      const tb=[...langs].map(l=>{var t=(v.translations||{})[l];return t===undefined?'':'<div class="trans'+(ETH.has(l)?' eth':'')+'">'+t+'</div>';}).join('');
      const idx=SPEAK_CARDS.length;SPEAK_CARDS.push({arabic:v.arabic,translations:v.translations,note:v.note,role:v.role,sura:v.sura,aya:v.aya});
      const isHl=localStorage.getItem('hl_'+CONCEPT+'_'+idx)==='1';
      h+='<div class="verse-card" style="border-left-color:'+color+';background:'+(isHl?'#FFF8D6':'#FFF')+'"><span class="vk">'+key+'</span>'+
        (v.role?'<span class="role-tag" style="background:'+color+'">'+v.role+'</span>':'')+
        '<div class="arabic">'+(v.arabic||'')+'</div>'+tb+
        (v.note?'<div class="note">'+v.note+'</div>':'')+
        '<div class="vtools"><a class="vtool" href="/index.html?sura='+v.sura+'&aya='+v.aya+'" target="_blank">🔗</a>'+
        '<div class="vtool" onclick="speakCard('+idx+')" title="Listen">🔊</div>'+
        '<div class="vtool" onclick="navigator.clipboard.writeText(\''+key+'\');toast(\'Copied\')" title="Copy reference">📋</div>'+
        '<div class="vtool'+(isHl?' active':'')+'" onclick="toggleHighlight('+idx+',this)" title="Highlight" style="'+(isHl?'background:#F5D000':'')+'">🖍</div>'+
        '<div class="vtool" onclick="shareCard('+idx+')" title="Share">📤</div>'+
        '<div class="vtool" onclick="saveToNotes('+idx+')" title="Save to notes">📝</div>'+
        '</div></div>';});
    col.innerHTML=h;wrap.appendChild(col);});
}
function renderSections(){
  if(!SEC.length)return;const order=['Definition','Historical Context','Linguistics','Internal Comparison','External Comparison','Hadith','Tafsir','Madhhabs','Scholarly Views','Questions'];
  const by={};SEC.forEach(r=>{(by[r.section]=by[r.section]||[]).push(r);});
  const kc={evidence:'#2E7D32',external:'#1A6FA8',interpretation:'#B8902A',pending:'#9E9E9E'};
  let h='';order.filter(s=>by[s]).forEach(s=>{const rows=by[s];const k=rows[0].kind||'evidence';
    h+='<div style="margin:0 14px 8px;border:1px solid #E8D8A0;border-radius:10px;overflow:hidden">'+
      '<div onclick="var b=this.nextElementSibling;b.style.display=b.style.display==\'none\'?\'block\':\'none\'" style="cursor:pointer;background:#FBF3DE;padding:9px 12px;font-size:12.5px;font-weight:800;color:#5A3A10;display:flex;justify-content:space-between">'+
      s+' <span class="chip" style="background:'+(kc[k]||'#999')+'">'+k+'</span></div>'+
      '<div style="display:none;padding:10px 12px;font-size:12.5px;line-height:1.6">'+
      rows.map(r=>(r.label?'<b>'+r.label+':</b> ':'')+(r.content||'')+(r.citation?' <i style=color:#8B6A30>('+r.citation+')</i>':'')).join('<hr style="border:none;border-top:1px solid #EFE3C4;margin:8px 0">')+
      '</div></div>';});
  document.getElementById('sections').innerHTML=h;
}
function renderSummary(){if(!C||!C.summary)return;const e=document.getElementById('summary');e.style.display='';

function renderEval(){if(!EV.length)return;const e=document.getElementById('eval');e.style.display='';
  const cc={High:'#2E7D32',Medium:'#B8902A',Low:'#9E9E9E'};
  const row=(k,v)=>v?'<tr><td>'+k+'</td><td>'+v+'</td></tr>':'';
  let h='<div class="eval-head">⚖️ Textual Evaluation</div>';
  EV.forEach(x=>{h+='<div class="eval-card"><h4>'+x.facet_a+' vs '+x.facet_b+' <span class="chip" style="background:'+(cc[x.confidence]||'#999')+'">'+(x.confidence||'')+'</span></h4><table>'+
    row('Same topic?',x.same_topic)+row('Both true if literal?',x.both_true_literal)+row('Tension type',x.tension_type)+row('Relationship',x.relationship)+'</table>'+
    '<div style="padding:8px 10px;display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid #EFE3C4">'+

    (x.reasoning_trace?'<div class="eval-reason"><b>Reasoning trace:</b><br>'+x.reasoning_trace.replace(/\n/g,'<br>')+'</div>':'')+
    (x.reasoning?'<div class="eval-reason"><b>Conclusion:</b> '+x.reasoning+'</div>':'')+'</div>';});
  e.innerHTML=h;
}
load();

<script>
/* ═══ UNIFIED SITE-WIDE HISTORY + PRECISE BACK NAVIGATION (v2) ═══
   One system, same on every page: Quran, Themes, Concept, Research,
   Madhhab, Sīra, Stories, Tensions, Graph, Qira'at.
   - qnav_hist   (localStorage) : persistent "recently visited" list -> drawer
   - qnav_stack  (sessionStorage): real back-stack -> precise "Back to X" bar + scroll restore

   Links: mark any in-app forward link with data-qnav (no inline onclick, no
   hand-written label/icon — the destination page records its own real title
   after it loads). Mark any "back" link with data-qnav-back. A single
   delegated click listener handles both while preserving normal browser
   link behavior (new tab, Ctrl/Cmd/Shift/Alt-click, middle-click, downloads,
   external links, long-press on mobile).
*/
(function(W) {
  var MAX = 60;
  var HIST_VERSION = 2; // bump when the entry format/semantics change
  var MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000; // 30 days

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function ago(ts){
    var s=Math.floor((Date.now()-ts)/1000);
    if(s<60) return 'just now';
    if(s<3600) return Math.floor(s/60)+'m ago';
    if(s<86400) return Math.floor(s/3600)+'h ago';
    return Math.floor(s/86400)+'d ago';
  }
  function getHist(){
    try{
      // One-time purge: entries recorded before HIST_VERSION carry the old
      // "total verse count mislabeled as a reference" bug and stale links
      // with no specific verse. Rather than guess which old entries are
      // "safe", wipe once per version bump — it's just a recents list.
      var storedVersion = parseInt(localStorage.getItem('qnav_hist_version') || '0');
      if (storedVersion < HIST_VERSION) {
        localStorage.removeItem('qnav_hist');
        localStorage.setItem('qnav_hist_version', String(HIST_VERSION));
        return [];
      }
      var h = JSON.parse(localStorage.getItem('qnav_hist')||'[]');
      // Auto-expire anything older than MAX_AGE_MS so stale entries never
      // silently accumulate again.
      var now = Date.now();
      var fresh = h.filter(function(x){ return (now - (x.time||0)) < MAX_AGE_MS; });
      if (fresh.length !== h.length) saveHist(fresh);
      return fresh;
    }catch(e){ return []; }
  }
  function saveHist(h){ try{ localStorage.setItem('qnav_hist',JSON.stringify(h)); }catch(e){} }
  function getStack(){ try{ return JSON.parse(sessionStorage.getItem('qnav_stack')||'[]'); }catch(e){ return []; } }
  function saveStack(s){ try{ sessionStorage.setItem('qnav_stack', JSON.stringify(s)); }catch(e){} }
  function getForward(){ try{ return JSON.parse(sessionStorage.getItem('qnav_forward')||'[]'); }catch(e){ return []; } }
  function saveForward(s){ try{ sessionStorage.setItem('qnav_forward', JSON.stringify(s)); }catch(e){} }
  function clearForward(){ try{ sessionStorage.removeItem('qnav_forward'); }catch(e){} }

  /* Push `entry` onto `stack`, deduping only against the immediately
     preceding item (same rule used for qnav_stack pushes elsewhere). */
  function pushDeduped(stack, entry, cap){
    var last = stack[stack.length - 1];
    if (last && stateKey(last) === stateKey(entry)) {
      stack[stack.length - 1] = entry;
    } else {
      stack.push(entry);
    }
    if (cap && stack.length > cap) stack = stack.slice(stack.length - cap);
    return stack;
  }

  function captureCurrent(){
    return {
      url: location.href,
      label: (W.QNAV_PAGE_LABEL || document.title || 'QuranHikma'),
      icon: (W.QNAV_PAGE_ICON || '📄'),
      scrollX: window.scrollX,
      scrollY: window.scrollY,
      state: null,
      savedAt: Date.now()
    };
  }

  /* Normalized identity for an entry: same destination + same label counts
     as "the same place", regardless of incidental query-param variance
     (e.g. a trailing &from=stories) or exact scroll position. */
  function stateKey(entry){
    var u;
    try { u = new URL(entry.url, location.href); } catch(e){ return entry.url || ''; }
    return [u.pathname, u.search, entry.label || ''].join('|');
  }

  /* Record the CURRENT page into the persistent activity list.
     Dedup across the WHOLE list — qnav_hist is a "recently visited" log,
     not a journey, so any earlier visit to the same place should collapse
     into this one, most-recent occurrence. */
  function record(label, url, icon, sub) {
    url = url || window.location.href;
    var entry = { label: label||document.title||'Page', url: url, icon: icon||'📄', sub: sub||'', time: Date.now() };
    var key = stateKey(entry);
    var h = getHist().filter(function(x){ return stateKey(x) !== key; });
    h.unshift(entry);
    if(h.length > MAX) h = h.slice(0, MAX);
    saveHist(h);
    renderList();
    updateBadge();
  }
  W.qhistRecord = record;

  function renderList(){
    var el = document.getElementById('qhist-scroll');
    if(!el) return;
    var h = getHist();
    if(!h.length){ el.innerHTML='<div class="qhist-empty">No history yet — start exploring!</div>'; return; }
    el.innerHTML = h.map(function(item){
      var safeUrl = esc(item.url);
      var goArg = JSON.stringify(item.url || '').replace(/'/g, '&#39;');
      return '<a class="qhist-item" href="'+safeUrl+'" onclick="event.preventDefault();qhistGo('+goArg+')">'
        +'<span class="qhist-ico">'+esc(item.icon||'📄')+'</span>'
        +'<span class="qhist-body">'
        +'<div class="qhist-lbl">'+esc(item.label)+'</div>'
        +'<div class="qhist-sub">'+esc(item.sub)+'</div>'
        +'</span>'
        +'<span class="qhist-ago">'+ago(item.time)+'</span>'
        +'</a>';
    }).join('');
  }

  function updateBadge(){
    var b = document.getElementById('qhist-badge');
    if(!b) return;
    var n = getHist().length;
    b.textContent = n; b.style.display = n ? 'flex' : 'none';
  }

  W.qnavToggleHist = function(){
    var d = document.getElementById('qhist-drawer');
    if(!d) return;
    d.classList.toggle('open');
    if(d.classList.contains('open')) renderList();
  };
  W.qnavClearHist = function(){
    saveHist([]); renderList(); updateBadge();
  };

  /* Jump to any item straight from the Activity History drawer */
  W.qhistGo = function(url){
    window.location.href = url;
  };

  /* ── THE REAL BACK-STACK ──
     Save exactly where the user is right now before we ever navigate away. */
  function saveCurrentPosition() {
    var entry = captureCurrent();
    var stack = pushDeduped(getStack(), entry, 25);
    saveStack(stack);
  }
  W.qnavSaveCurrentPosition = saveCurrentPosition;

  /* Navigate forward to a NEW destination. This is a fresh branch, so any
     previously-recorded forward path is no longer valid (same rule a
     browser follows: Back then choosing a different link drops "Forward"). */
  W.qnavGoTo = function(url) {
    saveCurrentPosition();
    clearForward();
    window.location.assign(url);
  };

  /* Pop the back-stack and go to the exact previous page + scroll position.
     The page we're leaving gets pushed onto the forward-stack so "Forward"
     can return to it. */
  W.qnavBack = function() {
    var stack = getStack();
    var entry = stack.pop();
    saveStack(stack);
    if (entry) {
      var fwd = pushDeduped(getForward(), captureCurrent(), 25);
      saveForward(fwd);
      try {
        localStorage.setItem('qnav_restore_scroll', JSON.stringify({ x: entry.scrollX||0, y: entry.scrollY||0 }));
      } catch(e) {}
      window.location.href = entry.url;
      return;
    }
    if (window.history.length > 1) window.history.back();
  };

  /* Mirror of Back: pop the forward-stack, push current page back onto the
     back-stack, go to the destination + scroll position. */
  W.qnavForward = function() {
    var fwd = getForward();
    var entry = fwd.pop();
    if (!entry) return;
    saveForward(fwd);
    var stack = pushDeduped(getStack(), captureCurrent(), 25);
    saveStack(stack);
    try {
      localStorage.setItem('qnav_restore_scroll', JSON.stringify({ x: entry.scrollX||0, y: entry.scrollY||0 }));
    } catch(e) {}
    window.location.href = entry.url;
  };

  /* ── Delegated click handler: preserves new-tab, modifier-clicks,
     middle-click, downloads, external links, long-press on mobile. ── */
  document.addEventListener('click', function(e){
    var link = e.target.closest('a[data-qnav], a[data-qnav-back]');
    if (!link) return;
    if (
      e.defaultPrevented ||
      e.button !== 0 ||
      e.ctrlKey || e.metaKey || e.shiftKey || e.altKey ||
      link.target === '_blank' ||
      link.hasAttribute('download')
    ) return;

    if (link.hasAttribute('data-qnav-back')) {
      e.preventDefault();
      W.qnavBack();
      return;
    }

    var dest;
    try { dest = new URL(link.href, location.href); } catch(err) { return; }
    if (dest.origin !== location.origin) return;

    e.preventDefault();
    W.qnavGoTo(dest.href);
  });

  /* Inject the floating button + drawer */
  function injectDrawer(){
    if(document.getElementById('qhist-btn')) return;

    var btn = document.createElement('button');
    btn.id = 'qhist-btn';
    btn.title = 'Your browsing history';
    btn.setAttribute('onclick','qnavToggleHist()');
    btn.innerHTML = '🕐<span id="qhist-badge" class="qhist-badge"></span>';
    document.body.appendChild(btn);

    var drawer = document.createElement('div');
    drawer.id = 'qhist-drawer';
    drawer.innerHTML = '<div class="qhist-head"><span class="qhist-title">📖 Activity History</span><button class="qhist-clearall" onclick="qnavClearHist()">Clear all</button></div><div class="qhist-scroll" id="qhist-scroll"></div>';
    document.body.appendChild(drawer);

    document.addEventListener('click', function(e){
      var d = document.getElementById('qhist-drawer');
      var b = document.getElementById('qhist-btn');
      if(d && d.classList.contains('open') && !d.contains(e.target) && b && !b.contains(e.target))
        d.classList.remove('open');
    });

    updateBadge();
  }

  /* Show the generic "← Back to X" bar (and "Forward →" when available) */
  function injectReturnBar(){
    var existing = document.getElementById('qnav-return-bar');
    if (existing) existing.remove();
    var stack = getStack();
    var prev = stack.length ? stack[stack.length - 1] : null;
    var fwd = getForward();
    var next = fwd.length ? fwd[fwd.length - 1] : null;
    if (!prev && !next) return;

    var bar = document.createElement('div');
    bar.id = 'qnav-return-bar';

    if (prev) {
      var backBtn = document.createElement('button');
      backBtn.innerHTML = '← Back: ' + esc(prev.icon || '📄') + ' ' + esc(prev.label || 'Back');
      backBtn.onclick = W.qnavBack;
      bar.appendChild(backBtn);
    }

    var desc = document.createElement('span');
    desc.className = 'qnav-desc';
    desc.textContent = 'Tap to return to the exact spot you left';
    bar.appendChild(desc);

    if (next) {
      var fwdBtn = document.createElement('button');
      fwdBtn.className = 'qnav-fwd';
      fwdBtn.innerHTML = 'Forward: ' + esc(next.icon || '📄') + ' ' + esc(next.label || 'Forward') + ' →';
      fwdBtn.onclick = W.qnavForward;
      bar.appendChild(fwdBtn);
    }

    document.body.insertBefore(bar, document.body.firstChild);
  }

  /* Restore scroll position (both axes) after a Back jump, once content has
     had a moment to render. */
  function restoreScroll(){
    try {
      var raw = localStorage.getItem('qnav_restore_scroll');
      if (raw === null) return;
      localStorage.removeItem('qnav_restore_scroll');
      var pos = JSON.parse(raw);
      var x = (typeof pos === 'number') ? 0 : (pos.x||0);
      var y = (typeof pos === 'number') ? pos : (pos.y||0);
      var tries = 0;
      var settle = setInterval(function(){
        window.scrollTo(x, y);
        tries++;
        if (tries >= 6) clearInterval(settle);
      }, 200);
    } catch(e) {}
  }

  function init(){
    injectDrawer();
    injectReturnBar();
    restoreScroll();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})(window);
</script>
