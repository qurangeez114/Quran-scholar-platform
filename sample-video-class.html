<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debate Detective · Video classroom</title><style>

gin-bottom:8px}input[type=radio]{margin-right:9px;accent-color:var(--green)}.score{font-size:42px;font-weight:750;line-height:1.3}.pass{color:#245d4b}.fail{color:#a4352e}.feedback{background:#f1f5ee;padding:12px;border-radius:8px}.slide{background:#193d34;color:white;border-radius:12px;padding:35px;min-height:260px;white-space:pre-wrap}.slide h2{color:#e8d6a7}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 5px;border-bottom:1px solid var(--line);font-size:14px}[hidden]{display:none!important}#notice{min-height:24px}dialog{width:min(600px,95vw);border:0;border-radius:16px;padding:28px}dialog::backdrop{background:#0009}@media(max-width:720px){.layout{grid-template-columns:1fr}aside{padding:14px}aside nav{display:flex;gap:5px;flex-wrap:wrap}aside button{width:auto;font-size:12px}header{align-items:start;flex-direction:column}main{padding:0 12px}section.card{padding:20px}h1{font-size:28px}}@media print{header,aside,.banner,button,#notice{display:none}.layout{display:block}.slide{break-after:page;color:#000;background:white}}
</style><script src="/site-chrome.js?v=schoolnav-20261022b" defer></script></head><body><header><div><strong>Qur’anHikma · Video classroom</strong><br><small>A complete practice journey</small></div><div><button id="student" class="secondary">Student view</button><button id="teacher" class="secondary">Teacher results</button></div></header><main><div class="banner">Practice course · No real login or enrollment. Progress, notes and quiz attempts stay in this browser. The teacher view shows your practice results only.</div><div class="layout"><aside><span class="eyebrow">Debate Detective</span><h2>Your classroom</h2><p id="learner" class="muted">Not enrolled yet</p><progress id="progress" max="4" value="0"></progress><p id="progress-label" class="muted">0 of 4 milestones</p><nav><button data-view="overview">01 · Enroll</button><button data-view="lesson">02 · Take the lesson</button><button data-view="page">03 · My Page</button><button data-view="quiz">04 · Take the quiz</button><button data-view="presentation">05 · Presentation</button></nav><button id="reset" class="secondary">Reset practice data</button></aside><section class="card"><p id="notice" role="status" aria-live="polite"></p><div id="content"></div></section></div></main><dialog id="present-dialog"><div id="full-slide" class="slide"></div><div class="row"><button id="prev-slide">Previous</button><button id="next-slide">Next</button><button id="close-slides" class="secondary">Close</button><span id="slide-counter"></span></div></dialog><script>
(()=>{'use strict';const key='qh-debate-detective-v1';const fresh=()=>({name:'',enrolled:false,lesson:false,page:{title:'My Research Notes',body:''},attempts:[],slides:[]});let state;try{state=JSON.parse(localStorage.getItem(key))||fresh();if(!state.page||!Array.isArray(state.attempts)||!Array.isArray(state.slides))state=fresh();}catch{state=fresh();}let view='overview',slideIndex=0;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PASS_MARK=90;
const questions=[{"id":"claim","q":"🎯 Claim catcher: which question does Christina raise at the start?","options":["The Trinity is biblical","Every participant agrees","The discussion is about astronomy"],"answer":0,"why":"At 2:16–2:35 she introduces whether the Trinity is demonstrated in scripture. This identifies her claim; it does not establish that the claim is true.","rationale":["","The participants explicitly disagree at 2:56–3:01.","Astronomy is not the opening topic."],"variants":[{"q":"Which question frames the opening debate?","options":["All traditions agree","The Trinity has a biblical basis","The video compares planets"],"answer":1,"rationale":["Disagreement is part of the discussion.","","The opening discussion concerns scripture."]}]},{"id":"evidence","q":"🔎 Evidence explorer: what does Christina want to examine in the opening?","options":["Audience applause","Only the popularity of a belief","Whether scripture demonstrates the Trinity"],"answer":2,"why":"At 2:22–2:35 she contrasts other approaches with the scriptural question she wants to discuss.","rationale":["Applause does not establish what a text teaches.","Popularity is not the stated evidence standard.",""],"variants":[{"q":"What evidence focus does she request for the first prompt?","options":["Scriptural support","The number of supporters","Which speaker is louder"],"answer":0,"rationale":["","Supporter counts do not establish scriptural meaning.","Volume is not evidence."]}]},{"id":"terms","q":"🧩 Definition decoder: how is the Trinity described in this exchange?","options":["Three separate divine essences","One divine essence and three distinct persons","One person taking turns wearing three names"],"answer":1,"why":"At 2:38–3:12 the speakers discuss one essence and distinct personhood. The challenge tests accurate reporting of their definition, not acceptance of the doctrine.","rationale":["This changes the one-essence definition stated in the exchange.","","The speakers explicitly distinguish persons; they do not give this description."],"variants":[{"q":"Which summary accurately represents the definition discussed at the start?","options":["Three unrelated gods","One person only","One essence, three distinct persons"],"answer":2,"rationale":["This misrepresents the stated definition.","The exchange refers to distinct persons.",""]}]},{"id":"reference","q":"📍 Citation hunter: which passage is introduced around 3:31?","options":["Nehemiah 9:6","Genesis 1:1","Psalm 23"],"answer":0,"why":"Nehemiah 9:6 is named around 3:31. A citation gives a passage to investigate; the speakers’ interpretations still require examination.","rationale":["","Genesis 1:1 is not the citation introduced at this moment.","Psalm 23 is not the citation introduced at this moment."],"variants":[{"q":"Which reference should you look up to check the passage raised around 3:31?","options":["Psalm 23","Nehemiah 9:6","Genesis 1:1"],"answer":1,"rationale":["That is not the cited reference.","","That is not the cited reference."]}]},{"id":"clarify","q":"🕵️ Meaning detective: what distinction does the reply ask about around 3:54–4:01?","options":["How many viewers watched","Which speaker is older","Whether the passage addresses divine essence or a person"],"answer":2,"why":"The response asks whether the passage addresses essence or one of the persons. Clarifying the referent helps identify exactly where interpretations differ.","rationale":["Viewer counts do not answer the interpretive question.","Age is not the distinction raised.",""],"variants":[{"q":"What clarification is requested in the response to Nehemiah 9:6?","options":["What the passage refers to: essence or person","Who has more followers","Who speaks first"],"answer":0,"rationale":["","Follower counts do not clarify a passage’s referent.","Speaking order does not answer the textual question."]}]}];

function finalAttempts(){return state.attempts.filter(a=>a.phase==='final'&&a.version===2);}
function hasPassed(){return finalAttempts().some(a=>a.percent>=PASS_MARK);}
function questionAt(session){
 const base=questions[session.index];
 const q=session.phase==='final'?{...base,...base.variants[session.variant%base.variants.length]}:{...base};
 // Deterministic per-attempt rotation; all feedback and grading use the mapped index.
 const shift=(session.variant+session.index+(session.phase==='final'?1:0))%q.options.length;
 const indices=q.options.map((_,i)=>(i+shift)%q.options.length);
 return {...q,options:indices.map(i=>q.options[i]),rationale:indices.map(i=>q.rationale[i]),answer:indices.indexOf(q.answer)};
}
function persist(){try{localStorage.setItem(key,JSON.stringify(state));return true;}catch{$('notice').textContent='Browser storage is unavailable. Keep this window open; refresh may lose progress.';return false;}}
function notice(t){$('notice').textContent=t;}function render(){const milestones=Number(state.enrolled)+Number(state.lesson)+Number(state.page.body.trim().length>0)+Number(hasPassed());$('progress').value=milestones;$('progress-label').textContent=milestones+' of 4 milestones';$('learner').textContent=state.enrolled?'Enrolled: '+state.name:'Not enrolled yet';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const c=$('content');if(view!=='overview'&&view!=='teacher'&&!state.enrolled){c.innerHTML='<h1>Start with enrollment</h1><p>Enroll in the practice course before opening your learning tools.</p><button id="begin">Go to enrollment</button>';$('begin').onclick=()=>go('overview');return;}({overview,lesson,page,quiz,presentation,teacher}[view])();}
function go(v){view=v;notice('');render();}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));$('student').onclick=()=>go(state.enrolled?'lesson':'overview');$('teacher').onclick=()=>go('teacher');$('reset').onclick=()=>{if(confirm('Clear this browser’s sample course, notes, slides and quiz attempts?')){state=fresh();persist();go('overview');}};
function overview(){$('content').innerHTML='<span class="eyebrow">Free practice course · About 10 minutes · full video optional</span><h1>Debate Detective: The Bridge</h1><p>Watch a Christian–Muslim discussion, spot the opening claim, decode the terms, and follow the evidence through five challenges.</p><ul><li>One video lesson · focused segment 2:16–4:25</li><li>A private practice page</li><li>Guided lesson quiz + reworded final check · Pass mark: 90%</li><li>Editable presentation and teacher results</li></ul>'+(state.enrolled?'<p class="feedback">You are enrolled as <strong>'+esc(state.name)+'</strong>.</p><button id="continue">Continue learning</button>':'<form id="enroll"><label>Your practice name<input id="name" type="text" maxlength="60" required placeholder="Enter your name"></label><button>Enroll in sample course</button></form>');if(state.enrolled)$('continue').onclick=()=>go('lesson');else $('enroll').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;state.name=name;state.enrolled=true;persist();go('lesson');};}
function lesson(){$('content').innerHTML="<span class=\"eyebrow\">Mission 1 · Watch, notice, verify</span><h1>Debate Detective: follow the evidence</h1><p>Watch the opening discussion at <strong>2:16–4:25</strong>. The full video is available below. Five challenges test listening and fair representation; no religious belief is required for a correct answer.</p><div style=\"aspect-ratio:16/9\"><iframe style=\"width:100%;height:100%;border:0;border-radius:12px\" src=\"https://www.youtube-nocookie.com/embed/IqOvw24pNGc?start=136&amp;end=265\" title=\"1 Christian vs. 12 Muslim Women | The Bridge — Dr. Daf Show\" loading=\"lazy\" allow=\"encrypted-media; picture-in-picture\" allowfullscreen></iframe></div><p><a href=\"https://www.youtube.com/watch?v=IqOvw24pNGc&t=136s\" target=\"_blank\" rel=\"noopener\">Watch on YouTube</a> · Source: Dr. Daf Show. Automatic captions can contain errors.</p><h2>Your detective toolkit</h2><ol><li><strong>Catch the claim:</strong> Christina asks whether the Trinity has a biblical basis.</li><li><strong>Identify the evidence:</strong> she asks to examine scripture.</li><li><strong>Define the terms:</strong> the exchange distinguishes one essence from three persons.</li><li><strong>Trace the citation:</strong> Nehemiah 9:6 is introduced around 3:31.</li><li><strong>Locate the disagreement:</strong> the reply asks whether the passage refers to essence or person.</li></ol><p>These are summaries of the discussion, not independent verification of its theological or historical claims. Read cited passages in context before drawing conclusions.</p><div class=\"source\"><strong>Notebook mission</strong><p>Write the opening claim, its cited passage, and one question you would investigate. Keep what a speaker says separate from your own conclusion.</p></div><div class=\"row\"><button id=\"complete\">Mark video lesson complete</button><button id=\"to-quiz\">Start five challenges</button><button id=\"save-excerpt\" class=\"secondary\">Save detective notes</button></div>";$('complete').onclick=()=>{state.lesson=true;persist();render();notice('Mission complete! Next: five detective challenges.');};$('to-quiz').onclick=()=>go('quiz');$('save-excerpt').onclick=()=>{const note='VIDEO SOURCE\nDr. Daf Show: 1 Christian vs. 12 Muslim Women | The Bridge\nhttps://www.youtube.com/watch?v=IqOvw24pNGc&t=136s\nStudy segment: 2:16–4:25\n\nCLAIM\n\nCITATION\n\nMY INTERPRETATION\n\nQUESTION TO CHECK\n';state.page.body+=(state.page.body?'\n\n':'')+note;persist();go('page');notice('Video reference and notebook prompts added.');};}

function page(){$('content').innerHTML='<span class="eyebrow">My Pages · Practice workspace</span><h1>Your titled research page</h1><form id="page-form"><label>Page title<input id="page-title" type="text" maxlength="150" required value="'+esc(state.page.title)+'"></label><label>Content and notes<textarea id="page-body">'+esc(state.page.body)+'</textarea></label><button id="save-page">Save page</button><span id="page-save-status" role="status" aria-live="polite"></span><button id="make-deck" type="button" class="secondary">Create presentation from this page</button></form><p class="muted">Saved in this browser for practice. You can edit this page and reopen it during the session.</p>';$('page-form').oninput=()=>{$('save-page').textContent='Save page';$('page-save-status').textContent='Unsaved changes';};$('page-form').onsubmit=e=>{e.preventDefault();savePage();};$('make-deck').onclick=()=>{if(!savePage())return;state.slides=[{title:state.page.title,body:'By '+state.name},{title:'Research notes',body:state.page.body},{title:'Conclusion',body:'Add your conclusion here. Distinguish your interpretation from the source.'}];persist();go('presentation');notice('Three editable slides created from your page.');};}
function saveConfirmation(buttonId,statusId,saved){const button=$(buttonId),status=$(statusId);if(button)button.textContent=saved?'✓ Saved':(buttonId==='save-page'?'Save page':'Save presentation');if(status){status.textContent=saved?'Saved in this browser at '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'.':'Could not save. Browser storage is unavailable; keep this window open and try again.';status.className=saved?'pass':'fail';}}
function savePage(){const title=$('page-title').value.trim();if(!title){notice('Enter a page title first.');$('page-title').focus();return false;}state.page={title,body:$('page-body').value};const saved=persist();if(saved){render();notice('Page saved: '+title);}saveConfirmation('save-page','page-save-status',saved);return saved;}
function startQuiz(phase){
 if(phase==='final'&&!state.attempts.some(a=>a.phase==='practice'&&a.version===2)){notice('Complete the guided lesson quiz before the final check.');return;}
 const variant=phase==='final'?finalAttempts().length:0;
 state.quizSession={phase,index:0,answers:[],correct:[],variant,reviewed:false};persist();quiz();
}
function quiz(){
 const session=state.quizSession;
 if(!session){
  const learned=state.attempts.some(a=>a.phase==='practice'&&a.version===2),last=finalAttempts().at(-1);
  $('content').innerHTML='<span class="eyebrow">Learn, review, then demonstrate understanding</span><h1>Quiz as a learning tool</h1><p>Work through five questions after the lesson. Check each answer to receive feedback. If you are unsure, choose “I don’t know / explain” or check without selecting an answer.</p><p>After the guided quiz, answer five reworded questions testing the same ideas. Only this final check counts toward passing: <strong>90%</strong>. With five equally weighted questions, you need <strong>5 out of 5</strong>.</p>'+(last?'<p class="feedback">Last final check: '+last.percent+'% · '+(last.percent>=PASS_MARK?'Passed':'Below 90% — review and try again')+'</p>':'')+'<button id="start-practice">Start guided lesson quiz</button><button id="start-final" class="secondary" '+(!learned?'disabled':'')+'>Take reworded final check</button>';
  $('start-practice').onclick=()=>startQuiz('practice');$('start-final').onclick=()=>startQuiz('final');return;
 }
 const q=questionAt(session),isFinal=session.phase==='final';
 $('content').innerHTML='<span class="eyebrow">'+(isFinal?'Reworded final check · Pass mark 90%':'Guided lesson quiz · Learn from every answer')+'</span><h1>Challenge '+(session.index+1)+' of '+questions.length+'</h1><p class="muted">'+(isFinal?'These questions test the same concepts with different wording. Your first response to each question is scored.':'This is practice. Read the explanation before moving on; the final check determines your pass status.')+'</p><form id="quiz-form"><fieldset class="question"><legend>'+esc(q.q)+'</legend>'+q.options.map((o,j)=>'<label><input type="radio" name="answer" value="'+j+'" '+(session.reviewed?'disabled ':'')+(session.answers[session.index]===j?'checked':'')+'>'+esc(o)+'</label>').join('')+'</fieldset><button id="check-answer" '+(session.reviewed?'hidden':'')+'>Check answer</button><button id="explain-answer" type="button" class="secondary" '+(session.reviewed?'hidden':'')+'>I don’t know / explain</button></form><div id="answer-feedback" role="status" aria-live="polite"></div><button id="next-question" hidden>'+(session.index===questions.length-1?'Finish '+(isFinal?'final check':'guided quiz'):'Next question')+'</button>';
 function feedback(){const selected=session.answers[session.index],correct=session.correct[session.index];$('answer-feedback').innerHTML='<div class="feedback"><h2>'+(selected===null?'Let’s learn this together':correct?'Correct — here is why':'Not quite — here is why')+'</h2><p><strong>Your response:</strong> '+(selected===null?'Not answered':esc(q.options[selected]))+'</p>'+(!correct&&selected!==null?'<p><strong>Why this answer is incorrect:</strong> '+esc(q.rationale[selected])+'</p>':selected===null?'<p>No answer was selected. This response earns no point; read the explanation to prepare for the next check.</p>':'')+'<p><strong>Correct answer:</strong> '+esc(q.options[q.answer])+'</p><p><strong>Why it is correct:</strong> '+esc(q.why)+'</p></div>';$('next-question').hidden=false;}
 function check(selected){if(session.reviewed)return;session.answers[session.index]=selected;session.correct[session.index]=selected===q.answer;session.reviewed=true;persist();quiz();}
 $('quiz-form').onsubmit=e=>{e.preventDefault();const checked=document.querySelector('input[name="answer"]:checked');check(checked?Number(checked.value):null);};
 $('explain-answer').onclick=()=>check(null);
 $('next-question').onclick=()=>{if(!session.reviewed)return;if(session.index<questions.length-1){session.index++;session.reviewed=false;persist();quiz();}else finishQuiz(session);};
 if(session.reviewed)feedback();
}
function finishQuiz(session){
 const correct=session.correct.filter(Boolean).length,percent=Math.round(correct/questions.length*100),isFinal=session.phase==='final';
 state.attempts.push({version:2,phase:session.phase,variant:session.variant,date:new Date().toISOString(),correct,percent,answers:session.answers});
 state.quizSession=null;persist();render();
 $('content').innerHTML='<span class="eyebrow">'+(isFinal?'Final check result':'Guided quiz completed')+'</span><div class="score '+(isFinal&&percent<PASS_MARK?'fail':'pass')+'">'+percent+'%</div><h1>'+(isFinal?(percent>=PASS_MARK?'Passed — understanding demonstrated':'Not passed yet — keep learning'):'Now check what you learned')+'</h1><p>'+correct+' of '+questions.length+' correct. '+(isFinal?'Pass mark: 90%.':'This practice score does not determine your pass status.')+'</p><p>'+(isFinal?(percent>=PASS_MARK?'You met the 90% requirement.':'Review the lesson and explanations, then try another reworded final check. With five questions, you need 5 correct.'):'You have seen the reasoning behind each answer. The final check now asks about the same ideas using different wording.')+'</p><button id="next-final">'+(isFinal?'Retake with reworded questions':'Take reworded final check')+'</button><button id="review-lesson" class="secondary">Review lesson</button><button id="results" class="secondary">Teacher results</button>';
 $('next-final').onclick=()=>startQuiz('final');$('review-lesson').onclick=()=>go('lesson');$('results').onclick=()=>go('teacher');
}
function presentation(){$('content').innerHTML='<span class="eyebrow">Presentation studio · Practice</span><h1>Your presentation</h1>'+(state.slides.length?state.slides.map((s,i)=>'<div class="question"><label>Slide '+(i+1)+' title<input type="text" data-title="'+i+'" value="'+esc(s.title)+'"></label><label>Slide text<textarea data-body="'+i+'">'+esc(s.body)+'</textarea></label><button data-up="'+i+'" class="secondary" '+(i===0?'disabled':'')+'>Move up</button><button data-remove="'+i+'" class="secondary">Remove slide</button></div>').join(''):'<p>Create slides from My Page or add a blank slide.</p>')+'<div class="row"><button id="save-slides">Save presentation</button><span id="slides-save-status" role="status" aria-live="polite"></span><button id="add-slide" class="secondary">Add slide</button><button id="present" class="secondary" '+(!state.slides.length?'disabled':'')+'>Present slides</button><button id="export" class="secondary" '+(!state.slides.length?'disabled':'')+'>Download presentation JSON</button></div>';
$('content').oninput=e=>{if(e.target.matches('[data-title],[data-body]')){$('save-slides').textContent='Save presentation';$('slides-save-status').textContent='Unsaved changes';}};
const read=()=>{document.querySelectorAll('[data-title]').forEach(n=>state.slides[Number(n.dataset.title)].title=n.value);document.querySelectorAll('[data-body]').forEach(n=>state.slides[Number(n.dataset.body)].body=n.value);return persist();};$('save-slides').onclick=()=>{const saved=read();saveConfirmation('save-slides','slides-save-status',saved);if(saved)notice('Presentation saved in this browser.');};$('add-slide').onclick=()=>{read();state.slides.push({title:'New slide',body:''});persist();render();};document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{read();const i=Number(b.dataset.up);[state.slides[i-1],state.slides[i]]=[state.slides[i],state.slides[i-1]];persist();render();});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{read();state.slides.splice(Number(b.dataset.remove),1);persist();render();});$('present').onclick=()=>{read();slideIndex=0;showSlide();$('present-dialog').showModal();};$('export').onclick=()=>{read();const url=URL.createObjectURL(new Blob([JSON.stringify({title:state.page.title,slides:state.slides},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='research-presentation.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};}
function showSlide(){const s=state.slides[slideIndex];$('full-slide').replaceChildren();const h=document.createElement('h2'),p=document.createElement('p');h.textContent=s.title;p.textContent=s.body;$('full-slide').append(h,p);$('slide-counter').textContent=(slideIndex+1)+' / '+state.slides.length;$('prev-slide').disabled=slideIndex===0;$('next-slide').disabled=slideIndex===state.slides.length-1;}$('prev-slide').onclick=()=>{if(slideIndex>0){slideIndex--;showSlide();}};$('next-slide').onclick=()=>{if(slideIndex<state.slides.length-1){slideIndex++;showSlide();}};$('close-slides').onclick=()=>$('present-dialog').close();
function teacher(){const finals=finalAttempts(),best=Math.max(0,...finals.map(a=>a.percent));$('content').innerHTML='<span class="eyebrow">Teacher results · Demonstration only</span><h1>Practice gradebook</h1><p>This view uses only practice data in your browser. Real teacher access requires staff authorization and server-verified grades.</p><div class="feedback"><strong>Student:</strong> '+esc(state.name||'Not enrolled')+'<br><strong>Lesson:</strong> '+(state.lesson?'Completed':'Not completed')+'<br><strong>Pass mark:</strong> 90%<br><strong>Final checks:</strong> '+finals.length+'<br><strong>Best final score:</strong> '+best+'%<br><strong>Final status:</strong> '+(finals.length?(hasPassed()?'Passed':'Not passed'):'Not attempted')+'</div><h2>Learning and assessment history</h2><p class="muted">Guided practice and earlier demo attempts do not count toward the new final pass requirement.</p>'+(state.attempts.length?'<table><thead><tr><th>Type</th><th>Score</th><th>Result</th><th>Date</th></tr></thead><tbody>'+state.attempts.map(a=>'<tr><td>'+(a.version!==2?'Earlier demo':a.phase==='practice'?'Guided practice':'Reworded final')+'</td><td>'+a.correct+'/5 ('+a.percent+'%)</td><td>'+(a.version!==2?'Not counted':a.phase==='practice'?'Learning only':a.percent>=PASS_MARK?'Passed':'Below 90%')+'</td><td>'+esc(new Date(a.date).toLocaleString())+'</td></tr>').join('')+'</tbody></table>':'<p>No submissions yet. Complete the guided quiz, then take the reworded final check.</p>');}
render();})();
</script></body></html>
