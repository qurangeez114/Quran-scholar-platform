};
const VT_LANGS = { bn: 'bengali', ms: 'malay', es: 'spanish', zh: 'chinese', sw: 'swahili', ha: 'hausa' };

const langStateDefault = { arabic: true, english: true };
let langState = (() => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('muhammadLangState')); } catch {}
  return { ...langStateDefault, ...(saved || {}) };
})();

function toggleLangPicker(){
  const panel = document.getElementById('langPickerPanel');

  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'flex';
  overlay.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) {
    const input = document.getElementById('langSearchInput');
    if (input) input.value = '';
    renderLangChips('');
  }
}
function closeLangPicker(){
  document.getElementById('langPickerPanel').style.display = 'none';
  document.getElementById('langPickerOverlay').style.display = 'none';
}
function renderLangChips(query){
  const container = document.getElementById('langChipsContainer');
  const sectionLabel = document.getElementById('langChipsSectionLabel');
  if (!container) return;
  const q = (query || '').trim().toLowerCase();
  let keys;
  if (!q) {
    keys = Object.keys(ALL_LANGS).sort((a, b) => (langState[b] ? 1 : 0) - (langState[a] ? 1 : 0));
    const activeCount = keys.filter(k => langState[k]).length;
    if (sectionLabel) sectionLabel.textContent = activeCount ? 'All Languages (selected first)' : 'All Languages — tap to add';
  } else {
    keys = Object.keys(ALL_LANGS).filter(k => {
      const meta = ALL_LANGS[k];
      if (meta.label.toLowerCase().includes(q)) return true;
      return (meta.aliases || []).some(a => a.toLowerCase().includes(q));
    });
    if (sectionLabel) sectionLabel.textContent = keys.length ? 'Matching Languages' : 'No matches — try another spelling';
  }
  container.innerHTML = keys.map(k => `
    <div class="lang-chip${langState[k] ? ' active' : ''}" id="chip-${k}" onclick="toggleLangChip('${k}')">${ALL_LANGS[k].badge} ${ALL_LANGS[k].label}</div>
  `).join('');
}
function syncChips(){
  const input = document.getElementById('langSearchInput');
  renderLangChips(input ? input.value : '');
}
function rerenderCurrentView(){
  filter();
}
function toggleLangChip(lang){
  langState[lang] = !langState[lang];

  try { localStorage.setItem('muhammadLangState', JSON.stringify(langState)); } catch {}
  updateLangCount();
  rerenderCurrentView();
}

}

async function load(){
  const [catRes, verseRes, tagRes, hadithRes, tensionRes, speakerRes] = await Promise.all([
    fetch(`${SB_URL}/rest/v1/muhammad_categories?select=*&order=display_order.asc`, {headers:HDR}),
    fetch(`${SB_URL}/rest/v1/muhammad_verses?select=*&review_status=eq.reviewed&order=sura.asc,aya.asc`, {headers:HDR}),
    fetch(`${SB_URL}/rest/v1/muhammad_verse_tags?select=*`, {headers:HDR}),
    fetch(`${SB_URL}/rest/v1/muhammad_hadith_links?select=*`, {headers:HDR}),
    fetch(`${SB_URL}/rest/v1/muhammad_tension_pairs?select=*&order=tension_id.asc`, {headers:HDR}),
    fetch(`${SB_URL}/rest/v1/muhammad_speaker_types?select=*`, {headers:HDR}),
  ]);
  CATEGORIES = await catRes.json();
  VERSES = await verseRes.json();
  const tags = await tagRes.json();
  const hadith = await hadithRes.json();
  TENSIONS = await tensionRes.json();
  const speakerRows = await speakerRes.json();
  const speakerById = {};
  speakerRows.forEach(s => { speakerById[s.id] = s.label; });
  window._speakerById = speakerById;

  tags.forEach(t => { (TAGS_BY_VERSE[t.verse_id] = TAGS_BY_VERSE[t.verse_id] || []).push(t); });
  hadith.forEach(h => { const k = `${h.sura}:${h.aya}`; (HADITH_BY_KEY[k] = HADITH_BY_KEY[k] || []).push(h); });

  // Pull Arabic/English text for exactly the suras referenced, from the
  // Pull text for exactly the suras referenced, from the site's existing
  // `ayas` table — text is never duplicated into these new tables, just
  // joined by (sura, aya). Includes every language that lives as an ayas
  // column, plus transliteration.
  const suraIds = [...new Set(VERSES.map(v => v.sura))];
  const ayasRes = await fetch(`${SB_URL}/rest/v1/ayas?select=sura_id,aya_number,arabic,arabic_transliteration,english,tigrinya,amharic,oromo,somali,german,urdu&sura_id=in.(${suraIds.join(',')})`, {headers:HDR});
  const ayasRows = await ayasRes.json();
  const ayaMap = {};
  ayasRows.forEach(a => { ayaMap[`${a.sura_id}:${a.aya_number}`] = a; });

  // The 6 newer languages live in verse_translations (verse_key + lang),
  // not as ayas columns. Fetch by exact verse_key list (chunked to keep
  // request URLs reasonable).
  const verseKeys = VERSES.map(v => `${v.sura}:${v.aya}`);
  const vtMap = {};
  const chunkSize = 150;
  for (let i = 0; i < verseKeys.length; i += chunkSize) {
    const chunk = verseKeys.slice(i, i + chunkSize);
    const vtRes = await fetch(`${SB_URL}/rest/v1/verse_translations?select=verse_key,lang,text&verse_key=in.(${chunk.join(',')})&lang=in.(${Object.keys(VT_LANGS).join(',')})`, {headers:HDR});
    const vtRows = await vtRes.json();
    vtRows.forEach(r => { (vtMap[r.verse_key] = vtMap[r.verse_key] || {})[VT_LANGS[r.lang]] = r.text; });
  }

  VERSES.forEach(v => {
    const key = `${v.sura}:${v.aya}`;
    const a = ayaMap[key] || {};
    v.arabic = a.arabic || '';
    v.translit = a.arabic_transliteration || '';
    v.english = a.english || '';
    v.tigrinya = a.tigrinya || '';
    v.amharic = a.amharic || '';
    v.oromo = a.oromo || '';
    v.somali = a.somali || '';
    v.german = a.german || '';
    v.urdu = a.urdu || '';
    const vt = vtMap[key] || {};
    v.bengali = vt.bengali || '';
    v.malay = vt.malay || '';
    v.spanish = vt.spanish || '';
    v.chinese = vt.chinese || '';
    v.swahili = vt.swahili || '';
    v.hausa = vt.hausa || '';
  });

  buildCatDropdown();
  updateLangCount();
  document.getElementById('note-banner').innerHTML =
    `${VERSES.length} verses fully reviewed and tagged (categories, tone, speaker, chronology). ` +
    `A further set of mechanically-flagged candidate verses is queued for manual review and not yet shown here.`;

  // Tension pairs cite verses (pole_a_verses / pole_b_verses) in three
  // different shapes: single refs ("6:50"), ranges ("33:50-53"), and
  // occasionally plain text instead of a verse list at all (T09's
  // "Qur'an-linked hadith corpus"). Feeding any of the last two straight
  // into a numeric sura_id query breaks the whole page load — so parse
  // defensively and only ever query with confirmed numeric sura:aya pairs.
  window.TENSION_VERSE_TEXT = {};
  window.TENSION_RANGE_EXPANSION = {}; // "sura:start-end" -> ["sura:start", ..., "sura:end"]
  const singleRefRe = /^(\d+):(\d+)$/;
  const rangeRefRe = /^(\d+):(\d+)-(\d+)$/;
  const parseRefs = (str) => (str || '').split(';').map(s => s.trim()).filter(Boolean);
  const numericPairs = new Set(); // "sura:aya" individual verses to actually fetch

  TENSIONS.forEach(t => {
    [...parseRefs(t.pole_a_verses), ...parseRefs(t.pole_b_verses)].forEach(ref => {
      const single = ref.match(singleRefRe);
      const range = ref.match(rangeRefRe);
      if (single) {
        numericPairs.add(ref);
      } else if (range) {
        const [, sura, start, end] = range;
        const expanded = [];
        for (let a = parseInt(start); a <= parseInt(end); a++) {
          const pair = `${sura}:${a}`;
          expanded.push(pair);
          numericPairs.add(pair);
        }
        window.TENSION_RANGE_EXPANSION[ref] = expanded;
      }
      // else: not a verse reference at all (e.g. "Qur'an-linked hadith
      // corpus") — intentionally ignored, rendered as plain text instead.
    });
  });

  const pairList = [...numericPairs];
  if (pairList.length) {
    // Query the EXACT cited verses only (via PostgREST's or=(and(...),...)
    // composite filter), not whole chapters. Filtering by sura_id alone
    // pulled entire suras (2,800+ rows for this citation set) and got
    // silently truncated by Supabase's default 1000-row response cap,
    // which is why later-cited suras never showed up. This scales
    // correctly regardless of how many verses exist in the cited chapters.
    const orFilter = pairList.map(p => {
      const [s, a] = p.split(':');
      return `and(sura_id.eq.${s},aya_number.eq.${a})`;
    }).join(',');
    const tAyasRes = await fetch(`${SB_URL}/rest/v1/ayas?select=sura_id,aya_number,arabic,arabic_transliteration,english,tigrinya,amharic,oromo,somali,german,urdu&or=(${orFilter})`, {headers:HDR});
    const tAyasRows = await tAyasRes.json();

    // Same 6 newer languages as the main Verses view, fetched from
    // verse_translations by exact verse_key (chunked, same pattern as the
    // main load()).
    const tVtMap = {};
    const chunkSize = 150;
    for (let i = 0; i < pairList.length; i += chunkSize) {
      const chunk = pairList.slice(i, i + chunkSize);
      const vtRes = await fetch(`${SB_URL}/rest/v1/verse_translations?select=verse_key,lang,text&verse_key=in.(${chunk.join(',')})&lang=in.(${Object.keys(VT_LANGS).join(',')})`, {headers:HDR});
      const vtRows = await vtRes.json();
      if (Array.isArray(vtRows)) {
        vtRows.forEach(r => { (tVtMap[r.verse_key] = tVtMap[r.verse_key] || {})[VT_LANGS[r.lang]] = r.text; });
      }
    }

    if (Array.isArray(tAyasRows)) {
      const tAyaMap = {};
      tAyasRows.forEach(a => { tAyaMap[`${a.sura_id}:${a.aya_number}`] = a; });
      pairList.forEach(pair => {
        const a = tAyaMap[pair] || {};
        const vt = tVtMap[pair] || {};
        window.TENSION_VERSE_TEXT[pair] = {
          arabic: a.arabic || '', translit: a.arabic_transliteration || '', english: a.english || '',
          tigrinya: a.tigrinya || '', amharic: a.amharic || '', oromo: a.oromo || '', somali: a.somali || '',
          german: a.german || '', urdu: a.urdu || '',
          bengali: vt.bengali || '', malay: vt.malay || '', spanish: vt.spanish || '',
          chinese: vt.chinese || '', swahili: vt.swahili || '', hausa: vt.hausa || '',
        };
      });
    } else {
      console.warn('Tension verse text fetch failed (non-fatal):', tAyasRows);
    }
  }

  render();
}

function buildCatDropdown(){
  const groups = {};
  CATEGORIES.forEach(c => { (groups[c.parent_group || 'Other'] = groups[c.parent_group || 'Other'] || []).push(c); });
  let html = `<div class="cat-item active" onclick="selectCat('', '📚 All Categories')">📚 All Categories</div>`;
  Object.keys(groups).forEach(g => {
    html += `<div class="cat-group-lbl">── ${esc(g.toUpperCase())} ──</div>`;
    groups[g].forEach(c => {
      html += `<div class="cat-item" onclick="selectCat('${c.slug}','${esc(c.name)}')">${esc(c.name)}</div>`;
    });
  });
  document.getElementById('cat-dropdown').innerHTML = html;
}

function filter(){
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();

  if (CURRENT_VIEW === 'tensions') {
    let list = TENSIONS;
    if (q) list = list.filter(t => [t.title,t.pole_a,t.pole_b,t.core_question].join(' ').toLowerCase().includes(q));
    renderTensions(list);
    return;
  }

  let list = VERSES;
  if (window._relevanceFilterVal) {
    const allowed = window._relevanceFilterVal.split(',');
    list = list.filter(v => allowed.includes(v.muhammad_relevance));
  }
  if (window._catFilterVal) {
    list = list.filter(v => (TAGS_BY_VERSE[v.id]||[]).some(t => t.category_slug === window._catFilterVal));
  }
  if (q) {
    list = list.filter(v => {
      const tagNames = (TAGS_BY_VERSE[v.id]||[]).map(t=>t.category_slug).join(' ');
      return [v.reference, v.summary, v.research_question, v.tone, tagNames].join(' ').toLowerCase().includes(q);
    });
  }
  renderVerses(list);
}

function catName(slug){
  const c = CATEGORIES.find(c => c.slug === slug);
  return c ? c.name : slug;
}

function renderVerses(list){
  document.getElementById('count').textContent = list.length + ' verses';
  const el = document.getElementById('list');
  if (!list.length) { el.innerHTML = '<div class="loading">No verses match.</div>'; return; }

  el.innerHTML = list.map(v => {
    const tags = TAGS_BY_VERSE[v.id] || [];
    const primary = tags.find(t => t.role === 'primary');
    const secondary = tags.filter(t => t.role !== 'primary');
    const hadithList = HADITH_BY_KEY[`${v.sura}:${v.aya}`] || [];

    let badges = '';
    if (primary) badges += `<span class="badge">${esc(catName(primary.category_slug))}</span>`;
    secondary.forEach(t => { badges += `<span class="badge secondary">${esc(catName(t.category_slug))}</span>`; });
    if (v.tone) badges += `<span class="badge tone">${esc(v.tone)}</span>`;
    if (v.discourse_type) badges += `<span class="badge secondary">🗣 ${esc(v.discourse_type)}</span>`;
    if (v.muhammad_relevance) badges += `<span class="badge secondary">🎯 ${esc(v.muhammad_relevance)}</span>`;
    if (v.event_context) badges += `<span class="badge secondary">📍 ${esc(v.event_context)}</span>`;

    const sb = window._speakerById || {};
    let speakerLine = sb[v.narrative_speaker_id] ? `Narrative speaker: ${esc(sb[v.narrative_speaker_id])}` : '';
    if (v.quoted_speaker_id) speakerLine += (speakerLine ? ' · ' : '') + `Quoting: ${esc(sb[v.quoted_speaker_id])}`;

    let hadithHtml = '';
    if (hadithList.length) {
      hadithHtml = `<div class="hadith-box"><div class="h-title">📿 Related Hadith</div>` +
        hadithList.map(h => `<div class="hadith-item"><b>${esc(h.collection)} ${esc(h.hadith_number||'')}:</b> ${esc(h.summary||'')}${h.critical_note ? ' <i>('+esc(h.critical_note)+')</i>' : ''}</div>`).join('') +
        `</div>`;
    }

    const langBlocks = Object.keys(ALL_LANGS)
      .filter(k => langState[k] && v[ALL_LANGS[k].field])
      .map(k => {
        const meta = ALL_LANGS[k];
        const rtl = (k === 'arabic' || k === 'urdu');
        return `<div class="verse-lang-block">
          <div class="verse-lang-label">${meta.badge} ${esc(meta.label)}</div>
          <div class="verse-lang-text"${rtl ? ' style="direction:rtl;text-align:right;font-size:19px;line-height:1.9;"' : ''}>${esc(v[meta.field])}</div>
        </div>`;
      }).join('');

    return `<div class="verse-card" id="mvc-${v.sura}-${v.aya}" style="${getHighlightColor(v.sura,v.aya) ? 'background-color:'+getHighlightColor(v.sura,v.aya)+'33;' : ''}">
      <div class="verse-toolbar">
        <button class="vt-btn" title="Listen" onclick='speakVerseCard(${JSON.stringify(v).replace(/'/g,"&#39;")})'>🔊</button>
        <button class="vt-btn${isBookmarked(v.sura,v.aya)?' active-toggle':''}" title="Bookmark" onclick="toggleBookmark(${v.sura},${v.aya},this)">${isBookmarked(v.sura,v.aya)?'🔖':'🏷️'}</button>
        <button class="vt-btn" title="Highlight color" onclick="showHlPicker(${v.sura},${v.aya},this)">🖊</button>
        <button class="vt-btn${hasNote(v.sura,v.aya)?' active-toggle':''}" title="Note" onclick="openNote(${v.sura},${v.aya})">📝</button>
        <button class="vt-btn" title="Copy" onclick='copyVerseCard(${JSON.stringify(v).replace(/'/g,"&#39;")})'>📋</button>
        <button class="vt-btn" title="Share" onclick='shareVerseCard(${JSON.stringify(v).replace(/'/g,"&#39;")})'>📤</button>
        <a class="vt-btn" style="text-decoration:none;color:#B8902A;" title="Open in Qur'an" href="index.html?sura=${v.sura}&aya=${v.aya}&from=muhammad" onclick="recordHistory(${v.sura},${v.aya},'${esc((v.summary||'').slice(0,60)).replace(/'/g,"\\'")}')">🔗</a>
      </div>
      <div class="verse-ref">${esc(v.reference)} · ${esc(v.explicitness||'')} · ${esc(v.meccan_medinan||'')}${v.chronology_disputed ? ' (disputed)' : ''}</div>
      <div class="verse-badges">${badges}</div>
      ${langBlocks}
      ${v.summary ? `<div class="verse-summary">${esc(v.summary)}</div>` : ''}
      ${v.research_question ? `<div class="verse-question">❓ ${esc(v.research_question)}</div>` : ''}
      <div class="verse-meta-row">
        ${speakerLine ? `<span>${speakerLine}</span>` : ''}
        ${v.addressee ? `<span>Addressee: ${esc(v.addressee)}</span>` : ''}
        ${v.applies_only_to_muhammad ? '<span>🔒 Unique to Muhammad</span>' : ''}
      </div>
      ${hadithHtml}
    </div>`;
  }).join('');
}

function renderSingleVerseBlock(ref){
  const t = (window.TENSION_VERSE_TEXT || {})[ref] || {};
  const hadithList = HADITH_BY_KEY[ref] || [];
  const hasAnyText = Object.keys(ALL_LANGS).some(k => t[ALL_LANGS[k].field]);
  const langBlocks = Object.keys(ALL_LANGS)
    .filter(k => langState[k] && t[ALL_LANGS[k].field])
    .map(k => {
      const meta = ALL_LANGS[k];
      const rtl = (k === 'arabic' || k === 'urdu');
      return `<div style="margin-top:3px;${rtl ? 'direction:rtl;text-align:right;font-size:16px;' : 'font-size:12.5px;color:#444;'}line-height:1.6;">${esc(t[meta.field])}</div>`;
    }).join('');
  return `<div style="margin-top:8px;padding:6px 8px;background:rgba(255,255,255,0.5);border-radius:6px;">
    <a href="index.html?sura=${ref.split(':')[0]}&aya=${ref.split(':')[1]}&from=muhammad" style="font-size:11px;font-weight:800;color:#1A5276;text-decoration:none;">${esc(ref)} 🔗</a>
    ${langBlocks}
    ${!hasAnyText ? `<div style="font-size:11px;color:#999;font-style:italic;margin-top:3px;">Text not loaded — tap reference to view</div>` : ''}
    ${hadithList.length ? `<div style="margin-top:4px;font-size:11px;color:#8B4513;">📿 ${hadithList.map(h => esc(h.collection + ' ' + (h.hadith_number||''))).join(', ')}</div>` : ''}
  </div>`;
}

function renderPoleVerses(refsStr){
  const singleRefRe = /^(\d+):(\d+)$/;
  const rangeRefRe = /^(\d+):(\d+)-(\d+)$/;
  const refs = (refsStr || '').split(';').map(s => s.trim()).filter(Boolean);
  if (!refs.length) return '';
  return refs.map(ref => {
    if (singleRefRe.test(ref)) {
      return renderSingleVerseBlock(ref);
    }
    if (rangeRefRe.test(ref)) {
      const expanded = (window.TENSION_RANGE_EXPANSION || {})[ref] || [];
      return `<div style="margin-top:8px;">
        <div style="font-size:11px;font-weight:800;color:#1A5276;">${esc(ref)} (range)</div>
        ${expanded.map(renderSingleVerseBlock).join('')}
      </div>`;
    }
    // Not a verse reference at all — show as plain descriptive text
    return `<div style="margin-top:6px;font-size:11.5px;color:#888;font-style:italic;">${esc(ref)}</div>`;
  }).join('');
}

function renderTensions(list){
  document.getElementById('count').textContent = list.length + ' tension pairs';
  const el = document.getElementById('list');
  if (!list.length) { el.innerHTML = '<div class="loading">No tension pairs match.</div>'; return; }

  el.innerHTML = list.map(t => `
    <div class="tension-card">
      <div class="tension-title">${esc(t.tension_id)} — ${esc(t.title)}</div>
      <div class="tension-pole a"><b>Pole A</b>${esc(t.pole_a)}${renderPoleVerses(t.pole_a_verses)}</div>
      <div class="tension-pole b"><b>Pole B</b>${esc(t.pole_b)}${renderPoleVerses(t.pole_b_verses)}</div>
      <div class="tension-q">❓ ${esc(t.core_question)}</div>
      ${t.hadith_effect ? `<div class="tension-hadith">📿 <b>With hadith:</b> ${esc(t.hadith_effect)}</div>` : ''}
      <div class="tension-status">${esc(t.status)}</div>
    </div>
  `).join('');
}

function render(){ filter(); }

load();
</script>
