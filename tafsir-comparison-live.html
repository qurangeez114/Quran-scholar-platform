<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qur’an Hikma — Tafsīr Comparison</title><style>body{margin:0;background:#f3efe6;color:#1d1b18;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:780px;min-height:100vh;margin:auto;background:#fff}.top{position:sticky;top:0;z-index:5;padding:13px 16px;background:#fffdf8;border-bottom:1px solid #e5dcc6;font-weight:850}.main{padding:16px}.picker{padding:13px;border:1px solid #e2d8c2;border-radius:14px;background:#fffaf0;margin-bottom:14px}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.row input{width:74px;padding:9px;border:1px solid #d3c5a5;border-radius:9px;font:inherit}.row button{padding:9px 12px;border:0;border-radius:9px;background:#9b771f;color:#fff;font-weight:800}.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.quick a{font-size:12px;text-decoration:none;color:#745712;border:1px solid #ddc98e;background:#fff;padding:5px 8px;border-radius:999px}.empty{padding:16px;border:1px dashed #d6c8a8;border-radius:12px;color:#6c6558}.view{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e5d8ba;border-radius:11px;padding:11px;margin:8px 0;cursor:pointer}.view b{font-size:14px}.meta{display:block;font-size:11px;color:#6b6357;margin-top:5px}.detail{display:none;font-size:12px;line-height:1.55;margin-top:8px}.view.open .detail{display:block}.bar{height:7px;background:#eee6d8;border-radius:8px;overflow:hidden;margin:7px 0 4px}.fill{height:100%;background:#b8902a}.warn{background:#fff1ed;border-left:3px solid #a95d48;padding:10px;font-size:12px;line-height:1.5;margin-top:10px}.note{font-size:12px;color:#665f53;line-height:1.5}.question{font-size:20px;margin:8px 0 5px}.source{font-weight:700}</style></head><body><div class="wrap"><div class="top">Qur’an Hikma · Tafsīr Comparison</div><main class="main"><section class="picker"><b>Open a researched verse</b><div class="row"><input id="s" inputmode="numeric" placeholder="Sura"><input id="a" inputmode="numeric" placeholder="Aya"><button id="go">Open</button></div><div class="quick" id="quick"></div></section><div id="out" class="empty">Loading comparison data…</div></main></div><script src="tafsir-comparison-renderer-v1.js"></script><script>
const api=window.QuranHikmaTafsirComparison, names={tabari:'al-Ṭabarī',ibn_kathir:'Ibn Kathīr',qurtubi:'al-Qurṭubī',jalalayn:'al-Jalālayn',saadi:'al-Saʿdī',ibn_abbas:'Tanwīr al-Miqbās (attributed to Ibn ʿAbbās)'};
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const keys=api?Object.keys(api.verified):[];document.getElementById('quick').innerHTML=keys.map(k=>`<a href="?verse=${k}">${k}</a>`).join('');
function chosen(){const p=new URLSearchParams(location.search),v=p.get('verse')||'19:28',m=v.match(/^(\d+):(\d+)$/);return m?m.slice(1).map(Number):[19,28]}
function render(){if(!api){document.getElementById('out').textContent='Comparison renderer unavailable.';return}const[s,a]=chosen(),k=s+':'+a,d=api.verified[k];document.getElementById('s').value=s;document.getElementById('a').value=a;if(!d){document.getElementById('out').className='empty';document.getElementById('out').innerHTML=`No curated comparison is published yet for <b>${k}</b>.`;return}document.title=`${k} Tafsīr Comparison — Qur’an Hikma`;document.getElementById('out').className='';document.getElementById('out').innerHTML=`<div class="note">QUR’AN ${k}</div><h1 class="question">${esc(d.question)}</h1><div class="note">${esc(d.note)}</div>${d.views.map(v=>{const report=v.scope==='report',label=v.countLabel||`${v.count} of 6 baseline sources`,bar=report?'':`<div class="bar"><div class="fill" style="width:${Math.round(v.count/6*100)}%"></div></div>`;return `<button class="view" type="button"><b>${esc(v.title)}</b>${bar}<span class="meta">${esc(label)}</span><div class="detail">${esc(v.text)}<br><br><span class="source">Source${v.scholars.length===1?'':'s'}:</span> ${v.scholars.map(x=>esc(names[x]||x)).join(' · ')}</div></button>`}).join('')}<div class="warn"><b>${esc(d.alertLabel||'Research note')}:</b> ${esc(d.special)}</div>`;document.querySelectorAll('.view').forEach(x=>x.onclick=()=>x.classList.toggle('open'))}
function go(){const s=parseInt(document.getElementById('s').value,10),a=parseInt(document.getElementById('a').value,10);if(s>0&&a>0)location.search='?verse='+s+':'+a}document.getElementById('go').onclick=go;document.querySelectorAll('input').forEach(x=>x.onkeydown=e=>{if(e.key==='Enter')go()});render();
</script></body></html>
