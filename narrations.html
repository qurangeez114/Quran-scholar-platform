<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narrations Compared — Quran Hikma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'EB Garamond','Georgia',serif;background:#FDFAF4;color:#3A2E1A;padding-bottom:78px;line-height:1.55}
  .topbar{background:#FFF8E8;border-bottom:1px solid #E8DDC0;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
  .topbar h1{font-size:19px;margin:0;flex:1;color:#5A3A10}
  .qbtn{background:#fff;border:1.5px solid #D4A830;color:#7A5010;border-radius:20px;padding:7px 14px;font-family:'EB Garamond',serif;font-size:14px;cursor:pointer}
  .qbtn.ghost{border-color:#ccc;color:#666}
  .wrap{padding:14px 16px;max-width:820px;margin:0 auto}
  .lede{font-size:15px;color:#4a3d28;margin:2px 0 12px}
  .counts{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#8a7a5a;margin-bottom:10px}
  .counts b{color:#5A3A10;font-size:15px}
  details.how{background:#FFF8E8;border:1px solid #E8DDC0;border-radius:10px;padding:10px 13px;margin-bottom:16px;font-size:13.5px;color:#5c4d33}
  details.how summary{cursor:pointer;font-weight:600;color:#7A5010}
  details.how p{margin:9px 0 0}
  .dhead{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8a7a5a;padding:15px 0 7px;border-bottom:1px solid #E8DDC0;margin-bottom:9px}
  a.row{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #E8DDC0;border-radius:10px;padding:11px 13px;margin-bottom:8px;transition:box-shadow .15s,border-color .15s}
  a.row:hover,a.row:focus-visible{box-shadow:0 2px 10px rgba(0,0,0,.07);border-color:#D4A830;outline:none}
  .rtitle{font-size:16px;font-weight:600;color:#3A2E1A;line-height:1.28;margin-bottom:6px}
  .rmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pill{font-size:11.5px;padding:2px 9px;border-radius:9px;background:#F3E9CE;color:#7A5010;font-weight:600;white-space:nowrap}
  .pill.contra{background:#EDE2EF;color:#6A3E8A}
  .pill.warn{background:#F5E3D0;color:#9A5A20}
  .thin{margin-top:7px;font-size:12px;color:#9A5A20;background:#FCF3E8;border:1px solid #EBD9C2;border-radius:7px;padding:6px 9px}
  .msg{padding:26px 16px;text-align:center;color:#8a7a5a;font-size:14.5px}
  #bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#FFF8E8;border-top:1px solid #E8DDC0;display:flex;overflow-x:auto;z-index:60}
  .bnav-btn{flex:0 0 auto;min-width:64px;background:none;border:none;padding:7px 9px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'EB Garamond',serif;font-size:10.5px;color:#8a7a5a;cursor:pointer}
  .bnav-btn.active{color:#7A5010;font-weight:700;box-shadow:inset 0 -2px 0 #D4A830}
  .bni{font-size:17px;line-height:1}
</style>
</head><body>
<div class="topbar">
  <h1>Narrations Compared</h1>
  <button class="qbtn ghost" onclick="location.href='index.html'">Home</button>
</div>
<div class="wrap"><div id="list"><div class="msg">Loading…</div></div></div>
<script>
const SB_URL='https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDRS={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEV={5:'Rule contradicts practice',4:'Contradictory outcome',3:'Accounts differ',2:'Detail varies',1:'Wording varies'};

async function load(){
  let rows;
  try{
    const r=await fetch(SB_URL+'/rest/v1/narrative_dossier_reader?select=*&order=dossier_slug.asc,sequence_order.asc',{headers:HDRS});
    if(!r.ok) throw new Error('HTTP '+r.status);
    rows=await r.json();
  }catch(e){
    document.getElementById('list').innerHTML='<div class="msg">Couldn\'t load the comparisons. '+esc(e.message)+'</div>';return;
  }
  if(!rows.length){document.getElementById('list').innerHTML='<div class="msg">No comparisons published yet.</div>';return;}

  const narrations=rows.reduce((a,r)=>a+(r.version_count||0),0);
  const contradictions=rows.reduce((a,r)=>a+(r.contradiction_count||0),0);

  let h='<div class="lede">Where the sources report the same event differently. Every comparison below is drawn from the Arabic text of the narrations, not from any translation.</div>'
      +'<div class="counts"><span><b>'+rows.length+'</b> comparisons</span><span><b>'+narrations+'</b> narrations</span><span><b>'+contradictions+'</b> contradictions</span></div>'
      +'<details class="how"><summary>How these comparisons were made</summary><p>'+esc(rows[0].method_note)+'</p></details>';

  let cur=null;
  rows.forEach(r=>{
    if(r.dossier_slug!==cur){cur=r.dossier_slug;h+='<div class="dhead">'+esc(r.dossier_title)+'</div>';}
    h+='<a class="row" href="narration.html?group='+encodeURIComponent(r.group_slug)+'">'
      +'<div class="rtitle">'+esc(r.group_title)+'</div><div class="rmeta">'
      +'<span class="pill">'+r.version_count+' narrations</span>'
      +'<span class="pill">'+r.distinct_collections+' collections</span>'
      +(r.contradiction_count>0?'<span class="pill contra">'+r.contradiction_count+' contradiction'+(r.contradiction_count===1?'':'s')+'</span>':'')
      +(r.max_severity>=4?'<span class="pill warn">'+esc(SEV[r.max_severity])+'</span>':'')
      +(r.versions_with_disputed_grade>0?'<span class="pill warn">'+r.versions_with_disputed_grade+' disputed grade'+(r.versions_with_disputed_grade===1?'':'s')+'</span>':'')
      +'</div>'
      +(r.distinct_narrators===1&&r.distinct_collections>2?'<div class="thin">In '+r.distinct_collections+' collections but traced to a single companion.</div>':'')
      +'</a>';
  });
  document.getElementById('list').innerHTML=h;
}
load();
</script>
