<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparing Narrations — Quran Hikma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'EB Garamond','Georgia',serif;background:#FDFAF4;color:#3A2E1A;padding-bottom:70px;line-height:1.6}
  .topbar{background:#FFF8E8;border-bottom:1px solid #E8DDC0;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
  .topbar h1{font-size:19px;margin:0;flex:1;color:#5A3A10}
  .qbtn{background:#fff;border:1.5px solid #D4A830;color:#7A5010;border-radius:20px;padding:7px 14px;font-family:'EB Garamond',serif;font-size:14px;cursor:pointer}
  .qbtn.ghost{border-color:#ccc;color:#666}
  .wrap{padding:16px;max-width:820px;margin:0 auto}

  /* ---- Dossier head ---- */
  .dossier-q{font-size:22px;line-height:1.35;color:#5A3A10;margin:4px 0 12px;font-weight:600}
  .dossier-sum{font-size:15px;color:#4a3d28;margin-bottom:14px}
  .method{background:#FFF8E8;border:1px solid #E8DDC0;border-left:4px solid #B8902A;border-radius:10px;padding:12px 14px;font-size:13.5px;color:#5c4d33;margin-bottom:20px}
  .method b{color:#7A5010}

  /* ---- Group cards ---- */
  .grp{background:#fff;border:1px solid #E8DDC0;border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s}
  .grp:hover,.grp:focus-visible{box-shadow:0 2px 12px rgba(0,0,0,.07);outline:none}
  .grp-role{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#8a7a5a;margin-bottom:5px}
  .grp-title{font-size:16.5px;font-weight:600;color:#3A2E1A;margin:0 0 8px;line-height:1.3}
  .stats{display:flex;flex-wrap:wrap;gap:6px}
  .stat{font-size:11.5px;padding:3px 9px;border-radius:9px;background:#F3E9CE;color:#7A5010;font-weight:600}
  .stat.warn{background:#F5E3D0;color:#9A5A20}
  .stat.contra{background:#EDE2EF;color:#6A3E8A}

  /* single-stranded flag: the point of the whole exercise */
  .thin{margin-top:9px;font-size:12.5px;color:#9A5A20;background:#FCF3E8;border:1px solid #EBD9C2;border-radius:8px;padding:7px 10px}

  /* ---- Detail ---- */
  #detail{display:none}
  .back{margin-bottom:14px}
  .core{background:#FFF8E8;border:1px solid #E8DDC0;border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:18px}
  .core b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8a7a5a;margin-bottom:5px;font-weight:700}

  h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#8a7a5a;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8DDC0}

  .ver{background:#fff;border:1px solid #E8DDC0;border-left:4px solid #B8902A;border-radius:10px;padding:13px;margin-bottom:10px}
  .ver-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:7px}
  .ver-ref{font-weight:700;font-size:14.5px;color:#5A3A10}
  .grade{font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;background:#E4F0E9;color:#2E7D32}
  .grade.weak{background:#F7E4E4;color:#A03030}
  .grade.mid{background:#FDF0D5;color:#9A6A00}
  .ev-en{font-size:14.5px;line-height:1.6;color:#3A2E1A;font-style:italic}
  .ev-note{font-size:11px;color:#9A5A20;margin-top:6px}
  .ambig{font-size:12.5px;color:#8a4a1a;background:#FDF3E7;border:1px solid #F0DCC4;border-radius:8px;padding:7px 10px;margin:7px 0}
  .gnote{font-size:12.5px;color:#6b5c3f;background:#F7F4EC;border-radius:8px;padding:7px 10px;margin:7px 0}
  .gnote b{color:#9A5A20}
  .grade-alt{font-size:11.5px;color:#A03030;background:#FCF0F0;border:1px solid #EED6D6;border-radius:8px;padding:5px 9px;margin-top:7px}
  .chain{font-size:12.5px;color:#8a7a5a;margin-bottom:6px}
  .ver-sum{font-size:14px}

  /* ---- Signature: the facing Arabic pair ---- */
  .div-card{border:1px solid #E8DDC0;border-radius:12px;background:#fff;margin-bottom:16px;overflow:hidden}
  .div-head{padding:12px 14px;background:#FFF8E8;border-bottom:1px solid #E8DDC0}
  .sev{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:9px;margin-bottom:6px}
  .sev-5{background:#EDE2EF;color:#6A3E8A}
  .sev-4{background:#F5E3D0;color:#9A5A20}
  .sev-3{background:#FDF0D5;color:#9A6A00}
  .sev-2{background:#F3E9CE;color:#7A5010}
  .div-cat{font-size:15.5px;font-weight:600;color:#3A2E1A}
  .pair{display:grid;grid-template-columns:1fr 1fr}
  .side{padding:13px}
  .side:first-child{border-right:1px solid #EFE6D0}
  .side-ref{font-size:11.5px;font-weight:700;color:#7A5010;margin-bottom:3px}
  .side-grade{font-size:10.5px;color:#8a7a5a;margin-bottom:8px}
  .ar{font-family:'Amiri',serif;font-size:19px;direction:rtl;text-align:right;line-height:1.85;color:#2A2012}
  .div-body{padding:13px 14px;border-top:1px solid #EFE6D0;font-size:14px}
  .div-body .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8a7a5a;font-weight:700;margin:11px 0 3px}
  .div-body .lbl:first-child{margin-top:0}
  .harm{background:#F7F4EC;border-radius:8px;padding:9px 11px;font-size:13.5px;margin-top:11px}

  .links{margin-top:8px}
  .link-item{background:#fff;border:1px solid #E8DDC0;border-radius:10px;padding:11px 13px;margin-bottom:9px;font-size:13.5px}
  .link-rel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#8a7a5a;margin-bottom:4px}
  .link-pair{font-weight:600;color:#5A3A10;margin-bottom:5px;font-size:14px}

  .msg{padding:26px 16px;text-align:center;color:#8a7a5a;font-size:14.5px}
  @media(max-width:520px){.pair{grid-template-columns:1fr}.side:first-child{border-right:none;border-bottom:1px solid #EFE6D0}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<div class="topbar">
  <h1>Comparing Narrations</h1>
  <button class="qbtn ghost" onclick="location.href='index.html'">Home</button>
</div>

<div class="wrap">
  <div id="list"><div class="msg">Loading…</div></div>
  <div id="detail"></div>
</div>

<script>
const SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDRS = {apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY};
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path){
  const r = await fetch(SB_URL + '/rest/v1/' + path, {headers: HDRS});
  if(!r.ok) throw new Error(r.status + ' on ' + path.split('?')[0]);
  return r.json();
}

function gradeClass(g){
  if(!g) return 'mid';
  const s = g.toLowerCase();
  if(s.includes('very daif') || s.includes('maudu') || s.includes('munkar')) return 'weak';
  if(s.includes('daif') || s.includes('shadh')) return 'weak';
  if(s.includes('hasan')) return 'mid';
  return '';
}

async function loadList(){
  let rows;
  try { rows = await api('narrative_dossier_reader?select=*&order=dossier_slug.asc,sequence_order.asc'); }
  catch(e){ document.getElementById('list').innerHTML =
    '<div class="msg">Couldn\'t load the comparisons. ' + esc(e.message) + '</div>'; return; }

  if(!rows.length){ document.getElementById('list').innerHTML =
    '<div class="msg">No comparisons published yet.</div>'; return; }

  // Rows arrive flat, one per group. Group them by dossier so each subject
  // keeps its own question, summary and method note.
  const byDossier = [];
  const seen = {};
  rows.forEach(r => {
    if(!seen[r.dossier_slug]){ seen[r.dossier_slug] = {meta:r, groups:[]}; byDossier.push(seen[r.dossier_slug]); }
    seen[r.dossier_slug].groups.push(r);
  });

  let h = '';
  byDossier.forEach((dos, i) => {
  const d = dos.meta;
  h += (i > 0 ? '<div style="height:34px"></div>' : '')
        + '<div class="dossier-q">' + esc(d.question) + '</div>'
        + '<div class="dossier-sum">' + esc(d.summary) + '</div>'
        + '<div class="method"><b>How these comparisons were made.</b> ' + esc(d.method_note) + '</div>';

  dos.groups.forEach(r => {
    h += '<div class="grp" tabindex="0" role="button" onclick="openGroup(\'' + esc(r.group_slug) + '\')"'
       + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openGroup(\'' + esc(r.group_slug) + '\')}">'
       + '<div class="grp-role">' + esc(r.role_in_dossier) + '</div>'
       + '<h2 class="grp-title">' + esc(r.group_title) + '</h2>'
       + '<div class="stats">'
       + '<span class="stat">' + r.version_count + ' narrations</span>'
       + '<span class="stat">' + r.distinct_collections + ' collections</span>'
       + '<span class="stat">' + r.distinct_narrators + ' companion' + (r.distinct_narrators===1?'':'s') + '</span>'
       + (r.contradiction_count > 0 ? '<span class="stat contra">' + r.contradiction_count + ' contradiction' + (r.contradiction_count===1?'':'s') + '</span>' : '')
       + (r.versions_with_disputed_grade > 0 ? '<span class="stat warn">' + r.versions_with_disputed_grade + ' disputed grade' + (r.versions_with_disputed_grade===1?'':'s') + '</span>' : '')
       + '</div>';
    // The attestation-inflation flag, computed from the data
    if(r.distinct_narrators === 1 && r.distinct_collections > 2){
      h += '<div class="thin">Appears in ' + r.distinct_collections + ' collections but traces to a single companion. '
         + 'Being in many books is not the same as being independently reported.</div>';
    }
    h += '</div>';
  });
  });
  document.getElementById('list').innerHTML = h;
}

async function openGroup(slug){
  const list = document.getElementById('list'), det = document.getElementById('detail');
  list.style.display='none'; det.style.display='block';
  det.innerHTML = '<div class="msg">Loading…</div>';
  window.scrollTo(0,0);

  let g, vers, divs, links;
  try {
    [g, vers, divs, links] = await Promise.all([
      api('narrative_dossier_reader?select=*&group_slug=eq.' + encodeURIComponent(slug)),
      api('narrative_version_reader?select=*&group_slug=eq.' + encodeURIComponent(slug) + '&order=sequence_order'),
      api('narrative_divergence_reader?select=*&group_slug=eq.' + encodeURIComponent(slug) + '&order=severity.desc'),
      api('narrative_group_link_reader?select=*&from_slug=eq.' + encodeURIComponent(slug))
    ]);
  } catch(e){ det.innerHTML = '<button class="qbtn ghost back" onclick="closeGroup()">← Back</button>'
    + '<div class="msg">Couldn\'t load this comparison. ' + esc(e.message) + '</div>'; return; }

  const info = g[0] || {};
  let h = '<button class="qbtn ghost back" onclick="closeGroup()">← All comparisons</button>'
        + '<h2 class="grp-title" style="font-size:20px">' + esc(info.group_title) + '</h2>'
        + '<div class="core"><b>What is not in dispute</b>' + esc(info.historical_core) + '</div>';

  h += '<h3 class="sec">Where the narrations diverge</h3>';
  if(!divs.length) h += '<div class="msg">No divergences recorded yet.</div>';
  divs.forEach(d => {
    if(!d.point_id) return;
    const sv = d.point_severity || d.severity;
    h += '<div class="div-card">'
       + '<div class="div-head"><span class="sev sev-' + sv + '">' + sevLabel(sv) + '</span>'
       + '<div class="div-cat">' + esc(d.category) + '</div></div>'
       + '<div class="pair">'
       + sidePanel(d.source_a, d.grade_a, d.arabic_a, d.evidence_language_a)
       + sidePanel(d.source_b, d.grade_b, d.arabic_b, d.evidence_language_b)
       + '</div>'
       + '<div class="div-body">'
       + '<div class="lbl">What differs</div>' + esc(d.analysis)
       + '<div class="lbl">Why it matters</div>' + esc(d.significance)
       + (d.harmonization_option ? '<div class="harm"><b>Offered reconciliation:</b> ' + esc(d.harmonization_option)
           + (d.preferred_explanation ? '<br><br><b>Does it settle it?</b> ' + esc(d.preferred_explanation) : '') + '</div>' : '')
       + '</div></div>';
  });

  h += '<h3 class="sec">The narrations compared (' + vers.length + ')</h3>';
  vers.forEach(v => {
    h += '<div class="ver"><div class="ver-head">'
       + '<span class="ver-ref">' + esc(v.source_collection) + ' ' + esc(v.source_reference) + '</span>'
       + '<span class="grade ' + gradeClass(v.hadith_grade) + '">' + esc(v.hadith_grade || 'ungraded') + '</span></div>'
       + '<div class="chain">' + esc(v.narrator) + ' — ' + esc(v.transmission_chain) + '</div>'
       + (v.grade_note ? '<div class="gnote">' + esc(v.grade_note)
           + (v.grade_attribution && v.grade_attribution.indexOf('not attributed') > -1
              ? ' <b>Attributed to a ' + esc(v.grade_attribution.split('—')[0].trim()) + ', not the Prophet.</b>' : '')
           + '</div>' : '')
       + (v.citation_ambiguous ? '<div class="ambig">This collection and number match more than one different hadith in this corpus, because the two source editions numbered differently. The text shown here is the one this comparison refers to (record ' + esc(v.hadith_corpus_id) + '). Check the opening words before relying on the number elsewhere.</div>' : '')
       + '<div class="ver-sum">' + esc(v.version_summary) + '</div>'
       + (v.grade_disputed
          ? '<div class="grade-alt">The same Arabic text is stored again in this corpus as '
            + esc(v.source_collection) + ' ' + esc(v.alternate_reference) + ' and graded <b>'
            + esc(v.alternate_grade) + '</b>. Both gradings are shown because the corpus contains both.</div>'
          : '')
       + '</div>';
  });

  h += '<div style="margin:18px 0 4px"><a href="narrative-comparison.html?story=' + encodeURIComponent(slug)
     + '" style="color:#7A5010;font-size:14px">Open the claim-by-claim view for this narration &rarr;</a></div>';

  if(links.length){
    h += '<h3 class="sec">How this connects to the others</h3><div class="links">';
    links.forEach(l => {
      h += '<div class="link-item"><div class="link-rel">' + esc(l.relation.replace(/_/g,' ')) + '</div>'
         + '<div class="link-pair">' + esc(l.to_title) + '</div>' + esc(l.note) + '</div>';
    });
    h += '</div>';
  }
  det.innerHTML = h;
}

function sidePanel(ref, grade, text, lang){
  // Evidence is normally the Arabic matn. A few sources are held in this
  // corpus only in English; those are quoted from the English and said to be,
  // rather than being rendered back into Arabic.
  const isEnglish = lang && lang.indexOf('English') === 0;
  return '<div class="side"><div class="side-ref">' + esc(ref) + '</div>'
       + '<div class="side-grade">' + esc(grade || '') + '</div>'
       + '<div class="' + (isEnglish ? 'ev-en' : 'ar') + '">' + esc(text) + '</div>'
       + (isEnglish ? '<div class="ev-note">' + esc(lang) + '</div>' : '')
       + '</div>';
}

function sevLabel(s){
  return {5:'Rule contradicts practice',4:'Contradictory outcome',3:'Accounts differ',2:'Detail varies',1:'Wording varies'}[s] || 'Differs';
}
function closeGroup(){
  document.getElementById('detail').style.display='none';
  document.getElementById('list').style.display='block';
  window.scrollTo(0,0);
}
loadList();
</script>
</body></html>
