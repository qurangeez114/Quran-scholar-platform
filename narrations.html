<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narrations Compared — Quran Hikma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'EB Garamond','Georgia',serif;background:#FDFAF4;color:#3A2E1A;padding-bottom:150px;line-height:1.55}
  .topbar{background:#FFF8E8;border-bottom:1px solid #E8DDC0;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
  .topbar h1{font-size:19px;margin:0;flex:1;color:#5A3A10}
  .qbtn{background:#fff;border:1.5px solid #D4A830;color:#7A5010;border-radius:20px;padding:7px 14px;font-family:'EB Garamond',serif;font-size:14px;cursor:pointer}
  .qbtn.ghost{border-color:#ccc;color:#666}
  .wrap{padding:14px 16px;max-width:820px;margin:0 auto}
  .lede{font-size:15px;color:#4a3d28;margin:2px 0 12px}
  .counts{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#8a7a5a;margin-bottom:10px}
  .counts b{color:#5A3A10;font-size:15px}
  details.how{background:#FFF8E8;border:1px solid #E8DDC0;border-radius:10px;padding:10px 13px;margin-bottom:16px;font-size:13.5px;color:#5c4d33}
  details.how summary{cursor:pointer;font-weight:600;color:#7A5010}
  details.how p{margin:9px 0 0}
  .dhead{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8a7a5a;padding:15px 0 7px;border-bottom:1px solid #E8DDC0;margin-bottom:9px}
  a.row{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #E8DDC0;border-radius:10px;padding:11px 13px;margin-bottom:8px;transition:box-shadow .15s,border-color .15s}
  a.row:hover,a.row:focus-visible{box-shadow:0 2px 10px rgba(0,0,0,.07);border-color:#D4A830;outline:none}
  .rtitle{font-size:16px;font-weight:600;color:#3A2E1A;line-height:1.28;margin-bottom:6px}
  .rmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pill{font-size:11.5px;padding:2px 9px;border-radius:9px;background:#F3E9CE;color:#7A5010;font-weight:600;white-space:nowrap}
  .pill.contra{background:#EDE2EF;color:#6A3E8A}
  .pill.warn{background:#F5E3D0;color:#9A5A20}
  .thin{margin-top:7px;font-size:12px;color:#9A5A20;background:#FCF3E8;border:1px solid #EBD9C2;border-radius:7px;padding:6px 9px}
  .searchbar{position:relative;margin:2px 0 10px}
  #q{width:100%;padding:13px 40px 13px 14px;font-family:'EB Garamond',serif;font-size:17px;color:#3A2E1A;
     background:#fff;border:1.5px solid #E8DDC0;border-radius:12px;outline:none}
  #q:focus{border-color:#D4A830}
  .clearq{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;
     font-size:24px;color:#8a7a5a;cursor:pointer;padding:0 8px;line-height:1}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:13.5px;padding:7px 13px;border-radius:18px;background:#fff;border:1.5px solid #E8DDC0;
     color:#6b5c3f;cursor:pointer;font-family:'EB Garamond',serif;min-height:38px}
  .chip.on{background:#FFF8E8;border-color:#D4A830;color:#5A3A10;font-weight:700}
  .rescount{font-size:13.5px;color:#8a7a5a;margin-bottom:8px}
  .msg{padding:26px 16px;text-align:center;color:#8a7a5a;font-size:14.5px}
  #bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#FFF8E8;border-top:1px solid #E8DDC0;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:60}
  #bottom-nav::-webkit-scrollbar{display:none}
  .bnav-btn{flex:0 0 auto;min-width:72px;background:none;border:none;padding:7px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'EB Garamond',serif;font-size:11px;color:#8a7a5a;cursor:pointer;white-space:nowrap;overflow:visible}
  .bnav-btn.active{color:#7A5010;font-weight:700;box-shadow:inset 0 -2px 0 #D4A830}
  .bni{font-size:17px;line-height:1}
</style>
</head><body>
<div class="topbar">
  <h1>Narrations Compared</h1>
  <button class="qbtn ghost" onclick="location.href='index.html'">Home</button>
</div>
<div class="wrap">
  <div class="lede">Where the sources report the same event differently. Every comparison is drawn from the Arabic text of the narrations, not from any translation.</div>
  <div class="searchbar">
    <input id="q" type="search" placeholder="Search a topic, companion, collection, or Arabic word…"
           autocomplete="off" oninput="applyFilters()">
    <button id="clearq" class="clearq" onclick="clearSearch()" hidden>&times;</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="count" class="rescount"></div>
  <div id="list"><div class="msg">Loading…</div></div>
</div>
<script>
const SB_URL='https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDRS={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEV={5:'Rule contradicts practice',4:'Contradictory outcome',3:'Accounts differ',2:'Detail varies',1:'Wording varies'};

let ALL=[];               // every comparison, with its searchable blob
let FILTER={sev:null,coll:null};

const FILTERS=[
  {key:'sev',  val:5, label:'Rule vs practice'},
  {key:'sev',  val:4, label:'Contradictory outcome'},
  {key:'coll', val:'Sahih al-Bukhari', label:'Bukhārī'},
  {key:'coll', val:'Sahih Muslim', label:'Muslim'},
  {key:'thin', val:true, label:'Single companion'}
];

function drawChips(){
  document.getElementById('chips').innerHTML = FILTERS.map((f,i)=>
    '<button class="chip'+(FILTER[f.key]===f.val?' on':'')+'" onclick="toggleFilter('+i+')">'+esc(f.label)+'</button>'
  ).join('');
}
function toggleFilter(i){
  const f=FILTERS[i];
  FILTER[f.key] = (FILTER[f.key]===f.val) ? null : f.val;
  drawChips(); applyFilters();
}
function clearSearch(){ document.getElementById('q').value=''; applyFilters(); }

function applyFilters(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  document.getElementById('clearq').hidden = !q;
  let rows=ALL.filter(r=>{
    if(q && !(r.searchable||'').includes(q)) return false;
    if(FILTER.sev && (r.max_severity||0) < FILTER.sev) return false;
    if(FILTER.coll && !(r.collections||'').includes(FILTER.coll)) return false;
    if(FILTER.thin && !(r.distinct_narrators===1 && r.distinct_collections>2)) return false;
    return true;
  });
  render(rows, q);
}

async function load(){
  let rows;
  try{
    const r=await fetch(SB_URL+'/rest/v1/narrative_search_index?select=*&order=dossier_slug.asc,group_title.asc',{headers:HDRS});
    if(!r.ok) throw new Error('HTTP '+r.status);
    rows=await r.json();
  }catch(e){
    document.getElementById('list').innerHTML='<div class="msg">Couldn\'t load the comparisons. '+esc(e.message)+'</div>';return;
  }
  if(!rows.length){document.getElementById('list').innerHTML='<div class="msg">No comparisons published yet.</div>';return;}
  ALL=rows; drawChips(); applyFilters();
}

function render(rows, q){
  const narrations=rows.reduce((a,r)=>a+(r.version_count||0),0);
  const contradictions=rows.reduce((a,r)=>a+(r.contradiction_count||0),0);
  document.getElementById('count').textContent =
    rows.length + (rows.length===1?' comparison':' comparisons')
    + ' · ' + narrations + ' narrations · ' + contradictions + ' contradictions';

  if(!rows.length){
    document.getElementById('list').innerHTML =
      '<div class="msg">Nothing matches that search.<br>Try a companion, a collection, a topic, or an Arabic word.</div>';
    return;
  }

  let h='';
  let cur=null;
  rows.forEach(r=>{
    if(r.dossier_title!==cur){cur=r.dossier_title;h+='<div class="dhead">'+esc(r.dossier_title||'Other comparisons')+'</div>';}
    h+='<a class="row" href="narration.html?group='+encodeURIComponent(r.group_slug)+'">'
      +'<div class="rtitle">'+esc(r.group_title)+'</div><div class="rmeta">'
      +'<span class="pill">'+r.version_count+' narrations</span>'
      +'<span class="pill">'+r.distinct_collections+' collections</span>'
      +(r.contradiction_count>0?'<span class="pill contra">'+r.contradiction_count+' contradiction'+(r.contradiction_count===1?'':'s')+'</span>':'')
      +(r.max_severity>=4?'<span class="pill warn">'+esc(SEV[r.max_severity])+'</span>':'')
      +(r.versions_with_disputed_grade>0?'<span class="pill warn">'+r.versions_with_disputed_grade+' disputed grade'+(r.versions_with_disputed_grade===1?'':'s')+'</span>':'')
      +'</div>'
      +(r.distinct_narrators===1&&r.distinct_collections>2?'<div class="thin">In '+r.distinct_collections+' collections but traced to a single companion.</div>':'')
      +'</a>';
  });
  document.getElementById('list').innerHTML=h;
}
load();
</script>
