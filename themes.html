<script>
const SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDR = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

let ALL_THEMES = [];

const CATS = [
  { pat: /Women/i,                                                          icon:'👩', label:'Women & Gender' },
  { pat: /Fight|War|Jihad|Warfare|Disbeliever|Allian/i,                    icon:'⚔️', label:'Warfare & Jihad' },
  { pat: /Moses|Abraham|Noah|Jesus|Joseph|Solomon|Prophet|Pharaoh|Khidr/i, icon:'🕌', label:'Prophets & Stories' },
  { pat: /Judgment|Hell|Paradise|Resurrect|Afterlife|Barzakh/i,            icon:'⚖️', label:'Afterlife' },
  { pat: /Monotheism|Tawhid|Divine|Shirk|Sonship/i,                        icon:'☝️', label:'Theology' },
  { pat: /Prayer|Worship|Fasting|Hajj|Charity|Zakat/i,                     icon:'🤲', label:'Worship' },
  { pat: /Quran|Scripture|Torah|Gospel|People of the Book|Covenant/i,      icon:'📖', label:'Scripture' },
  { pat: /Hypocrites|Apostasy|Opposition|Nifaq/i,                          icon:'⚠️', label:'Social & Political' },
  { pat: /Creation|Signs|Nature|Gratitude/i,                               icon:'🌿', label:'Creation & Signs' },
];
function getCat(t) { for (const c of CATS) { if (c.pat.test(t)) return c; } return { icon:'📚', label:'Other' }; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function load() {
  // Fetch all rows in pages of 1000
  let all = [], offset = 0;
  while (true) {
    const r = await fetch(`${SB_URL}/rest/v1/thematic_cross_references?select=theme,sura&limit=1000&offset=${offset}&order=theme`, { headers: HDR });
    if (!r.ok) break;
    const page = await r.json();
    if (!Array.isArray(page) || !page.length) break;
    all = all.concat(page);
    if (page.length < 1000) break;
    offset += 1000;
  }

  // Aggregate
  const themeV = {}, themeS = {};
  all.forEach(row => {
    if (!row || !row.theme) return;
    themeV[row.theme] = (themeV[row.theme] || 0) + 1;
    if (!themeS[row.theme]) themeS[row.theme] = new Set();
    themeS[row.theme].add(row.sura);
  });

  ALL_THEMES = Object.keys(themeV)
    .map(t => ({ theme: t, verse_count: themeV[t], sura_count: themeS[t].size }))
    .sort((a,b) => b.verse_count - a.verse_count);

  document.getElementById('count').textContent = ALL_THEMES.length + ' themes';
  render(sortByControversy(ALL_THEMES));
}

function render(themes) {
  themes = sortByControversy(themes);
  const list = document.getElementById('list');
  document.getElementById('count').textContent = themes.length + ' themes';
  if (!themes.length) { list.innerHTML = '<div class="loading">No themes found.</div>'; return; }

  // Group by category
  const byCategory = {};
  themes.forEach(t => {
    const c = getCat(t.theme);
    const key = c.icon + ' ' + c.label;
    if (!byCategory[key]) byCategory[key] = [];
    byCategory[key].push(t);
  });

  let html = '';
  Object.keys(byCategory).sort().forEach(cat => {
    html += `<div class="cat-header">${esc(cat)}</div>`;
    byCategory[cat].forEach(t => {
      html += `<div class="theme-row" onclick="open_theme('${encodeURIComponent(t.theme)}')">
        <div class="theme-name">${esc(t.theme)}</div>
        <div class="theme-count">${t.verse_count}v</div>
        <div class="theme-arrow">↗</div>
      </div>`;
    });
  });
  list.innerHTML = html;
}


// ── CONTROVERSY-FIRST RANKING ──
function controversyScore(v) {
  const text = [v.english,v.aya_text,v.text_english,v.hadith_text,v.topic,
                v.brief_description,v.content,v.reason_text,v.story_en,
                v.title_en,v.summary,v.name_english,v.theme,v.story]
    .filter(Boolean).join(' ').toLowerCase();
  let score = 0;
  const critical = ['kill','slay','smite','strike','cut off','amputat','crucif','stone','whip','lash',
    'apostat','apostasy','slave','captive','concubin','right hand possess',
    'wife.*beat','beat.*wife','men.*degree','men.*superior',
    'disbeliev.*hell','fight.*until','jihad','warfare','terror',
    'do not take.*friend','do not take.*ally',
    'adulter','zina.*punish','fornication.*lash','thief.*hand','theft.*amputa',
    'homosexual','liwat','blasphemy.*death','insult.*prophet',
    'jizya','dhimmi','poll tax','women.*half.*witness','testimony.*two women',
    'inherit.*half','daughter.*half','marry.*four','polygam','nushuz','idrib',
    'sex slave','slave.*sex','exile.*death','cut hand'];
  for (const kw of critical) { if (new RegExp(kw).test(text)) score += 12; }
  const moderate = ['divorce','talaq','khul','triple.*talaq','inheritance','mahr',
    'veil','hijab','niqab','disbeliev','infidel','kafir','mushrik',
    'hellfire','punishment','torment','wrath','war','battle','enemy',
    'riba','interest','usury','intoxicant','alcohol','wine','forbid',
    'gender.*court','women.*testimony','slave.*free','music.*forbid',
    'honor.*kill','martyr.*paradise','die.*path'];
  for (const kw of moderate) { if (new RegExp(kw).test(text)) score += 5; }
  const devotional = ['praise.*allah','glory.*allah','bismillah','alhamdulillah',
    'merciful','compassionate','forgiving','most kind',
    'be patient','trust.*allah','faith.*heart','believers.*paradise','righteous.*garden'];
  for (const kw of devotional) { if (new RegExp(kw).test(text)) score -= 2; }
  if (v.controversy_level) score += (parseInt(v.controversy_level)-1)*4;
  if (v.human_rights_score != null) score += Math.max(0,(5-parseFloat(v.human_rights_score))*2);
  if (v.potential_concerns && v.potential_concerns.length > 10) score += 4;
  return score;
}
function sortByControversy(arr) {
  return arr.slice().sort((a,b) => {
    const sa=controversyScore(a), sb=controversyScore(b);
    if (sb!==sa) return sb-sa;
    return (a.sura_id||a.year_ce||0)-(b.sura_id||b.year_ce||0)||(a.aya_number||0)-(b.aya_number||0);
  });
}
// ── END CONTROVERSY RANKING ──

function filter() {
  const q   = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('catSelect').value;
  let filtered = ALL_THEMES;
  if (q) filtered = filtered.filter(t => t.theme.toLowerCase().includes(q));
  if (cat) filtered = filtered.filter(t => new RegExp(cat,'i').test(t.theme));
  render(filtered);
}

async function open_theme(encoded) {
  var themeName = decodeURIComponent(encoded);
  // Show fiqh chips inline before navigating
  var existingModal = document.getElementById('theme-fiqh-modal');
  if (existingModal) existingModal.remove();

  var modal = document.createElement('div');
  modal.id = 'theme-fiqh-modal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;padding-bottom:80px;';
  modal.innerHTML = '<div style="background:#FDFAF2;border-radius:16px 16px 0 0;width:100%;max-width:600px;max-height:70vh;overflow-y:auto;padding:20px;">' +
    '<div style="font-family:Inconsolata,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#B8902A;margin-bottom:8px;">Theme: '+themeName+'</div>' +
    '<div id="theme-fiqh-list"><div style="text-align:center;padding:20px;color:#888;font-style:italic;">Loading related rulings…</div></div>' +
    '<div style="display:flex;gap:10px;margin-top:16px;">' +
      '<button onclick="window.location.href=\'theme-analysis.html?theme='+encoded+'\'" style="flex:1;padding:12px;background:#B8902A;border:none;border-radius:8px;color:#fff;font-family:Inconsolata,monospace;font-size:12px;font-weight:700;cursor:pointer;">Open Full Theme Analysis →</button>' +
      '<button onclick="document.getElementById(\'theme-fiqh-modal\').remove()" style="padding:12px 16px;background:#F5F0E4;border:1px solid #D4C9A8;border-radius:8px;color:#8B7355;font-family:Inconsolata,monospace;font-size:12px;cursor:pointer;">Close</button>' +
    '</div>' +
  '</div>';
  modal.onclick = function(e) { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);

  // Load relevant fiqh topics
  try {
    var txt = themeName.toLowerCase();
    var kwMap = {
      'war':'Jihad and Warfare','jihad':'Jihad and Warfare','fight':'Jihad and Warfare',
      'slave':'Slavery','captive':'Slavery',
      'wom':'Women: Legal Status and Personhood','gender':'Women: Legal Status and Personhood',
      'marriage':'Marriage and Family Law','divorce':'Divorce and Separation',
      'inherit':'Inheritance and Wills',
      'punish':'Criminal Law and Hudud','law':'Criminal Law and Hudud',
      'pray':'Prayer and Worship',
      'apostas':'Apostasy',
      'non-muslim':'Non-Muslim Rights and Dhimma',
      'food':'Food and Drink','halal':'Food and Drink',
      'finance':'Finance and Economics','riba':'Finance and Economics'
    };
    var category = null;
    var kws = Object.keys(kwMap);
    for (var i = 0; i < kws.length; i++) {
      if (txt.indexOf(kws[i]) !== -1) { category = kwMap[kws[i]]; break; }
    }
    if (!category) category = 'Prayer and Worship';
    var enc = encodeURIComponent(category);
    var r = await fetch(SB_URL+'/rest/v1/madhhab_topics?select=id,topic,category,controversy_level&category=ilike.*'+enc+'*&order=controversy_level.desc.nullslast&limit=5', {headers:{apikey:SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    var topics = r.ok ? await r.json() : [];
    var list = document.getElementById('theme-fiqh-list');
    if (!list) return;
    if (!topics || !topics.length) {
      list.innerHTML = '<div style="color:#888;font-style:italic;font-size:13px;text-align:center;">No related rulings found.</div>';
      return;
    }
    var lvlColors = {1:'#2E7D32',2:'#F57F17',3:'#E65100',4:'#B71C1C',5:'#6A1B9A'};
    var lvlLabels = {1:'Acceptable',2:'Concerning',3:'Disturbing',4:'Shocking',5:'Extreme'};
    list.innerHTML = topics.map(function(t) {
      var lvl = t.controversy_level || 3;
      var col = lvlColors[lvl] || '#888';
      return '<div onclick="window.location.href=\'madhhab.html?topic='+encodeURIComponent(t.id)+'&from=themes\'" style="margin-bottom:8px;padding:11px 13px;background:#fff;border:1px solid #E0D4B0;border-left:3px solid '+col+';border-radius:6px;cursor:pointer;">' +
        '<div style="font-family:\'EB Garamond\',serif;font-size:15px;font-weight:700;color:#1A1610;">'+t.topic+'</div>' +
        '<div style="font-family:Inconsolata,monospace;font-size:10px;color:#888;margin-top:3px;"><span style="color:'+col+';font-weight:700;">'+(lvlLabels[lvl]||'')+'</span> · Tap to read full ruling →</div>' +
      '</div>';
    }).join('');
  } catch(e) {
    var list2 = document.getElementById('theme-fiqh-list');
    if (list2) list2.innerHTML = '<div style="color:#888;font-style:italic;font-size:13px;text-align:center;">Could not load rulings.</div>';
  }
}

  var _t=[], _r={}, _loaded=false, _cat='all', _q='';
  var SB='https://ylosytbxpzxzwfzjpaej.supabase.co', AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  window.openMadhhabPanel = function(tid) {
    document.getElementById('madhhab-panel').classList.add('open');
    document.body.style.overflow = 'hidden';
    if (!_loaded) { _load().then(function(){ if(tid) _scrollTo(tid); }); }
    else if (tid) { _scrollTo(tid); }
  };

  window.closeMadhhabPanel = function() {
    document.getElementById('madhhab-panel').classList.remove('open');
    document.body.style.overflow = '';
  };

  window.searchMP = function(q) { _q = q; _render(); };

  window.filterMP = function(cat, el) {
    _cat = cat;
    document.querySelectorAll('.mcc').forEach(function(c){ c.classList.remove('active'); });
    if (el) el.classList.add('active');
    _render();
  };

  window.toggleMT = function(id) {
    var body = document.getElementById('mb-'+id);
    var arr = document.getElementById('ma-'+id);
    if (!body) return;
    if (body.classList.contains('open')) {
      body.classList.remove('open'); arr.classList.remove('open'); return;
    }
    body.classList.add('open'); arr.classList.add('open');
    if (_r[id]) { body.innerHTML = _r[id]; return; }
    body.innerHTML = '<div style="color:#aaa;padding:8px;font-size:13px">Loading...</div>';
    fetch(SB+'/rest/v1/madhhab_rulings?topic_id=eq.'+id+'&select=hanafi_position,maliki_position,shafii_position,hanbali_position,jafari_position,zaydi_position,ibadi_position,salafi_position,consensus,key_disagreement,historical_consequences', {
      headers: {'apikey': AK, 'Authorization': 'Bearer '+AK}
    }).then(function(r){ return r.json(); }).then(function(rows) {
      var r = rows[0];
      if (!r) { body.innerHTML = '<div style="color:#aaa;padding:8px">No ruling found.</div>'; return; }
      var schools = [['Hanafi',r.hanafi_position],['Maliki',r.maliki_position],['Shafii',r.shafii_position],['Hanbali',r.hanbali_position],['Jafari',r.jafari_position],['Zaydi',r.zaydi_position],['Ibadi',r.ibadi_position],['Salafi',r.salafi_position]].filter(function(s){ return s[1]; });
      var html = schools.map(function(s){ return '<div class="msr"><div class="msn">'+s[0]+'</div><div class="mst">'+esc(s[1])+'</div></div>'; }).join('');
      if (r.consensus) html += '<div class="msr" style="border-left-color:#4CAF50"><div class="msn" style="color:#2E7D32">Consensus</div><div class="mst">'+esc(r.consensus)+'</div></div>';
      if (r.historical_consequences) html += '<div class="msr" style="border-left-color:#c62828"><div class="msn" style="color:#c62828">Historical Impact</div><div class="mst">'+esc(r.historical_consequences)+'</div></div>';
      html += '<a href="madhhab.html?topic='+id+'" style="display:inline-block;margin-top:8px;padding:6px 14px;background:#FDF5DE;border:1.5px solid #D4A830;border-radius:16px;font-size:12px;font-weight:700;color:#B8902A;text-decoration:none">Open Full Page ↗</a>';
      _r[id] = html; body.innerHTML = html;
    }).catch(function(e){ body.innerHTML = '<div style="color:#c62828;padding:8px">Error: '+e.message+'</div>'; });
  };

  function _load() {
    return fetch(SB+'/rest/v1/madhhab_topics?select=id,topic,category&order=category,topic&limit=2000', {
      headers: {'apikey': AK, 'Authorization': 'Bearer '+AK}
    }).then(function(r){ return r.json(); }).then(function(data) {
      _t = data; _loaded = true;
      var cats = [], seen = {};
      _t.forEach(function(t){ if (!seen[t.category]) { seen[t.category]=1; cats.push(t.category); } });
      cats.sort();
      var bar = document.getElementById('mpcb');
      cats.forEach(function(cat){
        var c = document.createElement('div'); c.className='mcc'; c.textContent=cat;
        c.onclick = function(){ filterMP(cat,c); }; bar.appendChild(c);
      });
      _render();
    }).catch(function(e){ document.getElementById('mpb').innerHTML='<div class="mml">Error: '+e.message+'</div>'; });
  }

  function _render() {
    var body = document.getElementById('mpb');
    var topics = _t.slice();
    if (_cat !== 'all') topics = topics.filter(function(t){ return t.category === _cat; });
    if (_q) { var q = _q.toLowerCase(); topics = topics.filter(function(t){ return t.topic.toLowerCase().indexOf(q) !== -1 || t.category.toLowerCase().indexOf(q) !== -1; }); }
    if (!topics.length) { body.innerHTML = '<div class="mml">No topics found.</div>'; return; }
    var show = topics.slice(0,100);
    body.innerHTML = show.map(function(t){
      return '<div class="mtc" id="mt-'+t.id+'"><div class="mth" onclick="toggleMT('+t.id+')"><div><div class="mtt">'+esc(t.topic)+'</div><div class="mtcat">'+esc(t.category)+'</div></div><span class="mta" id="ma-'+t.id+'">▼</span></div><div class="mtbd" id="mb-'+t.id+'"></div></div>';
    }).join('') + (topics.length > 100 ? '<div class="mml">Showing 100 of '+topics.length+'. Search to narrow.</div>' : '');
  }

  function _scrollTo(id) {
    setTimeout(function(){
      var el = document.getElementById('mt-'+id);
      if (el) { el.scrollIntoView({behavior:'smooth'}); toggleMT(id); }
    }, 300);
  }
})();
</script>
</body>
</html>
