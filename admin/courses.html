<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Management - QuranHikma Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f3f6f8;
      color: #243e4a;
      line-height: 1.55;
    }
    .header {
      background: #173446;
      color: white;
      border-bottom: 3px solid #b69a60;
      padding: 1.25rem clamp(1rem, 3vw, 2rem);
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 1.8rem; }
    .header-nav { display: flex; gap: 1rem; }
    .header-nav a {
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.09);
      border-radius: 6px;
      transition: background 0.3s;
    }
    .header-nav a:hover { background: rgba(255,255,255,0.19); }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: clamp(1rem, 2.4vw, 2rem);
    }

    .section {
      background: white;
      border: 1px solid #dee7eb;
      border-radius: 14px;
      padding: clamp(1.1rem, 2.4vw, 1.75rem);
      margin-bottom: 1.5rem;
      box-shadow: 0 3px 12px rgba(18,47,62,.045);
    }

    .section h2 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #333;
      border-bottom: 1px solid #dfe8ea;
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #555;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
    }
    .form-group textarea { min-height: 100px; }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }
    .btn-primary { background: #176d69; color: white; }
    .btn-primary:hover { background: #125c59; }
    .btn-secondary { background: #eef3f4; color: #244b55; border: 1px solid #d9e4e6; }
    .btn-secondary:hover { background: #e0eced; }
    .btn-danger { background: #ab3d34; color: white; }
    .btn-danger:hover { background: #922f27; }
    .btn-success { background: #4CAF50; color: white; }

    /* Course cards are readable at every width; action labels never occupy narrow slivers. */
    .courses-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr));
      gap: 1rem;
      align-items: stretch;
    }

    .course-item {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #dce5e8;
      border-radius: 12px;
      padding: 1.25rem;
      transition: box-shadow 0.16s ease, border-color 0.16s ease;
      box-shadow: 0 2px 8px rgba(24, 49, 65, .035);
    }
    .course-item:hover { border-color: #9cbab8; box-shadow: 0 7px 20px rgba(24,49,65,.07); }

    .course-title {
      font-size: 1.13rem;
      font-weight: 730;
      line-height: 1.4;
      margin-bottom: 0.5rem;
      color: #173446;
      overflow-wrap: anywhere;
    }

    .course-description {
      color: #4e6571;
      font-size: 0.91rem;
      margin-bottom: 0.8rem;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .course-meta {
      font-size: 0.78rem;
      color: #6f818b;
      margin: 0 0 0.7rem;
      padding: 0 0 0.7rem;
      border-bottom: 1px solid #e6ecef;
    }
    .course-state { margin-bottom: 1rem; }

    .course-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: stretch;
      margin-top: auto;
    }
    .course-actions .btn {
      display: inline-flex;
      flex: 1 1 112px;
      min-width: 112px;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid transparent;
      padding: 0.57rem 0.75rem;
      font-size: .82rem;
      line-height: 1.25;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      word-break: normal;
      overflow-wrap: normal;
      cursor: pointer;
    }
    .course-actions .course-preview { flex-basis: 142px; }
    .course-actions .course-delete {
      background: #fff;
      border-color: #e3b5b0;
      color: #a0342a;
    }
    .course-actions .course-delete:hover { background: #fff0ee; }
    .course-actions .btn:focus-visible {
      outline: 3px solid #b5d7d3;
      outline-offset: 2px;
    }
    @media (max-width: 620px) {
      .courses-list { grid-template-columns: minmax(0, 1fr); }
      .course-item { padding: 1rem; }
      .course-actions .btn { flex-basis: 125px; }
    }
    @media (max-width: 410px) {
      .course-actions .btn { flex-basis: 100%; }
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }
    .status-badge.published { background: #e8f5e9; color: #2e7d32; }
    .status-badge.draft { background: #fff3e0; color: #e65100; }

    .alert {
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
    }
    .alert.error { background: #ffebee; color: #c62828; border-left: 4px solid #c62828; }
    .alert.success { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #2e7d32; }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #999;
    }
    .page-title-icon-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .class-icon { width: 1em; height: 1em; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="page-title-icon-wrap"><svg class="class-icon" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5 12 5l10 4.5-10 4.5L2 9.5Z"/><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/><path d="M22 9.5V15"/><path d="M12 20.5v-1"/><path d="M5.5 19.5h13"/></svg> Course Management</h1>
    <div class="header-nav"><a href="/instructor-dashboard.html">Teaching Dashboard</a><a href="/admin/grading.html?tab=quizzes">Quiz Results</a>
      <a href="/courses.html">View Courses</a>
      <a href="/account.html">My Account</a>
      <a href="/">Home</a>
    </div>
  </div>

  <div class="container">
    <div id="alertContainer"></div>

    <!-- Create Course Section -->
    <div class="section">
      <h2>📝 Create New Course</h2>
      <form id="createCourseForm">
        <div class="form-group">
          <label>Course Title</label>
          <input type="text" id="courseTitle" placeholder="e.g., Islamic History 101" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="courseDescription" placeholder="Describe what students will learn..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Create Course</button>
      </form>
    </div>

    <!-- Courses List Section -->
    <div class="section">
      <h2>📚 Your Courses</h2>
      <div class="courses-list" id="coursesList">
        <div style="grid-column: 1/-1; text-align: center; color: #999;">Loading courses...</div>
      </div>
    </div>
  </div>

  <!-- Edit Course Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeEditModal()">&times;</button>
      <div class="modal-header">Edit Course</div>
      <form id="editCourseForm">
        <input type="hidden" id="editCourseId">
        <div class="form-group">
          <label>Course Title</label>
          <input type="text" id="editTitle" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="editDescription"></textarea>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="editPublished"> Published
          </label>
        </div>
        <div style="display: flex; gap: 1rem;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()" style="flex: 1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from '../accounts/client.js';
    import { requireTeachingAccess } from '../accounts/lms-access.js';
    import { getCourses, createCourse, updateCourse, deleteCourse } from '../courses-api.js';

    import {loadCourseReadiness} from '../accounts/course-readiness.js';
    let currentUser = null;
    let courses = [];

    async function checkAuth() {
      await requireTeachingAccess();
      const { data } = await supabase.auth.getSession();
      currentUser = data.session?.user;

      if (!currentUser) {
        window.location.href = '/account.html';
      }
    }

    async function loadCourses() {
      try {
        const allCourses = await getCourses(false); // Include unpublished
        courses = allCourses.filter(c => c.created_by === currentUser.id);
        renderCourses();
      } catch (error) {
        console.error('Error loading courses:', error);
        showAlert('Failed to load courses', 'error');
      }
    }

    // Course names and descriptions are authored by users; keep them as text.
    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderCourses() {
      const container = document.getElementById('coursesList');

      if (courses.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #999;">No courses yet. Create your first course above!</div>';
        return;
      }

      container.innerHTML = courses.map(course => `
        <div class="course-item">
          <div class="course-title">${escapeHTML(course.title)}</div>
          <div class="course-description">${escapeHTML(course.description || 'No description')}</div>
          <div class="course-meta">
            Created: ${new Date(course.created_at).toLocaleDateString()}
          </div>
          <div class="course-state">
            <span class="status-badge ${course.is_published ? 'published' : 'draft'}">
              ${course.is_published ? '✓ Published' : 'Draft'}
            </span>
          </div>
          <div class="course-actions" role="group" aria-label="Actions for ${escapeHTML(course.title)}">
            <button type="button" class="btn btn-primary" onclick="viewLessons('${course.id}')">Lessons</button>
            <button type="button" class="btn btn-secondary" onclick="editCourse('${course.id}')">Edit</button>
            <a class="btn btn-secondary course-preview" href="/course.html?course=${course.id}&preview=1">Preview as student</a>
            <a class="btn btn-secondary" href="/admin/grading.html?tab=quizzes&course=${course.id}">Results</a>
            <button type="button" class="btn btn-danger course-delete" onclick="deleteCourseConfirm('${course.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('createCourseForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('courseTitle').value;
      const description = document.getElementById('courseDescription').value;

      try {
        await createCourse(title, description);
        showAlert('Course created successfully!', 'success');
        document.getElementById('createCourseForm').reset();
        await loadCourses();
      } catch (error) {
        console.error('Error creating course:', error);
        showAlert('Failed to create course', 'error');
      }
    });

    window.editCourse = async function(courseId) {
      const course = courses.find(c => c.id === courseId);
      if (!course) return;

      document.getElementById('editCourseId').value = courseId;
      document.getElementById('editTitle').value = course.title;
      document.getElementById('editDescription').value = course.description || '';
      document.getElementById('editPublished').checked = course.is_published;

      document.getElementById('editModal').classList.add('active');
    };

    window.closeEditModal = function() {
      document.getElementById('editModal').classList.remove('active');
    };

    document.getElementById('editCourseForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const courseId = document.getElementById('editCourseId').value;
      const title = document.getElementById('editTitle').value;
      const description = document.getElementById('editDescription').value;
      const is_published = document.getElementById('editPublished').checked;

      try {
        if(is_published){const issues=await loadCourseReadiness(supabase,courseId);if(issues.length){alert('Before publishing:\n\n'+issues.join('\n'));return;}}
        await updateCourse(courseId, { title, description, is_published });
        showAlert('Course updated successfully!', 'success');
        closeEditModal();
        await loadCourses();
      } catch (error) {
        console.error('Error updating course:', error);
        showAlert('Failed to update course', 'error');
      }
    });

    window.viewLessons = function(courseId) {
      window.location.href = `/admin/lesson-manager.html?course=${courseId}`;
    };

    window.deleteCourseConfirm = async function(courseId) {
      if (!confirm('Are you sure? This will delete all lessons and enrollments.')) return;

      try {
        await deleteCourse(courseId);
        showAlert('Course deleted!', 'success');
        await loadCourses();
      } catch (error) {
        console.error('Error deleting course:', error);
        showAlert('Failed to delete course', 'error');
      }
    };

    function showAlert(message, type) {
      const container = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert ${type}`;
      alert.textContent = message;
      container.appendChild(alert);

      setTimeout(() => alert.remove(), 5000);
    }

    // Initialize
    await checkAuth();
    await loadCourses();
  </script>
</body>
</html>
