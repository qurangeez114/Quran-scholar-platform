<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narration Comparison — Quran Hikma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'EB Garamond','Georgia',serif;background:#FDFAF4;color:#3A2E1A;padding-bottom:82px;line-height:1.7;font-size:17px;-webkit-text-size-adjust:100%}
  .topbar{background:#FFF8E8;border-bottom:1px solid #E8DDC0;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
  .topbar h1{font-size:17px;margin:0;flex:1;color:#5A3A10}
  .qbtn{background:#fff;border:1.5px solid #D4A830;color:#7A5010;border-radius:20px;padding:7px 14px;font-family:'EB Garamond',serif;font-size:14px;cursor:pointer;white-space:nowrap}
  .qbtn.ghost{border-color:#ccc;color:#666}
  .wrap{padding:16px;max-width:820px;margin:0 auto}
  h2.gt{font-size:25px;line-height:1.3;color:#5A3A10;margin:0 0 12px}
  .core{background:#FFF8E8;border:1px solid #E8DDC0;border-radius:12px;padding:15px 16px;font-size:17px;margin-bottom:22px}
  .core b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8a7a5a;margin-bottom:5px;font-weight:700}
  h3.sec{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:#8a7a5a;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8DDC0}
  .div-card{border:1px solid #E8DDC0;border-radius:12px;background:#fff;margin-bottom:16px;overflow:hidden}
  .div-head{padding:12px 14px;background:#FFF8E8;border-bottom:1px solid #E8DDC0}
  .sev{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:9px;margin-bottom:6px}
  .sev-5{background:#EDE2EF;color:#6A3E8A}.sev-4{background:#F5E3D0;color:#9A5A20}
  .sev-3{background:#FDF0D5;color:#9A6A00}.sev-2{background:#F3E9CE;color:#7A5010}.sev-1{background:#F3E9CE;color:#7A5010}
  .div-cat{font-size:19px;font-weight:600;color:#3A2E1A}
  .pair{display:block}
  .side{padding:16px}
  .side:first-child{border-bottom:1px solid #EFE6D0}
  .side-ref{font-size:14px;font-weight:700;color:#7A5010;margin-bottom:3px}
  .side-grade{font-size:12.5px;color:#8a7a5a;margin-bottom:8px}
  .ar{font-family:'Amiri',serif;font-size:24px;direction:rtl;text-align:right;line-height:1.85;color:#2A2012}
  .ev-en{font-size:17px;line-height:1.6;color:#3A2E1A;font-style:italic}
  .ev-note{font-size:11px;color:#9A5A20;margin-top:6px}
  .div-body{padding:16px;border-top:1px solid #EFE6D0;font-size:17px}
  .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#8a7a5a;font-weight:700;margin:11px 0 3px}
  .lbl:first-child{margin-top:0}
  .harm{background:#F7F4EC;border-radius:10px;padding:13px 14px;font-size:16px;margin-top:14px}
  .ver{background:#fff;border:1px solid #E8DDC0;border-left:5px solid #B8902A;border-radius:12px;padding:16px;margin-bottom:12px}
  .ver-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:7px}
  .ver-ref{font-weight:700;font-size:17px;color:#5A3A10}
  .grade{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:9px;background:#E4F0E9;color:#2E7D32}
  .grade.weak{background:#F7E4E4;color:#A03030}.grade.mid{background:#FDF0D5;color:#9A6A00}
  .kind{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:9px;background:#EDE7DA;color:#6b5c3f}
  .grade-alt{font-size:14.5px;color:#A03030;background:#FCF0F0;border:1px solid #EED6D6;border-radius:8px;padding:5px 9px;margin-top:7px}
  .gnote{font-size:14.5px;color:#6b5c3f;background:#F7F4EC;border-radius:8px;padding:7px 10px;margin:7px 0}
  .gnote b{color:#9A5A20}
  .ambig{font-size:14.5px;color:#8a4a1a;background:#FDF3E7;border:1px solid #F0DCC4;border-radius:8px;padding:7px 10px;margin:7px 0}
  .chain{font-size:14px;color:#8a7a5a;margin-bottom:8px;line-height:1.55}
  .ver-sum{font-size:17px}
  .link-item{background:#fff;border:1px solid #E8DDC0;border-radius:10px;padding:14px;margin-bottom:10px;font-size:16px}
  .link-rel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#8a7a5a;margin-bottom:4px}
  .link-pair{font-weight:600;color:#5A3A10;margin-bottom:5px;font-size:14px}
  .link-pair a{color:#7A5010}
  .pick{display:flex;gap:8px;padding:12px 16px 0;flex-wrap:wrap}
  .pick button{flex:1 1 auto;min-width:44%;min-height:46px;background:#fff;border:1.5px solid #E8DDC0;border-radius:10px;
       font-family:'EB Garamond',serif;font-size:15px;color:#6b5c3f;cursor:pointer;padding:9px 11px;line-height:1.3}
  .pick button.on{border-color:#D4A830;background:#FFF8E8;color:#5A3A10;font-weight:700;box-shadow:inset 0 -2px 0 #D4A830}
  .pick button small{display:block;font-size:12px;font-weight:400;color:#8a7a5a;margin-top:2px}
  .verify{display:inline-block;margin-top:12px;font-size:15px;color:#7A5010;text-decoration:none;border-bottom:1px solid #D4A830;padding-bottom:1px}
  .verify:after{content:' \2197'}
  .refnote{font-size:14.5px;color:#6b5c3f;background:#F7F4EC;border-radius:10px;padding:11px 13px;margin-bottom:12px}
  .msg{padding:26px 16px;text-align:center;color:#8a7a5a;font-size:14.5px}
  
  /* Broadcast: sized to stay legible when a phone screen is streamed and
     re-encoded by a social platform. One idea per screen, no chrome. */
  #bc{position:fixed;inset:0;background:#FDFAF4;z-index:9999;display:flex;flex-direction:column}
  .bc-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#FFF8E8;border-bottom:2px solid #E8DDC0}
  .bc-btn{min-width:56px;min-height:52px;font-size:26px;background:#fff;border:2px solid #D4A830;color:#7A5010;
          border-radius:12px;cursor:pointer;line-height:1}
  .bc-x{margin-left:auto;border-color:#ccc;color:#777}
  .bc-pos{font-size:19px;color:#7A5010;font-weight:700}
  .bc-body{flex:1;overflow-y:auto;padding:22px 20px 40px;-webkit-overflow-scrolling:touch}
  .bc-sev{display:inline-block;font-size:19px;font-weight:700;padding:6px 16px;border-radius:12px;margin-bottom:14px;
          background:#EDE2EF;color:#6A3E8A}
  .bc-cat{font-size:36px;line-height:1.2;font-weight:600;color:#3A2E1A;margin-bottom:22px}
  .bc-src{font-size:22px;font-weight:700;color:#7A5010;margin:20px 0 4px}
  .bc-grade{font-size:17px;color:#8a7a5a;margin-bottom:10px}
  .bc-ar{font-family:'Amiri',serif;font-size:40px;direction:rtl;text-align:right;line-height:1.9;color:#1F1810;
         background:#fff;border:2px solid #E8DDC0;border-radius:14px;padding:18px 20px}
  .bc-en{font-size:26px;line-height:1.55;font-style:italic;background:#fff;border:2px solid #E8DDC0;border-radius:14px;padding:18px 20px}
  .bc-lbl{font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:#8a7a5a;font-weight:700;margin:26px 0 6px}
  .bc-txt{font-size:25px;line-height:1.55;color:#2A2012}
  #bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#FFF8E8;border-top:1px solid #E8DDC0;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:60}
  #bottom-nav::-webkit-scrollbar{display:none}
  .bnav-btn{flex:0 0 auto;min-width:72px;background:none;border:none;padding:7px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'EB Garamond',serif;font-size:11px;color:#8a7a5a;cursor:pointer;white-space:nowrap;overflow:visible}
  .bnav-btn.active{color:#7A5010;font-weight:700;box-shadow:inset 0 -2px 0 #D4A830}
  .bni{font-size:17px;line-height:1}
</style>
</head><body>
<div class="topbar">
  <button class="qbtn ghost" onclick="location.href='narrations.html'">← All</button>
  <h1 id="crumb">Narration Comparison</h1>
  <button class="qbtn" onclick="openBroadcast()">Broadcast</button>
</div>
<div class="wrap"><div id="body"><div class="msg">Loading…</div></div></div>

<div id="bc" hidden>
  <div class="bc-bar">
    <button class="bc-btn" onclick="bcStep(-1)">&#8592;</button>
    <div class="bc-pos" id="bc-pos"></div>
    <button class="bc-btn" onclick="bcStep(1)">&#8594;</button>
    <button class="bc-btn bc-x" onclick="closeBroadcast()">&times;</button>
  </div>
  <div class="bc-body" id="bc-body"></div>
</div>
<script>
const SB_URL='https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDRS={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async p=>{const r=await fetch(SB_URL+'/rest/v1/'+p,{headers:HDRS});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();};
const SEV={5:'Rule contradicts practice',4:'Contradictory outcome',3:'Accounts differ',2:'Detail varies',1:'Wording varies'};

function gradeClass(g){
  if(!g) return 'mid';
  const s=g.toLowerCase();
  if(s.includes('very daif')||s.includes('maudu')||s.includes('mawdu')||s.includes('munkar')) return 'weak';
  if(s.includes('daif')||s.includes('shadh')) return 'weak';
  if(s.includes('hasan')) return 'mid';
  return '';
}
function sidePanel(ref,grade,text,lang,url,idx,cid){
  const isEnglish=lang&&lang.indexOf('English')===0;
  return '<div class="side" id="side-'+cid+'-'+idx+'"'+(idx===1?' hidden':'')+'>'
       +'<div class="side-ref">'+esc(ref)+'</div>'
       +'<div class="side-grade">'+esc(grade||'')+'</div>'
       +'<div class="'+(isEnglish?'ev-en':'ar')+'">'+esc(text)+'</div>'
       +(isEnglish?'<div class="ev-note">'+esc(lang)+'</div>':'')
       
       +'</div>';
}

// One card per divergence. On a phone two Arabic passages side by side are
// unreadable, so the reader picks which narration to look at; the analysis
// below stays visible either way.
function pickOne(cid, n){
  for(let i=0;i<2;i++){
    const panel=document.getElementById('side-'+cid+'-'+i);
    const btn=document.getElementById('pick-'+cid+'-'+i);
    if(panel) panel.hidden = (i!==n);
    if(btn) btn.className = (i===n?'on':'');
  }
}

let POINTS=[], BCI=0;

function openBroadcast(){
  if(!POINTS.length) return;
  BCI=0; document.getElementById('bc').hidden=false;
  document.body.style.overflow='hidden';
  bcDraw();
}
function closeBroadcast(){
  document.getElementById('bc').hidden=true;
  document.body.style.overflow='';
}
function bcStep(n){
  BCI=(BCI+n+POINTS.length)%POINTS.length;
  bcDraw();
  document.getElementById('bc-body').scrollTop=0;
}
function bcDraw(){
  const d=POINTS[BCI];
  const sv=d.point_severity||d.severity;
  const panel=(ref,grade,text,lang)=>{
    const en=lang&&lang.indexOf('English')===0;
    return '<div class="bc-src">'+esc(ref)+'</div>'
         + '<div class="bc-grade">'+esc(grade||'')+'</div>'
         + '<div class="'+(en?'bc-en':'bc-ar')+'">'+esc(text)+'</div>';
  };
  document.getElementById('bc-pos').textContent=(BCI+1)+' / '+POINTS.length;
  document.getElementById('bc-body').innerHTML=
      '<span class="bc-sev">'+esc(SEV[sv]||'Differs')+'</span>'
    + '<div class="bc-cat">'+esc(d.category)+'</div>'
    + panel(d.source_a,d.grade_a,d.arabic_a,d.evidence_language_a)
    + panel(d.source_b,d.grade_b,d.arabic_b,d.evidence_language_b)
    + '<div class="bc-lbl">What differs</div><div class="bc-txt">'+esc(d.analysis)+'</div>'
    + '<div class="bc-lbl">Why it matters</div><div class="bc-txt">'+esc(d.significance)+'</div>';
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('bc').hidden) return;
  if(e.key==='ArrowRight'||e.key===' ') bcStep(1);
  if(e.key==='ArrowLeft') bcStep(-1);
  if(e.key==='Escape') closeBroadcast();
});

async function load(){
  const slug=new URLSearchParams(location.search).get('group');
  const body=document.getElementById('body');
  if(!slug){ body.innerHTML='<div class="msg">No comparison selected. <a href="narrations.html">Browse all comparisons</a></div>'; return; }

  let info,vers,divs,links;
  try{
    [info,vers,divs,links]=await Promise.all([
      api('narrative_dossier_reader?select=*&group_slug=eq.'+encodeURIComponent(slug)),
      api('narrative_version_reader?select=*&group_slug=eq.'+encodeURIComponent(slug)+'&order=sequence_order'),
      api('narrative_divergence_reader?select=*&group_slug=eq.'+encodeURIComponent(slug)+'&order=severity.desc'),
      api('narrative_group_link_reader?select=*&from_slug=eq.'+encodeURIComponent(slug))
    ]);
  }catch(e){ body.innerHTML='<div class="msg">Couldn\'t load this comparison. '+esc(e.message)+'</div>'; return; }

  if(!info.length){ body.innerHTML='<div class="msg">No comparison found for that name. <a href="narrations.html">Browse all comparisons</a></div>'; return; }
  const g=info[0];
  document.title=g.group_title+' — Quran Hikma';
  document.getElementById('crumb').textContent=g.dossier_title;

  let h='<h2 class="gt">'+esc(g.group_title)+'</h2>'
       +'<div class="core"><b>What is not in dispute</b>'+esc(g.historical_core)+'</div>';

  h+='<h3 class="sec">Where the narrations diverge</h3>';
  const pts=divs.filter(d=>d.point_id);
  POINTS=pts;
  if(!pts.length) h+='<div class="msg">No divergences recorded yet.</div>';
  pts.forEach(d=>{
    const sv=d.point_severity||d.severity;
    const cid=d.point_id;
    h+='<div class="div-card"><div class="div-head">'
      +'<span class="sev sev-'+sv+'">'+esc(SEV[sv]||'Differs')+'</span>'
      +'<div class="div-cat">'+esc(d.category)+'</div></div>'
      +'<div class="pick">'
      +'<button id="pick-'+cid+'-0" class="on" onclick="pickOne('+cid+',0)">'+esc(d.source_a)+'<small>'+esc(d.grade_a||'')+'</small></button>'
      +'<button id="pick-'+cid+'-1" onclick="pickOne('+cid+',1)">'+esc(d.source_b)+'<small>'+esc(d.grade_b||'')+'</small></button>'
      +'</div>'
      +'<div class="pair">'
      +sidePanel(d.source_a,d.grade_a,d.arabic_a,d.evidence_language_a,d.url_a,0,cid)
      +sidePanel(d.source_b,d.grade_b,d.arabic_b,d.evidence_language_b,d.url_b,1,cid)
      +'</div><div class="div-body">'
      +'<div class="lbl">What differs</div>'+esc(d.analysis)
      +'<div class="lbl">Why it matters</div>'+esc(d.significance)
      +(d.harmonization_option?'<div class="harm"><b>Offered reconciliation:</b> '+esc(d.harmonization_option)
        +(d.preferred_explanation?'<br><br><b>Does it settle it?</b> '+esc(d.preferred_explanation):'')+'</div>':'')
      +'</div></div>';
  });

  h+='<h3 class="sec">The narrations compared ('+vers.length+')</h3>'
    +'<div class="refnote">The numbers below follow this corpus. Hadith numbering differs between editions and between websites — Sahih al-Bukhari 6577 here is 6824 on sunnah.com. A link is shown only where that mapping has been checked against the site itself, which so far means Sahih al-Bukhari. For the other collections the Arabic above is the evidence; it can be searched on any hadith site.</div>';
  vers.forEach(v=>{
    const isTafsir=v.source_type==='Tafsir';
    h+='<div class="ver"><div class="ver-head">'
      +'<span class="ver-ref">'+esc(v.source_collection)+' '+esc(v.source_reference)+'</span>'
      +(isTafsir?'<span class="kind">commentary</span>'
                :'<span class="grade '+gradeClass(v.hadith_grade)+'">'+esc(v.hadith_grade||'ungraded')+'</span>')
      +'</div>'
      +'<div class="chain">'+esc(v.narrator)+(v.transmission_chain?' — '+esc(v.transmission_chain):'')+'</div>'
      +(v.grade_note?'<div class="gnote">'+esc(v.grade_note)
        +(v.grade_attribution&&v.grade_attribution.indexOf('not attributed')>-1
          ?' <b>Attributed to a '+esc(v.grade_attribution.split('—')[0].trim())+', not the Prophet.</b>':'')+'</div>':'')
      +(v.citation_ambiguous?'<div class="ambig">This collection and number match more than one different hadith in this corpus, because the two source editions numbered differently. The text shown here is the one this comparison refers to (record '+esc(v.hadith_corpus_id)+').</div>':'')
      +'<div class="ver-sum">'+esc(v.version_summary)+'</div>'
      +(v.verified_url
        ? '<a class="verify" href="'+esc(v.verified_url)+'" target="_blank" rel="noopener">Read it on sunnah.com (numbered '+esc(v.external_reference)+' there)</a>'
        : '')
      
      +(v.grade_disputed?'<div class="grade-alt">The same Arabic text is stored again as '+esc(v.source_collection)+' '+esc(v.alternate_reference)+' and graded <b>'+esc(v.alternate_grade)+'</b>. Both are shown because the corpus contains both.</div>':'')
      +'</div>';
  });

  if(links.length){
    h+='<h3 class="sec">How this connects to the others</h3>';
    links.forEach(l=>{
      h+='<div class="link-item"><div class="link-rel">'+esc(l.relation.replace(/_/g,' '))+'</div>'
        +'<div class="link-pair"><a href="narration.html?group='+encodeURIComponent(l.to_slug)+'">'+esc(l.to_title)+'</a></div>'
        +esc(l.note)+'</div>';
    });
  }
  body.innerHTML=h;
}
load();
</script>
