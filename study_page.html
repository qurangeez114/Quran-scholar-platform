<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Page</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: #111;
  color: #e8e8e8;
  min-height: 100vh;
}

/* ── TOP BAR ── */
#top-bar {
  position: sticky; top: 0; z-index: 100;
  background: #1a1a1a;
  border-bottom: 1px solid #2a2a2a;
  padding: 12px 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
#top-bar h1 {
  font-size: 14px; font-weight: 700;
  color: #c9a84c; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.verse-count-badge {
  background: #2a2a2a; color: #888;
  font-size: 12px; padding: 3px 9px;
  border-radius: 10px; white-space: nowrap;
}
.lang-row { display: flex; gap: 6px; flex-wrap: wrap; }
.lang-btn {
  padding: 5px 13px; border-radius: 20px;
  border: 1px solid #333; background: #222;
  color: #999; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
}
.lang-btn.active {
  background: #c9a84c; color: #000;
  border-color: #c9a84c; font-weight: 700;
}

/* ── LAYOUT ── */
#content { max-width: 720px; margin: 0 auto; padding: 16px 14px 80px; }

.theme-intro {
  background: #1a1a1a; border: 1px solid #c9a84c44;
  border-radius: 10px; padding: 14px 16px; margin-bottom: 20px;
}
.theme-intro h2 { font-size: 16px; font-weight: 700; color: #c9a84c; margin-bottom: 4px; }
.theme-intro p { font-size: 13px; color: #777; }

/* ── VERSE CARD ── */
.verse-card {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 12px;
  margin-bottom: 14px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.verse-card.origin { border-color: #c9a84c88; }

/* Card header */
.card-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: #202020;
  border-bottom: 1px solid #2a2a2a;
}
.verse-ref {
  font-family: 'Amiri', serif;
  font-size: 17px; font-weight: 700;
  color: #c9a84c; min-width: 50px;
}
.sura-name {
  font-size: 12px; color: #666; font-weight: 500; flex: 1;
}
.origin-tag {
  font-size: 10px; font-weight: 700;
  background: #c9a84c22; color: #c9a84c;
  border: 1px solid #c9a84c44;
  padding: 2px 8px; border-radius: 8px;
}

/* Arabic */
.arabic-text {
  font-family: 'Amiri', serif;
  font-size: 22px; line-height: 2;
  text-align: right; direction: rtl;
  color: #f0ebe0;
  padding: 14px 16px 10px;
  border-bottom: 1px solid #222;
}

/* Translation */
.translation-text {
  font-size: 15px; line-height: 1.75;
  color: #d4d4d4;
  padding: 12px 16px;
  border-bottom: 1px solid #222;
  font-weight: 400;
}
.translation-text.hidden { display: none; }

/* Action bar */
.action-bar {
  display: flex; align-items: center;
  padding: 8px 12px; gap: 4px;
  border-bottom: 1px solid #222;
  flex-wrap: wrap;
}
.action-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 10px; border-radius: 8px;
  border: 1px solid #2a2a2a; background: #222;
  color: #888; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
  white-space: nowrap;
}
.action-btn:hover { background: #2a2a2a; color: #ccc; border-color: #444; }
.action-btn.active { background: #c9a84c22; color: #c9a84c; border-color: #c9a84c44; }
.action-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

/* Expand button */
.expand-btn {
  width: 100%; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  background: transparent; border: none;
  color: #666; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: color 0.15s;
  font-family: 'Inter', sans-serif;
}
.expand-btn:hover { color: #c9a84c; }
.expand-arrow { font-size: 11px; transition: transform 0.2s; }
.expand-btn.open .expand-arrow { transform: rotate(180deg); }

/* Expanded content */
.expanded-content { display: none; border-top: 1px solid #222; }
.expanded-content.open { display: block; }

.section-label {
  font-size: 11px; font-weight: 700;
  color: #c9a84c; letter-spacing: 1px;
  text-transform: uppercase;
  padding: 12px 16px 6px;
}

.scholar-card {
  margin: 0 14px 10px;
  background: #222;
  border-left: 3px solid #c9a84c;
  border-radius: 6px; padding: 10px 12px;
}
.scholar-name {
  font-size: 12px; font-weight: 700;
  color: #c9a84c; margin-bottom: 5px;
}
.scholar-text {
  font-size: 14px; line-height: 1.7;
  color: #ccc;
}

.hadith-card {
  margin: 0 14px 10px;
  background: #1e2a1e;
  border-left: 3px solid #4a8a4a;
  border-radius: 6px; padding: 10px 12px;
}
.hadith-name {
  font-size: 12px; font-weight: 700;
  color: #6ab06a; margin-bottom: 5px;
}
.hadith-text {
  font-size: 14px; line-height: 1.7; color: #ccc;
}
.hadith-meta {
  font-size: 11px; color: #555; margin-top: 5px;
}

.no-data {
  font-size: 13px; color: #444;
  font-style: italic; padding: 8px 16px 14px;
}

/* Loading */
#loading {
  text-align: center; padding: 60px 20px; color: #666;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid #2a2a2a; border-top-color: #c9a84c;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #c9a84c; color: #000; font-weight: 700;
  padding: 10px 20px; border-radius: 20px;
  font-size: 13px; opacity: 0; pointer-events: none;
  transition: opacity 0.3s; z-index: 999;
}
#toast.show { opacity: 1; }

/* Highlight overlay for bookmarked */
.verse-card.bookmarked { border-color: #4a8a4a88; }
.verse-card.highlighted .arabic-text { background: #c9a84c11; }
</style>
</head>
<body>

<div id="top-bar">
  <h1 id="theme-title">Loading...</h1>
  <span class="verse-count-badge" id="verse-count"></span>
  <div class="lang-row">
    <button class="lang-btn active" onclick="setLang('en',this)">English</button>
    <button class="lang-btn" onclick="setLang('ar',this)">Arabic Only</button>
    <button class="lang-btn" onclick="setLang('ti',this)">Tigrinya</button>
    <button class="lang-btn" onclick="setLang('am',this)">Amharic</button>
  </div>
</div>

<div id="content">
  <div id="loading"><div class="spinner"></div>Loading study page...</div>
  <div id="verses-container"></div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const H = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

let currentLang = 'en';
const bookmarks = JSON.parse(sessionStorage.getItem('bookmarks') || '{}');
const notes     = JSON.parse(sessionStorage.getItem('notes') || '{}');

async function sbFetch(table, params) {
  const url = new URL(`${SUPABASE_URL}/rest/v1/${table}`);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const r = await fetch(url, { headers: H });
  return r.json();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function setLang(lang, btn) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.translation-text').forEach(el => {
    el.classList.toggle('hidden', lang === 'ar');
  });
}

// ── TTS ──
function speakVerse(sura, aya) {
  const arabic = document.getElementById(`arabic-${sura}-${aya}`)?.textContent;
  const english = document.getElementById(`trans-${sura}-${aya}`)?.textContent;
  const text = currentLang === 'ar' ? arabic : (english || arabic);
  if (!text || text === '...') return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = currentLang === 'ar' ? 'ar-SA' : 'en-US';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
  showToast('▶ Playing...');
}

// ── COPY ──
function copyVerse(sura, aya) {
  const arabic  = document.getElementById(`arabic-${sura}-${aya}`)?.textContent || '';
  const english = document.getElementById(`trans-${sura}-${aya}`)?.textContent || '';
  const text = `${sura}:${aya}\n${arabic}\n${english}`;
  navigator.clipboard.writeText(text).then(() => showToast('Copied!'));
}

// ── BOOKMARK ──
function toggleBookmark(sura, aya, btn) {
  const key = `${sura}:${aya}`;
  const card = document.getElementById(`card-${sura}-${aya}`);
  if (bookmarks[key]) {
    delete bookmarks[key];
    btn.classList.remove('active');
    card.classList.remove('bookmarked');
    showToast('Bookmark removed');
  } else {
    bookmarks[key] = true;
    btn.classList.add('active');
    card.classList.add('bookmarked');
    showToast('Bookmarked ✓');
  }
  sessionStorage.setItem('bookmarks', JSON.stringify(bookmarks));
}

// ── NOTE ──
function openNote(sura, aya) {
  const key = `${sura}:${aya}`;
  const existing = notes[key] || '';
  const note = prompt(`Note for ${sura}:${aya}:`, existing);
  if (note !== null) {
    if (note.trim()) {
      notes[key] = note.trim();
      showToast('Note saved ✓');
    } else {
      delete notes[key];
      showToast('Note removed');
    }
    sessionStorage.setItem('notes', JSON.stringify(notes));
  }
}

// ── SHARE ──
function shareVerse(sura, aya) {
  const arabic  = document.getElementById(`arabic-${sura}-${aya}`)?.textContent || '';
  const english = document.getElementById(`trans-${sura}-${aya}`)?.textContent || '';
  const text = `Quran ${sura}:${aya}\n\n${arabic}\n\n${english}\n\nvia Qurangeez`;
  if (navigator.share) {
    navigator.share({ title: `Quran ${sura}:${aya}`, text });
  } else {
    navigator.clipboard.writeText(text).then(() => showToast('Copied to share!'));
  }
}

// ── EXPAND / COLLAPSE ──
function toggleExpand(sura, aya) {
  const btn  = document.getElementById(`expand-btn-${sura}-${aya}`);
  const body = document.getElementById(`expand-body-${sura}-${aya}`);
  const isOpen = body.classList.contains('open');
  btn.classList.toggle('open', !isOpen);
  body.classList.toggle('open', !isOpen);
  btn.querySelector('.expand-label').textContent = isOpen ? 'Tafsir & Hadith' : 'Collapse';
  if (!isOpen && !body.dataset.loaded) {
    body.dataset.loaded = '1';
    loadExpandedContent(sura, aya);
  }
}

async function loadExpandedContent(sura, aya) {
  const tafsirEl = document.getElementById(`tafsir-${sura}-${aya}`);
  const hadithEl = document.getElementById(`hadith-${sura}-${aya}`);

  // Tafsir
  try {
    const rows = await sbFetch('tafsir_entries', {
      select: 'source_name,scholar_name,content',
      sura: `eq.${sura}`, aya: `eq.${aya}`, language: 'eq.en'
    });
    if (rows.length > 0) {
      tafsirEl.innerHTML = rows.map(r => `
        <div class="scholar-card">
          <div class="scholar-name">${r.source_name || r.scholar_name || 'Scholar'}</div>
          <div class="scholar-text">${(r.content||'').slice(0,600)}${(r.content||'').length>600?'…':''}</div>
        </div>`).join('');
    } else {
      tafsirEl.innerHTML = '<p class="no-data">No tafsir in database for this verse.</p>';
    }
  } catch {
    tafsirEl.innerHTML = '<p class="no-data">Could not load tafsir.</p>';
  }

  // Hadith
  try {
    const rows = await sbFetch('hadith_connections', {
      select: 'hadith_text,collection,reference,narrator,hadith_grade',
      sura_id: `eq.${sura}`, aya_number: `eq.${aya}`
    });
    if (rows.length > 0) {
      hadithEl.innerHTML = rows.map(r => `
        <div class="hadith-card">
          <div class="hadith-name">${r.collection||'Hadith'}${r.hadith_grade?' — '+r.hadith_grade:''}</div>
          <div class="hadith-text">${r.hadith_text||''}</div>
          <div class="hadith-meta">${[r.narrator?'Narrator: '+r.narrator:'', r.reference||''].filter(Boolean).join(' · ')}</div>
        </div>`).join('');
    } else {
      hadithEl.innerHTML = '<p class="no-data">No hadith references in database for this verse.</p>';
    }
  } catch {
    hadithEl.innerHTML = '<p class="no-data">Could not load hadith.</p>';
  }
}

function svgIcon(name) {
  const icons = {
    speaker: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`,
    copy:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
    note:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
    bookmark:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
    share:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`,
  };
  return icons[name] || '';
}

function buildCard(v, suraName, currentSura, currentAya) {
  const isOrigin = (v.sura == currentSura && v.aya == currentAya);
  const key = `${v.sura}:${v.aya}`;
  const isBookmarked = bookmarks[key] ? 'active' : '';
  const bookmarkedClass = bookmarks[key] ? 'bookmarked' : '';

  return `
  <div class="verse-card ${isOrigin?'origin':''} ${bookmarkedClass}" id="card-${v.sura}-${v.aya}">
    <div class="card-header">
      <span class="verse-ref">${v.sura}:${v.aya}</span>
      <span class="sura-name">${suraName}</span>
      ${isOrigin ? '<span class="origin-tag">Viewing</span>' : ''}
    </div>

    <div class="arabic-text" id="arabic-${v.sura}-${v.aya}">...</div>
    <div class="translation-text" id="trans-${v.sura}-${v.aya}">Loading...</div>

    <div class="action-bar">
      <button class="action-btn" onclick="speakVerse(${v.sura},${v.aya})" title="Listen">
        ${svgIcon('speaker')} Listen
      </button>
      <button class="action-btn" onclick="copyVerse(${v.sura},${v.aya})" title="Copy">
        ${svgIcon('copy')} Copy
      </button>
      <button class="action-btn" onclick="openNote(${v.sura},${v.aya})" title="Note">
        ${svgIcon('note')} Note
      </button>
      <button class="action-btn ${isBookmarked}" id="bm-${v.sura}-${v.aya}"
        onclick="toggleBookmark(${v.sura},${v.aya},this)" title="Bookmark">
        ${svgIcon('bookmark')} Bookmark
      </button>
      <button class="action-btn" onclick="shareVerse(${v.sura},${v.aya})" title="Share">
        ${svgIcon('share')} Share
      </button>
    </div>

    <button class="expand-btn" id="expand-btn-${v.sura}-${v.aya}"
      onclick="toggleExpand(${v.sura},${v.aya})">
      <span class="expand-label">Tafsir & Hadith</span>
      <span class="expand-arrow">▼</span>
    </button>

    <div class="expanded-content" id="expand-body-${v.sura}-${v.aya}">
      <div class="section-label">Tafsir</div>
      <div id="tafsir-${v.sura}-${v.aya}"><p class="no-data">Loading...</p></div>
      <div class="section-label">Hadith References</div>
      <div id="hadith-${v.sura}-${v.aya}"><p class="no-data">Loading...</p></div>
    </div>
  </div>`;
}

async function loadStudyPage() {
  const params      = new URLSearchParams(window.location.search);
  const theme       = params.get('theme');
  const currentSura = parseInt(params.get('sura') || 0);
  const currentAya  = parseInt(params.get('aya')  || 0);

  if (!theme) {
    document.getElementById('loading').innerHTML = '<p style="color:#c66;padding:40px">No theme specified.</p>';
    return;
  }

  document.title = theme;
  document.getElementById('theme-title').textContent = theme;

  const verseRows = await sbFetch('thematic_cross_references', {
    select: 'sura,aya', theme: `eq.${theme}`, order: 'sura.asc,aya.asc'
  });

  document.getElementById('verse-count').textContent = `${verseRows.length} verses`;
  document.getElementById('loading').style.display = 'none';

  const container = document.getElementById('verses-container');
  container.innerHTML = `
    <div class="theme-intro">
      <h2>${theme}</h2>
      <p>${verseRows.length} verses · Tap <strong>Tafsir & Hadith</strong> on any card to expand</p>
    </div>`;

  // Fetch all sura names in one go
  const suraIds = [...new Set(verseRows.map(v => v.sura))];
  const suraMap = {};
  try {
    const suras = await sbFetch('suras', {
      select: 'sura_id,english_name,sura_name',
      sura_id: `in.(${suraIds.join(',')})`
    });
    suras.forEach(s => { suraMap[s.sura_id] = s.english_name || s.sura_name || `Sura ${s.sura_id}`; });
  } catch {}

  // Render all cards at once
  container.innerHTML += verseRows.map(v =>
    buildCard(v, suraMap[v.sura] || `Sura ${v.sura}`, currentSura, currentAya)
  ).join('');

  // Load verse texts in parallel
  verseRows.forEach(v => loadVerseText(v.sura, v.aya));

  // Auto-scroll to origin verse
  if (currentSura && currentAya) {
    setTimeout(() => {
      const el = document.getElementById(`card-${currentSura}-${currentAya}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 400);
  }
}

async function loadVerseText(sura, aya) {
  try {
    const rows = await sbFetch('ayas', {
      select: 'arabic,english,aya_text,amharic',
      sura_id: `eq.${sura}`, aya_number: `eq.${aya}`, limit: '1'
    });
    if (rows.length > 0) {
      const r = rows[0];
      document.getElementById(`arabic-${sura}-${aya}`).textContent  = r.arabic  || '';
      document.getElementById(`trans-${sura}-${aya}`).textContent   = r.english || r.aya_text || '';
    } else {
      document.getElementById(`arabic-${sura}-${aya}`).textContent = '—';
      document.getElementById(`trans-${sura}-${aya}`).textContent  = '—';
    }
  } catch {
    document.getElementById(`arabic-${sura}-${aya}`).textContent = '—';
    document.getElementById(`trans-${sura}-${aya}`).textContent  = '—';
  }
}

loadStudyPage();
</script>
</body>
</html>
