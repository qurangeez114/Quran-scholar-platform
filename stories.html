<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quranic Stories & Comparative Scripture</title>
<style>
:root {
  --bg: #0F1623;
  --surface: #1A2235;
  --surface2: #212D42;
  --border: #2E3D55;
  --gold: #C9A84C;
  --gold-light: #F0D080;
  --text: #E8EDF5;
  --text-secondary: #8A9BB5;
  --green: #1A7A48;
  --purple: #4A2080;
  --red: #8B2020;
  --blue: #1A4A7A;
  --arabic-font: 'Scheherazade New','Amiri',serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height: 100vh; }

/* ── Header ── */
.site-header {
  background: linear-gradient(135deg, #1B2A4A, #2C3E6B, #1B4332);
  padding: 16px;
  border-bottom: 2px solid var(--gold);
  display: flex; align-items: center; gap: 12px;
}
.back-btn {
  background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.4);
  color: var(--gold); padding: 6px 14px; border-radius: 20px;
  font-size: 13px; cursor: pointer; text-decoration: none;
}
.header-title { flex: 1; }
.header-title h1 { font-size: 18px; color: var(--gold-light); }
.header-title p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* ── Layout ── */
.app { display: flex; height: calc(100vh - 70px); }
.sidebar { width: 260px; min-width: 260px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; }
.main { flex: 1; overflow-y: auto; padding: 20px; }

/* ── Story list ── */
.category-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--text-secondary); padding: 14px 14px 6px; text-transform: uppercase; }
.story-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; cursor: pointer; border-left: 3px solid transparent;
  transition: all 0.2s;
}
.story-item:hover { background: var(--surface2); }
.story-item.active { background: var(--surface2); border-left-color: var(--gold); }
.story-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.story-name { font-size: 13px; font-weight: 600; color: var(--text); }
.story-arabic { font-family: var(--arabic-font); font-size: 16px; color: var(--gold); direction: rtl; }
.story-count { font-size: 10px; color: var(--text-secondary); margin-top: 1px; }

/* ── Story detail ── */
.story-header {
  background: linear-gradient(135deg, #1B2A4A, #2C3E6B, #1B4332);
  border-radius: 16px; padding: 20px; margin-bottom: 20px;
  border: 1px solid rgba(201,168,76,0.3);
}
.story-header-arabic { font-family: var(--arabic-font); font-size: clamp(36px,8vw,54px); color: var(--gold-light); direction: rtl; text-align: center; margin-bottom: 8px; }
.story-header-english { font-size: 22px; font-weight: 700; color: var(--text); text-align: center; }
.story-header-meta { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
.badge-gold { background: rgba(201,168,76,0.2); color: var(--gold); border: 1px solid rgba(201,168,76,0.4); }
.badge-green { background: rgba(26,122,72,0.2); color: #4ADB8A; border: 1px solid rgba(26,122,72,0.4); }
.badge-blue { background: rgba(26,74,122,0.2); color: #6AABFF; border: 1px solid rgba(26,74,122,0.4); }
.story-summary { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-top: 14px; text-align: center; max-width: 700px; margin-left: auto; margin-right: auto; }

/* ── Sections ── */
.section { margin-bottom: 24px; }
.section-title {
  font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
}

/* ── Quran verses ── */
.verse-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 12px; margin: 4px;
  font-size: 12px; cursor: pointer; transition: all 0.2s;
  text-decoration: none; color: var(--text);
}
.verse-chip:hover { border-color: var(--gold); color: var(--gold); }
.verse-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }

/* ── Source cards ── */
.source-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 16px; overflow: hidden;
}
.source-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; cursor: pointer;
  background: var(--surface2); transition: background 0.2s;
}
.source-header:hover { background: #283552; }
.source-tradition-badge {
  font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; flex-shrink: 0;
}
.trad-Torah, .trad-Bible { background: rgba(26,74,122,0.3); color: #6AABFF; border: 1px solid #1A4A7A; }
.trad-Talmud, .trad-Midrash { background: rgba(26,122,72,0.3); color: #4ADB8A; border: 1px solid #1A7A48; }
.trad-Apocrypha, .trad-Gospel { background: rgba(74,32,128,0.3); color: #B088FF; border: 1px solid #4A2080; }
.trad-Dead { background: rgba(139,32,32,0.3); color: #FF8888; border: 1px solid #8B2020; }
.source-info { flex: 1; }
.source-name { font-size: 14px; font-weight: 600; color: var(--text); }
.source-ref { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.source-body { padding: 16px; display: none; }
.source-body.open { display: block; }
.comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.comp-box { background: var(--surface2); border-radius: 10px; padding: 12px; }
.comp-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.comp-similar .comp-label { color: #4ADB8A; }
.comp-diff .comp-label { color: #FF8888; }
.comp-unique .comp-label { color: var(--gold); }
.comp-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
.source-summary-text { font-size: 13px; color: var(--text); line-height: 1.7; margin-bottom: 12px; }
.source-link { font-size: 12px; color: #6AABFF; text-decoration: none; }
.source-link:hover { text-decoration: underline; }

/* ── AI Analysis ── */
.ai-panel { background: var(--surface); border: 1px solid rgba(201,168,76,0.3); border-radius: 14px; padding: 16px; margin-top: 24px; }
.ai-output { font-size: 13px; line-height: 1.8; color: var(--text-secondary); white-space: pre-wrap; }
.ai-btn { background: linear-gradient(135deg,#2D1B4E,#4A2080); color: #B088FF; border: 1px solid #4A2080; padding: 8px 18px; border-radius: 20px; font-size: 13px; cursor: pointer; }
.ai-btn:hover { background: linear-gradient(135deg,#3D2B6E,#5A30A0); }

/* ── Loading ── */
.loading { text-align: center; padding: 40px; color: var(--text-secondary); }
.spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Mobile ── */
@media (max-width: 768px) {
  .app { flex-direction: column; height: auto; }
  .sidebar { width: 100%; min-width: 0; max-height: 200px; display: flex; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; border-right: none; border-bottom: 1px solid var(--border); }
  .category-label { display: none; }
  .story-item { flex-direction: column; padding: 8px 10px; min-width: 80px; text-align: center; border-left: none; border-bottom: 3px solid transparent; }
  .story-item.active { border-bottom-color: var(--gold); border-left-color: transparent; }
  .story-count { display: none; }
  .main { padding: 12px; }
  .comparison-grid { grid-template-columns: 1fr; }
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet"/>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="back-btn">← Quran</a>
  <div class="header-title">
    <h1>📚 Quranic Stories & Comparative Scripture</h1>
    <p>Prophets, events and narratives — compared with Torah, Talmud, Bible & Apocrypha</p>
  </div>
</header>

<div class="app">
  <nav class="sidebar" id="storySidebar">
    <div class="loading"><div class="spinner"></div></div>
  </nav>
  <main class="main" id="storyMain">
    <div class="loading" style="padding:80px 40px;">
      <div class="spinner"></div>
      <p style="margin-top:16px;color:var(--text-secondary);">Select a story from the list</p>
    </div>
  </main>
</div>

<script>
const SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDRS  = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

const ICONS = {
  prophet:'🕌', event:'⚡', people:'👥', theme:'💡'
};
const CATEGORY_COLORS = {
  prophet: '#C9A84C', event: '#6AABFF', people: '#4ADB8A', theme: '#B088FF'
};

let stories = [];
let currentStory = null;

async function sbFetch(table, params='') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, { headers: HDRS });
  return r.json();
}

async function init() {
  stories = await sbFetch('quranic_stories', 'select=*&order=total_mentions.desc');
  renderSidebar();

  // Check URL param
  const slug = new URLSearchParams(location.search).get('story');
  if (slug) {
    const s = stories.find(x => x.slug === slug);
    if (s) loadStory(s);
  } else if (stories.length) {
    loadStory(stories[0]);
  }
}

function renderSidebar() {
  const categories = {};
  stories.forEach(s => {
    if (!categories[s.category]) categories[s.category] = [];
    categories[s.category].push(s);
  });

  let html = '';
  for (const [cat, items] of Object.entries(categories)) {
    html += `<div class="category-label">${cat}s</div>`;
    items.forEach(s => {
      html += `<div class="story-item" id="item-${s.slug}" onclick="loadStory(${JSON.stringify(s).replace(/"/g,'&quot;')})">
        <div class="story-icon" style="background:rgba(${hexToRgb(CATEGORY_COLORS[s.category]||'#C9A84C')},0.15);">${ICONS[s.category]||'📖'}</div>
        <div>
          <div class="story-arabic">${s.name_arabic||''}</div>
          <div class="story-name">${s.name_english}</div>
          <div class="story-count">${s.total_mentions} mentions in Quran</div>
        </div>
      </div>`;
    });
  }
  document.getElementById('storySidebar').innerHTML = html;
}

async function loadStory(story) {
  currentStory = story;

  // Highlight sidebar
  document.querySelectorAll('.story-item').forEach(el => el.classList.remove('active'));
  const item = document.getElementById('item-' + story.slug);
  if (item) { item.classList.add('active'); item.scrollIntoView({block:'nearest'}); }

  document.getElementById('storyMain').innerHTML = '<div class="loading" style="padding:60px;"><div class="spinner"></div></div>';

  // Load sources
  const sources = await sbFetch('story_sources', `story_id=eq.${story.id}&select=*&order=tradition.asc`);

  // Build sura chips from primary_suras
  const suras = story.primary_suras || [];
  const SURA_NAMES = {1:'Al-Fatiha',2:'Al-Baqarah',3:'Ali Imran',4:'An-Nisa',5:'Al-Maidah',6:'Al-Anam',7:'Al-Araf',8:'Al-Anfal',9:'At-Tawbah',10:'Yunus',11:'Hud',12:'Yusuf',13:'Ar-Rad',14:'Ibrahim',15:'Al-Hijr',16:'An-Nahl',17:'Al-Isra',18:'Al-Kahf',19:'Maryam',20:'Ta-Ha',21:'Al-Anbiya',22:'Al-Hajj',23:'Al-Muminun',24:'An-Nur',25:'Al-Furqan',26:'Ash-Shuara',27:'An-Naml',28:'Al-Qasas',29:'Al-Ankabut',30:'Ar-Rum',31:'Luqman',32:'As-Sajdah',33:'Al-Ahzab',34:'Saba',35:'Fatir',36:'Ya-Sin',37:'As-Saffat',38:'Sad',39:'Az-Zumar',40:'Ghafir',41:'Fussilat',42:'Ash-Shura',43:'Az-Zukhruf',44:'Ad-Dukhan',45:'Al-Jathiyah',46:'Al-Ahqaf',51:'Adh-Dhariyat',53:'An-Najm',54:'Al-Qamar',57:'Al-Hadid',60:'Al-Mumtahanah',61:'As-Saff',66:'At-Tahrim',68:'Al-Qalam',69:'Al-Haqqah',71:'Nuh',79:'An-Naziat',85:'Al-Buruj',87:'Al-Ala',89:'Al-Fajr',91:'Ash-Shams'};

  const verseChips = suras.map(s =>
    `<a href="index.html?sura=${s}&from=stories&story=${story.slug}" class="verse-chip">
      <span style="color:var(--gold);">📖</span> ${s}. ${SURA_NAMES[s]||'Surah '+s}
    </a>`
  ).join('');

  // Sources HTML
  const tradClass = t => 'trad-' + t.split('/')[0].trim().replace(/\s+/g,'');
  const sourcesHtml = sources.length ? sources.map(src => `
    <div class="source-card">
      <div class="source-header" onclick="toggleSource(this)">
        <span class="source-tradition-badge ${tradClass(src.tradition)}">${src.tradition}</span>
        <div class="source-info">
          <div class="source-name">${src.source_name}</div>
          <div class="source-ref">${src.volume ? src.volume + ' · ' : ''}${src.reference||''}</div>
        </div>
        <span style="color:var(--text-secondary);font-size:18px;">▼</span>
      </div>
      <div class="source-body">
        <p class="source-summary-text">${src.summary||''}</p>
        <div class="comparison-grid">
          <div class="comp-box comp-similar">
            <div class="comp-label">✓ Similarities</div>
            <div class="comp-text">${src.similarities||'—'}</div>
          </div>
          <div class="comp-box comp-diff">
            <div class="comp-label">✕ Differences</div>
            <div class="comp-text">${src.differences||'—'}</div>
          </div>
        </div>
        <div class="comp-box comp-unique" style="margin-top:10px;">
          <div class="comp-label">★ Unique to Quran</div>
          <div class="comp-text">${src.unique_quran||'—'}</div>
        </div>
        ${src.url ? `<div style="margin-top:10px;"><a href="${src.url}" target="_blank" class="source-link">📎 Read source →</a></div>` : ''}
      </div>
    </div>`).join('') : '<p style="color:var(--text-secondary);font-size:13px;">No sources loaded yet. Use AI Analysis to generate comparisons.</p>';

  document.getElementById('storyMain').innerHTML = `
    <div class="story-header">
      <div class="story-header-arabic">${story.name_arabic||''}</div>
      <div class="story-header-english">${story.name_english}</div>
      ${story.name_tigrinya ? `<div style="font-size:14px;color:var(--text-secondary);text-align:center;margin-top:4px;">${story.name_tigrinya}</div>` : ''}
      <div class="story-header-meta">
        <span class="badge badge-gold">${ICONS[story.category]||'📖'} ${story.category}</span>
        <span class="badge badge-green">📖 ${story.total_mentions} Quranic mentions</span>
        <span class="badge badge-blue">${suras.length} Surahs</span>
      </div>
      <p class="story-summary">${story.summary||''}</p>
    </div>

    <div class="section">
      <div class="section-title">📖 Quranic References — tap to open verse</div>
      <div class="verse-chips">${verseChips}</div>
    </div>

    <div class="section">
      <div class="section-title">📚 Comparative Sources</div>
      ${sourcesHtml}
    </div>

    <div class="ai-panel">
      <div class="section-title" style="border:none;margin:0 0 12px;">🤖 AI Deep Analysis</div>
      <div id="aiOutput" class="ai-output" style="display:none;"></div>
      <button class="ai-btn" id="aiBtn" onclick="generateAnalysis()">✨ Generate Scholarly Analysis</button>
    </div>
  `;
}

function toggleSource(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('span:last-child');
  body.classList.toggle('open');
  arrow.textContent = body.classList.contains('open') ? '▲' : '▼';
}

async function generateAnalysis() {
  if (!currentStory) return;
  const btn = document.getElementById('aiBtn');
  const out = document.getElementById('aiOutput');
  btn.textContent = '⏳ Analyzing...';
  btn.disabled = true;
  out.style.display = 'block';
  out.textContent = 'Generating scholarly comparative analysis...';

  const sources = await sbFetch('story_sources', `story_id=eq.${currentStory.id}&select=*`);
  const srcText = sources.map(s => `- ${s.tradition}: ${s.source_name} (${s.reference||''}) — ${s.summary||''}`).join('\n');

  try {
    const res = await fetch('https://qurangeez-quran-scholar-api.hf.space/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        messages: [{
          role: 'user',
          content: `You are a comparative religion scholar. Write a deep scholarly analysis of the story of ${currentStory.name_english} as presented in the Quran, compared with the following sources:\n\n${srcText}\n\nStructure your analysis as:\n1. THE QURANIC ACCOUNT (key verses and themes)\n2. SIMILARITIES WITH OTHER TRADITIONS\n3. KEY DIFFERENCES\n4. UNIQUE QURANIC ELEMENTS\n5. SCHOLARLY SIGNIFICANCE\n\nBe precise, cite specific references, and maintain academic objectivity. Keep it under 600 words.`
        }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || 'Analysis unavailable.';
    out.textContent = text;
    btn.textContent = '🔄 Regenerate Analysis';
    btn.disabled = false;
  } catch(e) {
    out.textContent = 'Error generating analysis. Please try again.';
    btn.textContent = '✨ Generate Scholarly Analysis';
    btn.disabled = false;
  }
}

function hexToRgb(hex) {
  const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r ? `${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}` : '201,168,76';
}

init();
</script>
</body>
</html>
