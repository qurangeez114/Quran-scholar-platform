<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quranic Stories & Comparative Scripture</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet"/>



<body>

<header class="site-header" style="display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:52px;">
  <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()" title="Menu">☰</button>
  <a href="index.html" class="back-btn">← Quran</a>
  <div class="header-title" style="flex:1;min-width:0;">
    <h1 style="font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">📚 Stories & Comparative Scripture</h1>
  </div>
</header>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="app">
  <nav class="sidebar" id="storySidebar">
  <div class="sidebar-header">
    <h2>📚 Stories & Sources</h2>
    <button onclick="toggleSidebar()" style="background:none;border:none;color:var(--text-secondary);font-size:20px;cursor:pointer;" class="menu-toggle">✕</button>
  </div>
  <div class="sidebar-search">
    <input type="text" id="sidebarFilter" placeholder="Filter stories and topics..." oninput="filterSidebar(this.value)"/>

    <div class="loading"><div class="spinner"></div></div>
  </div>
</nav>
  <div class="main" style="display:flex;flex-direction:column;overflow:hidden;">
    <!-- Search bar moved inside main -->
    <div style="flex-shrink:0;">
      <!-- Search Bar -->
<div class="search-bar" id="searchBarSection">
  <input type="text" class="search-input" id="conceptSearch"
    placeholder="Search concept, name, or topic... e.g. sacrifice, flood, virgin birth, clay birds"
    onkeydown="if(event.key==='Enter')doConceptSearch()"/>
  <button class="search-btn" id="searchBtn" onclick="doConceptSearch()">🔍 Search</button>
</div>
<div class="search-suggestions">
  <span style="font-size:11px;color:var(--text-secondary);align-self:center;">Try:</span>
  <span class="suggestion-chip" onclick="quickSearch('washing')">washing</span>
  <span class="suggestion-chip" onclick="quickSearch('purification')">purification</span>
  <span class="suggestion-chip" onclick="quickSearch('sacrifice')">sacrifice</span>
  <span class="suggestion-chip" onclick="quickSearch('flood')">flood</span>
  <span class="suggestion-chip" onclick="quickSearch('virgin birth')">virgin birth</span>
  <span class="suggestion-chip" onclick="quickSearch('clay birds')">clay birds</span>
  <span class="suggestion-chip" onclick="quickSearch('burning bush')">burning bush</span>
  <span class="suggestion-chip" onclick="quickSearch('parting of the sea')">parting of the sea</span>
  <span class="suggestion-chip" onclick="quickSearch('prayer')">prayer</span>
  <span class="suggestion-chip" onclick="quickSearch('creation of man')">creation of man</span>
</div>
<div id="searchResultsArea" style="display:none;">
  <div class="search-tab-bar">
    <div class="search-tab active" onclick="switchSearchTab('results',this)">Results</div>
    <div class="search-tab" onclick="switchSearchTab('browse',this)">Browse Stories</div>
  </div>
  <div id="searchResultsContent" class="search-results"></div>
</div>
    </div>
    <!-- Story content scrollable area -->
    <div id="storyMain" style="flex:1;overflow-y:auto;padding:16px;">
      <div class="loading" style="padding:60px 20px;">
        <div class="spinner"></div>
        <p style="margin-top:16px;color:var(--text-secondary);">Select a story from the list</p>
      </div>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDRS  = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

const ICONS = {
  prophet:'🕌', event:'⚡', people:'👥', theme:'💡'
};
const CATEGORY_COLORS = {
  prophet: '#C9A84C', event: '#6AABFF', people: '#4ADB8A', theme: '#B088FF'
};

let stories = [];
let currentStory = null;

async function sbFetch(table, params='') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, { headers: HDRS });
  return r.json();
}

// Unlock TTS on first user interaction (required on iOS/Android)
document.addEventListener('click', function unlockTTS() {
  if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  }
  document.removeEventListener('click', unlockTTS);
}, { once: true });

function toggleSidebar() {
  const sb = document.getElementById('storySidebar');
  const ov = document.getElementById('sidebarOverlay');
  const isOpen = sb.classList.contains('open');
  sb.classList.toggle('open', !isOpen);
  if (ov) ov.classList.toggle('open', !isOpen);
}

function filterSidebar(q) {
  q = q.toLowerCase();
  document.querySelectorAll('#sidebarList .story-item').forEach(function(el) {
    const text = el.textContent.toLowerCase();
    el.style.display = text.includes(q) ? '' : 'none';
  });
  document.querySelectorAll('#sidebarList .category-label').forEach(function(el) {
    el.style.display = '';
  });
}

// Close sidebar when story selected on mobile
function closeSidebarOnMobile() {
  if (window.innerWidth <= 768) {
    document.getElementById('storySidebar').classList.remove('open');
    const ov = document.getElementById('sidebarOverlay');
    if (ov) ov.classList.remove('open');
  }
}

async function init() {
  stories = await sbFetch('quranic_stories', 'select=*&order=total_mentions.desc');
  renderSidebar();

  // Load hadith topics
  loadHadithTopics();

  // Check URL param
  const slug = new URLSearchParams(location.search).get('story');
  if (slug) {
    const s = stories.find(x => x.slug === slug);
    if (s) loadStory(s);
  } else if (stories.length) {
    loadStory(stories[0]);
  }
}

async function loadHadithTopics() {
  try {
    const topics = await sbFetch('hadith_comparative',
      'select=topic,slug,category&order=category.asc,topic.asc'
    );
    // Get unique topics
    const seen = new Set();
    const unique = topics.filter(t => {
      if (seen.has(t.slug)) return false;
      seen.add(t.slug);
      return true;
    });
    const catIcons = { worship:'🕌', ethics:'⚖️', theology:'📿', prophethood:'🌟', law:'📜', practice:'🤲' };
    const list = document.getElementById('hadithTopicList') || document.querySelector('[id="hadithTopicList"]');
    if (!list) return;
    list.innerHTML = unique.map(t => `
      <div class="story-item" onclick="loadHadithTopic('${t.slug}', '${t.topic.replace(/'/g,'\'')}');closeSidebarOnMobile()">
        <div class="story-icon" style="background:rgba(74,32,128,0.2);">${catIcons[t.category]||'📖'}</div>
        <div>
          <div class="story-name" style="font-size:12px;">${t.topic}</div>
          <div class="story-count">${t.category}</div>
        </div>
      </div>`).join('');
  } catch(e) { console.warn('hadith topics error', e); }
}

async function loadHadithTopic(slug, topicName) {
  document.getElementById('storyMain').innerHTML =
    '<div class="loading" style="padding:60px;"><div class="spinner"></div></div>';

  const sources = await sbFetch('hadith_comparative',
    `slug=eq.${slug}&select=*&order=tradition.asc`
  );
  if (!sources.length) {
    document.getElementById('storyMain').innerHTML =
      '<div class="no-results">No comparative sources found for this topic.</div>';
    return;
  }

  const tradClass = t => 'trad-' + (t||'').split('/')[0].trim().replace(/\s+/g,'');

  const sourcesHtml = sources.map(src => `
    <div class="source-card">
      <div class="source-header" onclick="toggleSource(this)">
        <span class="source-tradition-badge ${tradClass(src.tradition)}">${src.tradition}</span>
        <div class="source-info">
          <div class="source-name">${src.source_name}</div>
          <div class="source-ref">${src.volume||''} ${src.reference ? '· '+src.reference : ''}</div>
        </div>
        <button class="card-read-btn" onclick="event.stopPropagation();ttsReadCard(this,this.closest('.source-card'))">🔊</button>
        <span style="color:var(--text-secondary);font-size:18px;">▼</span>
      </div>
      <div class="source-body">
        <div style="background:rgba(201,168,76,0.08);border-left:3px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:12px;">
          <div style="font-size:10px;font-weight:700;color:var(--gold);margin-bottom:4px;">HADITH</div>
          <div style="font-size:13px;color:var(--text);line-height:1.7;">${src.hadith_text||''}</div>
        </div>
        <p class="source-summary-text">${src.summary||''}</p>
        <div class="comparison-grid">
          <div class="comp-box comp-similar"><div class="comp-label">✓ Similarities</div><div class="comp-text">${src.similarities||'—'}</div></div>
          <div class="comp-box comp-diff"><div class="comp-label">✕ Differences</div><div class="comp-text">${src.differences||'—'}</div></div>
        </div>
        <div class="comp-box comp-unique" style="margin-top:10px;">
          <div class="comp-label">★ Unique to Islam</div>
          <div class="comp-text">${src.unique_islam||'—'}</div>
        </div>
        ${src.url ? `<div style="margin-top:10px;"><a href="${src.url}" target="_blank" class="source-link">📎 Read source →</a></div>` : ''}
      </div>
    </div>`).join('');

  document.getElementById('storyMain').innerHTML = `
    <div class="story-header">
      <div class="story-header-english">${topicName}</div>
      <div class="story-header-meta">
        <span class="badge badge-gold">⚙️ Hadith Practice</span>
        <span class="badge badge-blue">${sources.length} comparative sources</span>
        <button class="read-all-btn" onclick="ttsReadAll()">🔊 Read All</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">📚 Comparative Sources from Prior Traditions</div>
      ${sourcesHtml}
    </div>`;
}

function renderSidebar() {
  // Build a slug->story map so onclick can reference by slug safely
  window._storyMap = {};
  stories.forEach(s => { window._storyMap[s.slug] = s; });

  const catOrder = ['prophet','event','people','theme'];
  const categories = {};
  stories.forEach(s => {
    const cat = s.category || 'other';
    if (!categories[cat]) categories[cat] = [];
    categories[cat].push(s);
  });

  let out = '';
  // Render in preferred order then any remaining
  const orderedCats = [...catOrder.filter(c => categories[c]), ...Object.keys(categories).filter(c => !catOrder.includes(c))];
  for (const cat of orderedCats) {
    const items = categories[cat];
    if (!items || !items.length) continue;
    out += `<div class="category-label">${cat}s</div>`;
    items.forEach(s => {
      const color = hexToRgb(CATEGORY_COLORS[s.category] || '#C9A84C');
      out += `<div class="story-item" id="item-${s.slug}" onclick="selectStory('${s.slug}')">
        <div class="story-icon" style="background:rgba(${color},0.15);">${ICONS[s.category]||'📖'}</div>
        <div>
          <div class="story-arabic">${s.name_arabic||''}</div>
          <div class="story-name">${s.name_english}</div>
        </div>
      </div>`;
    });
  }

  document.getElementById('sidebarList').innerHTML = out + `
    <div class="category-label" style="margin-top:8px;border-top:1px solid var(--border);padding-top:10px;">⚙️ Hadith Practices</div>
    <div id="hadithTopicList"></div>
  `;
}

// Safe story selector using slug map
function selectHadithTopic(el) {
  const slug = el.getAttribute('data-slug');
  const topic = el.getAttribute('data-topic');
  if (slug && topic) { loadHadithTopic(slug, topic); closeSidebarOnMobile(); }
}

function selectStory(slug) {
  const s = window._storyMap && window._storyMap[slug];
  if (s) { loadStory(s); closeSidebarOnMobile(); }
}


async function loadStory(story) {
  currentStory = story;

  // Highlight sidebar
  document.querySelectorAll('.story-item').forEach(el => el.classList.remove('active'));
  const item = document.getElementById('item-' + story.slug);
  if (item) { item.classList.add('active'); item.scrollIntoView({block:'nearest'}); }

  document.getElementById('storyMain').innerHTML = '<div class="loading" style="padding:60px;"><div class="spinner"></div></div>';

  // Load sources
  const sources = await sbFetch('story_sources', `story_id=eq.${story.id}&select=*&order=tradition.asc`);

  // Build sura chips from primary_suras
  const suras = story.primary_suras || [];
  const SURA_NAMES = {1:'Al-Fatiha',2:'Al-Baqarah',3:'Ali Imran',4:'An-Nisa',5:'Al-Maidah',6:'Al-Anam',7:'Al-Araf',8:'Al-Anfal',9:'At-Tawbah',10:'Yunus',11:'Hud',12:'Yusuf',13:'Ar-Rad',14:'Ibrahim',15:'Al-Hijr',16:'An-Nahl',17:'Al-Isra',18:'Al-Kahf',19:'Maryam',20:'Ta-Ha',21:'Al-Anbiya',22:'Al-Hajj',23:'Al-Muminun',24:'An-Nur',25:'Al-Furqan',26:'Ash-Shuara',27:'An-Naml',28:'Al-Qasas',29:'Al-Ankabut',30:'Ar-Rum',31:'Luqman',32:'As-Sajdah',33:'Al-Ahzab',34:'Saba',35:'Fatir',36:'Ya-Sin',37:'As-Saffat',38:'Sad',39:'Az-Zumar',40:'Ghafir',41:'Fussilat',42:'Ash-Shura',43:'Az-Zukhruf',44:'Ad-Dukhan',45:'Al-Jathiyah',46:'Al-Ahqaf',51:'Adh-Dhariyat',53:'An-Najm',54:'Al-Qamar',57:'Al-Hadid',60:'Al-Mumtahanah',61:'As-Saff',66:'At-Tahrim',68:'Al-Qalam',69:'Al-Haqqah',71:'Nuh',79:'An-Naziat',85:'Al-Buruj',87:'Al-Ala',89:'Al-Fajr',91:'Ash-Shams'};

  // Load actual key verses for this story from DB
  let keyVerses = [];
  try {
    // Get story_verses mapping first
    const storyVerses = await sbFetch('story_verses',
      `story_id=eq.${story.id}&select=sura_id,aya_number,note&order=sura_id.asc,aya_number.asc&limit=12`
    );
    if (storyVerses && storyVerses.length) {
      // Fetch actual verse text for each
      const versePromises = storyVerses.map(v =>
        sbFetch('ayas', `sura_id=eq.${v.sura_id}&aya_number=eq.${v.aya_number}&select=sura_id,aya_number,arabic,english&limit=1`)
          .then(r => r[0] ? {...r[0], note: v.note} : null)
      );
      const fetched = await Promise.all(versePromises);
      keyVerses = fetched.filter(Boolean);
    }
    // If no story_verses, fall back to fetching first verse of each primary sura
    if (!keyVerses.length && suras.length) {
      const fallbackPromises = suras.slice(0,8).map(s =>
        sbFetch('ayas', `sura_id=eq.${s}&aya_number=gte.1&select=sura_id,aya_number,arabic,english&order=aya_number.asc&limit=1`)
          .then(r => r[0] || null)
      );
      keyVerses = (await Promise.all(fallbackPromises)).filter(Boolean);
    }
  } catch(e) { console.warn('verse load error', e); }

  // Build verse cards with actual text
  const verseChips = keyVerses.length ? keyVerses.map(v => {
    const suraName = SURA_NAMES[v.sura_id] || 'Surah ' + v.sura_id;
    const url = `index.html?sura=${v.sura_id}&aya=${v.aya_number}&from=stories&story=${story.slug}`;
    return `<div class="verse-display-card">
      <div class="verse-display-ref">
        <span style="color:var(--gold);font-weight:700;">📖 ${v.sura_id}:${v.aya_number}</span>
        <span style="color:var(--text-secondary);font-size:11px;margin-left:6px;">${suraName}</span>
        ${v.note ? `<span style="color:var(--text-secondary);font-size:10px;margin-left:6px;font-style:italic;">— ${v.note}</span>` : ''}
        <a href="${url}" style="margin-left:auto;font-size:11px;color:var(--gold);text-decoration:none;white-space:nowrap;">Open →</a>
      </div>
      <div class="verse-display-arabic">${v.arabic||''}</div>
      <div class="verse-display-english">${v.english||''}</div>
    </div>`;
  }).join('') :
    suras.map(s => `<a href="index.html?sura=${s}&from=stories&story=${story.slug}" class="verse-chip">
      <span style="color:var(--gold);">📖</span> ${s}. ${SURA_NAMES[s]||'Surah '+s}
    </a>`).join('');

  // Sources HTML
  const tradClass = t => 'trad-' + t.split('/')[0].trim().replace(/\s+/g,'');
  const sourcesHtml = sources.length ? sources.map(src => `
    <div class="source-card">
      <div class="source-header" onclick="toggleSource(this)">
        <span class="source-tradition-badge ${tradClass(src.tradition)}">${src.tradition}</span>
        <div class="source-info">
          <div class="source-name">${src.source_name}</div>
          <div class="source-ref">${src.volume ? src.volume + ' · ' : ''}${src.reference||''}</div>
        </div>
        <button class="card-read-btn" onclick="event.stopPropagation();ttsReadCard(this,this.closest('.source-card'))" title="Read this card">🔊 Read</button>
        <span style="color:var(--text-secondary);font-size:18px;">▼</span>
      </div>
      <div class="source-body">
        <p class="source-summary-text">${src.summary||''}</p>
        <div class="comparison-grid">
          <div class="comp-box comp-similar">
            <div class="comp-label">✓ Similarities</div>
            <div class="comp-text">${src.similarities||'—'}</div>
          </div>
          <div class="comp-box comp-diff">
            <div class="comp-label">✕ Differences</div>
            <div class="comp-text">${src.differences||'—'}</div>
          </div>
        </div>
        <div class="comp-box comp-unique" style="margin-top:10px;">
          <div class="comp-label">★ Unique to Quran</div>
          <div class="comp-text">${src.unique_quran||'—'}</div>
        </div>
        ${src.url ? `<div style="margin-top:10px;"><a href="${src.url}" target="_blank" class="source-link">📎 Read source →</a></div>` : ''}
      </div>
    </div>`).join('') : '<p style="color:var(--text-secondary);font-size:13px;">No sources loaded yet. Use AI Analysis to generate comparisons.</p>';

  document.getElementById('storyMain').innerHTML = `
    <div class="story-header">
      <div class="story-header-arabic">${story.name_arabic||''}</div>
      <div class="story-header-english">${story.name_english}</div>
      ${story.name_tigrinya ? `<div style="font-size:14px;color:var(--text-secondary);text-align:center;margin-top:4px;">${story.name_tigrinya}</div>` : ''}
      <div class="story-header-meta">
        <span class="badge badge-gold">${ICONS[story.category]||'📖'} ${story.category}</span>
        <span class="badge badge-green">📖 ${story.total_mentions} Quranic mentions</span>
        <span class="badge badge-blue">${suras.length} Surahs</span>
        <button class="read-all-btn" onclick="ttsReadAll()" title="Read all content aloud">🔊 Read All</button>
      </div>
      <p class="story-summary">${story.summary||''}</p>
    </div>

    <div class="section">
      <div class="section-title">📖 Key Quranic Verses — tap "Open →" to read in Quran</div>
      <div id="verseCardsContainer">${verseChips}</div>
    </div>

    <div class="section">
      <div class="section-title">📚 Comparative Sources</div>
      ${sourcesHtml}
    </div>

    <div class="ai-panel">
      <div class="section-title" style="border:none;margin:0 0 12px;">🤖 AI Deep Analysis</div>
      <div id="aiOutput" class="ai-output" style="display:none;"></div>
      <button class="ai-btn" id="aiBtn" onclick="generateAnalysis()">✨ Generate Scholarly Analysis</button>
    </div>
  `;
}

function toggleSource(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('span:last-child');
  body.classList.toggle('open');
  arrow.textContent = body.classList.contains('open') ? '▲' : '▼';
}

async function generateAnalysis() {
  if (!currentStory) return;
  const btn = document.getElementById('aiBtn');
  const out = document.getElementById('aiOutput');
  btn.textContent = '⏳ Analyzing...';
  btn.disabled = true;
  out.style.display = 'block';
  out.textContent = 'Generating scholarly comparative analysis...';

  const sources = await sbFetch('story_sources', `story_id=eq.${currentStory.id}&select=*`);
  const srcText = sources.map(s => `- ${s.tradition}: ${s.source_name} (${s.reference||''}) — ${s.summary||''}`).join('\n');

  try {
    const res = await fetch('https://qurangeez-quran-scholar-api.hf.space/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        messages: [{
          role: 'user',
          content: `You are a comparative religion scholar. Write a deep scholarly analysis of the story of ${currentStory.name_english} as presented in the Quran, compared with the following sources:\n\n${srcText}\n\nStructure your analysis as:\n1. THE QURANIC ACCOUNT (key verses and themes)\n2. SIMILARITIES WITH OTHER TRADITIONS\n3. KEY DIFFERENCES\n4. UNIQUE QURANIC ELEMENTS\n5. SCHOLARLY SIGNIFICANCE\n\nBe precise, cite specific references, and maintain academic objectivity. Keep it under 600 words.`
        }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || 'Analysis unavailable.';
    out.textContent = text;
    btn.textContent = '🔄 Regenerate Analysis';
    btn.disabled = false;
  } catch(e) {
    out.textContent = 'Error generating analysis. Please try again.';
    btn.textContent = '✨ Generate Scholarly Analysis';
    btn.disabled = false;
  }
}

function hexToRgb(hex) {
  const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r ? `${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}` : '201,168,76';
}

function quickSearch(q) {
  document.getElementById('conceptSearch').value = q;
  doConceptSearch();
}

function switchSearchTab(tab, el) {
  document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (tab === 'browse') {
    document.getElementById('searchResultsContent').style.display = 'none';
    document.getElementById('searchResultsArea').style.display = 'none';
  } else {
    document.getElementById('searchResultsContent').style.display = 'block';
    document.getElementById('searchResultsArea').style.display = 'block';
  }
}

async function doConceptSearch() {
  const q = document.getElementById('conceptSearch').value.trim();
  if (!q) return;

  const btn = document.getElementById('searchBtn');
  btn.textContent = '⏳ Searching...';
  btn.disabled = true;

  const resultsArea = document.getElementById('searchResultsArea');
  const resultsContent = document.getElementById('searchResultsContent');
  resultsArea.style.display = 'block';
  document.getElementById('browseArea').style.display = 'none';
  resultsContent.innerHTML = '<div class="loading" style="padding:40px;"><div class="spinner"></div><p style="margin-top:14px;color:var(--text-secondary);">Searching Quran and comparative sources...</p></div>';

  // Switch to results tab
  document.querySelectorAll('.search-tab').forEach((t,i) => t.classList.toggle('active', i===0));

  try {
    // 1. Search stories by name/slug
    const matchedStories = stories.filter(s =>
      s.name_english.toLowerCase().includes(q.toLowerCase()) ||
      (s.summary||'').toLowerCase().includes(q.toLowerCase()) ||
      (s.slug||'').toLowerCase().includes(q.toLowerCase())
    );

    // 2. Search story_sources by summary/similarities/differences
    const enc = encodeURIComponent(q);
    const [srcBySummary, srcByTrad, hadithSrc] = await Promise.all([
      sbFetch('story_sources', `or=(summary.ilike.*${enc}*,similarities.ilike.*${enc}*,differences.ilike.*${enc}*,unique_quran.ilike.*${enc}*,source_name.ilike.*${enc}*)&select=*,quranic_stories(name_english,name_arabic,slug)&limit=20`),
      sbFetch('story_sources', `tradition.ilike.*${enc}*&select=*,quranic_stories(name_english,name_arabic,slug)&limit=10`),
      sbFetch('hadith_comparative', `or=(topic.ilike.*${enc}*,summary.ilike.*${enc}*,similarities.ilike.*${enc}*,hadith_text.ilike.*${enc}*,source_name.ilike.*${enc}*)&select=*&limit=10`)
    ]);
    // Add hadith results to display
    if (hadithSrc && hadithSrc.length) {
      hadithSrc.forEach(src => {
        const card = document.createElement('div');
        card.className = 'search-result-card';
        card.innerHTML = `
          <div class="search-result-header">
            <span class="source-tradition-badge trad-${(src.tradition||'').split('/')[0].trim().replace(/\s+/g,'')}">${src.tradition}</span>
            <div>
              <div class="search-result-title">${src.topic} · ${src.source_name}</div>
              <div class="search-result-meta">Hadith Practice · ${src.volume||''}</div>
            </div>
          </div>
          <div class="search-result-body">
            <div style="background:rgba(201,168,76,0.08);border-left:3px solid var(--gold);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12px;color:var(--text);">${src.hadith_text||''}</div>
            <p class="source-summary-text">${src.summary||''}</p>
            <div class="comparison-grid">
              <div class="comp-box comp-similar"><div class="comp-label">✓ Similarities</div><div class="comp-text">${src.similarities||'—'}</div></div>
              <div class="comp-box comp-diff"><div class="comp-label">✕ Differences</div><div class="comp-text">${src.differences||'—'}</div></div>
            </div>
            <div class="comp-box comp-unique" style="margin-top:8px;"><div class="comp-label">★ Unique to Islam</div><div class="comp-text">${src.unique_islam||'—'}</div></div>
          </div>`;
        document.getElementById('searchResultsContent').appendChild(card);
      });
    }

    // 3. Also ask AI for relevant Quran verses about this concept
    const aiVerses = await searchQuranVerses(q);

    const allSources = [...srcBySummary, ...srcByTrad].filter((s,i,arr) => arr.findIndex(x=>x.id===s.id)===i);

    if (!matchedStories.length && !allSources.length && !aiVerses.length) {
      // No DB results — use AI to generate comparison
      await aiGenerateSearch(q);
      btn.textContent = '🔍 Search';
      btn.disabled = false;
      return;
    }

    let html = '';

    // Show matched stories first
    if (matchedStories.length) {
      html += `<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);padding:0 0 10px;">Related Stories (${matchedStories.length})</div>`;
      matchedStories.forEach(s => {
        html += `<div class="search-result-card" style="cursor:pointer;" onclick="showStoryFromSearch('${s.slug}')">
          <div class="search-result-header">
            <div style="font-size:24px;">${ICONS[s.category]||'📖'}</div>
            <div>
              <div class="search-result-title">${s.name_arabic||''} — ${s.name_english}</div>
              <div class="search-result-meta">${s.total_mentions} Quranic mentions · ${(s.primary_suras||[]).length} surahs · Tap to open full story</div>
            </div>
          </div>
          <div class="search-result-body">
            <p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">${s.summary||''}</p>
          </div>
        </div>`;
      });
    }

    // Show source comparison cards
    if (allSources.length) {
      html += `<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);padding:12px 0 10px;">Source Comparisons (${allSources.length})</div>`;
      allSources.forEach(src => {
        const story = src.quranic_stories || {};
        html += `<div class="search-result-card">
          <div class="search-result-header">
            <span class="source-tradition-badge ${tradClass(src.tradition)}" style="flex-shrink:0;">${src.tradition}</span>
            <div>
              <div class="search-result-title">${src.source_name} ${src.reference ? '· '+src.reference : ''}</div>
              <div class="search-result-meta">${src.volume||''} ${story.name_english ? '· Story of '+story.name_english : ''}</div>
            </div>
          </div>
          <div class="search-result-body">
            <p class="source-summary-text">${src.summary||''}</p>
            <div class="comparison-grid">
              <div class="comp-box comp-similar"><div class="comp-label">✓ Similarities</div><div class="comp-text">${src.similarities||'—'}</div></div>
              <div class="comp-box comp-diff"><div class="comp-label">✕ Differences</div><div class="comp-text">${src.differences||'—'}</div></div>
            </div>
            <div class="comp-box comp-unique" style="margin-top:10px;"><div class="comp-label">★ Unique to Quran</div><div class="comp-text">${src.unique_quran||'—'}</div></div>
            ${src.url ? `<div style="margin-top:10px;"><a href="${src.url}" target="_blank" class="source-link">📎 Read source →</a></div>` : ''}
            ${story.slug ? `<div style="margin-top:10px;"><button onclick="showStoryFromSearch('${story.slug}')" style="background:none;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:4px 14px;font-size:12px;cursor:pointer;">📖 Open full story →</button></div>` : ''}
          </div>
        </div>`;
      });
    }

    // Show AI-found verses
    if (aiVerses.length) {
      html += `<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);padding:12px 0 10px;">Quranic Verses on "${q}"</div>`;
      aiVerses.forEach(v => {
        html += `<div class="quran-verse-block">
          <div class="quran-verse-arabic">${v.arabic||''}</div>
          <div class="quran-verse-english">${v.english||''}</div>
          <div class="quran-verse-ref" onclick="window.location.href='index.html?sura=${v.sura_id}&aya=${v.aya_number}&from=stories'">📖 Surah ${v.sura_id}:${v.aya_number} — tap to open →</div>
        </div>`;
      });
    }

    if (!html) {
      await aiGenerateSearch(q);
    } else {
      resultsContent.innerHTML = html;
    }

  } catch(e) {
    resultsContent.innerHTML = `<div class="no-results">Error: ${e.message}</div>`;
  }

  btn.textContent = '🔍 Search';
  btn.disabled = false;
}

async function searchQuranVerses(q) {
  try {
    const enc = encodeURIComponent(q);
    const res = await sbFetch('ayas',
      `or=(english.ilike.*${enc}*,arabic.ilike.*${enc}*)&select=sura_id,aya_number,arabic,english&limit=5`
    );
    return Array.isArray(res) ? res : [];
  } catch(e) { return []; }
}

async function aiGenerateSearch(q) {
  const resultsContent = document.getElementById('searchResultsContent');
  resultsContent.innerHTML = '<div class="loading" style="padding:30px;"><div class="spinner"></div><p style="margin-top:12px;color:var(--text-secondary);">Generating AI comparison for "' + q + '"...</p></div>';

  try {
    const res = await fetch('https://qurangeez-quran-scholar-api.hf.space/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1200,
        messages: [{
          role: 'user',
          content: `You are a comparative scripture scholar. The user searched for: "${q}"

Find where this concept, story, or word appears in:
1. The Quran (cite specific surah:verse numbers)
2. The Torah/Bible (cite book, chapter:verse)
3. The Talmud (cite tractate and page, e.g. Sanhedrin 89b)
4. Any other relevant source (Midrash, Apocrypha, Gospel of Thomas, Dead Sea Scrolls, etc.)

For each source found, provide:
- The exact reference
- A 1-2 sentence summary of what it says
- Key similarity with Quran
- Key difference from Quran

Format as JSON array like:
[{"tradition":"Torah/Bible","source_name":"Genesis","reference":"6:9-22","volume":"Book of Genesis","summary":"...","similarities":"...","differences":"...","unique_quran":"...","url":"https://..."}]

Return ONLY the JSON array, no other text.`
        }]
      })
    });
    const data = await res.json();
    const text = (data.content?.[0]?.text || '[]').replace(/```json|```/g,'').trim();
    let sources = [];
    try { sources = JSON.parse(text); } catch(e) {}

    if (!sources.length) {
      resultsContent.innerHTML = `<div class="no-results">No results found for "<strong>${q}</strong>".<br><span style="font-size:12px;">Try a different search term or browse the stories list.</span></div>`;
      return;
    }

    let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;"><div style="font-size:11px;color:var(--text-secondary);">🤖 AI-generated comparative analysis for "<strong style="color:var(--gold);">${q}</strong>"</div>`;
    sources.forEach(src => {
      html += `<div class="search-result-card">
        <div class="search-result-header">
          <span class="source-tradition-badge ${tradClass(src.tradition||'')}">${src.tradition||'Source'}</span>
          <div>
            <div class="search-result-title">${src.source_name||''} ${src.reference ? '· '+src.reference : ''}</div>
            <div class="search-result-meta">${src.volume||''}</div>
          </div>
        </div>
        <div class="search-result-body">
          <p class="source-summary-text">${src.summary||''}</p>
          <div class="comparison-grid">
            <div class="comp-box comp-similar"><div class="comp-label">✓ Similarities</div><div class="comp-text">${src.similarities||'—'}</div></div>
            <div class="comp-box comp-diff"><div class="comp-label">✕ Differences</div><div class="comp-text">${src.differences||'—'}</div></div>
          </div>
          <div class="comp-box comp-unique" style="margin-top:10px;"><div class="comp-label">★ Unique to Quran</div><div class="comp-text">${src.unique_quran||'—'}</div></div>
          ${src.url ? `<div style="margin-top:10px;"><a href="${src.url}" target="_blank" class="source-link">📎 Read source →</a></div>` : ''}
        </div>
      </div>`;
    });
    resultsContent.innerHTML = html;
  } catch(e) {
    resultsContent.innerHTML = `<div class="no-results">Could not generate comparison. Please try again.</div>`;
  }
}

function showStoryFromSearch(slug) {
  const s = stories.find(x => x.slug === slug);
  if (s) {
    document.getElementById('searchResultsArea').style.display = 'none';
    loadStory(s);
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

function tradClass(t) { return 'trad-' + (t||'').split('/')[0].trim().replace(/\s+/g,''); }

// ════════════════════════════════════════
//  TTS — Text To Speech System
// ════════════════════════════════════════
const TTS = {
  queue: [],       // array of {text, lang, label}
  idx: 0,
  playing: false,
  paused: false,
  utt: null,
  speed: 0.85,
  activeBtn: null
};

function ttsDetectLang(text) {
  if (!text) return 'en';
  const arabicRe = /[؀-ۿ]/;
  const ethiopicRe = /[ሀ-፿]/;
  if (arabicRe.test(text)) return 'ar';
  if (ethiopicRe.test(text)) return 'ti'; // Tigrinya
  return 'en';
}

function ttsLangCode(lang) {
  const map = { ar: 'ar-SA', en: 'en-US', ti: 'ti-ET', he: 'he-IL', de: 'de-DE' };
  return map[lang] || 'en-US';
}

function ttsShowBar() {
  document.getElementById('ttsBar').classList.add('visible');
}
function ttsHide() {
  ttsStop();
  document.getElementById('ttsBar').classList.remove('visible');
}

function ttsSetSpeed(v) {
  TTS.speed = parseFloat(v);
  if (TTS.playing && TTS.utt) {
    window.speechSynthesis.cancel();
    TTS.playing = false;
    ttsPlayNext();
  }
}

function ttsSetTitle(title, sub) {
  document.getElementById('ttsTitleEl').textContent = title || '';
  document.getElementById('ttsSubEl').textContent = sub || '';
}

function ttsSetProgress(pct) {
  document.getElementById('ttsProgressFill').style.width = Math.min(100,pct) + '%';
}

function ttsToggle() {
  if (!TTS.queue.length) return;
  if (TTS.paused) {
    window.speechSynthesis.resume();
    TTS.paused = false;
    TTS.playing = true;
    document.getElementById('ttsPlayBtn').textContent = '⏸';
  } else if (TTS.playing) {
    window.speechSynthesis.pause();
    TTS.paused = true;
    TTS.playing = false;
    document.getElementById('ttsPlayBtn').textContent = '▶';
  } else {
    ttsPlayNext();
  }
}

function ttsStop() {
  window.speechSynthesis.cancel();
  TTS.playing = false;
  TTS.paused = false;
  TTS.idx = 0;
  TTS.queue = [];
  document.getElementById('ttsPlayBtn').textContent = '▶';
  ttsSetProgress(0);
  ttsSetTitle('Ready to read', 'Tap 🔊 on any card or use Read All');
  if (TTS.activeBtn) { TTS.activeBtn.classList.remove('reading'); TTS.activeBtn.textContent = '🔊 Read'; TTS.activeBtn = null; }
}

function ttsPlayNext() {
  if (TTS.idx >= TTS.queue.length) {
    ttsStop();
    return;
  }
  const item = TTS.queue[TTS.idx];
  const utt = new SpeechSynthesisUtterance(item.text);
  utt.lang = ttsLangCode(item.lang || ttsDetectLang(item.text));
  utt.rate = TTS.speed;
  TTS.utt = utt;
  TTS.playing = true;
  document.getElementById('ttsPlayBtn').textContent = '⏸';
  ttsSetTitle(item.label || 'Reading...', `${TTS.idx+1} of ${TTS.queue.length}`);
  ttsSetProgress(((TTS.idx+1) / TTS.queue.length) * 100);

  utt.onend = () => {
    TTS.idx++;
    setTimeout(ttsPlayNext, 300);
  };
  utt.onerror = () => { TTS.idx++; setTimeout(ttsPlayNext, 300); };
  window.speechSynthesis.speak(utt);
}

// Read a single card's text
function ttsReadCard(btn, cardEl) {
  // If already reading this card, stop
  if (TTS.activeBtn === btn && TTS.playing) { ttsStop(); return; }
  ttsStop();
  if (TTS.activeBtn) { TTS.activeBtn.classList.remove('reading'); TTS.activeBtn.textContent = '🔊 Read'; }
  TTS.activeBtn = btn;
  btn.classList.add('reading');
  btn.textContent = '⏹ Stop';

  // Auto-open card body so text is accessible
  const body = cardEl.querySelector('.source-body');
  if (body && !body.classList.contains('open')) {
    body.classList.add('open');
  }

  const segments = [];

  // Title / tradition
  const title = cardEl.querySelector('.source-name, .search-result-title, .source-tradition-badge');
  if (title) segments.push({ text: title.textContent.trim(), lang: 'en', label: 'Source' });

  // Reference
  const ref = cardEl.querySelector('.source-ref, .search-result-meta');
  if (ref) segments.push({ text: ref.textContent.trim(), lang: 'en', label: 'Reference' });

  // All readable text
  const selectors = [
    '.source-summary-text', '.comp-text', '.quran-verse-english',
    '.verse-display-english', '.story-summary', '.ai-output'
  ];
  selectors.forEach(sel => {
    cardEl.querySelectorAll(sel).forEach(el => {
      const t = el.textContent.trim();
      if (t && t !== '—') segments.push({ text: t, lang: ttsDetectLang(t), label: sel });
    });
  });

  // Arabic text
  cardEl.querySelectorAll('.quran-verse-arabic, .verse-display-arabic').forEach(el => {
    const t = el.textContent.trim();
    if (t) segments.push({ text: t, lang: 'ar', label: 'Arabic verse' });
  });

  // Fallback
  if (!segments.length) {
    const t = cardEl.textContent.replace(/\s+/g,' ').trim().slice(0, 600);
    if (t) segments.push({ text: t, lang: 'en', label: 'Card' });
  }

  if (!segments.length) { alert('Nothing to read in this card.'); ttsStop(); return; }

  TTS.queue = segments;
  TTS.idx = 0;
  ttsShowBar();
  ttsPlayNext();
}

// Read ALL visible content continuously
function ttsReadAll() {
  ttsStop();
  const segments = [];

  // Story header
  const hdr = document.querySelector('.story-header');
  if (hdr) {
    const eng = hdr.querySelector('.story-header-english');
    if (eng) segments.push({ text: eng.textContent.trim(), lang: 'en', label: 'Chapter: ' + eng.textContent.trim() });
    const sum = hdr.querySelector('.story-summary');
    if (sum) segments.push({ text: sum.textContent.trim(), lang: 'en', label: 'Summary' });
  }

  // Source cards
  document.querySelectorAll('.source-card, .search-result-card').forEach((card, i) => {
    const name = card.querySelector('.source-name, .search-result-title');
    const label = name ? name.textContent.trim() : 'Source ' + (i+1);
    segments.push({ text: label, lang: 'en', label: 'Source: ' + label });
    card.querySelectorAll('.source-summary-text, .comp-text').forEach(el => {
      const t = el.textContent.trim();
      if (t && t !== '—') segments.push({ text: t, lang: ttsDetectLang(t), label });
    });
  });

  // AI output
  const ai = document.getElementById('aiOutput');
  if (ai && ai.style.display !== 'none') {
    segments.push({ text: ai.textContent.trim(), lang: 'en', label: 'AI Analysis' });
  }

  // Search results
  document.querySelectorAll('.quran-verse-english').forEach(el => {
    const t = el.textContent.trim();
    if (t) segments.push({ text: t, lang: 'en', label: 'Quran Verse' });
  });

  if (!segments.length) { alert('Nothing to read yet. Open a story or search first.'); return; }

  TTS.queue = segments;
  TTS.idx = 0;
  ttsShowBar();
  ttsPlayNext();
}

init();
</script>
