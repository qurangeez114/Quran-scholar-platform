<script>
window.controversyScore=function(v){var t=[v.english,v.aya_text,v.text_english,v.hadith_text,v.topic,v.brief_description,v.content,v.reason_text,v.story_en,v.title_en,v.summary,v.name_english,v.theme].filter(Boolean).join(' ').toLowerCase();var s=0;['kill','slay','smite','amputat','crucif','stone','whip','lash','apostat','slave','captive','concubin','beat.*wife','wife.*beat','fight.*until','jihad','warfare','adulter','zina','thief.*hand','homosexual','liwat','blasphemy','jizya','dhimmi','women.*half','inherit.*half','polygam','nushuz','sex slave','cut hand'].forEach(function(k){try{if(new RegExp(k).test(t))s+=12;}catch(e){}});['divorce','talaq','inheritance','veil','hijab','niqab','disbeliev','infidel','kafir','hellfire','punishment','torment','war','battle','riba','usury','intoxicant','alcohol','honor kill','martyr'].forEach(function(k){if(t.indexOf(k)!==-1)s+=5;});['alhamdulillah','merciful','compassionate','forgiving','be patient'].forEach(function(k){if(t.indexOf(k)!==-1)s-=2;});if(v.controversy_level)s+=(parseInt(v.controversy_level)-1)*4;if(v.human_rights_score!=null)s+=Math.max(0,(5-parseFloat(v.human_rights_score))*2);return s;};
window.sortByControversy=function(arr){if(!Array.isArray(arr))return arr;return arr.slice().sort(function(a,b){var sa=window.controversyScore(a),sb=window.controversyScore(b);return sb!==sa?sb-sa:((a.sura_id||a.year_ce||0)-(b.sura_id||b.year_ce||0))||((a.aya_number||0)-(b.aya_number||0));});};
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body {height:100%;background:#0F1623;color:#E8EDF5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;}
:root{--gold:#C9A84C;--gold2:#F0D080;--surface:#1A2235;--surface2:#212D42;--border:#2E3D55;--text:#E8EDF5;--dim:#8A9BB5;}

/* HEADER */
#hdr{position:fixed;top:0;left:0;right:0;height:50px;background:linear-gradient(135deg,#1B2A4A,#2C3E6B);border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:100;}
#hdr a{color:var(--gold);text-decoration:none;font-size:12px;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.4);padding:4px 10px;border-radius:14px;white-space:nowrap;}

/* LAYOUT */

.v-card{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:10px;padding:11px 13px;margin-bottom:8px;}

<script>
const SB_URL='https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HD={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};

async function sb(table,params){
  const r=await fetch(SB_URL+'/rest/v1/'+table+'?'+params,{headers:HD});
  return r.json();
}

let allStories=[];
const ICONS={prophet:'🕌',event:'⚡',people:'👥',theme:'💡'};
const CATS=['prophet','event','people','theme'];
const SNAMES={1:'Al-Fatiha',2:'Al-Baqarah',3:'Ali Imran',4:'An-Nisa',5:'Al-Maidah',6:'Al-Anam',7:'Al-Araf',8:'Al-Anfal',9:'At-Tawbah',10:'Yunus',11:'Hud',12:'Yusuf',14:'Ibrahim',15:'Al-Hijr',17:'Al-Isra',18:'Al-Kahf',19:'Maryam',20:'Ta-Ha',21:'Al-Anbiya',22:'Al-Hajj',26:'Ash-Shuara',27:'An-Naml',28:'Al-Qasas',37:'As-Saffat',71:'Nuh',85:'Al-Buruj'};

function toggleSB(){
  document.getElementById('sb').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

function filterSB(q){
  q=q.toLowerCase();
  document.querySelectorAll('#sb-list .si').forEach(el=>{
    el.style.display=el.textContent.toLowerCase().includes(q)?'':'none';
  });
}

function tradClass(t){
  const s=(t||'').split('/')[0].trim();
  if(/Torah|Bible/i.test(s))return'tT';
  if(/Talmud/i.test(s))return'tTa';
  if(/Midrash|Pirkei/i.test(s))return'tM';
  if(/Apocrypha|Gospel|Enoch|Testament|Jubilees|Pseudo|Dead|Targum|Syriac|Kebra/i.test(s))return'tA';
  if(/Zoroast|Avesta|Bundah|Arda|Vendidad/i.test(s))return'tZ';
  return'tO';
}

async function init(){
  allStories=await sb('quranic_stories','select=*&order=total_mentions.desc');
  buildSidebar();
  // Load hadith topics
  const htopics=await sb('hadith_comparative','select=topic,slug,category&order=category.asc,topic.asc');
  const seen=new Set();
  const uniq=htopics.filter(t=>{if(seen.has(t.slug))return false;seen.add(t.slug);return true;});
  const catIcons={worship:'🕌',ethics:'⚖️',theology:'📿',prophethood:'🌟',law:'📜',practice:'🤲'};
  const list=document.getElementById('sb-list');
  if(list){
    list.innerHTML+=`<div class="cat" style="margin-top:8px;border-top:1px solid var(--border);padding-top:10px;">⚙️ HADITH PRACTICES</div>`;
    uniq.forEach(t=>{
      const div=document.createElement('div');
      div.className='si';
      div.innerHTML=`<div class="si-icon" style="background:rgba(74,32,128,.2);">${catIcons[t.category]||'📖'}</div><div class="si-text"><span class="si-en">${t.topic}</span></div>`;
      div.addEventListener('click',()=>openHadith(t.slug,t.topic));
      list.appendChild(div);
    });
  }
  // Open first story
  if(allStories.length) openStory(allStories[0]);
}

function buildSidebar(){
  const list=document.getElementById('sb-list');
  list.innerHTML='';
  const cats={};
  allStories.forEach(s=>{
    const c=s.category||'other';
    if(!cats[c])cats[c]=[];
    cats[c].push(s);
  });
  [...CATS,...Object.keys(cats).filter(c=>!CATS.includes(c))].forEach(c=>{
    if(!cats[c])return;
    const label=document.createElement('div');
    label.className='cat';
    label.textContent=c+'s';
    list.appendChild(label);
    cats[c].forEach(s=>{
      const div=document.createElement('div');
      div.className='si';
      div.id='si-'+s.slug;
      div.innerHTML=`<div class="si-icon" style="background:rgba(201,168,76,.15);">${ICONS[s.category]||'📖'}</div><div class="si-text"><span class="si-ar">${s.name_arabic||''}</span><span class="si-en">${s.name_english}</span></div>`;
      div.addEventListener('click',()=>{
        openStory(s);
        if(window.innerWidth<600){toggleSB();}
      });
      list.appendChild(div);
    });
  });
}

async function openStory(story){
  // Highlight
  document.querySelectorAll('#sb-list .si').forEach(e=>e.classList.remove('on'));
  const el=document.getElementById('si-'+story.slug);
  if(el){el.classList.add('on');el.scrollIntoView({block:'nearest'});}
  // Show browse area

      <div class="v-en">${v.english||''}</div>
    </div>`).join(''):
    suras.map(s=>`<a href="index.html?sura=${s}&from=stories" style="display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:4px 10px;margin:3px;font-size:12px;color:var(--text);text-decoration:none;">📖 ${s}. ${SNAMES[s]||'Surah '+s}</a>`).join('');

  const srcHTML=sources.length?sources.map(s=>`
    <div class="src-card">
      <div class="src-hdr" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.arr').textContent=this.nextElementSibling.classList.contains('open')?'▲':'▼';">
        <span class="trad ${tradClass(s.tradition)}">${s.tradition}</span>

        <span class="arr" style="color:var(--dim);font-size:16px;flex-shrink:0;">▼</span>
      </div>
      <div class="src-body">

        <div class="cg">
          <div class="cb cs"><div class="cl">✓ Similarities</div><div class="ct">${s.similarities||'—'}</div></div>
          <div class="cb cd"><div class="cl">✕ Differences</div><div class="ct">${s.differences||'—'}</div></div>
        </div>
        <div class="cb cu" style="margin-top:8px;"><div class="cl">★ Unique to Quran</div><div class="ct">${s.unique_quran||'—'}</div></div>
        ${s.url?`<div style="margin-top:8px;"><a href="${s.url}" target="_blank" class="src-link">📎 Read source →</a></div>`:''}
      </div>
    </div>`).join(''):'<p style="color:var(--dim);font-size:13px;">No comparative sources yet.</p>';

  main.innerHTML=`
    <div class="s-hdr">
      <div class="s-ar">${story.name_arabic||''}</div>
      <div class="s-en">${story.name_english}</div>
      ${story.name_tigrinya?`<div class="s-ti">${story.name_tigrinya}</div>`:''}
      <div class="s-meta">
        <span class="bdg bdg-g">${ICONS[story.category]||'📖'} ${story.category}</span>
        <span class="bdg bdg-gr">📖 ${story.total_mentions} mentions</span>
        <span class="bdg bdg-b">${suras.length} Surahs</span>
        <button class="read-btn" onclick="genAI()">✨ AI Analysis</button>
      </div>
      <p class="s-sum">${story.summary||''}</p>
    </div>
    <div class="sec">
      <div class="sec-t">📖 Key Quranic Verses</div>
      ${vHTML}
    </div>
    <div class="sec">
      <div class="sec-t">📚 Comparative Sources</div>
      ${srcHTML}
    </div>
    <div class="ai-box">
      <div class="sec-t" style="border:none;margin:0 0 10px;">🤖 AI Deep Analysis</div>
      <div id="ai-out" class="ai-out"></div>
      <button class="ai-btn" id="ai-btn" onclick="genAI()">✨ Generate Scholarly Analysis</button>
    </div>
    <div class="sec" id="fiqh-sec" style="display:none;">
      <div class="sec-t">⚖️ Related Fiqh Rulings</div>
      <div id="fiqh-list"></div>
    </div>
  `;
  window._curStory=story;
  loadStoryFiqh(story);
}

async function loadStoryFiqh(story) {
  // Extract keywords from story name + category for madhhab search
  const keywords = [story.name_english, story.category].filter(Boolean).join(' ');
  const kwMap = {
    'prayer':'Prayer and Worship','salah':'Prayer and Worship','moses':'Apostasy',
    'marriage':'Marriage and Family Law','nikah':'Marriage and Family Law',
    'divorce':'Divorce and Separation','inherit':'Inheritance and Wills',
    'woman':'Women','mary':'Women: Worship','war':'Jihad and Warfare','jihad':'Jihad and Warfare',
    'slave':'Slavery','joseph':'Criminal Law and Hudud','david':'State and Politics',
    'solomon':'State and Politics','jesus':'Christians and Jews','isa':'Christians and Jews',
    'noah':'Eschatology','adam':'Theology of God','iblis':'Theology of God','satan':'Theology of God',
    'lut':'LGBTQ','lot':'LGBTQ','food':'Food and Drink','usury':'Banking and Riba',
    'riba':'Banking and Riba','punishment':'Hudud Punishments','theft':'Criminal Law and Hudud',
    'zina':'Hudud Punishments','adultery':'Hudud Punishments','prophet':'Blasphemy: Insulting the Prophet',
    'pilgrimage':'Prayer and Worship','hajj':'Prayer and Worship','fasting':'Prayer and Worship',
    'sufi':'Sufism and Mysticism','mystic':'Sufism and Mysticism',
    'creation':'Theology of God','judgment':'Eschatology and the End Times'
  };
  const SB_URL2 = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
  const SB_KEY2 = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
  const H2 = {'apikey':SB_KEY2,'Authorization':'Bearer '+SB_KEY2};

  try {
    const ls = keywords.toLowerCase();
    let topics = [];

    // Try direct keyword search first
    const enc = encodeURIComponent(story.name_english.split(' ').slice(0,2).join(' '));
    const r1 = await fetch(`${SB_URL2}/rest/v1/madhhab_topics?select=id,topic,category&or=(topic.ilike.*${enc}*,brief_description.ilike.*${enc}*)&limit=4`, {headers:H2});
    if (r1.ok) topics = await r1.json();

    // Fallback: category match
    if (!topics.length) {
      for (const kw in kwMap) {
        if (ls.includes(kw)) {
          const cat = encodeURIComponent(kwMap[kw]);
          const r2 = await fetch(`${SB_URL2}/rest/v1/madhhab_topics?select=id,topic,category&category=ilike.*${cat}*&limit=4`, {headers:H2});
          if (r2.ok) { topics = await r2.json(); if (topics.length) break; }
        }
      }
    }

    const sec = document.getElementById('fiqh-sec');
    const list = document.getElementById('fiqh-list');
    if (!sec || !list) return;

    if (!topics.length) return; // silently hide if nothing found

    list.innerHTML = topics.map(t => `
      <div class="fiqh-card" onclick="location.href='madhhab.html?topic=${encodeURIComponent(t.id)}&from=stories'">
        <div class="fiqh-card-title">⚖️ ${t.topic}</div>
        <div class="fiqh-card-meta">${t.category||''} · Tap to read full ruling →</div>
      </div>`).join('');
    sec.style.display = 'block';
  } catch(e) {} // silent fail
}

function qs(q){document.getElementById('s-inp').value=q;doSearch();}

function switchTab(tab,el){
  document.querySelectorAll('.s-tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  if(tab==='browse'){
    document.getElementById('s-content').style.display='none';
    document.getElementById('browse').style.display='block';
    document.getElementById('s-res').style.display='none';
  } else {
    document.getElementById('s-content').style.display='block';
    document.getElementById('browse').style.display='none';
  }
}

async function doSearch(){
  const q=document.getElementById('s-inp').value.trim();
  if(!q)return;
  document.getElementById('s-res').style.display='block';
  document.getElementById('browse').style.display='none';
  document.querySelectorAll('.s-tab').forEach((t,i)=>t.classList.toggle('on',i===0));
  const content=document.getElementById('s-content');
  content.style.display='block';
  content.innerHTML='<div class="loading"><div class="spin"></div></div>';
  const enc=encodeURIComponent(q);
  const [stSrc,hdSrc,verses]=await Promise.all([
    sb('story_sources','or=(summary.ilike.*'+enc+'*,similarities.ilike.*'+enc+'*,differences.ilike.*'+enc+'*,source_name.ilike.*'+enc+'*)&select=*,quranic_stories(name_english,slug)&limit=15'),
    sb('hadith_comparative','or=(topic.ilike.*'+enc+'*,summary.ilike.*'+enc+'*,hadith_text.ilike.*'+enc+'*)&select=*&limit=10'),
    sb('ayas','or=(english.ilike.*'+enc+'*,arabic.ilike.*'+enc+'*)&select=sura_id,aya_number,arabic,english&limit=5')
  ]);
  // Also check story names
  const matchedStories=allStories.filter(s=>s.name_english.toLowerCase().includes(q.toLowerCase())||(s.summary||'').toLowerCase().includes(q.toLowerCase()));
  let html='';
  if(matchedStories.length){
    html+=`<div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:0 0 8px;">Related Stories</div>`;
    matchedStories.forEach(s=>{
      html+=`<div class="sr-card" onclick="openStory(allStories.find(x=>x.slug==='${s.slug}'));document.getElementById('s-res').style.display='none';document.getElementById('browse').style.display='block';" style="cursor:pointer;">
        <div class="sr-hdr"><span style="font-size:20px;">${ICONS[s.category]||'📖'}</span><div><div class="sr-title">${s.name_arabic||''} — ${s.name_english}</div><div class="sr-meta">${s.total_mentions} mentions · Tap to open</div></div></div>
        <div class="sr-body"><p style="font-size:12px;color:var(--dim);line-height:1.7;">${(s.summary||'').slice(0,200)}...</p></div></div>`;
    });
  }
  if(stSrc.length){
    html+=`<div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:12px 0 8px;">Source Comparisons</div>`;
    stSrc.forEach(s=>{
      const story=s.quranic_stories||{};
      html+=`<div class="src-card"><div class="src-hdr" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.arr').textContent=this.nextElementSibling.classList.contains('open')?'▲':'▼';"><span class="trad ${tradClass(s.tradition)}">${s.tradition}</span><div class="src-info"><div class="src-name">${s.source_name}</div><div class="src-ref">${story.name_english?'Story: '+story.name_english:''}</div></div><span class="arr" style="color:var(--dim);">▼</span></div><div class="src-body"><p class="src-sum">${s.summary||''}</p><div class="cg"><div class="cb cs"><div class="cl">✓ Similarities</div><div class="ct">${s.similarities||'—'}</div></div><div class="cb cd"><div class="cl">✕ Differences</div><div class="ct">${s.differences||'—'}</div></div></div><div class="cb cu" style="margin-top:8px;"><div class="cl">★ Unique to Quran</div><div class="ct">${s.unique_quran||'—'}</div></div>${s.url?`<div style="margin-top:8px;"><a href="${s.url}" target="_blank" class="src-link">📎 Read source →</a></div>`:''}</div></div>`;
    });
  }
  if(hdSrc.length){
    html+=`<div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:12px 0 8px;">Hadith Practices</div>`;
    hdSrc.forEach(s=>{
      html+=`<div class="src-card"><div class="src-hdr" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.arr').textContent=this.nextElementSibling.classList.contains('open')?'▲':'▼';"><span class="trad ${tradClass(s.tradition)}">${s.tradition}</span><div class="src-info"><div class="src-name">${s.topic}</div><div class="src-ref">${s.source_name}</div></div><span class="arr" style="color:var(--dim);">▼</span></div><div class="src-body"><div style="background:rgba(201,168,76,.08);border-left:3px solid var(--gold);border-radius:7px;padding:8px 11px;margin-bottom:8px;font-size:12px;">${s.hadith_text||''}</div><p class="src-sum">${s.summary||''}</p><div class="cg"><div class="cb cs"><div class="cl">✓ Similarities</div><div class="ct">${s.similarities||'—'}</div></div><div class="cb cd"><div class="cl">✕ Differences</div><div class="ct">${s.differences||'—'}</div></div></div><div class="cb cu" style="margin-top:8px;"><div class="cl">★ Unique to Islam</div><div class="ct">${s.unique_islam||'—'}</div></div>${s.url?`<div style="margin-top:8px;"><a href="${s.url}" target="_blank" class="src-link">📎 Read source →</a></div>`:''}</div></div>`;
    });
  }
  if(verses.length){
    html+=`<div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:12px 0 8px;">Quranic Verses</div>`;
    verses.forEach(v=>{
      html+=`<div class="v-card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><span style="color:var(--gold);font-weight:700;font-size:12px;">📖 ${v.sura_id}:${v.aya_number}</span><a href="index.html?sura=${v.sura_id}&aya=${v.aya_number}&from=stories" style="margin-left:auto;font-size:11px;color:var(--gold);text-decoration:none;">Open →</a></div><div class="v-ar">${v.arabic||''}</div><div class="v-en">${v.english||''}</div></div>`;
    });
  }
  if(!html){
    // AI fallback
    content.innerHTML='<div class="loading"><div class="spin"></div><p style="margin-top:12px;color:var(--dim);">Generating AI comparison for "'+q+'"...</p></div>';
    try{
      const res=await fetch('https://qurangeez-quran-scholar-api.hf.space/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:`Find where "${q}" appears in Quran (cite surah:verse), Torah/Bible (cite book chapter:verse), Talmud (cite tractate page), and other sources. For each give: reference, 1-2 sentence summary, similarity with Quran, difference from Quran. Return only JSON array: [{"tradition":"...","source_name":"...","reference":"...","summary":"...","similarities":"...","differences":"...","unique_quran":"...","url":"..."}]`}]})});
      const d=await res.json();
      const txt=(d.content?.[0]?.text||'[]').replace(/\`\`\`json|\`\`\`/g,'').trim();
      let srcs=[];
      try{srcs=JSON.parse(txt);}catch(e){}
      if(srcs.length){
        html=`<div style="font-size:11px;color:var(--dim);padding:0 0 10px;">🤖 AI analysis for "<strong style="color:var(--gold);">${q}</strong>"</div>`;
        srcs.forEach(s=>{html+=`<div class="src-card"><div class="src-hdr" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.arr').textContent=this.nextElementSibling.classList.contains('open')?'▲':'▼';"><span class="trad ${tradClass(s.tradition)}">${s.tradition||'Source'}</span><div class="src-info"><div class="src-name">${s.source_name||''} ${s.reference?'· '+s.reference:''}</div></div><span class="arr" style="color:var(--dim);">▼</span></div><div class="src-body"><p class="src-sum">${s.summary||''}</p><div class="cg"><div class="cb cs"><div class="cl">✓ Similarities</div><div class="ct">${s.similarities||'—'}</div></div><div class="cb cd"><div class="cl">✕ Differences</div><div class="ct">${s.differences||'—'}</div></div></div><div class="cb cu" style="margin-top:8px;"><div class="cl">★ Unique to Quran</div><div class="ct">${s.unique_quran||'—'}</div></div>${s.url?`<div style="margin-top:8px;"><a href="${s.url}" target="_blank" class="src-link">📎 Read source →</a></div>`:''}</div></div>`;});
        content.innerHTML=html;return;
      }
    }catch(e){}
    content.innerHTML=`<p style="padding:30px;text-align:center;color:var(--dim);">No results found for "<strong>${q}</strong>". Try a different term.</p>`;
    return;
  }
  content.innerHTML=html;
}

async function genAI(){
  const story=window._curStory;
  if(!story)return;
  const btn=document.getElementById('ai-btn');
  const out=document.getElementById('ai-out');
  if(!btn||!out)return;
  btn.textContent='⏳ Analyzing...';btn.disabled=true;out.style.display='block';out.textContent='Generating...';
  try{
    const res=await fetch('https://qurangeez-quran-scholar-api.hf.space/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,messages:[{role:'user',content:`Write a scholarly comparative analysis of ${story.name_english} in the Quran vs other traditions. Include: 1) Quranic account key verses, 2) Similarities with other traditions, 3) Key differences, 4) Unique Quranic elements, 5) Scholarly significance. Under 500 words.`}]})});
    const d=await res.json();
    out.textContent=d.content?.[0]?.text||'Analysis unavailable.';
  }catch(e){out.textContent='Error. Please try again.';}
  btn.textContent='🔄 Regenerate';btn.disabled=false;
}

.msn{font-size:11px;font-weight:700;color:#B8902A;margin-bottom:3px;text-transform:uppercase;}
.mst{font-size:13px;color:#333;line-height:1.6;}
.mml{text-align:center;padding:40px;color:#aaa;font-size:14px;}
</style>
<div id="madhhab-panel">
  <div id="mph">
    <span style="font-size:20px">⚖️</span>
    <h2>Madhhab Scholar</h2>
    <button onclick="closeMadhhabPanel()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#999">✕</button>
    <a href="madhhab.html" style="background:#B8902A;color:#fff;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:700;text-decoration:none">Full Page ↗</a>
  </div>
  <div id="mpsb"><input id="mp-search" placeholder="🔍 Search topics..." oninput="searchMP(this.value)"></div>
  <div id="mpcb"><div class="mcc active" onclick="filterMP('all',this)">All</div></div>
  <div id="mpb"><div class="mml">Tap ⚖️ to open Madhhab panel</div></div>
</div>
<script>
(function() {
  var _t=[], _r={}, _loaded=false, _cat='all', _q='';
  var SB='https://ylosytbxpzxzwfzjpaej.supabase.co', AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  window.openMadhhabPanel = function(tid) {
    document.getElementById('madhhab-panel').classList.add('open');
    document.body.style.overflow = 'hidden';
    if (!_loaded) { _load().then(function(){ if(tid) _scrollTo(tid); }); }
    else if (tid) { _scrollTo(tid); }
  };

  window.closeMadhhabPanel = function() {
    document.getElementById('madhhab-panel').classList.remove('open');
    document.body.style.overflow = '';
  };

  window.searchMP = function(q) { _q = q; _render(); };

  window.filterMP = function(cat, el) {
    _cat = cat;
    document.querySelectorAll('.mcc').forEach(function(c){ c.classList.remove('active'); });
    if (el) el.classList.add('active');
    _render();
  };

  window.toggleMT = function(id) {
    var body = document.getElementById('mb-'+id);
    var arr = document.getElementById('ma-'+id);
    if (!body) return;
    if (body.classList.contains('open')) {
      body.classList.remove('open'); arr.classList.remove('open'); return;
    }
    body.classList.add('open'); arr.classList.add('open');
    if (_r[id]) { body.innerHTML = _r[id]; return; }
    body.innerHTML = '<div style="color:#aaa;padding:8px;font-size:13px">Loading...</div>';
    fetch(SB+'/rest/v1/madhhab_rulings?topic_id=eq.'+id+'&select=hanafi_position,maliki_position,shafii_position,hanbali_position,jafari_position,zaydi_position,ibadi_position,salafi_position,consensus,key_disagreement,historical_consequences', {
      headers: {'apikey': AK, 'Authorization': 'Bearer '+AK}
    }).then(function(r){ return r.json(); }).then(function(rows) {
      var r = rows[0];
      if (!r) { body.innerHTML = '<div style="color:#aaa;padding:8px">No ruling found.</div>'; return; }
      var schools = [['Hanafi',r.hanafi_position],['Maliki',r.maliki_position],['Shafii',r.shafii_position],['Hanbali',r.hanbali_position],['Jafari',r.jafari_position],['Zaydi',r.zaydi_position],['Ibadi',r.ibadi_position],['Salafi',r.salafi_position]].filter(function(s){ return s[1]; });
      var html = schools.map(function(s){ return '<div class="msr"><div class="msn">'+s[0]+'</div><div class="mst">'+esc(s[1])+'</div></div>'; }).join('');
      if (r.consensus) html += '<div class="msr" style="border-left-color:#4CAF50"><div class="msn" style="color:#2E7D32">Consensus</div><div class="mst">'+esc(r.consensus)+'</div></div>';
      if (r.historical_consequences) html += '<div class="msr" style="border-left-color:#c62828"><div class="msn" style="color:#c62828">Historical Impact</div><div class="mst">'+esc(r.historical_consequences)+'</div></div>';
      html += '<a href="madhhab.html?topic='+id+'" style="display:inline-block;margin-top:8px;padding:6px 14px;background:#FDF5DE;border:1.5px solid #D4A830;border-radius:16px;font-size:12px;font-weight:700;color:#B8902A;text-decoration:none">Open Full Page ↗</a>';
      _r[id] = html; body.innerHTML = html;
    }).catch(function(e){ body.innerHTML = '<div style="color:#c62828;padding:8px">Error: '+e.message+'</div>'; });
  };

  function _load() {
    return fetch(SB+'/rest/v1/madhhab_topics?select=id,topic,category&order=category,topic&limit=2000', {
      headers: {'apikey': AK, 'Authorization': 'Bearer '+AK}
    }).then(function(r){ return r.json(); }).then(function(data) {
      _t = data; _loaded = true;
      var cats = [], seen = {};
      _t.forEach(function(t){ if (!seen[t.category]) { seen[t.category]=1; cats.push(t.category); } });
      cats.sort();
      var bar = document.getElementById('mpcb');
      cats.forEach(function(cat){
        var c = document.createElement('div'); c.className='mcc'; c.textContent=cat;
        c.onclick = function(){ filterMP(cat,c); }; bar.appendChild(c);
      });
      _render();
    }).catch(function(e){ document.getElementById('mpb').innerHTML='<div class="mml">Error: '+e.message+'</div>'; });
  }

  function _render() {
    var body = document.getElementById('mpb');
    var topics = _t.slice();
    if (_cat !== 'all') topics = topics.filter(function(t){ return t.category === _cat; });
    if (_q) { var q = _q.toLowerCase(); topics = topics.filter(function(t){ return t.topic.toLowerCase().indexOf(q) !== -1 || t.category.toLowerCase().indexOf(q) !== -1; }); }
    if (!topics.length) { body.innerHTML = '<div class="mml">No topics found.</div>'; return; }
    var show = topics.slice(0,100);
    body.innerHTML = show.map(function(t){
      return '<div class="mtc" id="mt-'+t.id+'"><div class="mth" onclick="toggleMT('+t.id+')"><div><div class="mtt">'+esc(t.topic)+'</div><div class="mtcat">'+esc(t.category)+'</div></div><span class="mta" id="ma-'+t.id+'">▼</span></div><div class="mtbd" id="mb-'+t.id+'"></div></div>';
    }).join('') + (topics.length > 100 ? '<div class="mml">Showing 100 of '+topics.length+'. Search to narrow.</div>' : '');
  }

  function _scrollTo(id) {
    setTimeout(function(){
      var el = document.getElementById('mt-'+id);
      if (el) { el.scrollIntoView({behavior:'smooth'}); toggleMT(id); }
    }, 300);
  }
})();
</script>
</body>
</html>
