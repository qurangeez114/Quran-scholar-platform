
<!DOCTYPE html>


<script>
// Open Madhhab page with optional search query or topic
function openMadhhab(query, topicId) {
  var url = 'madhhab.html';
  var params = [];
  if (topicId) params.push('topic=' + encodeURIComponent(topicId));
  if (query) params.push('q=' + encodeURIComponent(query));
  if (params.length) url += '?' + params.join('&');
  window.location.href = url;
}
// Allow calling from verse context chips
window.openMadhhabForVerse = function(sura, aya, topic) {
  openMadhhab(topic || '', null);
};
</script>

</body>
</html>
