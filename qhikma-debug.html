<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity History Debug Console</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Lato, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { margin-top: 0; color: #b8860b; }
    h2 { font-size: 16px; margin-top: 20px; padding: 10px; background: #fafafa; border-left: 4px solid #b8860b; }
    .status {
      padding: 12px;
      border-radius: 6px;
      margin: 10px 0;
      font-weight: 500;
    }
    .status.ok { background: #e8f5e9; color: #2e7d32; }
    .status.error { background: #ffebee; color: #c62828; }
    .code-block {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      overflow-x: auto;
      margin: 10px 0;
      max-height: 400px;
      overflow-y: auto;
    }
    button {
      background: #b8860b;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin: 8px 4px 8px 0;
    }
    button:hover { opacity: 0.9; }
    button.danger { background: #d32f2f; }
    .input-group {
      display: flex;
      gap: 8px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      flex: 1;
      min-width: 200px;
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .data-row:last-child { border-bottom: none; }
    .data-label { font-weight: 500; }
    .data-value { font-family: monospace; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🕐 Activity History Debug Console</h1>
    <p>Check localStorage status and manually test history recording.</p>

    <h2>1. localStorage Status</h2>
    <div id="status"></div>
    <div id="ls-info"></div>

    <h2>2. Current Data</h2>
    <div id="data-summary"></div>
    <h3>History Entries:</h3>
    <div id="history-list" class="code-block"></div>
    <h3>Research Entries:</h3>
    <div id="research-list" class="code-block"></div>
    <h3>Presentation Entries:</h3>
    <div id="presentation-list" class="code-block"></div>

    <h2>3. Manual Test</h2>
    <p>Add a test entry to history:</p>
    <div class="input-group">
      <input id="test-title" type="text" placeholder="Title (e.g., Test Page)" value="Test Page">
      <input id="test-url" type="text" placeholder="URL" value="https://quranhikma.com/test">
      <button onclick="manualAddTest()">Add to History</button>
    </div>

    <h2>4. Actions</h2>
    <button onclick="refreshDebug()">🔄 Refresh Display</button>
    <button onclick="clearHistory()">Clear History</button>
    <button onclick="clearAll()" class="danger">⚠️ Clear ALL Data</button>
    <button onclick="exportData()">📥 Export as JSON</button>

    <h2>5. Console Output</h2>
    <div id="console" class="code-block"></div>
  </div>

  <script>
    const KEYS = {
      history: 'qhikma_activity_history',
      research: 'qhikma_research_saved',
      presentations: 'qhikma_presentations'
    };

    function log(msg) {
      console.log(msg);
      const el = document.getElementById('console');
      el.textContent += msg + '\n';
      el.scrollTop = el.scrollHeight;
    }

    function checkLocalStorage() {
      try {
        localStorage.setItem('test', '1');
        localStorage.removeItem('test');
        return true;
      } catch (e) {
        return false;
      }
    }

    function loadData(key) {
      try {
        return JSON.parse(localStorage.getItem(key) || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveData(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify(data));
        return true;
      } catch (e) {
        log('❌ Save failed: ' + e.message);
        return false;
      }
    }

    function refreshDebug() {
      // Status
      const lsOk = checkLocalStorage();
      const statusEl = document.getElementById('status');
      if (lsOk) {
        statusEl.innerHTML = '<div class="status ok">✅ localStorage available</div>';
      } else {
        statusEl.innerHTML = '<div class="status error">❌ localStorage NOT available</div>';
      }

      // Info
      const lsInfo = document.getElementById('ls-info');
      lsInfo.innerHTML = `
        <div class="data-row">
          <span class="data-label">localStorage size:</span>
          <span class="data-value">${new Blob([JSON.stringify(localStorage)]).size} bytes</span>
        </div>
        <div class="data-row">
          <span class="data-label">Total keys:</span>
          <span class="data-value">${localStorage.length}</span>
        </div>
      `;

      // Load data
      const history = loadData(KEYS.history);
      const research = loadData(KEYS.research);
      const presentations = loadData(KEYS.presentations);

      // Summary
      const summary = document.getElementById('data-summary');
      summary.innerHTML = `
        <div class="data-row">
          <span class="data-label">History entries:</span>
          <span class="data-value">${history.length}</span>
        </div>
        <div class="data-row">
          <span class="data-label">Research entries:</span>
          <span class="data-value">${research.length}</span>
        </div>
        <div class="data-row">
          <span class="data-label">Presentation entries:</span>
          <span class="data-value">${presentations.length}</span>
        </div>
      `;

      // Lists
      document.getElementById('history-list').textContent = JSON.stringify(history, null, 2);
      document.getElementById('research-list').textContent = JSON.stringify(research, null, 2);
      document.getElementById('presentation-list').textContent = JSON.stringify(presentations, null, 2);

      log('✅ Refreshed display');
    }

    function manualAddTest() {
      try {
        const title = document.getElementById('test-title').value || 'Test Page';
        const url = document.getElementById('test-url').value || 'https://quranhikma.com/test';
        
        const history = loadData(KEYS.history);
        history.unshift({
          title: title,
          url: url,
          icon: '📖',
          timestamp: Date.now()
        });
        
        if (saveData(KEYS.history, history)) {
          log('✅ Added test entry: ' + title);
          refreshDebug();
        } else {
          log('❌ Failed to save test entry');
        }
      } catch (e) {
        log('❌ Error: ' + e.message);
      }
    }

    function clearHistory() {
      if (confirm('Clear all history entries?')) {
        try {
          saveData(KEYS.history, []);
          log('✅ Cleared history');
          refreshDebug();
        } catch (e) {
          log('❌ Error: ' + e.message);
        }
      }
    }

    function clearAll() {
      if (confirm('⚠️ This will DELETE ALL Activity History data. Continue?')) {
        try {
          localStorage.removeItem(KEYS.history);
          localStorage.removeItem(KEYS.research);
          localStorage.removeItem(KEYS.presentations);
          log('✅ Cleared all data');
          refreshDebug();
        } catch (e) {
          log('❌ Error: ' + e.message);
        }
      }
    }

    function exportData() {
      try {
        const data = {
          history: loadData(KEYS.history),
          research: loadData(KEYS.research),
          presentations: loadData(KEYS.presentations),
          exportedAt: new Date().toISOString()
        };
        
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `qhikma-activity-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        
        log('✅ Exported data');
      } catch (e) {
        log('❌ Export error: ' + e.message);
      }
    }

    // Initialize
    log('🔧 Activity History Debug Console loaded');
    refreshDebug();
  </script>
<script src="/quran-verse-audio.js" defer></script>
</body>
</html>
