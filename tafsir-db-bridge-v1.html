<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qur’an Hikma — Tafsir DB Bridge</title><style>body{margin:0;background:#f3efe6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1d1b18}.wrap{max-width:780px;margin:auto;background:#fff;min-height:100vh}.top{position:sticky;top:0;background:#fffdf8;border-bottom:1px solid #e5dcc6;padding:12px 16px;font-weight:800}.sec{padding:16px}.ref{font-size:12px;font-weight:800;color:#9a7420}.arabic{font-size:31px;line-height:1.9;direction:rtl;text-align:right;margin:12px 0}.card{border:1px solid #e2d8c2;border-radius:14px;padding:14px;margin:10px 0}.status{background:#fff9e9}.ok{color:#237a3b}.err{color:#a52a2a}.scholar{border:1px solid #e1d8c6;border-radius:12px;margin:10px 0;overflow:hidden}.scholar summary{padding:13px;font-weight:800;cursor:pointer}.body{padding:13px;border-top:1px solid #e8e0d2}.lang{font-size:11px;font-weight:800;color:#8b6d23;margin:10px 0 5px}.content{white-space:pre-wrap;line-height:1.65;font-size:14px}.ar{direction:rtl;text-align:right;font-size:18px}.pill{display:inline-block;background:#fff4d6;border:1px solid #e7cf8f;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;margin:3px}.small{font-size:12px;color:#6c6558;line-height:1.5}.btn{border:1px solid #cdbb87;border-radius:9px;padding:8px 10px;background:#9b771f;color:white;font-weight:800;cursor:pointer}</style></head><body><div class="wrap"><div class="top">Qur’an Hikma · Database Tafsir Bridge</div><section class="sec"><div class="ref">SURAH MARYAM · 19:28</div><div class="arabic">يَـٰٓأُخْتَ هَـٰرُونَ مَا كَانَ أَبُوكِ ٱمْرَأَ سَوْءٍۢ وَمَا كَانَتْ أُمُّكِ بَغِيًّۭا</div><div class="card status"><b>Live database test</b><div id="status" class="small">Connecting to tafsir_entries…</div><div id="meta"></div><button class="btn" onclick="loadTafsir()">Reload</button></div><div id="results"></div></section></div><script>
const SUPABASE_URL='https://ylosytbxpzxzwfzjpaej.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const scholarNames={tabari:'al-Ṭabarī',ibn_kathir:'Ibn Kathīr',qurtubi:'al-Qurṭubī',jalalayn:'al-Jalālayn',saadi:'al-Saʿdī',ibn_abbas:'Ibn ʿAbbās / Tanwīr al-Miqbās'};
function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
async function loadTafsir(){const st=document.getElementById('status'),meta=document.getElementById('meta'),out=document.getElementById('results');st.className='small';st.textContent='Connecting to tafsir_entries…';meta.innerHTML='';out.innerHTML='';try{const url=new URL(SUPABASE_URL+'/rest/v1/tafsir_entries');url.searchParams.set('sura','eq.19');url.searchParams.set('aya','eq.28');url.searchParams.set('select','scholar_key,language,content');url.searchParams.set('order','scholar_key.asc,language.asc');const r=await fetch(url,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY}});if(!r.ok)throw new Error('HTTP '+r.status+' — '+await r.text());const rows=await r.json();st.className='small ok';st.textContent='Connected successfully. These rows are coming from Supabase, not hard-coded preview text.';const grouped={};for(const row of rows){const k=row.scholar_key||'unknown';(grouped[k]??=[]).push(row)}const keys=Object.keys(grouped);meta.innerHTML='<div class="small" style="margin-top:8px">'+rows.length+' database row(s) · '+keys.length+' scholar key(s)</div>'+keys.map(k=>'<span class="pill">'+esc(scholarNames[k]||k)+'</span>').join('');if(!rows.length){out.innerHTML='<div class="card">No tafsir_entries rows were returned for 19:28.</div>';return}out.innerHTML=keys.map((k,i)=>{const rs=grouped[k];return '<details class="scholar" '+(i===0?'open':'')+'><summary>'+esc(scholarNames[k]||k)+' <span class="small">('+rs.length+' row'+(rs.length===1?'':'s')+')</span></summary><div class="body">'+rs.map(x=>'<div class="lang">'+esc((x.language||'').toUpperCase())+'</div><div class="content '+(x.language==='ar'?'ar':'')+'">'+esc(x.content||'')+'</div>').join('')+'</div></details>'}).join('')}catch(e){st.className='small err';st.textContent='Database bridge failed: '+e.message;out.innerHTML='<div class="card"><b>Nothing on the live site was changed.</b><div class="small">This test page is isolated so a schema or permission problem cannot break the Qur’an reader.</div></div>'}}
loadTafsir();
</script></body></html>
