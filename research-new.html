<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research – Quran Hikma (draft)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F0;--card:#fff;--ink:#2B2620;--ink2:#6B6358;--line:#E8E0D0;--gold:#B8902A;--goldbg:#FDF8EE;--goldline:#E8C97B;--teal:#0F766E;--tealbg:#CCFBF1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'EB Garamond',Georgia,serif;font-size:17px;line-height:1.5}
a{color:var(--teal)}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff;font-size:15px}
.top a{text-decoration:none;color:var(--ink2)}
.hero{max-width:820px;margin:0 auto;padding:36px 16px 8px;text-align:center}
.hero h1{font-size:34px;margin:0 0 6px;font-weight:600}
.hero p{margin:0 0 20px;color:var(--ink2)}
.sbox{display:flex;gap:8px;max-width:680px;margin:0 auto}
.sbox input{flex:1;padding:14px 16px;font:inherit;font-size:19px;border:2px solid var(--goldline);border-radius:10px;background:#fff;outline:none}
.sbox input:focus{border-color:var(--gold)}
.sbox button{padding:0 24px;font:inherit;font-size:18px;font-weight:600;background:var(--gold);color:#fff;border:0;border-radius:10px;cursor:pointer}
.scope{max-width:680px;margin:12px auto 0;font-size:14.5px;color:var(--ink2)}
.scope b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 0}
.chip{padding:6px 14px;border:1px solid var(--goldline);background:var(--goldbg);border-radius:999px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink)}
.chip:hover{background:#F7EBCB}
main{max-width:820px;margin:0 auto;padding:8px 16px 60px}
.variants{font-size:14.5px;color:var(--ink2);margin:18px 0 8px}
.variants span{background:var(--tealbg);color:#134E4A;border-radius:4px;padding:1px 7px;margin:0 3px;white-space:nowrap}
.tabs{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:6px;z-index:5;border-bottom:1px solid var(--line)}
.tab{padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font:inherit;font-size:14.5px}
.tab b{color:var(--gold)}
.tab.off{opacity:.45}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab.on b{color:#F2D98B}
section.src{margin-top:26px}
section.src h2{font-size:21px;margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
section.src h2 small{font-size:14px;color:var(--ink2);font-weight:400}
.what{font-size:14px;color:var(--ink2);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.card .meta{font-size:13.5px;color:var(--ink2);margin-bottom:3px}
.card .ttl{font-weight:600}
.card .txt{font-size:16px}
mark{background:#FDE68A;border-radius:2px;padding:0 1px}
.more{font-size:15px;margin:6px 0 0}
.none{color:var(--ink2);font-style:italic;font-size:15px}
.note{margin-top:30px;padding:14px;border:1px dashed var(--goldline);border-radius:10px;background:var(--goldbg);font-size:15px;color:var(--ink2)}
.draft{background:#FEF3C7;border-bottom:1px solid #F59E0B;text-align:center;padding:6px;font-size:14px}
.empty{padding:30px 0;text-align:center;color:var(--ink2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="draft">Draft of the new research page – the current page is still at <a href="research.html">research.html</a></div>
<div class="top"><a href="/">← Quran Hikma</a><a href="research.html">Classic research page</a></div>

<div class="hero">
  <h1>Research</h1>
  <p>Ask about any word, person, event or subject. One search covers every source on the site.</p>
  <form class="sbox" onsubmit="go(event)">
    <input id="q" type="search" placeholder="e.g. jizya, apostasy, Khaybar, inheritance, جزية" autocomplete="off" autofocus>
    <button type="submit">Search</button>
  </form>
  <div class="scope" id="scope">Loading what is searched…</div>
  <div class="chips" id="chips"></div>
</div>

<main>
  <div id="out"></div>
</main>

<script>
const SB='https://ylosytbxpzxzwfzjpaej.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const EXAMPLES=['jizya','apostasy','Khaybar','inheritance','slavery','mut\u2019ah','جزية'];

// Each source: label, a plain sentence about what is in it, and where "see all" leads.
const SRC={
 quran:{what:'The Quran itself – Arabic text, English and transliteration.',link:r=>`/?sura=${r.sura}&aya=${r.aya}`,ref:r=>`${r.sura}:${r.aya}`},
 hadith:{what:'Reports of the Prophet in the major Sunni and Shia collections, with their grades. Sahih-graded reports are shown first.',link:r=>`research.html?q=${encodeURIComponent(CUR)}&source=hadith`,ref:r=>`${r.collection} #${r.number}${r.grade?' · '+r.grade:''}${r.tradition?' · '+r.tradition:''}`},
 tafsir:{what:'Classical and modern commentary on the verses.',link:r=>`/?sura=${r.sura}&aya=${r.aya}`,ref:r=>`${r.title||'Tafsir'} on ${r.sura}:${r.aya}${r.tradition?' · '+r.tradition:''}`},
 madhhab:{what:'How the schools of law (Hanafi, Maliki, Shafi\u02bfi, Hanbali, Ja\u02bffari and others) treat the subject.',link:r=>`madhhab.html`,ref:r=>r.tradition||''},
 sira:{what:'Events from the life of the Prophet.',link:r=>`sira.html`,ref:r=>r.year?`${r.year} CE`:''},
 campaigns:{what:'Battles and expeditions, with their verses, hadith and sources.',link:r=>`stories.html`,ref:r=>r.year?`${r.year} CE`:''},
 themes:{what:'Thematic studies that group verses and hadith by subject.',link:r=>`themes.html`,ref:r=>r.tradition||''},
 propositions:{what:'Individual claims extracted from hadith and commentary, so they can be compared one by one.',link:r=>`research.html?q=${encodeURIComponent(CUR)}`,ref:r=>'Claim'},
 tensions:{what:'Places where texts appear to pull in different directions, and how later scholars read them.',link:r=>`research.html?q=${encodeURIComponent(CUR)}`,ref:r=>r.tradition||''},
 stories:{what:'Stories told in the Quran, such as the prophets.',link:r=>`stories.html`,ref:r=>''},
 topics:{what:'Topic analyses already written on the site.',link:r=>`research.html?q=${encodeURIComponent(CUR)}`,ref:r=>''}
};
const ORDER=Object.keys(SRC);
const LABEL={quran:'Quran verses',hadith:'Hadith',tafsir:'Tafsir (commentary)',madhhab:'Schools of law',sira:'Sira (life of the Prophet)',campaigns:'Campaigns and battles',themes:'Themes',propositions:'Extracted claims',tensions:'Textual tensions',stories:'Quranic stories',topics:'Topic analyses'};
let CUR='';

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=x=>Number(x||0).toLocaleString('en-US');

async function rpc(fn,body){
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(body)});
  if(!r.ok) throw new Error(fn+' '+r.status);
  return r.json();
}

async function loadScope(){
  try{
    const s=await rpc('site_sources',{});
    $('scope').innerHTML='<b>What is searched:</b> '+[
      `${n(s.verses)} Quran verses`,
      `${n(s.hadith)} hadith from ${n(s.collections)} collections`,
      `${n(s.tafsir)} commentary entries`,
      `${n(s.madhhab)} legal topics across the schools`,
      `${n(s.sira)} Sira events`,
      `${n(s.campaigns)} campaigns`,
      `${n(s.themes)} themes`,
      `${n(s.propositions)} extracted claims`,
      `${n(s.tensions)} textual tensions`,
      `${n(s.stories)} Quranic stories`
    ].join(' · ')+'.';
  }catch(e){ $('scope').textContent='Searches the Quran, hadith, commentary, the schools of law, the Sira, campaigns, themes and more.'; }
}

function highlight(text,vars){
  let t=esc(text||'');
  (vars||[]).filter(v=>v&&v.length>=3).sort((a,b)=>b.length-a.length).forEach(v=>{
    try{ t=t.replace(new RegExp('('+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); }catch(e){}
  });
  return t;
}

function snip(text,vars){
  text=text||''; if(text.length<=340) return text;
  const low=text.toLowerCase(); let best=-1;
  (vars||[]).filter(v=>v&&v.length>=3).forEach(v=>{const i=low.indexOf(v.toLowerCase()); if(i>=0&&(best<0||i<best)) best=i;});
  let a=best<0?0:Math.max(0,best-130);
  if(a>0){const sp=text.indexOf(' ',a); if(sp>0&&sp<a+25) a=sp+1;}
  const out=text.slice(a,a+340);
  return (a>0?'\u2026':'')+out+(a+340<text.length?'\u2026':'');
}
function card(key,r,vars){
  const cfg=SRC[key];
  const ref=cfg.ref(r);
  const ttl=r.title?`<div class="ttl">${highlight(r.title,vars)}</div>`:'';
  const href=cfg.link(r);
  return `<div class="card"><div class="meta">${esc(ref)}</div>${ttl}<div class="txt">${highlight(snip(r.text,vars),vars)}</div><div class="more"><a href="${href}">Open →</a></div></div>`;
}

function render(results,vars,q){
  const total=results.reduce((a,r)=>a+(r.count||0),0);
  let h='';
  const uniqVars=[...new Set(vars)].filter(v=>v.toLowerCase()!==q.toLowerCase());
  if(uniqVars.length) h+=`<div class="variants">Also searched as: ${uniqVars.map(v=>`<span>${esc(v)}</span>`).join(' ')}</div>`;
  h+='<div class="tabs">'+results.map(r=>`<button class="tab ${r.count?'':'off'}" onclick="jump('${r.key}')">${esc(LABEL[r.key])} <b>${r.capped?'1000+':n(r.count)}</b></button>`).join('')+'</div>';
  if(!total){
    h+=`<div class="empty">Nothing found for \u201c${esc(q)}\u201d in any source.<br>Try another spelling, an Arabic form, or a simpler word. If the subject is real and missing, that is a gap in the site\u2019s coverage, not a sign that nothing was written about it.</div>`;
  }
  results.forEach(r=>{
    h+=`<section class="src" id="src-${r.key}"><h2>${esc(LABEL[r.key])} <small>${r.count?(r.capped?'more than 1,000 matches':n(r.count)+' match'+(r.count==1?'':'es')):'no matches'}</small></h2><p class="what">${esc(SRC[r.key].what)}</p>`;
    if(r.count){
      h+=r.rows.map(x=>card(r.key,x,vars)).join('');
      if(r.count>r.rows.length) h+=`<div class="more"><a href="research.html?q=${encodeURIComponent(q)}${['hadith','tafsir'].includes(r.key)?'&source='+r.key:''}">See all ${r.capped?'1,000+':n(r.count)} in the full search →</a></div>`;
    } else h+='<div class="none">Nothing in this source for this search.</div>';
    h+='</section>';
  });
  h+=`<div class="note">Results come straight from the site\u2019s own database. Some sources, especially hadith linked to the later suras, were assembled automatically and have not yet been reviewed verse by verse; each source above says what it contains so you can judge how much weight to give it.</div>`;
  $('out').innerHTML=h;
}

function jump(k){ const e=$('src-'+k); if(e) e.scrollIntoView({behavior:'smooth',block:'start'}); }

async function search(q){
  q=q.trim(); if(!q) return;
  CUR=q;
  try{ history.replaceState(null,'','?q='+encodeURIComponent(q)); }catch(e){}
  $('out').innerHTML='<div class="empty"><span class="spin"></span>Searching every source…</div>';
  try{
    const res=await Promise.all(ORDER.map(k=>rpc('site_search_src',{src:k,q:q,lim:6}).catch(()=>({key:k,count:0,rows:[],variants:[q],failed:true}))));
    const vars=[...new Set(res.flatMap(r=>r.variants||[q]))];
    render(res,vars,q);
  }catch(e){
    $('out').innerHTML='<div class="empty">The search could not be completed. Please try again.</div>';
  }
}
function go(e){ e.preventDefault(); search($('q').value); }

$('chips').innerHTML=EXAMPLES.map(x=>`<button class="chip" type="button" onclick="$('q').value='${x.replace(/'/g,"\\'")}';search('${x.replace(/'/g,"\\'")}')">${esc(x)}</button>`).join('');
loadScope();
const p=new URLSearchParams(location.search).get('q');
if(p){ $('q').value=p; search(p); }
</script>
</body>
</html>
