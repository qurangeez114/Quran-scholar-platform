<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Madhhab Test</title></head>
<body>
<h2>Madhhab Topics Test</h2>
<div id="status">Testing...</div>
<div id="results"></div>
<script>
const SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';

async function test() {
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  try {
    status.textContent = 'Fetching...';
    const r = await fetch(SB_URL + '/rest/v1/madhhab_topics?select=id,topic,category&order=id.asc&limit=5', {
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
    });
    const data = await r.json();
    status.textContent = 'Status: ' + r.status + ' — Got ' + data.length + ' topics';
    results.innerHTML = data.map(t => '<p>' + t.topic + ' (' + t.category + ')</p>').join('');
  } catch(e) {
    status.textContent = 'ERROR: ' + e.message;
  }
}
test();
</script>
</body>
</html>
