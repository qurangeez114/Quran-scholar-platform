<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verse Cross-Reference — Quran Scholar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#FAFAF7;color:#1a1a1a;padding-bottom:70px;}
.top-bar{background:linear-gradient(135deg,#1a1a2e,#2d2d44);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;border-bottom:2px solid #E8C97B;}
.back-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600;text-decoration:none;flex-shrink:0;}
.top-title{font-size:15px;font-weight:800;color:#E8C97B;flex:1;}

.section{background:#fff;border:1px solid #E8E4DC;border-radius:12px;margin:12px;padding:16px;}
.section-title{font-size:12px;font-weight:800;color:#B8902A;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}

.verse-ref-big{font-size:20px;font-weight:800;color:#1A5276;margin-bottom:4px;}
.verse-arabic{font-size:22px;line-height:1.9;text-align:right;direction:rtl;color:#1a1a1a;margin:12px 0;}
.verse-lang-block{margin-top:10px;padding-bottom:10px;border-bottom:1px solid #F0EAE0;}
.verse-lang-label{font-size:10px;font-weight:700;letter-spacing:1px;color:#B8902A;text-transform:uppercase;margin-bottom:4px;}
.verse-lang-text{font-size:14px;line-height:1.65;color:#333;}

.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:12px;background:#EAF2FF;color:#1A5276;border:1px solid #1A527633;margin:2px 4px 2px 0;}
.badge.secondary{background:#F5F3EC;color:#6B5A3E;border-color:#6B5A3E22;}
.badge.tone{background:#FFF0F0;color:#A83240;border-color:#A8324022;}

.toolbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;}
.vt-btn{background:#FDF8EE;border:1px solid #E8C97B;border-radius:6px;width:34px;height:32px;font-size:14px;cursor:pointer;padding:0;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#B8902A;}
.vt-btn.active-toggle{background:#B8902A;color:#fff;}

.xref-card{background:#F5F9FF;border:1px solid #C9DCF0;border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.xref-title{font-size:13px;font-weight:800;color:#1A5276;margin-bottom:6px;}
.xref-role{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;color:#666;margin-bottom:3px;}
.xref-text{font-size:12.5px;color:#333;line-height:1.5;margin-bottom:4px;}
.xref-q{font-size:12px;font-style:italic;color:#6B5A3E;}

.hadith-card{background:#FFF8F0;border:1px solid #E8DDC0;border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.hadith-card b{color:#8B4513;}

.empty-note{font-size:13px;color:#999;font-style:italic;padding:8px 0;}
.loading{padding:40px;text-align:center;color:#AAA;font-style:italic;}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid #E8C97B;border-top-color:#B8902A;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}

#discuss-panel{margin-top:8px;padding:10px;background:#FAFAF7;border-radius:8px;border:1px solid #E8E4DC;}
#discuss-messages{max-height:280px;overflow-y:auto;margin-bottom:8px;}

#bottom-nav {position:fixed !important;bottom:0 !important;left:0 !important;right:0 !important;width:100% !important;height:54px !important;background:#FDFAF4 !important;border-top:1.5px solid #E8DDC0 !important;display:flex !important;flex-direction:row !important;z-index:9999 !important;box-shadow:0 -2px 8px rgba(0,0,0,0.10) !important;overflow-x:auto !important;}
.bnav-btn {flex:1 1 0 !important;display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:center !important;gap:1px !important;background:none !important;border:none !important;border-right:1px solid #F0EAE0 !important;cursor:pointer !important;padding:4px 1px !important;color:#AAA !important;font-size:7px !important;font-weight:700 !important;text-transform:uppercase !important;min-width:0 !important;overflow:hidden !important;white-space:nowrap !important;}
.bnav-btn.active{color:#B8902A !important;}
.bnav-btn:last-child{border-right:none !important;}
.bni{font-size:16px;}
</style>
</head>
<body>

<div class="top-bar">
  <a href="#" id="backBtn" class="back-btn">← Back</a>
  <div class="top-title" id="pageTitle">Verse Cross-Reference</div>
</div>

<div id="content"><div class="loading"><span class="spinner"></span>Loading...</div></div>

<nav id="bottom-nav">
  <button class="bnav-btn" onclick="location.href='index.html'"><span class="bni">📖</span><span>Quran</span></button>
  <button class="bnav-btn" onclick="location.href='research.html'"><span class="bni">🔬</span><span>Research</span></button>
  <button class="bnav-btn" onclick="location.href='themes.html'"><span class="bni">🗂️</span><span>Themes</span></button>
  <button class="bnav-btn" onclick="location.href='madhhab.html'"><span class="bni">⚖️</span><span>Madhhab</span></button>
  <button class="bnav-btn" onclick="location.href='sira.html'"><span class="bni">🕌</span><span>Sīra</span></button>
  <button class="bnav-btn" onclick="location.href='stories.html'"><span class="bni">📚</span><span>Stories</span></button>
  <button class="bnav-btn active" onclick="location.href='muhammad.html'"><span class="bni">☪️</span><span>Muhammad</span></button>
  <button class="bnav-btn" onclick="location.href='contradiction.html'"><span class="bni">⚔️</span><span>Tensions</span></button>
  <button class="bnav-btn" onclick="location.href='knowledge-graph.html'"><span class="bni">🕸️</span><span>Graph</span></button>
</nav>

<script>
const SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDR = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

const VT_LANGS = { bn: 'bengali', ms: 'malay', es: 'spanish', zh: 'chinese', sw: 'swahili', ha: 'hausa' };
const ALL_LANGS = {
  arabic:{label:'Arabic',badge:'🔤',field:'arabic'}, translit:{label:'Transliteration',badge:'Aa',field:'translit'},
  english:{label:'English',badge:'A',field:'english'}, tigrinya:{label:'Tigrinya',badge:'ት',field:'tigrinya'},
  amharic:{label:'Amharic',badge:'አ',field:'amharic'}, oromo:{label:'Oromo',badge:'O',field:'oromo'},
  somali:{label:'Somali',badge:'S',field:'somali'}, german:{label:'German',badge:'DE',field:'german'},
  urdu:{label:'Urdu',badge:'اردو',field:'urdu'}, bengali:{label:'Bengali',badge:'ব',field:'bengali'},
  malay:{label:'Malay',badge:'M',field:'malay'}, spanish:{label:'Spanish',badge:'E',field:'spanish'},
  chinese:{label:'Chinese',badge:'中',field:'chinese'}, swahili:{label:'Swahili',badge:'K',field:'swahili'},
  hausa:{label:'Hausa',badge:'H',field:'hausa'},
};
let langState = (() => {
  try { return { ...{arabic:true,english:true}, ...(JSON.parse(localStorage.getItem('muhammadLangState'))||{}) }; }
  catch { return {arabic:true,english:true}; }
})();

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function loadJSON(key, fallback){ try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; } }
function saveJSON(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

const params = new URLSearchParams(location.search);
const SURA = parseInt(params.get('sura'));
const AYA = parseInt(params.get('aya'));
const FROM = params.get('from') || 'muhammad';

document.getElementById('backBtn').href = FROM === 'tension' ? 'muhammad.html' : 'muhammad.html';
document.getElementById('pageTitle').textContent = `${SURA}:${AYA} — Cross-Reference`;

let VERSE_ROW = null;
let CATEGORIES = [];

function catName(slug){ const c = CATEGORIES.find(c=>c.slug===slug); return c ? c.name : slug; }

async function load(){
  if (!SURA || !AYA) {
    document.getElementById('content').innerHTML = '<div class="empty-note" style="padding:40px;text-align:center;">No verse specified.</div>';
    return;
  }

  const [ayaRes, mvRes, catRes, tagRes, hadithRes, tensionRes] = await Promise.all([
    fetch(`${SB_URL}/rest/v1/ayas?select=*&sura_id=eq.${SURA}&aya_number=eq.${AYA}`, {headers:HDR}),
    fetch(`${SB_URL}/rest/v1/muhammad_verses?select=*&sura=eq.${SURA}&aya=eq.${AYA}`, {headers:HDR}),
    fetch(`${SB_URL}/rest/v1/muhammad_categories?select=*`, {headers:HDR}),
    fetch(`${SB_URL}/rest/v1/muhammad_verse_tags?select=*`, {headers:HDR}),
    fetch(`${SB_URL}/rest/v1/muhammad_hadith_links?select=*&sura=eq.${SURA}&aya=eq.${AYA}`, {headers:HDR}),
    fetch(`${SB_URL}/rest/v1/muhammad_tension_pairs?select=*`, {headers:HDR}),
  ]);
  const ayaRows = await ayaRes.json();
  const mvRows = await mvRes.json();
  CATEGORIES = await catRes.json();
  const allTags = await tagRes.json();
  const hadithRows = await hadithRes.json();
  const allTensions = await tensionRes.json();

  const a = ayaRows[0] || {};
  const vtRes = await fetch(`${SB_URL}/rest/v1/verse_translations?select=lang,text&verse_key=eq.${SURA}:${AYA}&lang=in.(${Object.keys(VT_LANGS).join(',')})`, {headers:HDR});
  const vtRows = await vtRes.json();
  const vt = {};
  if (Array.isArray(vtRows)) vtRows.forEach(r => { vt[VT_LANGS[r.lang]] = r.text; });

  VERSE_ROW = mvRows[0] || { sura: SURA, aya: AYA };
  VERSE_ROW.arabic = a.arabic || ''; VERSE_ROW.translit = a.arabic_transliteration || ''; VERSE_ROW.english = a.english || '';
  VERSE_ROW.tigrinya = a.tigrinya || ''; VERSE_ROW.amharic = a.amharic || ''; VERSE_ROW.oromo = a.oromo || '';
  VERSE_ROW.somali = a.somali || ''; VERSE_ROW.german = a.german || ''; VERSE_ROW.urdu = a.urdu || '';
  Object.assign(VERSE_ROW, vt);

  const myTags = mvRows[0] ? allTags.filter(t => t.verse_id === mvRows[0].id) : [];

  // Cross-reference: which tension pairs cite this exact verse?
  const ref = `${SURA}:${AYA}`;
  const singleRe = /^(\d+):(\d+)$/;
  const rangeRe = /^(\d+):(\d+)-(\d+)$/;
  function citesThisVerse(str){
    return (str||'').split(';').map(s=>s.trim()).some(r => {
      if (r === ref) return true;
      const m = r.match(rangeRe);
      if (m && parseInt(m[1])===SURA && AYA >= parseInt(m[2]) && AYA <= parseInt(m[3])) return true;
      return false;
    });
  }
  const relatedTensions = allTensions.filter(t => citesThisVerse(t.pole_a_verses) || citesThisVerse(t.pole_b_verses))
    .map(t => ({ ...t, side: citesThisVerse(t.pole_a_verses) ? 'A' : 'B' }));

  render(myTags, hadithRows, relatedTensions);
}

function langBlocksHtml(v){
  return Object.keys(ALL_LANGS).filter(k => langState[k] && v[ALL_LANGS[k].field]).map(k => {
    const meta = ALL_LANGS[k];
    const rtl = (k === 'arabic' || k === 'urdu');
    return `<div class="verse-lang-block"><div class="verse-lang-label">${meta.badge} ${esc(meta.label)}</div>
      <div class="verse-lang-text"${rtl?' style="direction:rtl;text-align:right;font-size:18px;line-height:1.85;"':''}>${esc(v[meta.field])}</div></div>`;
  }).join('');
}

function render(myTags, hadithRows, relatedTensions){
  const v = VERSE_ROW;
  const primary = myTags.find(t => t.role === 'primary');
  const secondary = myTags.filter(t => t.role !== 'primary');
  let badges = '';
  if (primary) badges += `<span class="badge">${esc(catName(primary.category_slug))}</span>`;
  secondary.forEach(t => badges += `<span class="badge secondary">${esc(catName(t.category_slug))}</span>`);
  if (v.tone) badges += `<span class="badge tone">${esc(v.tone)}</span>`;
  if (v.discourse_type) badges += `<span class="badge secondary">🗣 ${esc(v.discourse_type)}</span>`;
  if (v.muhammad_relevance) badges += `<span class="badge secondary">🎯 ${esc(v.muhammad_relevance)}</span>`;

  const html = `
    <div class="section">
      <div class="toolbar">
        <button class="vt-btn" title="Listen" onclick="speakThis()">🔊</button>
        <button class="vt-btn${isBookmarked()?' active-toggle':''}" id="bmBtn" title="Bookmark" onclick="toggleBm()">${isBookmarked()?'🔖':'🏷️'}</button>
        <button class="vt-btn" title="Copy" onclick="copyThis()">📋</button>
        <button class="vt-btn" title="Share" onclick="shareThis()">📤</button>
        <a class="vt-btn" title="Open in Qur'an" href="index.html?sura=${v.sura}&aya=${v.aya}&from=muhammad">🔗</a>
      </div>
      <div class="verse-ref-big">${v.sura}:${v.aya}</div>
      <div style="margin-bottom:8px;">${badges}</div>
      ${langBlocksHtml(v)}
      ${v.summary ? `<div style="margin-top:8px;padding:8px 10px;background:#FAFAF7;border-left:3px solid #E8C97B;border-radius:4px;font-size:13px;color:#555;">${esc(v.summary)}</div>` : ''}
      ${v.research_question ? `<div style="margin-top:8px;font-size:12.5px;font-style:italic;color:#6B5A3E;">❓ ${esc(v.research_question)}</div>` : ''}
    </div>

    <div class="section">
      <div class="section-title">⚖️ Appears in Tension Pairs (${relatedTensions.length})</div>
      ${relatedTensions.length ? relatedTensions.map(t => `
        <div class="xref-card">
          <div class="xref-title">${esc(t.tension_id)} — ${esc(t.title)}</div>
          <div class="xref-role">Pole ${t.side}</div>
          <div class="xref-text">${esc(t.side === 'A' ? t.pole_a : t.pole_b)}</div>
          <div class="xref-q">❓ ${esc(t.core_question)}</div>
        </div>
      `).join('') : '<div class="empty-note">Not currently cited in any tension pair.</div>'}
    </div>

    <div class="section">
      <div class="section-title">📿 Related Hadith (${hadithRows.length})</div>
      ${hadithRows.length ? hadithRows.map(h => `
        <div class="hadith-card">
          <b>${esc(h.collection)} ${esc(h.hadith_number||'')}</b> — ${esc(h.relationship_type||'')}<br>
          ${esc(h.summary||'')}
          ${h.critical_note ? `<div style="margin-top:4px;font-style:italic;color:#8B4513;">${esc(h.critical_note)}</div>` : ''}
        </div>
      `).join('') : '<div class="empty-note">No hadith currently linked to this verse.</div>'}
    </div>

    <div class="section">
      <div class="section-title">💬 Discuss This Verse</div>
      <div id="discuss-panel">
        <div id="discuss-messages"></div>
        <div style="display:flex;gap:6px;">
          <input id="discuss-input" placeholder="Ask about this verse..." onkeydown='if(event.key==="Enter")sendDiscussLocal()' style="flex:1;padding:8px 10px;border:1px solid #D4C9A8;border-radius:8px;font-size:13px;outline:none;">
          <button id="discuss-btn" onclick="sendDiscussLocal()" style="padding:8px 14px;background:#B8902A;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">Ask</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}

// ── Toolbar actions (bookmark/copy/share/speak) ─────────────────────────
function isBookmarked(){ return loadJSON('muhammadBookmarks', []).some(b => b.sura === SURA && b.aya === AYA); }
function toggleBm(){
  let bm = loadJSON('muhammadBookmarks', []);
  const idx = bm.findIndex(b => b.sura === SURA && b.aya === AYA);
  if (idx >= 0) bm.splice(idx, 1); else bm.push({ sura: SURA, aya: AYA, ts: Date.now() });
  saveJSON('muhammadBookmarks', bm);
  document.getElementById('bmBtn').textContent = isBookmarked() ? '🔖' : '🏷️';
  document.getElementById('bmBtn').classList.toggle('active-toggle', isBookmarked());
}
function copyThis(){
  let text = `${SURA}:${AYA}\n`;
  Object.keys(ALL_LANGS).forEach(k => { if (langState[k] && VERSE_ROW[ALL_LANGS[k].field]) text += `\n[${ALL_LANGS[k].label}] ${VERSE_ROW[ALL_LANGS[k].field]}`; });
  if (VERSE_ROW.summary) text += `\n\nSummary: ${VERSE_ROW.summary}`;
  text += `\n\n— Muhammad in the Qur'an, quranhikma.com`;
  navigator.clipboard?.writeText(text).then(() => alert('Copied ' + SURA + ':' + AYA)).catch(()=>alert('Could not copy.'));
}
function shareThis(){
  const url = `${location.origin}/index.html?sura=${SURA}&aya=${AYA}&from=muhammad`;
  const text = `${SURA}:${AYA} — ${VERSE_ROW.english || VERSE_ROW.summary || ''}`;
  if (navigator.share) navigator.share({ title: `${SURA}:${AYA}`, text, url }).catch(()=>{});
  else navigator.clipboard?.writeText(`${text}\n${url}`).then(() => alert('Link copied'));
}
function speakThis(){
  if (!('speechSynthesis' in window)) { alert('Speech not supported.'); return; }
  window.speechSynthesis.cancel();
  const preferred = Object.keys(ALL_LANGS).find(k => langState[k] && k !== 'arabic' && VERSE_ROW[ALL_LANGS[k].field]) || 'english';
  const text = VERSE_ROW[ALL_LANGS[preferred]?.field || 'english'] || VERSE_ROW.english || VERSE_ROW.arabic;
  if (!text) return;
  const u = new SpeechSynthesisUtterance(text);
  const langMap = { english:'en-US', arabic:'ar-SA', urdu:'ur-PK', german:'de-DE', spanish:'es-ES', chinese:'zh-CN', bengali:'bn-BD', malay:'ms-MY', somali:'so-SO' };
  u.lang = langMap[preferred] || 'en-US';
  window.speechSynthesis.speak(u);
}

// ── Discuss chat (same streaming edge function as the rest of the site) ──
const DISCUSS_HISTORY = [];
async function streamClaudeAPI(payload, onChunk){
  const res = await fetch('/api/claude-stream', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
  if (!res.ok || !res.body) {
    let errMsg = 'Request failed (status ' + res.status + ')';
    try { const j = await res.json(); errMsg = (j && (j.error?.message||j.error)) || errMsg; } catch {}
    throw new Error(errMsg);
  }
  const reader = res.body.getReader(); const decoder = new TextDecoder(); let full = '';
  while (true) { const {done,value} = await reader.read(); if (done) break; full += decoder.decode(value,{stream:true}); if (onChunk) onChunk(full); }
  return full;
}
function renderDiscuss(){
  const c = document.getElementById('discuss-messages');
  if (!c) return;
  c.innerHTML = DISCUSS_HISTORY.map(m => {
    const isUser = m.role === 'user';
    return `<div style="display:flex;justify-content:${isUser?'flex-end':'flex-start'};margin-bottom:6px;">
      <div style="max-width:88%;padding:9px 12px;border-radius:${isUser?'14px 14px 3px 14px':'14px 14px 14px 3px'};background:${isUser?'#B8902A':'#F5F3EC'};color:${isUser?'#fff':'#1a1a1a'};font-size:13px;line-height:1.55;border:${isUser?'none':'1.5px solid #D4C9A8'};">${esc(m.content)}</div>
    </div>`;
  }).join('');
  c.scrollTop = c.scrollHeight;
}
async function sendDiscussLocal(){
  const input = document.getElementById('discuss-input');
  const btn = document.getElementById('discuss-btn');
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  if (btn) btn.disabled = true;
  const v = VERSE_ROW;
  const systemPrompt = `You are a Quranic studies research assistant discussing ${v.sura}:${v.aya}.
Arabic: ${v.arabic||''}
English: ${v.english||''}
${v.summary ? 'Summary: '+v.summary : ''}
Tone: ${v.tone||'unspecified'} | Discourse type: ${v.discourse_type||'unspecified'} | Relevance to Muhammad: ${v.muhammad_relevance||'unspecified'}
${v.research_question ? 'Open research question: '+v.research_question : ''}
Answer with scholarly care: present the range of classical and academic views where relevant, note genuine interpretive disputes rather than picking a side, keep answers focused unless asked to go deeper.`;
  DISCUSS_HISTORY.push({role:'user', content:question});
  renderDiscuss();
  const loadingDiv = document.createElement('div');
  loadingDiv.id = 'discuss-loading';
  loadingDiv.style.cssText = 'display:flex;justify-content:flex-start;margin-bottom:6px;';
  loadingDiv.innerHTML = '<div style="padding:9px 12px;background:#F5F3EC;border-radius:14px 14px 14px 3px;border:1.5px solid #D4C9A8;"><span class="spinner" style="width:12px;height:12px;border-width:2px;"></span></div>';
  document.getElementById('discuss-messages').appendChild(loadingDiv);
  try {
    const messages = DISCUSS_HISTORY.map(m => ({role:m.role, content:m.content}));
    DISCUSS_HISTORY.push({role:'assistant', content:''});
    const idx = DISCUSS_HISTORY.length - 1;
    document.getElementById('discuss-loading')?.remove();
    await streamClaudeAPI({ model:'claude-sonnet-4-6', max_tokens:1000, system:systemPrompt, messages }, (text) => {
      DISCUSS_HISTORY[idx].content = text;
      renderDiscuss();
    });
    if (!DISCUSS_HISTORY[idx].content) DISCUSS_HISTORY[idx].content = 'No response received.';
  } catch(e) {
    DISCUSS_HISTORY.push({role:'assistant', content:'Could not connect to AI: ' + e.message});
  }
  document.getElementById('discuss-loading')?.remove();
  renderDiscuss();
  if (btn) btn.disabled = false;
}

load();
</script>
</body>
</html>
