<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'EB Garamond','Georgia',serif;background:#FDFAF4;color:#3A2E1A;padding-bottom:70px}
  .topbar{background:#FFF8E8;border-bottom:1px solid #E8DDC0;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}

  #reader{display:none;padding:14px}
  .searchbar{display:flex;gap:8px;margin-bottom:12px}
  .searchbar input{flex:1;padding:10px 14px;border-radius:20px;border:1.5px solid #E8DDC0;font-family:'EB Garamond',serif;font-size:15px}
  #searchSuggest{display:none;position:absolute;top:44px;left:0;right:46px;background:#fff;border:1.5px solid #E8DDC0;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:60;max-height:280px;overflow-y:auto;}
  .sugg-item{padding:9px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #F5EFDD;}
  .sugg-item:last-child{border-bottom:none}
  .sugg-item:hover, .sugg-item.active-sugg{background:#FDF5DE}
  .sugg-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;flex-shrink:0;}
  .sugg-tag.narrator{background:#EFE6F5;color:#6A3E8A}
  .sugg-tag.topic{background:#E4F0E9;color:#2E7D32}
  .sugg-tag.text{background:#FDF0D5;color:#9A6A00}
  .sugg-label{color:#3A2E1A;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sugg-label mark{background:#FFE58A;padding:0;}
  .sugg-empty{padding:10px 14px;font-size:13px;color:#8a7a5a;font-style:italic;}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filter-row select{padding:7px 10px;border-radius:10px;border:1.5px solid #E8DDC0;font-family:'EB Garamond',serif;font-size:13.5px;background:#fff;color:#5A3A10}
  #entryCount{font-size:12.5px;color:#8a7a5a;text-align:center;margin-bottom:10px}

  .entry-card{background:#fff;border:1px solid #E8DDC0;border-left:4px solid #B8902A;border-radius:10px;padding:16px;margin-bottom:14px}
  .entry-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:9px}

  .badge.topic{background:#E4F0E9;color:#2E7D32}
  .badge.grade-sahih{background:#E4F0E9;color:#2E7D32}
  .badge.grade-hasan{background:#FFF3D6;color:#9A6A00}
  .badge.grade-daif{background:#FBE4E4;color:#B23A3A}

  .arabic-text{font-family:'Amiri',serif;font-size:20px;line-height:2.1;direction:rtl;text-align:right;color:#241a0a;user-select:text;margin-bottom:10px}
  .english-text{font-size:14.5px;color:#444;line-height:1.7;margin-bottom:8px}

  .entry-actions{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid #F0E8D5;padding-top:10px}
  .act-btn{background:#FBF6E9;border:1px solid #E8DDC0;color:#7A5010;border-radius:16px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'EB Garamond',serif}
  .act-btn:active{background:#F3E9CE}
  .act-btn.playing{background:#3A2E1A;color:#fff;border-color:#3A2E1A}

  #bottom-nav {

</style>

<body>

<div class="topbar">
  <button class="qbtn ghost" id="backBtn" onclick="goBack()">← Back</button>
  <h1 id="pageTitle">📚 Books Library</h1>
</div>

<div id="library">
  <div style="background:#FBF6E9;border:1.5px solid #D4A830;border-radius:12px;padding:14px 16px;margin-bottom:18px;">
    <div style="font-weight:700;color:#5A3A10;margin-bottom:8px;">🔬 Compare Across All Hadith Books</div>

<div id="reader">

    <input type="text" id="searchInput" placeholder="Search text, narrator, or topic..." autocomplete="off"
      oninput="onSearchInput()" onfocus="onSearchInput()" onkeydown="onSearchKeydown(event)">
    <button class="qbtn" onclick="runSearch()">🔍</button>
    <div id="searchSuggest"></div>
  </div>
  <div class="filter-row" id="groupFilterRow" style="margin-bottom:6px;">
    <span style="font-size:12.5px;color:#8a7a5a;align-self:center;">Group by:</span>
    <button class="qbtn" id="groupNoneBtn" onclick="setGroupMode('none')">None</button>
    <button class="qbtn" id="groupNarratorBtn" onclick="setGroupMode('narrator')">👤 Narrator</button>
    <button class="qbtn" id="groupTopicBtn" onclick="setGroupMode('topic')">🏷 Topic</button>

  <div class="filter-row" id="dropdownFilterRow">

    <button class="qbtn ghost" onclick="clearFilters()">Clear filters</button>
  </div>
  <div class="filter-row" id="chapterModeRow" style="display:none;">
    <select id="chapterSelect" style="flex:1;"><option value="">Select a chapter/book...</option></select>
    <button class="qbtn" onclick="loadChapterClusters()">🔗 Group Duplicates</button>
    <button class="qbtn ghost" onclick="exitChapterMode()">← Back to full list</button>
  </div>
  <div id="entryCount"></div>
  <div id="entries"></div>
  <div id="loadMoreRow" style="display:none;text-align:center;margin:10px 0 20px;">
    <button class="qbtn" onclick="loadMoreEntries()">⬇ Load more entries</button>
  </div>
</div>

<div id="selPopup"><button onclick="highlightSelection()">🖍 Highlight</button></div>

<div id="researchModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9998;align-items:flex-end;justify-content:center;">
  <div style="background:#FDFAF4;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;max-height:70vh;overflow-y:auto;">
    <div style="font-weight:700;color:#5A3A10;margin-bottom:12px;font-size:16px;">Save to Research Collection</div>
    <div id="rpCollectionList"></div>
    <div style="margin-top:12px;border-top:1px solid #E8DDC0;padding-top:12px;">
      <div style="font-size:13px;color:#8a7a5a;margin-bottom:6px;">Or create a new collection:</div>
      <input type="text" id="rpNewName" placeholder="Collection name" style="width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #E8DDC0;font-family:'EB Garamond',serif;font-size:14px;margin-bottom:8px;">
      <button class="qbtn" onclick="createAndSaveCollection()">Create & Save</button>
      <button class="qbtn ghost" onclick="closeResearchPicker()">Cancel</button>
    </div>
  </div>
</div>

<nav id="bottom-nav">
  <button class="bnav-btn " onclick="location.href='index.html'"><span class="bni">📖</span><span>Quran</span></button>

  <button class="bnav-btn " onclick="location.href='stories.html'"><span class="bni">📚</span><span>Stories</span></button>
  <button class="bnav-btn active" onclick="location.href='books.html'"><span class="bni">📕</span><span>Books</span></button>

<script>
const SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDR = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

function getDeviceId(){
  let id = localStorage.getItem('qh_device_id');
  if(!id){ id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('qh_device_id', id); }
  return id;
}
const DEVICE_ID = getDeviceId();

let CURRENT_BOOK = null;
let ALL_ENTRIES = [];
let ANNOTATIONS = {}; // entry_id -> {highlights:[], notes:[]}
let IS_PAGINATED = false;
let PAGE_OFFSET = 0;
const PAGE_SIZE = 25;
let HAS_MORE = false;

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---- Cross-collection comparison (search across every hadith book at once) ----
let CROSS_RESULTS = [];

async function runCrossSearch(){
  const q = document.getElementById('crossSearchInput').value.trim();
  const box = document.getElementById('crossSearchResults');
  if(!q){ toast('Type something to search'); return; }
  box.innerHTML = '<div style="padding:14px 0;color:#8a7a5a;font-size:13px;"><em>Searching across all hadith books…</em></div>';
  const enc = encodeURIComponent(q);
  const res = await fetch(SB_URL + '/rest/v1/hadith_corpus?select=id,collection,narrator,book_chapter,text_arabic,text_english,grade,grade_details,hadith_number,source_url&text_english=ilike.*' + enc + '*&limit=60', { headers: HDR });
  if(!res.ok){ box.innerHTML = '<div style="color:#B23A3A;padding:10px 0;">Search failed — try a shorter phrase.</div>'; return; }
  const rows = await res.json();
  CROSS_RESULTS = rows;
  renderCrossSearchResults(q);
}

function renderCrossSearchResults(q){
  const box = document.getElementById('crossSearchResults');
  if(!CROSS_RESULTS.length){ box.innerHTML = '<div style="padding:14px 0;color:#8a7a5a;font-size:13px;">No matches found across any collection.</div>'; return; }

  const byCollection = {};
  CROSS_RESULTS.forEach(r => { if(!byCollection[r.collection]) byCollection[r.collection] = []; byCollection[r.collection].push(r); });
  const collections = Object.keys(byCollection).sort();

  box.innerHTML = `
    <div style="margin:12px 0 8px;font-size:13px;color:#5A3A10;font-weight:700;">${CROSS_RESULTS.length} matches across ${collections.length} book${collections.length===1?'':'s'}</div>
    <button class="qbtn" onclick="crossCollectionAnalyze('${esc(q).replace(/'/g,"\\'")}')" style="margin-bottom:14px;">🔬 Analyze All Together (contradictions, changes, omissions, Quran relation)</button>
    <div id="crossAnalysisBox" style="margin-bottom:16px;"></div>
  ` + collections.map(col => `
    <div class="group-header">📚 ${esc(col)} <span style="font-weight:400;color:#8a7a5a;">(${byCollection[col].length})</span></div>
    ${byCollection[col].map(r => `
      <div class="entry-card">
        <div class="entry-badges">
          ${r.narrator ? `<span class="badge narrator">👤 ${esc(r.narrator)}</span>` : ''}
          ${r.book_chapter ? `<span class="badge topic">🏷 Book ${esc(r.book_chapter)}, #${esc(r.hadith_number||'')}</span>` : ''}
          <span class="badge ${gradeClass(r.grade)}">${esc(gradeLabel(r.grade))}</span>
        </div>
        ${r.text_arabic ? `<div class="arabic-text">${esc(r.text_arabic).slice(0,500)}${r.text_arabic.length>500?'…':''}</div>` : ''}
        ${r.text_english ? `<div class="english-text">${esc(r.text_english).slice(0,500)}${r.text_english.length>500?'…':''}</div>` : ''}
        ${r.source_url ? `<div class="grade-note"><a href="${esc(r.source_url)}" target="_blank" rel="noopener" style="color:#2E7D32;font-weight:700;text-decoration:none;">🔗 Verify source</a></div>` : ''}
      </div>
    `).join('')}
  `).join('');
}

async function crossCollectionAnalyze(q){
  const box = document.getElementById('crossAnalysisBox');
  box.innerHTML = '<em>Gathering context…</em>';

  // Cap how many versions we send to keep the prompt focused — one representative per collection
  const byCollection = {};
  CROSS_RESULTS.forEach(r => { if(!byCollection[r.collection]) byCollection[r.collection] = r; });
  const picks = Object.values(byCollection);

  const ids = picks.map(r => r.id).join(',');
  const [linksRes] = await Promise.all([
    fetch(SB_URL + '/rest/v1/theme_hadith_links?hadith_id=in.(' + ids + ')&select=hadith_id,sura_id,aya_number,similarity_note,difference_note&order=relevance_score.desc&limit=15', { headers: HDR })
  ]);
  const links = linksRes.ok ? await linksRes.json() : [];
  const linksText = links.length
    ? links.map(l => `Quran ${l.sura_id}:${l.aya_number} (linked to hadith id ${l.hadith_id}) — ${l.similarity_note || ''}${l.difference_note ? ' (tension: ' + l.difference_note + ')' : ''}`).join('\n')
    : 'No pre-linked Quran verses on file for these hadith.';

  const versionsText = picks.map(r => {
    const crossRefs = extractCrossRefs(r.grade_details);
    return `Source: ${r.collection} (hadith #${r.hadith_number || '?'}, id ${r.id}), narrator: ${r.narrator || 'unknown'}, grade: ${r.grade || 'unknown'}${crossRefs.length ? ', also recorded in: ' + crossRefs.join(', ') : ''}:\n${r.text_english || r.text_arabic}`;
  }).join('\n\n');

  box.innerHTML = '<em>Analyzing across ' + picks.length + ' books…</em>';
  const prompt = `You are a hadith scholar comparing how the same topic ("${q}") is narrated across DIFFERENT hadith collections. Below is one representative narration from each collection that matched this search, each explicitly labeled with its source book, plus any pre-linked Quran verses on file (real data — do not invent more).

NARRATIONS (one per source book):
${versionsText}

PRE-LINKED QURAN VERSES ON FILE:
${linksText}

Provide a structured critical analysis with exactly these four headed sections, under 450 words total. Always name the specific source book(s) you are referring to — never speak generically about "the hadith".
### 1. What's Consistent
What core content or wording is shared across the different books' versions.
### 2. Contradictions and Changes
Real differences in wording, emphasis, isnad, or claimed events between the named sources — note any that appear to contradict each other, not just stylistic variation.
### 3. Omissions
What one source includes that others leave out, and whether that omission seems significant.
### 4. Relation to the Quran
Using only the pre-linked verses above, explain how these narrations (naming their sources) relate to, support, or sit in tension with those verses. If no verses are linked, say so rather than inventing any.

Be concise, factual, and avoid speculation beyond what the given text and context supports.`;
  try{
    const res = await fetch('/claude', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 900, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await res.json();
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    box.innerHTML = '<div style="background:#F5F0FF;border-radius:10px;padding:14px 16px;font-size:13.5px;line-height:1.6;">' +
      esc(text).replace(/### (.+)/g, '<div style="font-weight:700;color:#5A3A8B;margin:10px 0 4px;">$1</div>').replace(/\n/g, '<br>') +
      '</div>';
  }catch(err){
    box.innerHTML = '<span style="color:#B23A3A;">Analysis failed — try again.</span>';
  }
}

async function loadBooks(){
  const res = await fetch(SB_URL + '/rest/v1/books?select=*&order=id', { headers: HDR });
  const books = await res.json();
  const c = document.getElementById('bookCards');
  if(!books.length){ c.innerHTML = '<div id="emptyState">No books added yet.</div>'; return; }
  c.innerHTML = books.map(b => `
    <div class="book-card" onclick="openBook(${b.id})">
      <span class="cat-pill">${esc(b.category || 'book')}</span>
      <div class="book-title-ar">${esc(b.title_ar)}</div>
      <div class="book-title-en">${esc(b.title_en || '')}</div>
      <div class="book-meta">
        ${b.author_en ? esc(b.author_en) + ' · ' : ''}${esc(b.author_dates || '')}<br>
        ${b.editor ? 'Edited by ' + esc(b.editor) + ' · ' : ''}${esc(b.publisher || '')}
        ${b.total_volumes ? ' · ' + b.total_volumes + ' volumes' : ''}
      </div>
      <div class="book-desc">${esc(b.description || '')}</div>
    </div>`).join('');
}

async function openBook(id){
  const res = await fetch(SB_URL + '/rest/v1/books?id=eq.' + id + '&select=*', { headers: HDR });
  const rows = await res.json();
  CURRENT_BOOK = rows[0];
  IS_PAGINATED = !!CURRENT_BOOK.source_table;
  document.getElementById('pageTitle').textContent = '📖 ' + (CURRENT_BOOK.title_en || CURRENT_BOOK.title_ar);
  document.getElementById('library').style.display = 'none';
  document.getElementById('reader').style.display = 'block';
  document.getElementById('groupFilterRow').style.display = IS_PAGINATED ? 'none' : 'flex';
  document.getElementById('dropdownFilterRow').style.display = IS_PAGINATED ? 'none' : 'flex';
  document.getElementById('loadMoreRow').style.display = 'none';
  const isHadith = CURRENT_BOOK.source_table === 'hadith_corpus';
  document.getElementById('chapterModeRow').style.display = isHadith ? 'flex' : 'none';
  if(isHadith) await populateChapterOptions();
  await loadEntries();
}

function goBack(){
  if(document.getElementById('reader').style.display === 'block'){
    document.getElementById('reader').style.display = 'none';
    document.getElementById('library').style.display = 'block';
    document.getElementById('pageTitle').textContent = '📚 Books Library';
    CURRENT_BOOK = null;
  } else {
    window.location.href = 'themes.html';
  }
}

// ---- Normalize a raw row from any source table into the common entry shape ----
function normalizeRawEntry(raw){
  const st = CURRENT_BOOK.source_table;
  if(st === 'hadith_corpus'){
    return {
      id: raw.id, narrator: raw.narrator || '', topic: raw.book_chapter || '',
      arabic_text: raw.text_arabic || '', english_text: raw.text_english || '',
      grade: raw.grade || '', grader: raw.isnad ? ('Isnad: ' + raw.isnad) : '',
      page_ref: raw.hadith_number ? ('#' + raw.hadith_number) : '', source_url: raw.source_url || '',
      grade_details: raw.grade_details || null
    };
  }
  if(st === 'tafsir_entries'){
    return {
      id: raw.id, narrator: '', topic: 'Sura ' + raw.sura,
      arabic_text: raw.language === 'ar' ? (raw.content || '') : '',
      english_text: raw.language === 'en' ? (raw.content || '') : '',
      grade: '', grader: raw.tradition || '', page_ref: raw.sura + ':' + raw.aya, source_url: raw.source_url || ''
    };
  }
  if(st === 'asbab_al_nuzul'){
    return {
      id: raw.id, narrator: '', topic: 'Sura ' + raw.sura_id,
      arabic_text: '', english_text: raw.reason_text || '',
      grade: '', grader: raw.scholar || '', page_ref: raw.sura_id + ':' + raw.aya_number, source_url: ''
    };
  }
  return raw; // book_entries already matches the shape (now includes source_url)
}

let CLUSTER_MODE = false;
let CLUSTERS = {};

async function loadChapterClusters(){
  const chapter = document.getElementById('chapterSelect').value;
  if(!chapter){ toast('Pick a chapter first'); return; }
  document.getElementById('entries').innerHTML = '<div id="emptyState">Loading…</div>';
  document.getElementById('loadMoreRow').style.display = 'none';

  const clusterRes = await fetch(SB_URL + '/rest/v1/hadith_dedup_clusters?collection=eq.' + encodeURIComponent(CURRENT_BOOK.source_filter_val) + '&book_chapter=eq.' + encodeURIComponent(chapter) + '&select=hadith_id,cluster_id', { headers: HDR });
  let clusterRows = clusterRes.ok ? await clusterRes.json() : [];

  if(!clusterRows.length){
    // Not precomputed yet (e.g. brand-new data) — fall back to live computation
    const res = await fetch(SB_URL + '/rest/v1/rpc/get_hadith_duplicate_clusters', {
      method: 'POST', headers: { ...HDR, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_collection: CURRENT_BOOK.source_filter_val, p_chapter: chapter })
    });
    if(!res.ok){ document.getElementById('entries').innerHTML = '<div id="emptyState">This chapter is too large to cluster live — try a smaller one.</div>'; return; }
    const rows = await res.json();
    CLUSTER_MODE = true;
    CLUSTERS = {};
    rows.forEach(r => { if(!CLUSTERS[r.cluster_id]) CLUSTERS[r.cluster_id] = []; CLUSTERS[r.cluster_id].push(normalizeRawEntry(r)); });
    ALL_ENTRIES = rows.map(normalizeRawEntry);
    await loadAnnotations();
    renderClusters();
    return;
  }

  // Fast path: precomputed clusters exist — just fetch the actual hadith rows
  const ids = clusterRows.map(r => r.hadith_id).join(',');
  const hadithRes = await fetch(SB_URL + '/rest/v1/hadith_corpus?id=in.(' + ids + ')&select=id,narrator,book_chapter,text_arabic,text_english,grade,grade_details,isnad,hadith_number,source_url', { headers: HDR });
  const hadithRows = hadithRes.ok ? await hadithRes.json() : [];
  const byId = {}; hadithRows.forEach(h => byId[h.id] = h);

  CLUSTER_MODE = true;
  CLUSTERS = {};
  clusterRows.forEach(r => {
    const raw = byId[r.hadith_id];
    if(!raw) return;
    if(!CLUSTERS[r.cluster_id]) CLUSTERS[r.cluster_id] = [];
    CLUSTERS[r.cluster_id].push(normalizeRawEntry(raw));
  });
  ALL_ENTRIES = Object.values(CLUSTERS).flat();
  await loadAnnotations();
  renderClusters();
}

function exitChapterMode(){
  CLUSTER_MODE = false;
  document.getElementById('chapterSelect').value = '';
  loadEntries();
}

function renderClusters(){
  const groups = Object.entries(CLUSTERS).sort((a,b) => +a[0] - +b[0]);
  const multi = groups.filter(([,members]) => members.length > 1);
  const single = groups.filter(([,members]) => members.length === 1);
  document.getElementById('entryCount').textContent = groups.length + ' distinct hadith (' + multi.length + ' with multiple narrations, ' + single.length + ' unique)';
  const c = document.getElementById('entries');
  c.innerHTML = groups.map(([cid, members]) => {
    const preview = esc((members[0].english_text || members[0].arabic_text || '').slice(0, 120)) + '…';
    if(members.length === 1){
      return `<div class="entry-card">
        ${entryBodyHTML(members[0])}
        <div style="padding:0 16px 16px;">
          <button class="qbtn" onclick="analyzeCluster(${cid})">🔍 Critical Analysis</button>
          <div id="clusterAnalysis-${cid}" style="margin-top:10px;font-size:13.5px;color:#3A2E1A;"></div>
        </div>
      </div>`;
    }
    return `
    <div class="entry-card" style="padding:0;overflow:hidden;">
      <div style="padding:14px 16px;cursor:pointer;background:#FBF6E9;" onclick="toggleCluster(${cid})">
        <span class="badge topic" style="margin-bottom:0;">${members.length} narrations</span>
        <div style="margin-top:6px;font-size:13.5px;color:#5A3A10;">${preview}</div>
        <div style="font-size:11.5px;color:#8a7a5a;margin-top:4px;">Tap to expand ▾</div>
      </div>
      <div id="clusterBody-${cid}" style="display:none;border-top:1px solid #F0E8D5;">
        ${members.map(e => `<div style="padding:16px;border-bottom:1px solid #F5EFDD;" data-entry-id="${e.id}">${entryBodyHTML(e)}</div>`).join('')}
        <div style="padding:12px 16px;">
          <button class="qbtn" onclick="analyzeCluster(${cid})">🔍 Critical Analysis</button>
          <div id="clusterAnalysis-${cid}" style="margin-top:10px;font-size:13.5px;color:#3A2E1A;"></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCluster(cid){
  const el = document.getElementById('clusterBody-' + cid);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function analyzeCluster(cid){
  const box = document.getElementById('clusterAnalysis-' + cid);
  box.innerHTML = '<em>Gathering context…</em>';
  const members = CLUSTERS[cid];
  const bookName = CURRENT_BOOK.title_en || CURRENT_BOOK.title_ar;
  const versionsText = members.map((e,i) => {
    const crossRefs = extractCrossRefs(e.grade_details);
    return `Version ${i+1} — Source: ${bookName}, narrator: ${e.narrator || 'unknown'}, grade: ${e.grade || 'unknown'}${crossRefs.length ? ', also recorded in: ' + crossRefs.join(', ') : ''}:\n${e.english_text || e.arabic_text}`;
  }).join('\n\n');

  // Ground the prompt with real linked Quran verses and any existing scholarly analysis already in the DB
  const ids = members.map(m => m.id).join(',');
  const [linksRes, analysisRes] = await Promise.all([
    fetch(SB_URL + '/rest/v1/theme_hadith_links?hadith_id=in.(' + ids + ')&select=sura_id,aya_number,similarity_note,difference_note&order=relevance_score.desc&limit=8', { headers: HDR }),
    fetch(SB_URL + '/rest/v1/hadith_analysis?hadith_id=in.(' + ids + ')&select=authenticity_grade,quran_tension_summary,sunni_interpretation,shia_interpretation&limit=5', { headers: HDR })
  ]);
  const links = linksRes.ok ? await linksRes.json() : [];
  const analyses = analysisRes.ok ? await analysisRes.json() : [];

  const linksText = links.length
    ? links.map(l => `Quran ${l.sura_id}:${l.aya_number} — ${l.similarity_note || ''}${l.difference_note ? ' (tension: ' + l.difference_note + ')' : ''}`).join('\n')
    : 'No pre-linked Quran verses on file for this hadith.';
  const priorAnalysisText = analyses.length
    ? analyses.map(a => `Prior note — grade: ${a.authenticity_grade || 'n/a'}; Quran tension: ${a.quran_tension_summary || 'none noted'}; Sunni view: ${a.sunni_interpretation || 'n/a'}; Shia view: ${a.shia_interpretation || 'n/a'}`).join('\n')
    : 'No prior scholarly analysis on file for this hadith.';

  box.innerHTML = '<em>Analyzing…</em>';
  const prompt = `You are a hadith scholar. Below are ${members.length} narration(s) of a hadith, each explicitly labeled with its source book, plus grounding data already on file (real linked Quran verses and any prior analysis — treat this as factual context, do not invent additional links beyond it).

NARRATIONS:
${versionsText}

PRE-LINKED QURAN VERSES ON FILE:
${linksText}

PRIOR ANALYSIS ON FILE:
${priorAnalysisText}

Provide a structured critical analysis with exactly these three headed sections, under 350 words total. In every section, explicitly name the source book(s) you are referring to (e.g. "${bookName}", or any cross-referenced collection listed above) rather than speaking generically about "the hadith" — a reader must be able to tell which book each claim comes from.
### 1. Comparison of Narrations
If multiple versions exist, note real differences in wording, isnad, or emphasis between the named sources, and flag any apparent internal contradiction. If only one version, say so briefly, naming its source.
### 2. Relation to the Quran
Using the pre-linked verses above (do not fabricate new ones), explain how this hadith (naming its source book) supports, elaborates on, or is in tension with those verses.
### 3. Fiqh / Madhhab Ruling
Explain what legal ruling(s), if any, classical scholars derive from this hadith as recorded in the named source(s), and whether madhhabs differ on it. State "no direct fiqh ruling derived" if that's accurate — do not invent a ruling that isn't well attested.

Be concise, factual, and avoid speculation beyond what the given text and context supports.`;
  try{
    const res = await fetch('/claude', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 700, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await res.json();
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    box.innerHTML = esc(text).replace(/### (.+)/g, '<div style="font-weight:700;color:#5A3A10;margin:10px 0 4px;">$1</div>').replace(/\n/g, '<br>');
  }catch(err){
    box.innerHTML = '<span style="color:#B23A3A;">Analysis failed — try again.</span>';
  }
}


async function loadEntries(){
  if(!IS_PAGINATED){
    const res = await fetch(SB_URL + '/rest/v1/book_entries?book_id=eq.' + CURRENT_BOOK.id + '&select=*&order=entry_number', { headers: HDR });
    ALL_ENTRIES = await res.json();
    await loadAnnotations();
    populateFilterOptions();
    GROUP_MODE = 'none';
    document.getElementById('groupNoneBtn').classList.add('active');
    document.getElementById('groupNarratorBtn').classList.remove('active');
    document.getElementById('groupTopicBtn').classList.remove('active');
    renderEntries(ALL_ENTRIES);
    return;
  }
  // Paginated (large source-table) book
  PAGE_OFFSET = 0;
  ALL_ENTRIES = [];
  await fetchMorePaginated(true);
}

function buildSourceQuery(offset, searchQ){
  const st = CURRENT_BOOK.source_table;
  const enc = searchQ ? encodeURIComponent(searchQ) : '';
  if(st === 'hadith_corpus'){
    let url = SB_URL + '/rest/v1/hadith_corpus?select=id,narrator,book_chapter,text_arabic,text_english,grade,grade_details,isnad,hadith_number,source_url'
      + '&collection=eq.' + encodeURIComponent(CURRENT_BOOK.source_filter_val)
      + '&order=id&limit=' + PAGE_SIZE + '&offset=' + offset;
    if(searchQ) url += '&or=(text_english.ilike.*' + enc + '*,text_arabic.ilike.*' + enc + '*,narrator.ilike.*' + enc + '*)';
    return url;
  }
  if(st === 'tafsir_entries'){
    let url = SB_URL + '/rest/v1/tafsir_entries?select=id,sura,aya,language,content,tradition,source_url'
      + '&scholar_key=eq.' + encodeURIComponent(CURRENT_BOOK.source_filter_val)
      + '&order=sura,aya&limit=' + PAGE_SIZE + '&offset=' + offset;
    if(searchQ) url += '&content=ilike.*' + enc + '*';
    return url;
  }
  if(st === 'asbab_al_nuzul'){
    let url = SB_URL + '/rest/v1/asbab_al_nuzul?select=id,sura_id,aya_number,scholar,reason_text'
      + '&reason_text=not.like.Undefined Essential Tafsirs*'
      + '&order=sura_id,aya_number&limit=' + PAGE_SIZE + '&offset=' + offset;
    if(searchQ) url += '&reason_text=ilike.*' + enc + '*';
    return url;
  }
  return null;
}

async function fetchMorePaginated(reset){
  const searchQ = document.getElementById('searchInput').value.trim();
  const offset = reset ? 0 : PAGE_OFFSET;
  const url = buildSourceQuery(offset, searchQ);
  if(!url) return;
  const res = await fetch(url, { headers: { ...HDR, Prefer: 'count=exact' } });
  const raw = await res.json();
  const range = res.headers.get('content-range'); // e.g. "0-24/1298"
  const total = range && range.includes('/') ? parseInt(range.split('/')[1], 10) : null;
  const normalized = raw.map(normalizeRawEntry);
  if(reset) ALL_ENTRIES = normalized;
  else ALL_ENTRIES = ALL_ENTRIES.concat(normalized);
  PAGE_OFFSET = offset + raw.length;
  HAS_MORE = total !== null ? PAGE_OFFSET < total : raw.length === PAGE_SIZE;
  await loadAnnotations();
  renderEntries(ALL_ENTRIES);
  document.getElementById('entryCount').textContent = ALL_ENTRIES.length + (total !== null ? ' of ' + total : '') + ' entries';
  document.getElementById('loadMoreRow').style.display = HAS_MORE ? 'block' : 'none';
}
function loadMoreEntries(){ fetchMorePaginated(false); }

async function loadAnnotations(){
  if(!ALL_ENTRIES.length) return;
  const st = CURRENT_BOOK.source_table || 'book_entries';
  const ids = ALL_ENTRIES.map(e => e.id).join(',');
  const res = await fetch(SB_URL + '/rest/v1/book_annotations?entry_id=in.(' + ids + ')&source_table=eq.' + encodeURIComponent(st) + '&device_id=eq.' + encodeURIComponent(DEVICE_ID) + '&select=*', { headers: HDR });
  const rows = await res.json();
  ANNOTATIONS = {};
  rows.forEach(r => {
    if(!ANNOTATIONS[r.entry_id]) ANNOTATIONS[r.entry_id] = { highlights: [], notes: [] };
    if(r.kind === 'highlight') ANNOTATIONS[r.entry_id].highlights.push(r);
    else ANNOTATIONS[r.entry_id].notes.push(r);
  });
}

function populateFilterOptions(){
  const narrators = [...new Set(ALL_ENTRIES.map(e => e.narrator).filter(Boolean))].sort();
  const topics = [...new Set(ALL_ENTRIES.map(e => e.topic).filter(Boolean))].sort();

  tf.innerHTML = '<option value="">All topics</option>' + topics.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
}

let CURRENT_SEARCH_QUERY = '';

function highlightSearchTerms(escapedText){
  if(!CURRENT_SEARCH_QUERY) return escapedText;
  const words = CURRENT_SEARCH_QUERY.split(/\s+/).map(w => w.trim()).filter(Boolean);
  if(!words.length) return escapedText;
  let out = escapedText;
  words.forEach(w => {
    const escW = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if(!escW) return;
    const rx = new RegExp('(' + escW + ')', 'gi');
    out = out.replace(rx, '<mark class="hl">$1</mark>');
  });
  return out;
}

function applyHighlights(text, entryId){
  const hls = (ANNOTATIONS[entryId] && ANNOTATIONS[entryId].highlights) || [];
  let out = esc(text);
  hls.forEach(h => {
    if(!h.selected_text) return;
    const escSel = esc(h.selected_text);
    if(out.includes(escSel)) out = out.replace(escSel, '<mark class="hl">' + escSel + '</mark>');
  });
  return highlightSearchTerms(out);
}

function gradeClass(grade){
  if(!grade) return 'grade-ungraded';
  const g = grade.toLowerCase();
  if(g === 'ungraded') return 'grade-ungraded';
  if(g.includes('sahih')) return 'grade-sahih';
  if(g.includes('hasan')) return 'grade-hasan';
  if(g.includes('daif') || g.includes("da'if") || g.includes('weak')) return 'grade-daif';
  if(g.includes('mawdu') || g.includes('fabricat')) return 'grade-daif';
  return '';
}
function gradeLabel(grade){
  if(!grade || grade.toLowerCase() === 'ungraded') return 'No grade on file';
  return grade;
}

let GROUP_MODE = 'none'; // 'none' | 'narrator' | 'topic'

function setGroupMode(mode){
  GROUP_MODE = mode;
  ['groupNoneBtn','groupNarratorBtn','groupTopicBtn'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(mode === 'none' ? 'groupNoneBtn' : mode === 'narrator' ? 'groupNarratorBtn' : 'groupTopicBtn').classList.add('active');
  applyFilters();
}

function truncatedHTML(text, id, cls){
  const safe = highlightSearchTerms(esc(text));
  if(text.length <= 700) return `<div class="${cls}">${safe}</div>`;
  const short = highlightSearchTerms(esc(text.slice(0, 700))) + '…';
  return `<div class="${cls}" id="full-${cls}-${id}" style="display:none;">${safe}</div>
    <div class="${cls}" id="short-${cls}-${id}">${short} <a href="#" onclick="event.preventDefault();expandText('${cls}',${id})" style="color:#B8902A;font-weight:700;">Read more</a></div>`;
}
function expandText(cls, id){
  document.getElementById('short-' + cls + '-' + id).style.display = 'none';
  document.getElementById('full-' + cls + '-' + id).style.display = 'block';
}

function extractCrossRefs(gradeDetails){
  if(!gradeDetails || !Array.isArray(gradeDetails)) return [];
  const refs = new Set();
  const rx = /(Sahih (?:al-)?Bukhari|Sahih Muslim)\s*\(([^)]+)\)/gi;
  gradeDetails.forEach(g => {
    let m;
    const text = g.grade || '';
    while((m = rx.exec(text)) !== null){ refs.add(m[1] + ' ' + m[2]); }
  });
  return [...refs];
}

  return `

      ${e.arabic_text ? `<div class="arabic-text" data-raw="${esc(e.arabic_text).replace(/"/g,'&quot;')}">${e.arabic_text.length <= 700 ? applyHighlights(e.arabic_text, e.id) : truncatedHTML(e.arabic_text, e.id, 'arabic-text')}</div>` : ''}

function entryCardHTML(e){

function renderEntries(list){
  document.getElementById('entryCount').textContent = list.length + ' entries' + (list.length !== ALL_ENTRIES.length ? ' (filtered from ' + ALL_ENTRIES.length + ')' : '');
  const c = document.getElementById('entries');
  if(!list.length){ c.innerHTML = '<div id="emptyState">No entries match your search.</div>'; return; }

  if(GROUP_MODE === 'none'){
    c.innerHTML = list.map(entryCardHTML).join('');
    return;
  }

  const key = GROUP_MODE === 'narrator' ? 'narrator' : 'topic';
  const groups = {};
  const order = [];
  list.forEach(e => {
    const g = e[key] || (GROUP_MODE === 'narrator' ? 'Unattributed' : 'Uncategorized');
    if(!groups[g]){ groups[g] = []; order.push(g); }
    groups[g].push(e);
  });
  order.sort((a, b) => a.localeCompare(b, 'ar'));
  const icon = GROUP_MODE === 'narrator' ? '👤' : '🏷';
  c.innerHTML = order.map(g => `
    <div class="group-header">${icon} ${esc(g)} <span style="font-weight:400;color:#8a7a5a;">(${groups[g].length})</span></div>
    ${groups[g].map(entryCardHTML).join('')}
  `).join('');
}

function applyFilters(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  CURRENT_SEARCH_QUERY = q;
  if(IS_PAGINATED){ fetchMorePaginated(true); return; }
  const nf = document.getElementById('narratorFilter').value;
  const tf = document.getElementById('topicFilter').value;
  let list = ALL_ENTRIES;
  if(nf) list = list.filter(e => e.narrator === nf);
  if(tf) list = list.filter(e => e.topic === tf);
  if(q) list = list.filter(e =>
    (e.arabic_text || '').toLowerCase().includes(q) ||
    (e.english_text || '').toLowerCase().includes(q) ||
    (e.narrator || '').toLowerCase().includes(q) ||
    (e.topic || '').toLowerCase().includes(q));
  renderEntries(list);
}
function clearFilters(){
  document.getElementById('searchInput').value = '';
  document.getElementById('narratorFilter').value = '';
  document.getElementById('topicFilter').value = '';
  document.getElementById('searchSuggest').style.display = 'none';
  CURRENT_SEARCH_QUERY = '';
  if(IS_PAGINATED) fetchMorePaginated(true);
  else renderEntries(ALL_ENTRIES);
}
let searchTimer;
let _suggItems = [];
let _suggActiveIdx = -1;

function onSearchInput(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    updateSuggestions();
    applyFilters();
  }, 200);
}

function updateSuggestions(){
  const box = document.getElementById('searchSuggest');
  if(IS_PAGINATED){ box.style.display = 'none'; return; } // full dataset isn't loaded client-side; search box alone drives server search
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  _suggActiveIdx = -1;
  if(!q){ box.style.display = 'none'; _suggItems = []; return; }

  const items = [];
  const seen = new Set();

  // Narrator matches
  [...new Set(ALL_ENTRIES.map(e => e.narrator).filter(Boolean))].forEach(n => {
    if(n.toLowerCase().includes(q) && !seen.has('n:' + n)){
      seen.add('n:' + n);
      items.push({ type: 'narrator', label: n, value: n });
    }
  });
  // Topic matches
  [...new Set(ALL_ENTRIES.map(e => e.topic).filter(Boolean))].forEach(t => {
    if(t.toLowerCase().includes(q) && !seen.has('t:' + t)){
      seen.add('t:' + t);
      items.push({ type: 'topic', label: t, value: t });
    }
  });
  // Text snippet matches (Arabic or English content)
  let textMatches = 0;
  for(const e of ALL_ENTRIES){
    if(textMatches >= 4) break;
    const hay = ((e.arabic_text || '') + ' ' + (e.english_text || '')).toLowerCase();
    if(hay.includes(q)){
      const src = (e.english_text || e.arabic_text || '');
      const idx = src.toLowerCase().indexOf(q);
      const start = Math.max(0, idx - 20);
      const snippet = (start > 0 ? '…' : '') + src.slice(start, idx + q.length + 30) + '…';
      items.push({ type: 'text', label: snippet, value: q, entryId: e.id });
      textMatches++;
    }
  }

  _suggItems = items.slice(0, 8);
  renderSuggestions(q);
}

function renderSuggestions(q){
  const box = document.getElementById('searchSuggest');
  if(!_suggItems.length){ box.innerHTML = '<div class="sugg-empty">No matches yet — keep typing or press search.</div>'; box.style.display = 'block'; return; }
  const reQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const rx = new RegExp('(' + reQ + ')', 'ig');
  box.innerHTML = _suggItems.map((it, i) => {
    const tagLbl = it.type === 'narrator' ? '👤' : it.type === 'topic' ? '🏷' : 'text';
    const highlighted = esc(it.label).replace(rx, '<mark>$1</mark>');
    return `<div class="sugg-item${i === _suggActiveIdx ? ' active-sugg' : ''}" onclick="selectSuggestion(${i})">
      <span class="sugg-tag ${it.type}">${tagLbl}</span>
      <span class="sugg-label">${highlighted}</span>
    </div>`;
  }).join('');
  box.style.display = 'block';
}

function selectSuggestion(i){
  const it = _suggItems[i];
  if(!it) return;
  const box = document.getElementById('searchSuggest');
  if(it.type === 'narrator'){
    document.getElementById('narratorFilter').value = it.value;
    document.getElementById('searchInput').value = '';
  } else if(it.type === 'topic'){
    document.getElementById('topicFilter').value = it.value;
    document.getElementById('searchInput').value = '';
  } else {
    document.getElementById('searchInput').value = it.value;
  }
  box.style.display = 'none';
  applyFilters();
}

function onSearchKeydown(e){
  const box = document.getElementById('searchSuggest');
  if(box.style.display !== 'block' || !_suggItems.length) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); _suggActiveIdx = Math.min(_suggActiveIdx + 1, _suggItems.length - 1); renderSuggestions(document.getElementById('searchInput').value.trim().toLowerCase()); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); _suggActiveIdx = Math.max(_suggActiveIdx - 1, 0); renderSuggestions(document.getElementById('searchInput').value.trim().toLowerCase()); }
  else if(e.key === 'Enter'){ if(_suggActiveIdx >= 0){ e.preventDefault(); selectSuggestion(_suggActiveIdx); } else { box.style.display = 'none'; applyFilters(); } }
  else if(e.key === 'Escape'){ box.style.display = 'none'; }
}

document.addEventListener('click', e => {
  const box = document.getElementById('searchSuggest');
  const bar = document.querySelector('.searchbar');
  if(box && bar && !bar.contains(e.target)) box.style.display = 'none';
});

function runSearch(){ document.getElementById('searchSuggest').style.display = 'none'; applyFilters(); }

function copyEntry(id){
  const e = ALL_ENTRIES.find(x => x.id === id);
  if(!e) return;
  const text = e.arabic_text + (e.english_text ? '\n\n' + e.english_text : '') + '\n\n— ' + (e.narrator || '') + (CURRENT_BOOK ? ', ' + CURRENT_BOOK.title_en : '');
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard'));
}

function shareEntry(id){
  const e = ALL_ENTRIES.find(x => x.id === id);
  if(!e) return;
  const text = e.arabic_text + (e.english_text ? '\n\n' + e.english_text : '');
  const url = window.location.origin + window.location.pathname + '?book=' + (CURRENT_BOOK.slug) + '&entry=' + id;
  if(navigator.share){
    navigator.share({ title: CURRENT_BOOK.title_en, text, url }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text + '\n' + url).then(() => toast('Copied share text + link'));
  }
}

function toggleNoteBox(id){
  const box = document.getElementById('noteBox-' + id);
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

async function saveNote(id){
  const input = document.getElementById('noteInput-' + id);
  const text = input.value.trim();
  if(!text) return;
  await fetch(SB_URL + '/rest/v1/book_annotations', {
    method: 'POST',
    headers: { ...HDR, 'Content-Type': 'application/json', Prefer: 'return=representation' },
    body: JSON.stringify({ entry_id: id, device_id: DEVICE_ID, kind: 'note', note_text: text, source_table: CURRENT_BOOK.source_table || 'book_entries' })
  });
  input.value = '';
  await loadAnnotations();
  if(IS_PAGINATED) renderEntries(ALL_ENTRIES); else applyFilters();
  toast('Note saved');
}

// ---- Highlight-on-selection ----
document.addEventListener('mouseup', showSelPopup);
document.addEventListener('touchend', showSelPopup);
function showSelPopup(e){
  const sel = window.getSelection();
  const popup = document.getElementById('selPopup');
  if(!sel || sel.isCollapsed || !sel.toString().trim()){ popup.style.display = 'none'; return; }
  const anchorNode = sel.anchorNode;
  const container = anchorNode && anchorNode.parentElement ? anchorNode.parentElement.closest('.arabic-text') : null;
  if(!container){ popup.style.display = 'none'; return; }
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  popup.style.left = Math.max(4, rect.left) + 'px';
  popup.style.top = Math.max(4, rect.top - 42) + 'px';
  popup.style.display = 'block';
  popup._selectedText = sel.toString().trim();
  popup._entryId = container.closest('.entry-card').dataset.entryId;
}
async function highlightSelection(){
  const popup = document.getElementById('selPopup');
  const text = popup._selectedText;
  const entryId = popup._entryId;
  popup.style.display = 'none';
  if(!text || !entryId) return;
  await fetch(SB_URL + '/rest/v1/book_annotations', {
    method: 'POST',
    headers: { ...HDR, 'Content-Type': 'application/json', Prefer: 'return=representation' },
    body: JSON.stringify({ entry_id: +entryId, device_id: DEVICE_ID, kind: 'highlight', selected_text: text, source_table: CURRENT_BOOK.source_table || 'book_entries' })
  });
  await loadAnnotations();
  if(IS_PAGINATED) renderEntries(ALL_ENTRIES); else applyFilters();
  toast('Highlighted');
}

// ---- Read aloud (Web Speech API) ----
let _speakingId = null;
function speakEntry(id){
  if(!('speechSynthesis' in window)){ toast('Speech not supported on this browser'); return; }
  const wasSpeaking = _speakingId;
  window.speechSynthesis.cancel();
  resetSpeakButtons();
  if(wasSpeaking === id) { _speakingId = null; return; } // acted as a stop toggle

  const e = ALL_ENTRIES.find(x => x.id === id);
  if(!e) return;
  const btn = document.getElementById('speakBtn-' + id);

  const uttAr = new SpeechSynthesisUtterance(e.arabic_text || '');
  uttAr.lang = 'ar-SA';
  uttAr.rate = 0.85;

  uttAr.onstart = () => { _speakingId = id; if(btn){ btn.classList.add('playing'); btn.textContent = '⏹ Stop'; } };
  uttAr.onend = () => {
    if(e.english_text){
      const uttEn = new SpeechSynthesisUtterance(e.english_text);
      uttEn.lang = 'en-US';
      uttEn.rate = 0.95;
      uttEn.onend = () => { _speakingId = null; if(btn){ btn.classList.remove('playing'); btn.textContent = '🔊 Listen'; } };
      uttEn.onerror = uttEn.onend;
      window.speechSynthesis.speak(uttEn);
    } else {
      _speakingId = null; if(btn){ btn.classList.remove('playing'); btn.textContent = '🔊 Listen'; }
    }
  };
  uttAr.onerror = () => { _speakingId = null; if(btn){ btn.classList.remove('playing'); btn.textContent = '🔊 Listen'; } };

  window.speechSynthesis.speak(uttAr);
}
function resetSpeakButtons(){
  document.querySelectorAll('.speak-btn').forEach(b => { b.classList.remove('playing'); b.textContent = '🔊 Listen'; });
}
// Stop playback if the user navigates away from the entries
window.addEventListener('beforeunload', () => { if('speechSynthesis' in window) window.speechSynthesis.cancel(); });

// ---- Add to Presentation (shares the same basket the rest of the site uses) ----
function addEntryToPresentation(id){
  const e = ALL_ENTRIES.find(x => x.id === id);
  if(!e) return;
  const key = 'presentationBasket';
  let existing = [];
  try { existing = JSON.parse(localStorage.getItem(key) || '[]'); } catch(err){}
  const reference = (e.narrator ? e.narrator + ' — ' : '') + (CURRENT_BOOK.title_en || CURRENT_BOOK.title_ar);
  const already = existing.find(s => s.type === 'hadith' && s.sourceUrl === ('books.html?book=' + CURRENT_BOOK.slug + '&entry=' + id));
  if(already){ toast('Already in presentation'); return; }
  existing.push({
    type: 'hadith',
    id: 'book_' + id + '_' + Date.now(),
    title: e.topic || reference,
    reference: reference,
    text: e.english_text || '',
    arabic: e.arabic_text || '',
    speakerNotes: e.grade ? ('Grade: ' + e.grade + (e.grader ? ' — ' + e.grader : '')) : '',
    sourceUrl: 'books.html?book=' + CURRENT_BOOK.slug + '&entry=' + id
  });
  try { localStorage.setItem(key, JSON.stringify(existing)); } catch(err){}
  toast('✓ Added to presentation (' + existing.length + ' slides)');
}

// ---- Save to Research (own lightweight collection picker; research_collections/items are shared tables) ----
let _rpEntryId = null;
async function openResearchPicker(id){
  _rpEntryId = id;
  const modal = document.getElementById('researchModal');
  modal.style.display = 'flex';
  const list = document.getElementById('rpCollectionList');
  list.innerHTML = 'Loading collections...';
  const res = await fetch(SB_URL + '/rest/v1/research_collections?select=id,title&order=created_at.desc', { headers: HDR });
  const cols = res.ok ? await res.json() : [];
  if(!cols.length){
    list.innerHTML = '<div style="color:#8a7a5a;font-size:13px;margin-bottom:8px;">No collections yet — create one below.</div>';
  } else {
    list.innerHTML = cols.map(c => `<button class="qbtn" style="display:block;width:100%;text-align:left;margin-bottom:6px;" onclick="saveEntryToCollection('${c.id}')">${esc(c.title)}</button>`).join('');
  }
}
function closeResearchPicker(){
  document.getElementById('researchModal').style.display = 'none';
  document.getElementById('rpNewName').value = '';
}
async function createAndSaveCollection(){
  const name = document.getElementById('rpNewName').value.trim();
  if(!name){ toast('Enter a collection name'); return; }
  const res = await fetch(SB_URL + '/rest/v1/research_collections', {
    method: 'POST',
    headers: { ...HDR, 'Content-Type': 'application/json', Prefer: 'return=representation' },
    body: JSON.stringify({ title: name, visibility: 'private' })
  });
  const rows = await res.json();
  if(!res.ok || !rows[0]){ toast('Could not create collection'); return; }
  saveEntryToCollection(rows[0].id);
}
async function saveEntryToCollection(collectionId){
  const e = ALL_ENTRIES.find(x => x.id === _rpEntryId);
  if(!e) return;
  const res = await fetch(SB_URL + '/rest/v1/research_items', {
    method: 'POST',
    headers: { ...HDR, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      collection_id: collectionId,
      item_type: 'hadith',
      title: (e.narrator || 'Hadith') + ' — ' + (CURRENT_BOOK.title_en || CURRENT_BOOK.title_ar),
      content: (e.arabic_text + (e.english_text ? '\n' + e.english_text : '')).slice(0, 500),
      source_table: CURRENT_BOOK.source_table || 'book_entries',
      source_id: String(e.id)
    })
  });
  if(!res.ok){ toast('Could not save to research'); return; }
  closeResearchPicker();
  toast('✅ Saved to Research');
}

let toastTimer;
function toast(msg){
  let t = document.getElementById('qhToast');
  if(!t){ t = document.createElement('div'); t.id = 'qhToast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#3A2E1A;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:99999;font-family:EB Garamond,serif;';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 1800);
}
