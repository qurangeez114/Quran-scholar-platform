<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books Library — Quran Hikma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'EB Garamond','Georgia',serif;background:#FDFAF4;color:#3A2E1A;padding-bottom:70px}
  .topbar{background:#FFF8E8;border-bottom:1px solid #E8DDC0;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
  .topbar h1{font-size:19px;margin:0;flex:1;color:#5A3A10}
  .qbtn{background:#fff;border:1.5px solid #D4A830;color:#7A5010;border-radius:20px;padding:7px 14px;font-family:'EB Garamond',serif;font-size:14px;font-weight:600;cursor:pointer}
  .qbtn.active{background:#B8902A;color:#fff}
  .qbtn.ghost{border-color:#ccc;color:#666}

  /* ---- Library grid ---- */
  #library{padding:16px}
  .book-card{background:#fff;border:1px solid #E8DDC0;border-radius:14px;padding:18px;margin-bottom:14px;cursor:pointer;transition:box-shadow .15s}
  .book-card:active{box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .book-title-ar{font-family:'Amiri',serif;font-size:26px;color:#3A2E1A;margin:0 0 4px;text-align:right;direction:rtl}
  .book-title-en{font-size:15px;color:#7A5010;font-weight:600;margin:0 0 8px}
  .book-meta{font-size:12.5px;color:#8a7a5a;line-height:1.6}
  .book-desc{font-size:13.5px;color:#555;margin-top:8px;line-height:1.6}
  .cat-pill{display:inline-block;background:#F3E9CE;color:#7A5010;font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px;margin-bottom:8px}

  /* ---- Reader ---- */
  #reader{display:none;padding:14px}
  .searchbar{display:flex;gap:8px;margin-bottom:12px}
  .searchbar input{flex:1;padding:10px 14px;border-radius:20px;border:1.5px solid #E8DDC0;font-family:'EB Garamond',serif;font-size:15px}
  #searchSuggest{display:none;position:absolute;top:44px;left:0;right:46px;background:#fff;border:1.5px solid #E8DDC0;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:60;max-height:280px;overflow-y:auto;}
  .sugg-item{padding:9px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #F5EFDD;}
  .sugg-item:last-child{border-bottom:none}
  .sugg-item:hover, .sugg-item.active-sugg{background:#FDF5DE}
  .sugg-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;flex-shrink:0;}
  .sugg-tag.narrator{background:#EFE6F5;color:#6A3E8A}
  .sugg-tag.topic{background:#E4F0E9;color:#2E7D32}
  .sugg-tag.text{background:#FDF0D5;color:#9A6A00}
  .sugg-label{color:#3A2E1A;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sugg-label mark{background:#FFE58A;padding:0;}
  .sugg-empty{padding:10px 14px;font-size:13px;color:#8a7a5a;font-style:italic;}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filter-row select{padding:7px 10px;border-radius:10px;border:1.5px solid #E8DDC0;font-family:'EB Garamond',serif;font-size:13.5px;background:#fff;color:#5A3A10}
  #entryCount{font-size:12.5px;color:#8a7a5a;text-align:center;margin-bottom:10px}

  .entry-card{background:#fff;border:1px solid #E8DDC0;border-left:4px solid #B8902A;border-radius:10px;padding:16px;margin-bottom:14px}
  .entry-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:9px}
  .badge.narrator{background:#EFE6F5;color:#6A3E8A}
  .badge.topic{background:#E4F0E9;color:#2E7D32}
  .badge.grade-sahih{background:#E4F0E9;color:#2E7D32}
  .badge.grade-hasan{background:#FFF3D6;color:#9A6A00}
  .badge.grade-daif{background:#FBE4E4;color:#B23A3A}
  .arabic-text{font-family:'Amiri',serif;font-size:20px;line-height:2.1;direction:rtl;text-align:right;color:#241a0a;user-select:text;margin-bottom:10px}
  .english-text{font-size:14.5px;color:#444;line-height:1.7;margin-bottom:8px}
  .grade-note{font-size:12px;color:#8a7a5a;font-style:italic;margin-bottom:10px}
  .entry-actions{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid #F0E8D5;padding-top:10px}
  .act-btn{background:#FBF6E9;border:1px solid #E8DDC0;color:#7A5010;border-radius:16px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'EB Garamond',serif}
  .act-btn:active{background:#F3E9CE}
  .act-btn.playing{background:#3A2E1A;color:#fff;border-color:#3A2E1A}
  mark.hl{background:#FFE58A;padding:0 1px;border-radius:2px}
  .note-box{margin-top:10px;background:#FFFBF0;border:1px dashed #D4A830;border-radius:8px;padding:10px;font-size:13px;color:#5A3A10}
  .note-box textarea{width:100%;border:1px solid #E8DDC0;border-radius:6px;padding:8px;font-family:'EB Garamond',serif;font-size:13.5px;resize:vertical;min-height:60px}

  /* selection popup */
  #selPopup{display:none;position:fixed;z-index:9999;background:#3A2E1A;color:#fff;border-radius:8px;padding:6px 4px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  #selPopup button{background:none;border:none;color:#fff;font-size:13px;padding:6px 10px;cursor:pointer;font-family:'EB Garamond',serif}

  #emptyState{text-align:center;color:#8a7a5a;padding:40px 20px;font-size:14px}
  .group-header{font-family:'EB Garamond',serif;font-weight:700;font-size:15px;color:#5A3A10;background:#F3E9CE;padding:8px 14px;border-radius:8px;margin:18px 0 10px;position:sticky;top:0;z-index:5}
  .group-header:first-child{margin-top:0}

  #bottom-nav {
    position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; top: auto !important;
    width: 100% !important; height: 54px !important; background: #FDFAF4 !important;
    border-top: 1.5px solid #E8DDC0 !important; display: flex !important; flex-direction: row !important;
    z-index: 9999 !important; box-shadow: 0 -2px 8px rgba(0,0,0,0.10) !important; overflow: hidden !important;
  }
  .bnav-btn {
    flex: 1 1 0 !important; display: flex !important; flex-direction: column !important;
    align-items: center !important; justify-content: center !important; gap: 1px !important;
    background: none !important; border: none !important; border-right: 1px solid #F0EAE0 !important;
    cursor: pointer !important; padding: 4px 1px !important; color: #AAA !important; font-size: 7px !important;
    font-weight: 700 !important; text-transform: uppercase !important; letter-spacing: 0 !important;
    min-width: 0 !important; max-width: 12.5% !important; overflow: hidden !important;
    white-space: nowrap !important; text-overflow: clip !important;
  }
  .bnav-btn:last-child { border-right: none !important; }
  .bnav-btn:active { background: #FDF5DE !important; }
  .bnav-btn.active { color: #B8902A !important; background: #FDF8EE !important; }
  .bnav-btn .bni { font-size: 14px !important; line-height: 1 !important; }
</style>
</head>
<body>

<div class="topbar">
  <button class="qbtn ghost" id="backBtn" onclick="goBack()">← Back</button>
  <h1 id="pageTitle">📚 Books Library</h1>
</div>

<div id="library">
  <div id="bookCards"></div>
</div>

<div id="reader">
  <div class="searchbar" style="position:relative;">
    <input type="text" id="searchInput" placeholder="Search text, narrator, or topic..." autocomplete="off"
      oninput="onSearchInput()" onfocus="onSearchInput()" onkeydown="onSearchKeydown(event)">
    <button class="qbtn" onclick="runSearch()">🔍</button>
    <div id="searchSuggest"></div>
  </div>
  <div class="filter-row" style="margin-bottom:6px;">
    <span style="font-size:12.5px;color:#8a7a5a;align-self:center;">Group by:</span>
    <button class="qbtn" id="groupNoneBtn" onclick="setGroupMode('none')">None</button>
    <button class="qbtn" id="groupNarratorBtn" onclick="setGroupMode('narrator')">👤 Narrator</button>
    <button class="qbtn" id="groupTopicBtn" onclick="setGroupMode('topic')">🏷 Topic</button>
  </div>
  <div class="filter-row">
    <select id="narratorFilter" onchange="applyFilters()"><option value="">All narrators</option></select>
    <select id="topicFilter" onchange="applyFilters()"><option value="">All topics</option></select>
    <button class="qbtn ghost" onclick="clearFilters()">Clear filters</button>
  </div>
  <div id="entryCount"></div>
  <div id="entries"></div>
</div>

<div id="selPopup"><button onclick="highlightSelection()">🖍 Highlight</button></div>

<div id="researchModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9998;align-items:flex-end;justify-content:center;">
  <div style="background:#FDFAF4;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;max-height:70vh;overflow-y:auto;">
    <div style="font-weight:700;color:#5A3A10;margin-bottom:12px;font-size:16px;">Save to Research Collection</div>
    <div id="rpCollectionList"></div>
    <div style="margin-top:12px;border-top:1px solid #E8DDC0;padding-top:12px;">
      <div style="font-size:13px;color:#8a7a5a;margin-bottom:6px;">Or create a new collection:</div>
      <input type="text" id="rpNewName" placeholder="Collection name" style="width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #E8DDC0;font-family:'EB Garamond',serif;font-size:14px;margin-bottom:8px;">
      <button class="qbtn" onclick="createAndSaveCollection()">Create & Save</button>
      <button class="qbtn ghost" onclick="closeResearchPicker()">Cancel</button>
    </div>
  </div>
</div>

<nav id="bottom-nav">
  <button class="bnav-btn " onclick="location.href='index.html'"><span class="bni">📖</span><span>Quran</span></button>
  <button class="bnav-btn " onclick="location.href='research.html'"><span class="bni">🔬</span><span>Research</span></button>
  <button class="bnav-btn " onclick="location.href='themes.html'"><span class="bni">🗂️</span><span>Themes</span></button>
  <button class="bnav-btn " onclick="location.href='madhhab.html'"><span class="bni">⚖️</span><span>Madhhab</span></button>
  <button class="bnav-btn " onclick="location.href='sira.html'"><span class="bni">🕌</span><span>Sīra</span></button>
  <button class="bnav-btn " onclick="location.href='stories.html'"><span class="bni">📚</span><span>Stories</span></button>
  <button class="bnav-btn active" onclick="location.href='books.html'"><span class="bni">📕</span><span>Books</span></button>
  <button class="bnav-btn" onclick="location.href='contradiction.html'"><span class="bni">⚔️</span><span>Tensions</span></button>
</nav>

<script>
const SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDR = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

function getDeviceId(){
  let id = localStorage.getItem('qh_device_id');
  if(!id){ id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('qh_device_id', id); }
  return id;
}
const DEVICE_ID = getDeviceId();

let CURRENT_BOOK = null;
let ALL_ENTRIES = [];
let ANNOTATIONS = {}; // entry_id -> {highlights:[], notes:[]}

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadBooks(){
  const res = await fetch(SB_URL + '/rest/v1/books?select=*&order=id', { headers: HDR });
  const books = await res.json();
  const c = document.getElementById('bookCards');
  if(!books.length){ c.innerHTML = '<div id="emptyState">No books added yet.</div>'; return; }
  c.innerHTML = books.map(b => `
    <div class="book-card" onclick="openBook(${b.id})">
      <span class="cat-pill">${esc(b.category || 'book')}</span>
      <div class="book-title-ar">${esc(b.title_ar)}</div>
      <div class="book-title-en">${esc(b.title_en || '')}</div>
      <div class="book-meta">
        ${b.author_en ? esc(b.author_en) + ' · ' : ''}${esc(b.author_dates || '')}<br>
        ${b.editor ? 'Edited by ' + esc(b.editor) + ' · ' : ''}${esc(b.publisher || '')}
        ${b.total_volumes ? ' · ' + b.total_volumes + ' volumes' : ''}
      </div>
      <div class="book-desc">${esc(b.description || '')}</div>
    </div>`).join('');
}

async function openBook(id){
  const res = await fetch(SB_URL + '/rest/v1/books?id=eq.' + id + '&select=*', { headers: HDR });
  const rows = await res.json();
  CURRENT_BOOK = rows[0];
  document.getElementById('pageTitle').textContent = '📖 ' + (CURRENT_BOOK.title_en || CURRENT_BOOK.title_ar);
  document.getElementById('library').style.display = 'none';
  document.getElementById('reader').style.display = 'block';
  await loadEntries();
}

function goBack(){
  if(document.getElementById('reader').style.display === 'block'){
    document.getElementById('reader').style.display = 'none';
    document.getElementById('library').style.display = 'block';
    document.getElementById('pageTitle').textContent = '📚 Books Library';
    CURRENT_BOOK = null;
  } else {
    window.location.href = 'themes.html';
  }
}

async function loadEntries(){
  const res = await fetch(SB_URL + '/rest/v1/book_entries?book_id=eq.' + CURRENT_BOOK.id + '&select=*&order=entry_number', { headers: HDR });
  ALL_ENTRIES = await res.json();
  await loadAnnotations();
  populateFilterOptions();
  GROUP_MODE = 'none';
  document.getElementById('groupNoneBtn').classList.add('active');
  document.getElementById('groupNarratorBtn').classList.remove('active');
  document.getElementById('groupTopicBtn').classList.remove('active');
  renderEntries(ALL_ENTRIES);
}

async function loadAnnotations(){
  if(!ALL_ENTRIES.length) return;
  const ids = ALL_ENTRIES.map(e => e.id).join(',');
  const res = await fetch(SB_URL + '/rest/v1/book_annotations?entry_id=in.(' + ids + ')&device_id=eq.' + encodeURIComponent(DEVICE_ID) + '&select=*', { headers: HDR });
  const rows = await res.json();
  ANNOTATIONS = {};
  rows.forEach(r => {
    if(!ANNOTATIONS[r.entry_id]) ANNOTATIONS[r.entry_id] = { highlights: [], notes: [] };
    if(r.kind === 'highlight') ANNOTATIONS[r.entry_id].highlights.push(r);
    else ANNOTATIONS[r.entry_id].notes.push(r);
  });
}

function populateFilterOptions(){
  const narrators = [...new Set(ALL_ENTRIES.map(e => e.narrator).filter(Boolean))].sort();
  const topics = [...new Set(ALL_ENTRIES.map(e => e.topic).filter(Boolean))].sort();
  const nf = document.getElementById('narratorFilter'), tf = document.getElementById('topicFilter');
  nf.innerHTML = '<option value="">All narrators</option>' + narrators.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  tf.innerHTML = '<option value="">All topics</option>' + topics.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
}

function applyHighlights(text, entryId){
  const hls = (ANNOTATIONS[entryId] && ANNOTATIONS[entryId].highlights) || [];
  let out = esc(text);
  hls.forEach(h => {
    if(!h.selected_text) return;
    const escSel = esc(h.selected_text);
    if(out.includes(escSel)) out = out.replace(escSel, '<mark class="hl">' + escSel + '</mark>');
  });
  return out;
}

function gradeClass(grade){
  if(!grade) return '';
  const g = grade.toLowerCase();
  if(g.includes('sahih')) return 'grade-sahih';
  if(g.includes('hasan')) return 'grade-hasan';
  if(g.includes('daif') || g.includes("da'if")) return 'grade-daif';
  return '';
}

let GROUP_MODE = 'none'; // 'none' | 'narrator' | 'topic'

function setGroupMode(mode){
  GROUP_MODE = mode;
  ['groupNoneBtn','groupNarratorBtn','groupTopicBtn'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(mode === 'none' ? 'groupNoneBtn' : mode === 'narrator' ? 'groupNarratorBtn' : 'groupTopicBtn').classList.add('active');
  applyFilters();
}

function entryCardHTML(e){
  const notes = (ANNOTATIONS[e.id] && ANNOTATIONS[e.id].notes) || [];
  return `
    <div class="entry-card" data-entry-id="${e.id}">
      <div class="entry-badges">
        ${e.narrator ? `<span class="badge narrator">👤 ${esc(e.narrator)}</span>` : ''}
        ${e.topic ? `<span class="badge topic">🏷 ${esc(e.topic)}</span>` : ''}
        ${e.grade ? `<span class="badge ${gradeClass(e.grade)}">${esc(e.grade)}</span>` : ''}
      </div>
      <div class="arabic-text" data-raw="${esc(e.arabic_text).replace(/"/g,'&quot;')}">${applyHighlights(e.arabic_text, e.id)}</div>
      ${e.english_text ? `<div class="english-text">${esc(e.english_text)}</div>` : ''}
      ${e.grader ? `<div class="grade-note">— ${esc(e.grader)}${e.page_ref ? ' · ' + esc(e.page_ref) : ''}</div>` : ''}
      <div class="entry-actions">
        <button class="act-btn speak-btn" id="speakBtn-${e.id}" onclick="speakEntry(${e.id})">🔊 Listen</button>
        <button class="act-btn" onclick="copyEntry(${e.id})">📋 Copy</button>
        <button class="act-btn" onclick="toggleNoteBox(${e.id})">✏️ Note${notes.length ? ' (' + notes.length + ')' : ''}</button>
        <button class="act-btn" onclick="shareEntry(${e.id})">↗ Share</button>
        <button class="act-btn" onclick="addEntryToPresentation(${e.id})">＋ Add to Presentation</button>
        <button class="act-btn" onclick="openResearchPicker(${e.id})">📚 Save to Research</button>
      </div>
      <div class="note-box" id="noteBox-${e.id}" style="display:none;">
        ${notes.map(n => `<div style="margin-bottom:6px;">${esc(n.note_text)}</div>`).join('')}
        <textarea id="noteInput-${e.id}" placeholder="Add a note..."></textarea>
        <button class="qbtn" style="margin-top:6px;" onclick="saveNote(${e.id})">Save note</button>
      </div>
    </div>`;
}

function renderEntries(list){
  document.getElementById('entryCount').textContent = list.length + ' entries' + (list.length !== ALL_ENTRIES.length ? ' (filtered from ' + ALL_ENTRIES.length + ')' : '');
  const c = document.getElementById('entries');
  if(!list.length){ c.innerHTML = '<div id="emptyState">No entries match your search.</div>'; return; }

  if(GROUP_MODE === 'none'){
    c.innerHTML = list.map(entryCardHTML).join('');
    return;
  }

  const key = GROUP_MODE === 'narrator' ? 'narrator' : 'topic';
  const groups = {};
  const order = [];
  list.forEach(e => {
    const g = e[key] || (GROUP_MODE === 'narrator' ? 'Unattributed' : 'Uncategorized');
    if(!groups[g]){ groups[g] = []; order.push(g); }
    groups[g].push(e);
  });
  order.sort((a, b) => a.localeCompare(b, 'ar'));
  const icon = GROUP_MODE === 'narrator' ? '👤' : '🏷';
  c.innerHTML = order.map(g => `
    <div class="group-header">${icon} ${esc(g)} <span style="font-weight:400;color:#8a7a5a;">(${groups[g].length})</span></div>
    ${groups[g].map(entryCardHTML).join('')}
  `).join('');
}

function applyFilters(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const nf = document.getElementById('narratorFilter').value;
  const tf = document.getElementById('topicFilter').value;
  let list = ALL_ENTRIES;
  if(nf) list = list.filter(e => e.narrator === nf);
  if(tf) list = list.filter(e => e.topic === tf);
  if(q) list = list.filter(e =>
    (e.arabic_text || '').toLowerCase().includes(q) ||
    (e.english_text || '').toLowerCase().includes(q) ||
    (e.narrator || '').toLowerCase().includes(q) ||
    (e.topic || '').toLowerCase().includes(q));
  renderEntries(list);
}
function clearFilters(){
  document.getElementById('searchInput').value = '';
  document.getElementById('narratorFilter').value = '';
  document.getElementById('topicFilter').value = '';
  document.getElementById('searchSuggest').style.display = 'none';
  renderEntries(ALL_ENTRIES);
}
let searchTimer;
let _suggItems = [];
let _suggActiveIdx = -1;

function onSearchInput(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    updateSuggestions();
    applyFilters();
  }, 200);
}

function updateSuggestions(){
  const box = document.getElementById('searchSuggest');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  _suggActiveIdx = -1;
  if(!q){ box.style.display = 'none'; _suggItems = []; return; }

  const items = [];
  const seen = new Set();

  // Narrator matches
  [...new Set(ALL_ENTRIES.map(e => e.narrator).filter(Boolean))].forEach(n => {
    if(n.toLowerCase().includes(q) && !seen.has('n:' + n)){
      seen.add('n:' + n);
      items.push({ type: 'narrator', label: n, value: n });
    }
  });
  // Topic matches
  [...new Set(ALL_ENTRIES.map(e => e.topic).filter(Boolean))].forEach(t => {
    if(t.toLowerCase().includes(q) && !seen.has('t:' + t)){
      seen.add('t:' + t);
      items.push({ type: 'topic', label: t, value: t });
    }
  });
  // Text snippet matches (Arabic or English content)
  let textMatches = 0;
  for(const e of ALL_ENTRIES){
    if(textMatches >= 4) break;
    const hay = ((e.arabic_text || '') + ' ' + (e.english_text || '')).toLowerCase();
    if(hay.includes(q)){
      const src = (e.english_text || e.arabic_text || '');
      const idx = src.toLowerCase().indexOf(q);
      const start = Math.max(0, idx - 20);
      const snippet = (start > 0 ? '…' : '') + src.slice(start, idx + q.length + 30) + '…';
      items.push({ type: 'text', label: snippet, value: q, entryId: e.id });
      textMatches++;
    }
  }

  _suggItems = items.slice(0, 8);
  renderSuggestions(q);
}

function renderSuggestions(q){
  const box = document.getElementById('searchSuggest');
  if(!_suggItems.length){ box.innerHTML = '<div class="sugg-empty">No matches yet — keep typing or press search.</div>'; box.style.display = 'block'; return; }
  const reQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const rx = new RegExp('(' + reQ + ')', 'ig');
  box.innerHTML = _suggItems.map((it, i) => {
    const tagLbl = it.type === 'narrator' ? '👤' : it.type === 'topic' ? '🏷' : 'text';
    const highlighted = esc(it.label).replace(rx, '<mark>$1</mark>');
    return `<div class="sugg-item${i === _suggActiveIdx ? ' active-sugg' : ''}" onclick="selectSuggestion(${i})">
      <span class="sugg-tag ${it.type}">${tagLbl}</span>
      <span class="sugg-label">${highlighted}</span>
    </div>`;
  }).join('');
  box.style.display = 'block';
}

function selectSuggestion(i){
  const it = _suggItems[i];
  if(!it) return;
  const box = document.getElementById('searchSuggest');
  if(it.type === 'narrator'){
    document.getElementById('narratorFilter').value = it.value;
    document.getElementById('searchInput').value = '';
  } else if(it.type === 'topic'){
    document.getElementById('topicFilter').value = it.value;
    document.getElementById('searchInput').value = '';
  } else {
    document.getElementById('searchInput').value = it.value;
  }
  box.style.display = 'none';
  applyFilters();
}

function onSearchKeydown(e){
  const box = document.getElementById('searchSuggest');
  if(box.style.display !== 'block' || !_suggItems.length) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); _suggActiveIdx = Math.min(_suggActiveIdx + 1, _suggItems.length - 1); renderSuggestions(document.getElementById('searchInput').value.trim().toLowerCase()); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); _suggActiveIdx = Math.max(_suggActiveIdx - 1, 0); renderSuggestions(document.getElementById('searchInput').value.trim().toLowerCase()); }
  else if(e.key === 'Enter'){ if(_suggActiveIdx >= 0){ e.preventDefault(); selectSuggestion(_suggActiveIdx); } else { box.style.display = 'none'; applyFilters(); } }
  else if(e.key === 'Escape'){ box.style.display = 'none'; }
}

document.addEventListener('click', e => {
  const box = document.getElementById('searchSuggest');
  const bar = document.querySelector('.searchbar');
  if(box && bar && !bar.contains(e.target)) box.style.display = 'none';
});

function runSearch(){ document.getElementById('searchSuggest').style.display = 'none'; applyFilters(); }

function copyEntry(id){
  const e = ALL_ENTRIES.find(x => x.id === id);
  if(!e) return;
  const text = e.arabic_text + (e.english_text ? '\n\n' + e.english_text : '') + '\n\n— ' + (e.narrator || '') + (CURRENT_BOOK ? ', ' + CURRENT_BOOK.title_en : '');
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard'));
}

function shareEntry(id){
  const e = ALL_ENTRIES.find(x => x.id === id);
  if(!e) return;
  const text = e.arabic_text + (e.english_text ? '\n\n' + e.english_text : '');
  const url = window.location.origin + window.location.pathname + '?book=' + (CURRENT_BOOK.slug) + '&entry=' + id;
  if(navigator.share){
    navigator.share({ title: CURRENT_BOOK.title_en, text, url }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text + '\n' + url).then(() => toast('Copied share text + link'));
  }
}

function toggleNoteBox(id){
  const box = document.getElementById('noteBox-' + id);
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

async function saveNote(id){
  const input = document.getElementById('noteInput-' + id);
  const text = input.value.trim();
  if(!text) return;
  await fetch(SB_URL + '/rest/v1/book_annotations', {
    method: 'POST',
    headers: { ...HDR, 'Content-Type': 'application/json', Prefer: 'return=representation' },
    body: JSON.stringify({ entry_id: id, device_id: DEVICE_ID, kind: 'note', note_text: text })
  });
  input.value = '';
  await loadAnnotations();
  applyFilters();
  toast('Note saved');
}

// ---- Highlight-on-selection ----
document.addEventListener('mouseup', showSelPopup);
document.addEventListener('touchend', showSelPopup);
function showSelPopup(e){
  const sel = window.getSelection();
  const popup = document.getElementById('selPopup');
  if(!sel || sel.isCollapsed || !sel.toString().trim()){ popup.style.display = 'none'; return; }
  const anchorNode = sel.anchorNode;
  const container = anchorNode && anchorNode.parentElement ? anchorNode.parentElement.closest('.arabic-text') : null;
  if(!container){ popup.style.display = 'none'; return; }
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  popup.style.left = Math.max(4, rect.left) + 'px';
  popup.style.top = Math.max(4, rect.top - 42) + 'px';
  popup.style.display = 'block';
  popup._selectedText = sel.toString().trim();
  popup._entryId = container.closest('.entry-card').dataset.entryId;
}
async function highlightSelection(){
  const popup = document.getElementById('selPopup');
  const text = popup._selectedText;
  const entryId = popup._entryId;
  popup.style.display = 'none';
  if(!text || !entryId) return;
  await fetch(SB_URL + '/rest/v1/book_annotations', {
    method: 'POST',
    headers: { ...HDR, 'Content-Type': 'application/json', Prefer: 'return=representation' },
    body: JSON.stringify({ entry_id: +entryId, device_id: DEVICE_ID, kind: 'highlight', selected_text: text })
  });
  await loadAnnotations();
  applyFilters();
  toast('Highlighted');
}

// ---- Read aloud (Web Speech API) ----
let _speakingId = null;
function speakEntry(id){
  if(!('speechSynthesis' in window)){ toast('Speech not supported on this browser'); return; }
  const wasSpeaking = _speakingId;
  window.speechSynthesis.cancel();
  resetSpeakButtons();
  if(wasSpeaking === id) { _speakingId = null; return; } // acted as a stop toggle

  const e = ALL_ENTRIES.find(x => x.id === id);
  if(!e) return;
  const btn = document.getElementById('speakBtn-' + id);

  const uttAr = new SpeechSynthesisUtterance(e.arabic_text || '');
  uttAr.lang = 'ar-SA';
  uttAr.rate = 0.85;

  uttAr.onstart = () => { _speakingId = id; if(btn){ btn.classList.add('playing'); btn.textContent = '⏹ Stop'; } };
  uttAr.onend = () => {
    if(e.english_text){
      const uttEn = new SpeechSynthesisUtterance(e.english_text);
      uttEn.lang = 'en-US';
      uttEn.rate = 0.95;
      uttEn.onend = () => { _speakingId = null; if(btn){ btn.classList.remove('playing'); btn.textContent = '🔊 Listen'; } };
      uttEn.onerror = uttEn.onend;
      window.speechSynthesis.speak(uttEn);
    } else {
      _speakingId = null; if(btn){ btn.classList.remove('playing'); btn.textContent = '🔊 Listen'; }
    }
  };
  uttAr.onerror = () => { _speakingId = null; if(btn){ btn.classList.remove('playing'); btn.textContent = '🔊 Listen'; } };

  window.speechSynthesis.speak(uttAr);
}
function resetSpeakButtons(){
  document.querySelectorAll('.speak-btn').forEach(b => { b.classList.remove('playing'); b.textContent = '🔊 Listen'; });
}
// Stop playback if the user navigates away from the entries
window.addEventListener('beforeunload', () => { if('speechSynthesis' in window) window.speechSynthesis.cancel(); });

// ---- Add to Presentation (shares the same basket the rest of the site uses) ----
function addEntryToPresentation(id){
  const e = ALL_ENTRIES.find(x => x.id === id);
  if(!e) return;
  const key = 'presentationBasket';
  let existing = [];
  try { existing = JSON.parse(localStorage.getItem(key) || '[]'); } catch(err){}
  const reference = (e.narrator ? e.narrator + ' — ' : '') + (CURRENT_BOOK.title_en || CURRENT_BOOK.title_ar);
  const already = existing.find(s => s.type === 'hadith' && s.sourceUrl === ('books.html?book=' + CURRENT_BOOK.slug + '&entry=' + id));
  if(already){ toast('Already in presentation'); return; }
  existing.push({
    type: 'hadith',
    id: 'book_' + id + '_' + Date.now(),
    title: e.topic || reference,
    reference: reference,
    text: e.english_text || '',
    arabic: e.arabic_text || '',
    speakerNotes: e.grade ? ('Grade: ' + e.grade + (e.grader ? ' — ' + e.grader : '')) : '',
    sourceUrl: 'books.html?book=' + CURRENT_BOOK.slug + '&entry=' + id
  });
  try { localStorage.setItem(key, JSON.stringify(existing)); } catch(err){}
  toast('✓ Added to presentation (' + existing.length + ' slides)');
}

// ---- Save to Research (own lightweight collection picker; research_collections/items are shared tables) ----
let _rpEntryId = null;
async function openResearchPicker(id){
  _rpEntryId = id;
  const modal = document.getElementById('researchModal');
  modal.style.display = 'flex';
  const list = document.getElementById('rpCollectionList');
  list.innerHTML = 'Loading collections...';
  const res = await fetch(SB_URL + '/rest/v1/research_collections?select=id,title&order=created_at.desc', { headers: HDR });
  const cols = res.ok ? await res.json() : [];
  if(!cols.length){
    list.innerHTML = '<div style="color:#8a7a5a;font-size:13px;margin-bottom:8px;">No collections yet — create one below.</div>';
  } else {
    list.innerHTML = cols.map(c => `<button class="qbtn" style="display:block;width:100%;text-align:left;margin-bottom:6px;" onclick="saveEntryToCollection('${c.id}')">${esc(c.title)}</button>`).join('');
  }
}
function closeResearchPicker(){
  document.getElementById('researchModal').style.display = 'none';
  document.getElementById('rpNewName').value = '';
}
async function createAndSaveCollection(){
  const name = document.getElementById('rpNewName').value.trim();
  if(!name){ toast('Enter a collection name'); return; }
  const res = await fetch(SB_URL + '/rest/v1/research_collections', {
    method: 'POST',
    headers: { ...HDR, 'Content-Type': 'application/json', Prefer: 'return=representation' },
    body: JSON.stringify({ title: name, visibility: 'private' })
  });
  const rows = await res.json();
  if(!res.ok || !rows[0]){ toast('Could not create collection'); return; }
  saveEntryToCollection(rows[0].id);
}
async function saveEntryToCollection(collectionId){
  const e = ALL_ENTRIES.find(x => x.id === _rpEntryId);
  if(!e) return;
  const res = await fetch(SB_URL + '/rest/v1/research_items', {
    method: 'POST',
    headers: { ...HDR, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      collection_id: collectionId,
      item_type: 'hadith',
      title: (e.narrator || 'Hadith') + ' — ' + (CURRENT_BOOK.title_en || CURRENT_BOOK.title_ar),
      content: (e.arabic_text + (e.english_text ? '\n' + e.english_text : '')).slice(0, 500),
      source_table: 'book_entries',
      source_id: String(e.id)
    })
  });
  if(!res.ok){ toast('Could not save to research'); return; }
  closeResearchPicker();
  toast('✅ Saved to Research');
}

let toastTimer;
function toast(msg){
  let t = document.getElementById('qhToast');
  if(!t){ t = document.createElement('div'); t.id = 'qhToast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#3A2E1A;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:99999;font-family:EB Garamond,serif;';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 1800);
}
