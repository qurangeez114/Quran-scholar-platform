async function generateRuling(category, topic) {
  const t = topic.replace(/"/g, "'");
  const c = category.replace(/"/g, "'");
  const prompt = "You are an Islamic scholar. For the topic: " + t + " (category: " + c + "), provide the ruling from each major school. Return ONLY a valid JSON object with no markdown, no explanation, starting with { and ending with }. Use these exact keys: topic, category, hanafi, maliki, shafii, hanbali, jafari, zaydi, ibadi, salafi, consensus, disagreement, history, verses, hadiths.";

  let res, attempts = 0;
  while (attempts < 4) {
    attempts++;
    res = await fetch('/claude', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1500,
        messages: [{role: 'user', content: prompt}]
      })
    });
    if (res.ok) break;
    if ([502,503,504,529].includes(res.status)) {
      const wait = attempts * 20000;
      log('⏳ Error ' + res.status + ', waiting ' + (wait/1000) + 's (retry ' + attempts + '/4)');
      await new Promise(r => setTimeout(r, wait));
    } else { throw new Error('HTTP ' + res.status); }
  }
  if (!res.ok) throw new Error('Failed after retries: ' + res.status);

  const data = await res.json();
  const raw = (data.content && data.content[0] && data.content[0].text) || '';
  if (!raw) throw new Error('Empty response. API returned: ' + JSON.stringify(data).substring(0,150));

  // Try parsing
  try { return JSON.parse(raw.trim()); } catch(e) {}
  try { return JSON.parse(raw.replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').trim()); } catch(e) {}
  const s = raw.indexOf('{'), en = raw.lastIndexOf('}');
  if (s !== -1 && en > s) { try { return JSON.parse(raw.substring(s, en+1)); } catch(e) {} }
  try {
    let depth=0, start=-1;
    for (let i=0; i<raw.length; i++) {
      if (raw[i]==='{') { if(start===-1) start=i; depth++; }
      else if (raw[i]==='}' && --depth===0 && start!==-1) { return JSON.parse(raw.substring(start, i+1)); }
    }
  } catch(e) {}
  throw new Error('Parse failed: ' + raw.substring(0,120));
}

async function insertRuling(ruling) {
  // Use upsert to skip duplicates
  const tr = await fetch(SB_URL+'/rest/v1/madhhab_topics?on_conflict=topic,category', {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation,resolution=merge-duplicates'},
    body: JSON.stringify({topic:ruling.topic, category:ruling.category, subcategory:ruling.topic})
  });
  const topics = await tr.json();
  const tid = topics[0]&&topics[0].id;
  if (!tid) {
    // Try to fetch existing topic ID
    const existing = await fetch(SB_URL+'/rest/v1/madhhab_topics?topic=eq.'+encodeURIComponent(ruling.topic)+'&category=eq.'+encodeURIComponent(ruling.category)+'&select=id', {
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    const ex = await existing.json();
    if (!ex[0]||!ex[0].id) throw new Error('No topic ID after upsert');
    return ex[0].id;
  }

  await fetch(SB_URL+'/rest/v1/madhhab_rulings', {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
    body: JSON.stringify({
      topic_id: tid,
      category: ruling.category,
      hanafi_position: ruling.hanafi || ruling.hanafi_position || '',
      maliki_position: ruling.maliki || ruling.maliki_position || '',
      shafii_position: ruling.shafii || ruling.shafii_position || '',
      hanbali_position: ruling.hanbali || ruling.hanbali_position || '',
      jafari_position: ruling.jafari || ruling.jafari_position || '',
      zaydi_position: ruling.zaydi || ruling.zaydi_position || '',
      ibadi_position: ruling.ibadi || ruling.ibadi_position || '',
      salafi_position: ruling.salafi || ruling.salafi_position || '',
      consensus: ruling.consensus || '',
      key_disagreement: ruling.disagreement || ruling.key_disagreement || '',
      historical_consequences: ruling.history || ruling.historical_consequences || '',
      quran_verses: ruling.verses || ruling.quran_verses || [],
      hadith_refs: ruling.hadiths || ruling.hadith_refs || []
    })
  });
  return tid;
}

async function seedCat(cat) {
  stopped = false;
  const btnId = 'btn-'+cat.replace(/[^a-z]/gi,'_');
  const btn = document.getElementById(btnId);
  if (btn) btn.className = 'btn-cat active';
  const topics = CATS[cat];
  log('▶ Starting: '+cat+' ('+topics.length+' topics)');
  document.getElementById('progress').textContent = 'Seeding: '+cat;
  let done = 0;
  for (const topic of topics) {
    if (stopped) { log('⏹ Stopped','err'); return; }
    try {
      const ruling = await generateRuling(cat, topic);
      await insertRuling(ruling);
      done++; totalDone++;
      log('✓ '+topic.substring(0,55), 'ok');
    } catch(e) {
      totalErr++;
      log('✗ '+topic.substring(0,45)+': '+e.message, 'err');
    }
    updateStats();
    await new Promise(r => setTimeout(r, 3000));
  }
  catsDone++;
  if (btn) btn.className = 'btn-cat done';
  log('✅ Done: '+cat+' — '+done+'/'+topics.length, 'ok');
  updateStats();
}

async function seedAll() {
  stopped = false;
  log('🚀 Seeding ALL '+Object.keys(CATS).length+' categories...');
  for (const cat of Object.keys(CATS)) {
    if (stopped) break;
    await seedCat(cat);
    await new Promise(r => setTimeout(r, 5000));
  }
  if (!stopped) { log('🎉 ALL CATEGORIES DONE!', 'ok'); document.getElementById('progress').textContent = 'Complete!'; }
}

function stopSeed() { stopped = true; log('⏹ Stop requested','err'); }
