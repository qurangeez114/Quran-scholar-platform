<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quran Theme Seeder v3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:monospace;background:#0a0a0a;color:#00ff41;padding:16px;max-width:900px;margin:0 auto;}
h1{color:#E8C97B;font-size:17px;margin-bottom:4px;}
.sub{color:#666;font-size:11px;margin-bottom:14px;}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;}
.stat{background:#111;border:1px solid #222;border-radius:6px;padding:8px;text-align:center;}
.stat-n{font-size:18px;font-weight:700;color:#E8C97B;}
.stat-l{font-size:9px;color:#555;margin-top:2px;text-transform:uppercase;}
.bar-wrap{background:#111;border-radius:4px;height:14px;margin:6px 0;overflow:hidden;border:1px solid #222;}
.bar{background:linear-gradient(90deg,#5A3A10,#B8902A,#E8C97B);height:100%;transition:width 0.5s;}
.bar.good{background:linear-gradient(90deg,#0a3a0a,#2E7D32,#00ff41);}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center;}
button{background:#B8902A;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:700;font-family:monospace;}
button:disabled{background:#222;color:#444;cursor:not-allowed;}
button.stop-btn{background:#8B0000;}
button.clear-btn{background:#222;}
input[type=number]{background:#111;color:#E8C97B;border:1px solid #333;padding:5px 8px;width:60px;border-radius:4px;font-family:monospace;font-size:12px;}
select{background:#111;color:#E8C97B;border:1px solid #333;padding:5px 8px;border-radius:4px;font-family:monospace;font-size:12px;}
label{color:#888;font-size:11px;}
.log{background:#050505;border:1px solid #1a1a1a;border-radius:6px;padding:10px;height:300px;overflow-y:auto;font-size:10px;line-height:1.8;margin-top:10px;}
.ok{color:#00ff41;}.err{color:#ff4444;}.info{color:#E8C97B;}.warn{color:#ffaa00;}.skip{color:#333;}
#status{font-size:13px;font-weight:700;color:#E8C97B;margin:6px 0;}
.sura-grid{display:grid;grid-template-columns:repeat(19,1fr);gap:2px;margin:10px 0;}
.sg{width:100%;aspect-ratio:1;border-radius:2px;background:#111;font-size:7px;display:flex;align-items:center;justify-content:center;color:#333;cursor:default;transition:background 0.3s;}
.sg.full{background:#2E7D32;color:#00ff41;}
.sg.partial{background:#5A3A10;color:#B8902A;}
.sg.empty{background:#1a0a0a;color:#333;}
.sg.active{background:#B8902A;color:#fff;animation:pulse 0.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
</style>
</head>
<body>
<h1>📖 Quran Theme Seeder v3 — SMART</h1>
<div class="sub">Per-verse gap detection · Arabic+English context · Auto-retry missed verses · V2 sync after each batch · Target 98%</div>

<div class="stats">
  <div class="stat"><div class="stat-n" id="sn-pct">0%</div><div class="stat-l">Coverage</div></div>
  <div class="stat"><div class="stat-n" id="sn-themed">0</div><div class="stat-l">Verses Themed</div></div>
  <div class="stat"><div class="stat-n" id="sn-added">0</div><div class="stat-l">Added This Run</div></div>
  <div class="stat"><div class="stat-n" id="sn-calls">0</div><div class="stat-l">API Calls</div></div>
  <div class="stat"><div class="stat-n" id="sn-errors">0</div><div class="stat-l">Errors</div></div>
</div>

<div>
  Coverage: <span id="pct-text">0%</span> of 6,211 verses
  <div class="bar-wrap"><div class="bar" id="prog-bar" style="width:0%"></div></div>
</div>

<div id="status">Ready — v3 Smart Seeder</div>

<div class="controls">
  <button onclick="startSeed()" id="btn-start">▶ Start Smart Seeding</button>
  <button class="stop-btn" onclick="stopSeed()" id="btn-stop" disabled>■ Stop</button>
  <button class="clear-btn" onclick="clearLog()">Clear Log</button>
  <label>Start: <input type="number" id="start-sura" min="1" max="114" value="1"></label>
  <label>End: <input type="number" id="end-sura" min="1" max="114" value="114"></label>
  <label>
    Mode:
    <select id="mode-select">
      <option value="gaps">Gaps only (skip complete suras)</option>
      <option value="all">All verses (re-check everything)</option>
    </select>
  </label>
</div>

<!-- Sura coverage grid -->
<div class="sura-grid" id="sura-grid"></div>

<div class="log" id="log"></div>

<script>
const SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDR = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

let running = false;
let addedThisRun = 0, callsMade = 0, errCount = 0;
let suraStats = {}; // sura_id → {total, themed}

function log(msg, cls) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  d.className = cls || 'ok';
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
function clearLog() { document.getElementById('log').innerHTML = ''; }

async function loadCoverage() {
  try {
    // Get per-sura coverage
    const r = await fetch(SB_URL + '/rest/v1/rpc/get_sura_coverage', { method:'POST', headers:{...HDR,'Content-Type':'application/json'}, body:'{}' });
    // Fallback: get counts separately
    const [ayaR, themR] = await Promise.all([
      fetch(SB_URL + '/rest/v1/ayas?select=sura_id,aya_number&limit=10000', { headers: HDR }),
      fetch(SB_URL + '/rest/v1/thematic_cross_references?select=sura,aya&limit=10000', { headers: HDR })
    ]);
    const ayas   = await ayaR.json().catch(() => []);
    const themed = await themR.json().catch(() => []);

    const total   = {};
    const themedM = {};
    (Array.isArray(ayas)   ? ayas   : []).forEach(a => { total[a.sura_id]  = (total[a.sura_id]  || 0) + 1; });
    (Array.isArray(themed) ? themed : []).forEach(t => { themedM[t.sura]   = (themedM[t.sura]   || 0) + 1; });

    // Deduplicate themed (multiple themes per verse)
    const themedUniq = {};
    (Array.isArray(themed) ? themed : []).forEach(t => {
      if (!themedUniq[t.sura]) themedUniq[t.sura] = new Set();
      themedUniq[t.sura].add(t.aya);
    });

    suraStats = {};
    for (let s = 1; s <= 114; s++) {
      suraStats[s] = { total: total[s] || 0, themed: themedUniq[s] ? themedUniq[s].size : 0 };
    }

    const totalVerses  = Object.values(suraStats).reduce((a,b) => a + b.total, 0);
    const themedVerses = Object.values(suraStats).reduce((a,b) => a + b.themed, 0);
    const pct = totalVerses ? Math.round(themedVerses * 100 / totalVerses) : 0;

    document.getElementById('sn-themed').textContent = themedVerses.toLocaleString();
    document.getElementById('sn-pct').textContent = pct + '%';
    document.getElementById('pct-text').textContent = pct + '% (' + themedVerses + '/' + totalVerses + ')';
    document.getElementById('prog-bar').style.width = pct + '%';
    document.getElementById('prog-bar').className = 'bar' + (pct >= 90 ? ' good' : '');

    renderGrid();
    return { themedVerses, totalVerses, pct };
  } catch(e) { console.error(e); return {}; }
}

function renderGrid() {
  const grid = document.getElementById('sura-grid');
  let html = '';
  for (let s = 1; s <= 114; s++) {
    const st = suraStats[s] || { total:0, themed:0 };
    const pct = st.total ? Math.round(st.themed * 100 / st.total) : 0;
    const cls = pct >= 90 ? 'full' : pct >= 20 ? 'partial' : 'empty';
    html += `<div class="sg ${cls}" title="Sura ${s}: ${st.themed}/${st.total} (${pct}%)">${s}</div>`;
  }
  grid.innerHTML = html;
}

function markSuraActive(s) {
  const cells = document.querySelectorAll('.sg');
  cells.forEach(c => c.classList.remove('active'));
  if (cells[s-1]) cells[s-1].classList.add('active');
}

async function callSeed(sura, offset, retries) {
  retries = retries || 0;
  callsMade++;
  document.getElementById('sn-calls').textContent = callsMade;
  try {
    const res = await fetch('/.netlify/functions/seed-themes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sura, offset })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(e) {
    errCount++;
    document.getElementById('sn-errors').textContent = errCount;
    if (retries < 4) {
      const wait = 1500 * Math.pow(2, retries);
      log(`  ↺ Retry ${retries+1}/4 sura ${sura} offset ${offset} — waiting ${wait/1000}s`, 'warn');
      await new Promise(r => setTimeout(r, wait));
      return callSeed(sura, offset, retries + 1);
    }
    throw e;
  }
}

async function processSura(sura) {
  markSuraActive(sura);
  const mode = document.getElementById('mode-select').value;

  // In gaps mode, check if sura is already fully covered
  if (mode === 'gaps') {
    const st = suraStats[sura] || { total:0, themed:0 };
    const pct = st.total ? Math.round(st.themed * 100 / st.total) : 0;
    if (pct >= 98) {
      log(`Sura ${sura}: ✓ ${pct}% covered — skip`, 'skip');
      return 0;
    }
  }

  let offset = 0, totalAdded = 0, batches = 0;

  while (running) {
    let r;
    try { r = await callSeed(sura, offset); }
    catch(e) { log(`Sura ${sura} FAILED: ${e.message}`, 'err'); break; }

    if (r.error) { log(`Sura ${sura} error: ${r.error}`, 'err'); break; }

    totalAdded += r.inserted || 0;
    batches++;

    if (r.inserted > 0) {
      addedThisRun += r.inserted;
      document.getElementById('sn-added').textContent = addedThisRun.toLocaleString();
      // Update sura stats
      if (!suraStats[sura]) suraStats[sura] = { total: 0, themed: 0 };
      suraStats[sura].themed = Math.min(suraStats[sura].themed + r.unthemed, suraStats[sura].total);
      renderGrid();
    }

    if (!r.has_more || r.done) break;
    offset = r.next_offset;
    await new Promise(res => setTimeout(res, 250));
  }

  return totalAdded;
}

async function startSeed() {
  running = true;
  addedThisRun = 0; callsMade = 0; errCount = 0;
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('sn-added').textContent = '0';

  const startSura = parseInt(document.getElementById('start-sura').value) || 1;
  const endSura   = parseInt(document.getElementById('end-sura').value)   || 114;

  log(`▶ Smart Seeder v3 — Suras ${startSura}→${endSura}`, 'info');
  await loadCoverage();

  let surasDone = 0;
  for (let sura = startSura; sura <= endSura && running; sura++) {
    document.getElementById('status').textContent = `Processing Sura ${sura}/${endSura}...`;
    const added = await processSura(sura);
    surasDone++;

    if (added > 0) log(`Sura ${sura}: +${added} theme assignments`, 'ok');

    // Refresh coverage every 5 suras
    if (surasDone % 5 === 0) {
      const cov = await loadCoverage();
      log(`── Coverage: ${cov.pct}% (${cov.themedVerses}/${cov.totalVerses}) ──`, 'info');
    }

    await new Promise(r => setTimeout(r, 400));
  }

  // Final coverage check
  const final = await loadCoverage();
  running = false;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('status').textContent = `✅ Done — ${final.pct}% coverage (${final.themedVerses}/${final.totalVerses} verses)`;
  log(`Complete! ${addedThisRun} added. Coverage: ${final.pct}%`, 'info');

  // Mark all active cells as done
  document.querySelectorAll('.sg.active').forEach(c => c.classList.remove('active'));
}

function stopSeed() {
  running = false;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('status').textContent = 'Stopped';
  log('Stopped by user.', 'warn');
  document.querySelectorAll('.sg.active').forEach(c => c.classList.remove('active'));
}

// Load coverage on startup
loadCoverage();
</script>
</body>
</html>
