<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Theme Seeder v2 — Quran Scholar Admin</title>
<style>
*{box-sizing:border-box;}
body{font-family:monospace;background:#0f0f0f;color:#00ff41;padding:20px;max-width:860px;margin:0 auto;}
h1{color:#E8C97B;font-size:18px;margin-bottom:4px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;}
.stat{background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:8px;text-align:center;}
.stat-n{font-size:20px;font-weight:700;color:#E8C97B;}
.stat-l{font-size:10px;color:#888;margin-top:2px;}
.bar-wrap{background:#222;border-radius:4px;height:18px;margin:6px 0;overflow:hidden;}
.bar{background:linear-gradient(90deg,#B8902A,#E8C97B);height:100%;transition:width 0.4s;}
button{background:#B8902A;color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:700;margin:3px;}
button:disabled{background:#333;color:#666;cursor:not-allowed;}
.log{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:10px;height:380px;overflow-y:auto;font-size:11px;line-height:1.7;margin-top:10px;}
.ok{color:#00ff41;}.err{color:#ff5555;}.info{color:#E8C97B;}.warn{color:#ffaa00;}
input[type=number]{background:#1a1a1a;color:#E8C97B;border:1px solid #444;padding:4px 8px;width:65px;border-radius:4px;font-family:monospace;}
#status{font-size:14px;font-weight:700;color:#E8C97B;margin:8px 0;}
</style>
</head>
<body>
<h1>📖 Quran Theme Seeder v2</h1>
<p style="color:#666;font-size:11px;">Classifies all 6,211 verses. Processes 20 verses/call to avoid timeouts. Large suras auto-paginate.</p>

<div class="stats">
  <div class="stat"><div class="stat-n" id="sn-suras">0</div><div class="stat-l">Suras Done</div></div>
  <div class="stat"><div class="stat-n" id="sn-verses">0</div><div class="stat-l">Theme Assignments</div></div>
  <div class="stat"><div class="stat-n" id="sn-calls">0</div><div class="stat-l">API Calls</div></div>
  <div class="stat"><div class="stat-n" id="sn-errors">0</div><div class="stat-l">Errors (retried)</div></div>
</div>

<div style="margin-bottom:8px;">
  <div>Sura <span id="cur-sura">—</span>/114 &nbsp;|&nbsp; <span id="pct">0%</span></div>
  <div class="bar-wrap"><div class="bar" id="prog-bar" style="width:0%"></div></div>
</div>

<div id="status">Ready</div>

<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;">
  <button onclick="startSeed()" id="btn-start">&#9654; Start Seeding</button>
  <button onclick="stopSeed()" id="btn-stop" disabled>&#9632; Stop</button>
  <button onclick="clearLog()" style="background:#222;">Clear Log</button>
  <span style="color:#888;font-size:11px;margin-left:8px;">Start sura:</span>
  <input type="number" id="start-sura" min="1" max="114" value="1">
  <span style="color:#888;font-size:11px;">End sura:</span>
  <input type="number" id="end-sura" min="1" max="114" value="114">
</div>

<div class="log" id="log"></div>

<script>
let running = false;
let surasDone = 0, versesAdded = 0, callsMade = 0, errCount = 0;

const SURA_SIZES = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,59,59,37,62,38,29,48,45,60,52,62,55,78,96,29,105,110,26,114,6,11,17,12,55,78,3,43,28,25,43,32,24,43,11,5,20,56,26,30,60,56,15,50,40,29,19,36,25,22,17,19,26,30,26,25,25,27,33,30,22,30,14,27,9,14,14,22,23,33,42,30,31,27,13,25,22,21,21,10,15,15,11,16,11,16,13,12,14,10,11,13,11,28,12,12,27,44,28,14,14,20,17,24,10,33,35,38,29,18,26,25,25,43,22,42,47,29,28,36,17,27,9,21,27,16,11,16,13,12,14,10,11,13,11,7];

function log(msg, cls) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  d.className = cls || 'ok';
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
function clearLog() { document.getElementById('log').innerHTML = ''; }
function updateStats(sura) {
  document.getElementById('sn-suras').textContent = surasDone;
  document.getElementById('sn-verses').textContent = versesAdded;
  document.getElementById('sn-calls').textContent = callsMade;
  document.getElementById('sn-errors').textContent = errCount;
  document.getElementById('cur-sura').textContent = sura;
  const endSura = parseInt(document.getElementById('end-sura').value) || 114;
  const startSura = parseInt(document.getElementById('start-sura').value) || 1;
  const pct = Math.round(((sura - startSura + 1) / (endSura - startSura + 1)) * 100);
  document.getElementById('pct').textContent = Math.min(100,pct) + '%';
  document.getElementById('prog-bar').style.width = Math.min(100,pct) + '%';
}

async function callSeed(sura, offset, retries) {
  retries = retries || 0;
  callsMade++;
  document.getElementById('sn-calls').textContent = callsMade;
  try {
    const res = await fetch('/.netlify/functions/seed-themes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sura, offset })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(e) {
    errCount++;
    document.getElementById('sn-errors').textContent = errCount;
    if (retries < 3) {
      log('  Sura ' + sura + ' offset ' + offset + ' error (' + e.message + ') — retry ' + (retries+1) + '/3', 'warn');
      await new Promise(r => setTimeout(r, 2000 * (retries + 1)));
      return callSeed(sura, offset, retries + 1);
    }
    throw e;
  }
}

async function processSura(sura) {
  let offset = 0;
  let totalInserted = 0;
  let batches = 0;

  while (running) {
    const r = await callSeed(sura, offset);
    totalInserted += r.inserted || 0;
    batches++;

    if (r.error) {
      log('Sura ' + sura + ' ERROR: ' + r.error, 'err');
      break;
    }

    if (!r.has_more || r.done) break;
    offset = r.next_offset;
    await new Promise(res => setTimeout(res, 300));
  }

  return totalInserted;
}

async function startSeed() {
  running = true;
  surasDone = 0; versesAdded = 0; callsMade = 0; errCount = 0;
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').disabled = false;

  const startSura = parseInt(document.getElementById('start-sura').value) || 1;
  const endSura   = parseInt(document.getElementById('end-sura').value) || 114;
  log('Starting Suras ' + startSura + ' → ' + endSura, 'info');

  for (let sura = startSura; sura <= endSura && running; sura++) {
    document.getElementById('status').textContent = 'Processing Sura ' + sura + '/' + endSura + '...';
    try {
      const inserted = await processSura(sura);
      surasDone++;
      versesAdded += inserted;
      document.getElementById('sn-verses').textContent = versesAdded;
      if (inserted > 0) {
        log('Sura ' + sura + ': ' + inserted + ' theme assignments added ✓');
      } else {
        log('Sura ' + sura + ': already complete ✓');
      }
    } catch(e) {
      log('Sura ' + sura + ' FAILED after retries: ' + e.message, 'err');
    }
    updateStats(sura);
    await new Promise(r => setTimeout(r, 400));
  }

  running = false;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('status').textContent = running ? 'Stopped' : '✅ Done! ' + versesAdded + ' total assignments added.';
  log('Complete! ' + versesAdded + ' theme assignments, ' + surasDone + ' suras processed.', 'info');
}

function stopSeed() {
  running = false;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('status').textContent = 'Stopped at Sura ' + document.getElementById('cur-sura').textContent;
  log('Stopped by user.', 'warn');
}
</script>
</body>
</html>
