[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/claude"
  to = "/.netlify/functions/claude-proxy"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."claude-proxy"]
  timeout = 26

[functions."analyze"]
  timeout = 26

[functions."research"]
  timeout = 26

[functions."contradictions"]
  timeout = 26
