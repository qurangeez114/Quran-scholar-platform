[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"


[[redirects]]
  from = "/claude"
  to = "/.netlify/functions/claude-proxy"
  status = 200

# Keep the faculty short URL canonical and prevent the SPA catch-all
# from swallowing the faculty directory page.
[[redirects]]
  from = "/faculty"
  to = "/faculty.html"
  status = 301

[[redirects]]
  from = "/faculty/"
  to = "/faculty.html"
  status = 301

# Canonical school courses routes must resolve before the 404 fallback.
[[redirects]]
  from = "/courses"
  to = "/courses.html"
  status = 301

[[redirects]]
  from = "/courses/"
  to = "/courses.html"
  status = 301

# Public admissions page, before the missing-page fallback
[[redirects]]
  from = "/apply"
  to = "/apply.html"
  status = 301

[[redirects]]
  from = "/apply/"
  to = "/apply.html"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[edge_functions]]
  path = "/api/claude-stream"
  function = "claude-stream"

[[edge_functions]]
  path = "/*"
  function = "donate-inject"

[functions."claude-proxy"]
  timeout = 26

[functions."analyze"]
  timeout = 26

[functions."research"]
  timeout = 26

[functions."contradictions"]
  timeout = 26
