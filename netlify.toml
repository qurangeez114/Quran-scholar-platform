[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"


[[redirects]]
  from = "/claude"
  to = "/.netlify/functions/claude-proxy"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  path = "/api/claude-stream"
  function = "claude-stream"

[[edge_functions]]
  path = "/*"
  function = "donate-inject"

[[edge_functions]]
  path = "/api/extract-hadith-verses"
  function = "extract-hadith-verses"

# Scheduled functions (requires Netlify Pro or higher)
[[scheduled_functions]]
  name = "extract-hadith-verses"
  # Every 2 days at 03:00 UTC
  schedule = "0 3 */2 * *"

[functions."claude-proxy"]
  timeout = 26

[functions."analyze"]
  timeout = 26

[functions."research"]
  timeout = 26

[functions."contradictions"]
  timeout = 26
