[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/claude"
  to = "/.netlify/functions/claude-proxy"
  status = 200

[[redirects]]
  from = "/api/tiktok/auth"
  to = "/.netlify/functions/tiktok-auth"
  status = 200

[[redirects]]
  from = "/api/tiktok/callback"
  to = "/.netlify/functions/tiktok-callback"
  status = 200

[[redirects]]
  from = "/api/tiktok/session"
  to = "/.netlify/functions/tiktok-session"
  status = 200

[[redirects]]
  from = "/api/tiktok/upload-init"
  to = "/.netlify/functions/tiktok-upload-init"
  status = 200

[[redirects]]
  from = "/api/tiktok/status"
  to = "/.netlify/functions/tiktok-status"
  status = 200

[[redirects]]
  from = "/api/tiktok/disconnect"
  to = "/.netlify/functions/tiktok-disconnect"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  path = "/api/claude-stream"
  function = "claude-stream"

[[edge_functions]]
  path = "/*"
  function = "donate-inject"

[functions."claude-proxy"]
  timeout = 26

[functions."analyze"]
  timeout = 26

[functions."research"]
  timeout = 26

[functions."contradictions"]
  timeout = 26
