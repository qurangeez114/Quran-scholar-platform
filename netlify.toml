[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."analyze"]
  timeout = 26

[functions."claude-proxy"]
  timeout = 26

[functions."bulk-fill-lexicon"]
  timeout = 26

[[redirects]]
  from = "/claude"
  to = "/.netlify/functions/claude-proxy"
  status = 200

[functions."seed-madhhab-categories"]
  timeout = 26

[[redirects]]
  from = "/seed-madhhab"
  to = "/.netlify/functions/seed-madhhab-categories"
  status = 200

# Force redeploy 2026-06-09T08:27:02Z v1780993622
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
