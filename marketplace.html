<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace — Quran Hikma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'EB Garamond','Georgia',serif;background:#FDFAF4;color:#3A2E1A;padding-bottom:70px}
  .topbar{background:#FFF8E8;border-bottom:1px solid #E8DDC0;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
  .topbar h1{font-size:19px;margin:0;flex:1;color:#5A3A10}
  .qbtn{background:#fff;border:1.5px solid #D4A830;color:#7A5010;border-radius:20px;padding:7px 14px;font-family:'EB Garamond',serif;font-size:14px;font-weight:600;cursor:pointer}
  .qbtn.ghost{border-color:#ccc;color:#666}
  .qbtn.primary{background:#B8902A;color:#fff;border-color:#B8902A;}
  #wrap{padding:16px}
  .lib-search{width:100%;padding:10px 14px;border-radius:20px;border:1.5px solid #E8DDC0;font-family:'EB Garamond',serif;font-size:15px;margin-bottom:12px;}
  #grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;}
  .listing-card{background:#fff;border:1px solid #E8DDC0;border-radius:14px;overflow:hidden;}
  .listing-cover{aspect-ratio:3/4;background:linear-gradient(160deg,#B8902A,#7A5010);display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;background-size:cover;background-position:center;}
  .listing-body{padding:10px 12px;}
  .listing-title{font-size:13.5px;font-weight:700;color:#3A2E1A;margin-bottom:4px;line-height:1.3;}
  .listing-author{font-size:11.5px;color:#8a7a5a;margin-bottom:8px;}
  .price-tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:8px;}
  .price-tag.free{background:#E9F5EC;color:#2E7D32;}
  .price-tag.paid{background:#FDF0D5;color:#9A6A00;}
  .sell-section{background:#FBF6E9;border:1.5px solid #D4A830;border-radius:14px;padding:18px;margin-bottom:20px;}
  .sell-section h2{font-size:17px;color:#5A3A10;margin:0 0 8px;}
  .sell-section p{font-size:13px;color:#8a7a5a;line-height:1.5;margin:0 0 12px;}
  .form-field{margin-bottom:12px;}
  .form-field label{display:block;font-size:12.5px;font-weight:700;color:#5A3A10;margin-bottom:4px;}
  .form-field input[type=text], .form-field input[type=email], .form-field input[type=url], .form-field input[type=number], .form-field textarea{
    width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid #E8DDC0;font-family:'EB Garamond',serif;font-size:14px;background:#fff;
  }
  .form-field textarea{min-height:70px;resize:vertical;}
  .status-banner{padding:12px 14px;border-radius:10px;font-size:13.5px;margin-bottom:12px;}
  .status-banner.pending{background:#FDF0D5;color:#9A6A00;}
  .status-banner.approved{background:#E9F5EC;color:#2E7D32;}
  .status-banner.rejected{background:#FBE4E4;color:#B23A3A;}
  #emptyState{text-align:center;color:#8a7a5a;padding:30px 20px;font-size:14px;grid-column:1/-1;}
  #bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#FFF8E8;border-top:1px solid #E8DDC0;display:flex;overflow-x:auto;z-index:60;}
  .bnav-btn{flex:1;min-width:64px;background:none;border:none;border-right:1px solid #F0E8D5;padding:8px 4px;font-family:'EB Garamond',serif;display:flex;flex-direction:column;align-items:center;gap:2px;color:#7A5010;font-size:10px;cursor:pointer;}
  .bnav-btn:last-child{border-right:none;}
  .bnav-btn.active{color:#B8902A;background:#FDF8EE;font-weight:700;}
  .bnav-btn .bni{font-size:16px;}
</style>
</head><body>

<div class="topbar">
  <button class="qbtn ghost" onclick="location.href='books.html'">← Back</button>
  <h1>🛒 Marketplace</h1>
</div>

<div id="wrap">
  <input type="text" id="searchInput" class="lib-search" placeholder="Search books, authors..." oninput="renderGrid()">
  <div id="grid"></div>

  <div class="sell-section" id="sellSection"></div>
</div>

<nav id="bottom-nav">
  <button class="bnav-btn" onclick="location.href='index.html'"><span class="bni">📖</span><span>Quran</span></button>
  <button class="bnav-btn" onclick="location.href='research.html'"><span class="bni">🔬</span><span>Research</span></button>
  <button class="bnav-btn" onclick="location.href='themes.html'"><span class="bni">🗂️</span><span>Themes</span></button>
  <button class="bnav-btn" onclick="location.href='madhhab.html'"><span class="bni">⚖️</span><span>Madhhab</span></button>
  <button class="bnav-btn" onclick="location.href='sira.html'"><span class="bni">🕌</span><span>Sīra</span></button>
  <button class="bnav-btn" onclick="location.href='stories.html'"><span class="bni">📚</span><span>Stories</span></button>
  <button class="bnav-btn" onclick="location.href='books.html'"><span class="bni">📕</span><span>Books</span></button>
  <button class="bnav-btn" onclick="location.href='narrations.html'"><span class="bni">🧵</span><span>Narrations</span></button>
  <button class="bnav-btn active" onclick="location.href='marketplace.html'"><span class="bni">🛒</span><span>Market</span></button>
  <button class="bnav-btn" onclick="location.href='contradiction.html'"><span class="bni">⚔️</span><span>Tensions</span></button>
</nav>

<script>
const SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDR = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

function getDeviceId(){
  let id = localStorage.getItem('qh_device_id');
  if(!id){ id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('qh_device_id', id); }
  return id;
}
const DEVICE_ID = getDeviceId();

function esc(s){ return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#B8902A;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:999999;';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

let ALL_LISTINGS = [];

async function loadListings(){
  // Only listings whose seller has been approved are shown publicly
  const res = await fetch(SB_URL + '/rest/v1/book_listings?select=*,sellers!inner(status,seller_name)&sellers.status=eq.approved&order=created_at.desc', { headers: HDR });
  ALL_LISTINGS = res.ok ? await res.json() : [];
  renderGrid();
}

function renderGrid(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  let list = ALL_LISTINGS;
  if(q) list = list.filter(l => (l.title||'').toLowerCase().includes(q) || (l.author_name||'').toLowerCase().includes(q));
  if(!list.length){ grid.innerHTML = '<div id="emptyState">No listings yet — be the first to sell or share a book below.</div>'; return; }
  grid.innerHTML = list.map(l => `
    <div class="listing-card">
      <div class="listing-cover" ${l.cover_url ? `style="background-image:url('${esc(l.cover_url)}');"` : ''}>${l.cover_url ? '' : '📘'}</div>
      <div class="listing-body">
        <span class="price-tag ${l.is_free ? 'free' : 'paid'}">${l.is_free ? 'FREE' : '$' + (l.price_cents/100).toFixed(2)}</span>
        <div class="listing-title">${esc(l.title)}</div>
        <div class="listing-author">${esc(l.author_name || '')}${l.sellers ? ' · via ' + esc(l.sellers.seller_name) : ''}</div>
        <button class="qbtn primary" style="width:100%;" onclick="getListing(${l.id})">${l.is_free ? '⬇ Get Free' : '🛒 Buy'}</button>
      </div>
    </div>`).join('');
}

function getListing(id){
  const l = ALL_LISTINGS.find(x => x.id === id);
  if(!l) return;
  if(l.is_free){
    if(l.file_url) window.open(l.file_url, '_blank');
    else toast('No file available yet for this listing');
  } else {
    toast('Checkout isn\'t wired up yet — contact the seller directly for now');
  }
}

// ---- Seller flow ----
let CURRENT_SELLER = null;

async function loadSellerStatus(){
  const res = await fetch(SB_URL + '/rest/v1/sellers?device_id=eq.' + encodeURIComponent(DEVICE_ID) + '&select=*', { headers: HDR });
  const rows = res.ok ? await res.json() : [];
  CURRENT_SELLER = rows[0] || null;
  renderSellSection();
}

function renderSellSection(){
  const box = document.getElementById('sellSection');
  if(!CURRENT_SELLER){
    box.innerHTML = `
      <h2>🖋️ Sell or Share Your Book</h2>
      <p>Apply to become a seller. Every application is reviewed before you can publish — this keeps the marketplace trustworthy and free of unauthorized content.</p>
      <div class="form-field"><label>Your name</label><input type="text" id="sellerName"></div>
      <div class="form-field"><label>Contact email</label><input type="email" id="sellerEmail"></div>
      <div class="form-field"><label>Tell us about yourself / what you'd like to publish</label><textarea id="sellerBio"></textarea></div>
      <div class="form-field" style="display:flex;align-items:flex-start;gap:8px;">
        <input type="checkbox" id="rightsConfirm" style="margin-top:3px;">
        <label style="font-weight:400;font-size:12.5px;" for="rightsConfirm">I confirm I own the rights to any book(s) I submit, or they are in the public domain, and I have permission to sell/distribute them.</label>
      </div>
      <button class="qbtn primary" onclick="applyAsSeller()">Submit Application</button>
    `;
    return;
  }
  if(CURRENT_SELLER.status === 'pending'){
    box.innerHTML = `<h2>🖋️ Sell or Share Your Book</h2>
      <div class="status-banner pending">⏳ Your seller application is pending review. You'll be able to publish once approved.</div>`;
    return;
  }
  if(CURRENT_SELLER.status === 'rejected'){
    box.innerHTML = `<h2>🖋️ Sell or Share Your Book</h2>
      <div class="status-banner rejected">Your application was not approved.${CURRENT_SELLER.review_note ? ' Note: ' + esc(CURRENT_SELLER.review_note) : ''}</div>`;
    return;
  }
  // approved
  box.innerHTML = `
    <h2>🖋️ Publish a Book</h2>
    <div class="status-banner approved">✅ You're an approved seller. Submissions below go live immediately.</div>
    <div class="form-field"><label>Book title</label><input type="text" id="listTitle"></div>
    <div class="form-field"><label>Author name</label><input type="text" id="listAuthor"></div>
    <div class="form-field"><label>Description</label><textarea id="listDesc"></textarea></div>
    <div class="form-field"><label>Cover image URL (optional)</label><input type="url" id="listCover" placeholder="https://..."></div>
    <div class="form-field"><label>File URL (PDF/text link readers will get)</label><input type="url" id="listFile" placeholder="https://..."></div>
    <div class="form-field" style="display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="listIsFree" onchange="document.getElementById('priceField').style.display=this.checked?'none':'block'">
      <label style="font-weight:400;" for="listIsFree">Give this away for free</label>
    </div>
    <div class="form-field" id="priceField"><label>Price (USD)</label><input type="number" id="listPrice" min="0" step="0.01" value="0"></div>
    <button class="qbtn primary" onclick="submitListing()">Publish Listing</button>
  `;
}

async function applyAsSeller(){
  const seller_name = document.getElementById('sellerName').value.trim();
  const contact_email = document.getElementById('sellerEmail').value.trim();
  const bio = document.getElementById('sellerBio').value.trim();
  const rights_confirmed = document.getElementById('rightsConfirm').checked;
  if(!seller_name || !contact_email){ toast('Name and email are required'); return; }
  if(!rights_confirmed){ toast('Please confirm you have the rights to publish'); return; }
  const res = await fetch(SB_URL + '/rest/v1/sellers', {
    method: 'POST', headers: { ...HDR, 'Content-Type': 'application/json', Prefer: 'return=representation' },
    body: JSON.stringify({ device_id: DEVICE_ID, seller_name, contact_email, bio, rights_confirmed })
  });
  if(!res.ok){ toast('Could not submit application'); return; }
  toast('Application submitted!');
  loadSellerStatus();
}

async function submitListing(){
  const title = document.getElementById('listTitle').value.trim();
  const author_name = document.getElementById('listAuthor').value.trim();
  const description = document.getElementById('listDesc').value.trim();
  const cover_url = document.getElementById('listCover').value.trim();
  const file_url = document.getElementById('listFile').value.trim();
  const is_free = document.getElementById('listIsFree').checked;
  const price_cents = is_free ? 0 : Math.round(parseFloat(document.getElementById('listPrice').value || '0') * 100);
  if(!title){ toast('Title is required'); return; }
  const res = await fetch(SB_URL + '/rest/v1/book_listings', {
    method: 'POST', headers: { ...HDR, 'Content-Type': 'application/json' },
    body: JSON.stringify({ seller_id: CURRENT_SELLER.id, title, author_name, description, cover_url, file_url, is_free, price_cents })
  });
  if(!res.ok){ toast('Could not publish listing'); return; }
  toast('📚 Listing published!');
  document.getElementById('listTitle').value = '';
  document.getElementById('listAuthor').value = '';
  document.getElementById('listDesc').value = '';
  document.getElementById('listCover').value = '';
  document.getElementById('listFile').value = '';
  loadListings();
}

loadListings();
loadSellerStatus();
</script>
</body></html>
