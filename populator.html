<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Madhhab Rulings Populator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1208; color: #e8d5a0; font-family: Georgia, serif; padding: 16px; min-height: 100vh; }
h1 { color: #c9a84c; font-size: 1.2rem; border-bottom: 1px solid #3a2a10; padding-bottom: 10px; margin-bottom: 14px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
button { background: #c9a84c; color: #1a1208; border: none; border-radius: 6px; padding: 12px 18px; font-size: 1rem; font-weight: bold; cursor: pointer; }
button:disabled { background: #3a2a10; color: #5a4a30; cursor: not-allowed; }
#stopBtn { background: #e57373; color: #fff; display: none; }
.stats { display: flex; gap: 8px; margin-bottom: 12px; }
.stat { flex: 1; background: #2a1f0a; border-radius: 8px; padding: 8px 4px; text-align: center; }
.stat-val { font-size: 1.5rem; font-weight: bold; }
.stat-lbl { font-size: 0.65rem; color: #8a7050; letter-spacing: 0.1em; text-transform: uppercase; }
.progress { background: #2a1f0a; border-radius: 4px; height: 6px; margin-bottom: 12px; overflow: hidden; }
.progress-bar { height: 100%; background: #c9a84c; width: 0%; transition: width 0.3s; }
#log { background: #0f0c06; border: 1px solid #2a1f0a; border-radius: 8px; padding: 12px; height: 350px; overflow-y: auto; font-family: monospace; font-size: 0.78rem; }
.info { color: #c9a84c; }
.ok { color: #4caf7d; }
.err { color: #e57373; }
.warn { color: #ffb74d; }
</style>
</head>
<body>
<h1>⚖️ Madhhab Rulings Populator</h1>

<div class="btns">
  <button onclick="run(10)">Run 10</button>
  <button onclick="run(25)">Run 25</button>
  <button onclick="run(50)">Run 50</button>
  <button onclick="run(100)">Run 100</button>
  <button onclick="run(200)">Run 200</button>
  <button id="stopBtn" onclick="doStop()">⏹ Stop</button>
</div>

<div class="stats">
  <div class="stat"><div class="stat-val" id="sTotal" style="color:#c9a84c">0</div><div class="stat-lbl">Total</div></div>
  <div class="stat"><div class="stat-val" id="sDone" style="color:#4caf7d">0</div><div class="stat-lbl">Done</div></div>
  <div class="stat"><div class="stat-val" id="sErr" style="color:#e57373">0</div><div class="stat-lbl">Errors</div></div>
  <div class="stat"><div class="stat-val" id="sRem" style="color:#7fb3d3">0</div><div class="stat-lbl">Remaining</div></div>
</div>
<div class="progress"><div class="progress-bar" id="bar"></div></div>
<div id="log"><span class="info">Tap a Run button to start...</span></div>

<script>
const SB = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTQ1MjI4NzIsImV4cCI6MjAzMDA5ODg3Mn0.t3XWlFBiRCRPQNbmFMFmMiIRBVi9XKaCVJbEPfbhqBs';
const HDR = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };

const SYSTEM = `You are an expert in Islamic jurisprudence. Return ONLY a valid JSON object, no markdown:
{
  "consensus":"...","key_disagreement":"...",
  "hanafi_position":"...","hanafi_evidence":"...","hanafi_sources":["..."],
  "maliki_position":"...","maliki_evidence":"...","maliki_sources":["..."],
  "shafii_position":"...","shafii_evidence":"...","shafii_sources":["..."],
  "hanbali_position":"...","hanbali_evidence":"...","hanbali_sources":["..."],
  "jafari_position":"...","jafari_evidence":"...","jafari_sources":["..."],
  "zaydi_position":"...","ibadi_position":"...","mutazila_position":"...","salafi_position":"...",
  "practical_difference":"...","historical_consequences":"...","bloodshed_or_persecution":"...","reformist_view":"...",
  "quran_verses":["4:34"],"hadith_refs":["Bukhari 5066"],"reflection_questions":["..."],"controversy_level":3
}
controversy_level 1=minor 2=moderate 3=significant 4=severe 5=extremely contentious. Return ONLY valid JSON.`;

let running = false, stop = false, done = 0, errors = 0, total = 0;

function log(msg, cls='info') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}
function setStats(t,d,e) {
  total=t; done=d; errors=e;
  document.getElementById('sTotal').textContent = t;
  document.getElementById('sDone').textContent = d;
  document.getElementById('sErr').textContent = e;
  document.getElementById('sRem').textContent = Math.max(0, t-d-e);
  document.getElementById('bar').style.width = t ? ((d/t)*100)+'%' : '0%';
}
function setBtns(on) {
  document.querySelectorAll('.btns button:not(#stopBtn)').forEach(b => b.disabled = !on);
  document.getElementById('stopBtn').style.display = on ? 'none' : 'inline-block';
}
function doStop() { stop = true; }

async function sbGet(path) {
  const r = await fetch(SB + path, { headers: {...HDR, Range:'0-4999', Prefer:'count=none'} });
  return r.json();
}

async function getMissing(batchSize) {
  // Use Supabase's not= filter to find topics with no ruling
  // We query topics where id is NOT in the set of ruled topic_ids
  // Strategy: get all ruled topic_ids first, then find topics not in that set
  // But since there are 6000+ ruled, easier: query topics with a left join using PostgREST
  // PostgREST supports: GET /madhhab_topics?id=not.in.(select topic_id from madhhab_rulings)
  // But anon key may not support subqueries — use a simpler approach:
  // Fetch topics in pages starting from where missing ones are (id > 6000)
  const all = [];
  let offset = 0;
  const pageSize = 500;
  while (all.length < batchSize) {
    const topics = await sbGet(`/rest/v1/madhhab_topics?select=id,topic,category&order=id.asc&limit=${pageSize}&offset=${offset}`);
    if (!topics.length) break;
    const ids = topics.map(t=>t.id).join(',');
    const r2 = await fetch(SB + `/rest/v1/madhhab_rulings?select=topic_id&topic_id=in.(${ids})`, { headers: {...HDR, Range:'0-999'} });
    const rulings = await r2.json();
    const covered = new Set(rulings.map(r=>r.topic_id));
    const missing = topics.filter(t=>!covered.has(t.id));
    all.push(...missing);
    offset += pageSize;
    if (topics.length < pageSize) break;
  }
  return all.slice(0, batchSize);
}

async function generate(topic, category) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 2000,
      system: SYSTEM,
      messages: [{ role: 'user', content: `Topic: ${topic}\nCategory: ${category}` }]
    })
  });
  const d = await r.json();
  let text = d.content[0].text.trim().replace(/^```json\s*/,'').replace(/\s*```$/,'');
  return JSON.parse(text);
}

async function insert(topicId, category, a) {
  const row = {
    topic_id: topicId, category,
    consensus: a.consensus||'', key_disagreement: a.key_disagreement||'',
    hanafi_position: a.hanafi_position||'', hanafi_evidence: a.hanafi_evidence||'', hanafi_sources: a.hanafi_sources||[],
    maliki_position: a.maliki_position||'', maliki_evidence: a.maliki_evidence||'', maliki_sources: a.maliki_sources||[],
    shafii_position: a.shafii_position||'', shafii_evidence: a.shafii_evidence||'', shafii_sources: a.shafii_sources||[],
    hanbali_position: a.hanbali_position||'', hanbali_evidence: a.hanbali_evidence||'', hanbali_sources: a.hanbali_sources||[],
    jafari_position: a.jafari_position||'', jafari_evidence: a.jafari_evidence||'', jafari_sources: a.jafari_sources||[],
    zaydi_position: a.zaydi_position||'', ibadi_position: a.ibadi_position||'',
    mutazila_position: a.mutazila_position||'', salafi_position: a.salafi_position||'',
    practical_difference: a.practical_difference||'', historical_consequences: a.historical_consequences||'',
    bloodshed_or_persecution: a.bloodshed_or_persecution||'', reformist_view: a.reformist_view||'',
    quran_verses: a.quran_verses||[], hadith_refs: a.hadith_refs||[], reflection_questions: a.reflection_questions||[]
  };
  const r = await fetch(`${SB}/rest/v1/madhhab_rulings`, {
    method: 'POST',
    headers: { ...HDR, Prefer: 'return=minimal' },
    body: JSON.stringify(row)
  });
  if (!r.ok) throw new Error('DB ' + r.status + ': ' + (await r.text()).slice(0,100));
  if (a.controversy_level) {
    await fetch(`${SB}/rest/v1/madhhab_topics?id=eq.${topicId}`, {
      method: 'PATCH', headers: { ...HDR, Prefer: 'return=minimal' },
      body: JSON.stringify({ controversy_level: a.controversy_level })
    });
  }
}

async function run(batchSize) {
  if (running) return;
  running = true; stop = false; done = 0; errors = 0;
  setBtns(false);
  document.getElementById('log').innerHTML = '';
  setStats(0,0,0);

  try {
    log('🔍 Fetching missing topics...');
    const missing = await getMissing(batchSize);
    log(`📋 Found ${missing.length} topics to populate`, 'ok');
    setStats(missing.length, 0, 0);

    for (let i = 0; i < missing.length; i++) {
      if (stop) { log('⏹ Stopped.', 'warn'); break; }
      const t = missing[i];
      log(`[${i+1}/${missing.length}] ${t.topic.slice(0,55)}...`);
      try {
        const a = await generate(t.topic, t.category||'');
        await insert(t.id, t.category||'', a);
        log(`  ✅ Done (level ${a.controversy_level}/5)`, 'ok');
        done++;
      } catch(e) {
        log(`  ❌ ${e.message.slice(0,100)}`, 'err');
        errors++;
      }
      setStats(missing.length, done, errors);
      await new Promise(r => setTimeout(r, 300));
    }
    log('🏁 Batch complete!', 'ok');
  } catch(e) {
    log('Fatal: ' + e.message, 'err');
  }
  running = false;
  setBtns(true);
}
</script>
</body>
</html>
