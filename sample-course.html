<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Essentials · Sample classroom</title><style>
:root{--ink:#183d35;--green:#245d4b;--paper:#f5f3ea;--gold:#b58832;--line:#d9dfd5}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px/1.65 system-ui,sans-serif;color:var(--ink)}header{padding:22px max(20px,calc((100vw - 1100px)/2));background:var(--ink);color:white;display:flex;justify-content:space-between;align-items:center;gap:16px}header strong{font-size:19px}header small{color:#d8dfcb}main{max-width:1100px;margin:24px auto;padding:0 20px}.banner{background:#fff1cf;border:1px solid #e5d3a8;padding:12px 18px;border-radius:12px;margin-bottom:22px}.layout{display:grid;grid-template-columns:250px 1fr;gap:22px}aside,section.card{background:white;border:1px solid var(--line);border-radius:16px;padding:24px}aside{align-self:start}h1{font:700 32px/1.2 Georgia,serif;margin:12px 0 20px}h2{font:700 24px/1.3 Georgia,serif}button,.link{border:0;border-radius:8px;padding:11px 16px;background:var(--green);color:white;font:600 14px system-ui;cursor:pointer;display:inline-block;text-decoration:none;margin:5px 5px 5px 0}button.secondary{background:#edf2ec;color:var(--ink)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}aside button{display:block;width:100%;text-align:left;margin:8px 0;background:transparent;color:var(--ink);border:1px solid var(--line)}aside button.active{background:var(--green);color:white}label{display:block;margin:12px 0}input[type=text],textarea{width:100%;padding:12px;border:1px solid #a6b7ab;border-radius:8px;font:inherit}textarea{min-height:150px}progress{width:100%;height:12px;accent-color:var(--green)}.muted{color:#5b7067;font-size:14px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:#7f6426}.source{border-left:3px solid var(--gold);padding:10px 20px;background:#f7f7f1}.question{border-top:1px solid var(--line);padding:18px 0}fieldset{border:0;padding:0;margin:0}legend{font-weight:700;margin-bottom:8px}input[type=radio]{margin-right:9px;accent-color:var(--green)}.score{font-size:42px;font-weight:750;line-height:1.3}.pass{color:#245d4b}.fail{color:#a4352e}.feedback{background:#f1f5ee;padding:12px;border-radius:8px}.slide{background:#193d34;color:white;border-radius:12px;padding:35px;min-height:260px;white-space:pre-wrap}.slide h2{color:#e8d6a7}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 5px;border-bottom:1px solid var(--line);font-size:14px}[hidden]{display:none!important}#notice{min-height:24px}dialog{width:min(600px,95vw);border:0;border-radius:16px;padding:28px}dialog::backdrop{background:#0009}@media(max-width:720px){.layout{grid-template-columns:1fr}aside{padding:14px}aside nav{display:flex;gap:5px;flex-wrap:wrap}aside button{width:auto;font-size:12px}header{align-items:start;flex-direction:column}main{padding:0 12px}section.card{padding:20px}h1{font-size:28px}}@media print{header,aside,.banner,button,#notice{display:none}.layout{display:block}.slide{break-after:page;color:#000;background:white}}
</style></head><body><header><div><strong>Qur’anHikma · Sample classroom</strong><br><small>A complete practice journey</small></div><div><button id="student" class="secondary">Student view</button><button id="teacher" class="secondary">Teacher results</button></div></header><main><div class="banner">Practice course · No real login or enrollment. Progress, notes and quiz attempts stay in this browser. The teacher view shows your practice results only.</div><div class="layout"><aside><span class="eyebrow">Research Essentials</span><h2>Your classroom</h2><p id="learner" class="muted">Not enrolled yet</p><progress id="progress" max="4" value="0"></progress><p id="progress-label" class="muted">0 of 4 milestones</p><nav><button data-view="overview">01 · Enroll</button><button data-view="lesson">02 · Take the lesson</button><button data-view="page">03 · My Page</button><button data-view="quiz">04 · Take the quiz</button><button data-view="presentation">05 · Presentation</button></nav><button id="reset" class="secondary">Reset practice data</button></aside><section class="card"><p id="notice" role="status" aria-live="polite"></p><div id="content"></div></section></div></main><dialog id="present-dialog"><div id="full-slide" class="slide"></div><div class="row"><button id="prev-slide">Previous</button><button id="next-slide">Next</button><button id="close-slides" class="secondary">Close</button><span id="slide-counter"></span></div></dialog><script>
(()=>{'use strict';const key='qh-sample-course-v1';const fresh=()=>({name:'',enrolled:false,lesson:false,page:{title:'My Research Notes',body:''},attempts:[],slides:[]});let state;try{state=JSON.parse(localStorage.getItem(key))||fresh();if(!state.page||!Array.isArray(state.attempts)||!Array.isArray(state.slides))state=fresh();}catch{state=fresh();}let view='overview',slideIndex=0;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PASS_MARK=90;
const questions=[
 {id:'source',q:'Which item is a primary source for studying what a document says?',options:['A social-media comment about it','The original document itself','An anonymous summary'],answer:1,why:'The original document is direct evidence of its wording. Later comments and summaries interpret or condense that evidence.',rationale:['A comment reports someone’s response; it is not the original document you are studying.','','A summary may omit wording or context and does not replace the original.'],variants:[{q:'You want to verify the exact words in a historical letter. Which source should you consult first?',options:['A short online summary','A discussion of the letter','The letter itself'],answer:2,rationale:['A summary condenses the letter and may leave out the words you need.','A discussion is interpretation rather than the original letter.','']},{q:'A researcher is checking what an original record states. What is the most direct evidence?',options:['The record itself','A later review','An uncited retelling'],answer:0,rationale:['','A review interprets the record rather than reproducing all its evidence.','An uncited retelling cannot establish the original wording.']}]},
 {id:'reference',q:'What should you save alongside an excerpt?',options:['Only the copied words','Only your opinion','Its source reference and your own notes separately'],answer:2,why:'A source reference makes the excerpt traceable. Keeping your interpretation separate prevents readers from confusing your opinion with the source.',rationale:['Copied words without a reference are difficult to trace or verify.','Your opinion alone does not preserve the source or its evidence.',''],variants:[{q:'You copy a paragraph into your research notebook. What makes the entry useful and clear?',options:['Add its reference and label your own interpretation separately','Remove its author and location','Blend your opinion into the quotation'],answer:0,rationale:['','Without the author and location, readers may be unable to find the paragraph.','Mixing your words into a quotation misrepresents what the source says.']},{q:'How should a saved research passage distinguish evidence from commentary?',options:['Leave it without a reference','Keep the citation and put personal notes in a separate section','Replace the passage with an opinion'],answer:1,rationale:['An uncited excerpt is hard to verify.','','Replacing the evidence with an opinion prevents comparison with the source.']}]},
 {id:'compare',q:'Two sources appear to disagree. What is the best first step?',options:['Compare wording, context, date and genre','Delete the source you dislike','Assume the shorter account is correct'],answer:0,why:'Compare wording, context, dates and genre before reaching a conclusion. Differences can reflect scope or perspective; neither preference nor length establishes accuracy.',rationale:['','Discarding inconvenient evidence introduces selection bias.','A shorter account is not necessarily more accurate.'],variants:[{q:'Two accounts describe an event differently. What should you investigate before deciding between them?',options:['Which account you prefer','Their wording, setting, dates and type of writing','Which account uses fewer words'],answer:1,rationale:['Preference is not evidence that an account is accurate.','','Length alone does not establish reliability.']},{q:'What is a responsible first response to an apparent contradiction in two texts?',options:['Ignore the inconvenient text','Choose the shortest text','Examine both texts in context and compare their dates and genres'],answer:2,rationale:['Ignoring evidence can distort the conclusion.','Brevity does not demonstrate truth.','']}]},
 {id:'slides',q:'Where should a quotation’s citation appear in a presentation?',options:['Nowhere','On or clearly linked to the relevant slide','Only in the file name'],answer:1,why:'Attach a clear source reference to the relevant quotation. A slide citation or an explicit link to a source list lets the audience trace the evidence.',rationale:['Without a citation, the audience cannot readily verify the quotation.','','A file name does not show which source supports each quotation.'],variants:[{q:'An audience member wants to check a quote on your slide. How should you help them?',options:['Omit the source','Put unrelated details in the file name','Show its citation on the slide or provide a clear source link'],answer:2,rationale:['Omitting the source prevents readers from tracing the quote.','A file name does not reliably connect a quote to its source.','']},{q:'What is the clearest way to connect a slide quotation to its evidence?',options:['Provide an identifiable reference on that slide or a clearly linked source list','Give no reference','Rely on the audience to guess'],answer:0,rationale:['','A quotation needs a traceable reference.','Readers should not have to guess the origin of evidence.']}]},
 {id:'percent',q:'Four correct answers out of five give what percentage?',options:['4%','90%','80%'],answer:2,why:'Divide correct answers by total questions, then multiply by 100: 4 ÷ 5 × 100 = 80%. That is below the 90% pass mark. With five equally weighted questions, passing requires 5 out of 5.',rationale:['Four is a count, not a percentage. The total number of questions must be included.','Four fifths equals 80%, not 90%.',''],variants:[{q:'A student answers 8 of 10 questions correctly. What score is recorded?',why:'8 ÷ 10 × 100 = 80%. That is below the 90% passing requirement.',options:['80%','90%','8%'],answer:0,rationale:['','8 ÷ 10 × 100 gives 80%, below 90%.','Eight is the number correct, not the percentage.']},{q:'A learner gets 16 of 20 answers right. What is the percentage?',why:'16 ÷ 20 × 100 = 80%. The pass mark is 90%, so this score does not pass.',options:['90%','16%','80%'],answer:2,rationale:['16 ÷ 20 equals 0.8, not 0.9.','The correct count must be divided by the total before converting to percent.','']}]}
];
function finalAttempts(){return state.attempts.filter(a=>a.phase==='final'&&a.version===2);}
function hasPassed(){return finalAttempts().some(a=>a.percent>=PASS_MARK);}
function questionAt(session){const base=questions[session.index];return session.phase==='final'?{...base,...base.variants[session.variant%base.variants.length]}:base;}
function persist(){try{localStorage.setItem(key,JSON.stringify(state));return true;}catch{$('notice').textContent='Browser storage is unavailable. Keep this window open; refresh may lose progress.';return false;}}
function notice(t){$('notice').textContent=t;}function render(){const milestones=Number(state.enrolled)+Number(state.lesson)+Number(state.page.body.trim().length>0)+Number(hasPassed());$('progress').value=milestones;$('progress-label').textContent=milestones+' of 4 milestones';$('learner').textContent=state.enrolled?'Enrolled: '+state.name:'Not enrolled yet';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const c=$('content');if(view!=='overview'&&view!=='teacher'&&!state.enrolled){c.innerHTML='<h1>Start with enrollment</h1><p>Enroll in the practice course before opening your learning tools.</p><button id="begin">Go to enrollment</button>';$('begin').onclick=()=>go('overview');return;}({overview,lesson,page,quiz,presentation,teacher}[view])();}
function go(v){view=v;notice('');render();}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));$('student').onclick=()=>go(state.enrolled?'lesson':'overview');$('teacher').onclick=()=>go('teacher');$('reset').onclick=()=>{if(confirm('Clear this browser’s sample course, notes, slides and quiz attempts?')){state=fresh();persist();go('overview');}};
function overview(){$('content').innerHTML='<span class="eyebrow">Free practice course · About 10 minutes</span><h1>Research with clarity</h1><p>Learn to identify sources, save a cited note, compare claims, and turn your work into a short presentation.</p><ul><li>One short lesson</li><li>A private practice page</li><li>Guided lesson quiz + reworded final check · Pass mark: 90%</li><li>Editable presentation and teacher results</li></ul>'+(state.enrolled?'<p class="feedback">You are enrolled as <strong>'+esc(state.name)+'</strong>.</p><button id="continue">Continue learning</button>':'<form id="enroll"><label>Your practice name<input id="name" type="text" maxlength="60" required placeholder="Enter your name"></label><button>Enroll in sample course</button></form>');if(state.enrolled)$('continue').onclick=()=>go('lesson');else $('enroll').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;state.name=name;state.enrolled=true;persist();go('lesson');};}
function lesson(){$('content').innerHTML='<span class="eyebrow">Lesson 1 · Reading sources carefully</span><h1>From a claim to evidence</h1><h2>1. Start with the source</h2><p>A primary source is original material relevant to your question: a document, inscription, recorded speech, or first-hand account. A later explanation or analysis is usually a secondary source.</p><h2>2. Keep text and interpretation separate</h2><p>Save the exact excerpt, its author or collection, a date or locator, and a link when available. Put your own explanation under a separate note.</p><div class="source"><strong>Practice passage — fictional example</strong><p>“The council met in the town square on Monday. Several residents asked for a new well.”</p><small>Source: Fictional Town Record, entry 1. Created for this exercise.</small></div><h2>3. Compare before concluding</h2><p>If another account differs, compare wording, dates, context and genre. A difference can reflect perspective or scope; inspect the evidence before deciding.</p><h2>4. Present responsibly</h2><p>Use one clear idea per slide. Keep quotations faithful and attach their references. Label your conclusions as your own.</p><div class="row"><button id="save-excerpt">Save passage to My Page</button><button id="complete" class="secondary">'+(state.lesson?'Lesson completed ✓':'Mark lesson complete')+'</button><button id="to-quiz" class="secondary">Open quiz</button></div>';$('complete').onclick=()=>{state.lesson=true;persist();render();notice('Lesson completed.');};$('to-quiz').onclick=()=>go('quiz');$('save-excerpt').onclick=()=>{const excerpt='SOURCE EXCERPT\n“The council met in the town square on Monday. Several residents asked for a new well.”\nSource: Fictional Town Record, entry 1 (practice example).\n\nMY INTERPRETATION\n';if(!state.page.body.includes('Fictional Town Record'))state.page.body+=(state.page.body?'\n\n':'')+excerpt;persist();go('page');notice('Passage and reference added. Give your page a title and add your interpretation.');};}
function page(){$('content').innerHTML='<span class="eyebrow">My Pages · Practice workspace</span><h1>Your titled research page</h1><form id="page-form"><label>Page title<input id="page-title" type="text" maxlength="150" required value="'+esc(state.page.title)+'"></label><label>Content and notes<textarea id="page-body">'+esc(state.page.body)+'</textarea></label><button id="save-page">Save page</button><span id="page-save-status" role="status" aria-live="polite"></span><button id="make-deck" type="button" class="secondary">Create presentation from this page</button></form><p class="muted">Saved in this browser for practice. You can edit this page and reopen it during the session.</p>';$('page-form').oninput=()=>{$('save-page').textContent='Save page';$('page-save-status').textContent='Unsaved changes';};$('page-form').onsubmit=e=>{e.preventDefault();savePage();};$('make-deck').onclick=()=>{if(!savePage())return;state.slides=[{title:state.page.title,body:'By '+state.name},{title:'Research notes',body:state.page.body},{title:'Conclusion',body:'Add your conclusion here. Distinguish your interpretation from the source.'}];persist();go('presentation');notice('Three editable slides created from your page.');};}
function saveConfirmation(buttonId,statusId,saved){const button=$(buttonId),status=$(statusId);if(button)button.textContent=saved?'✓ Saved':(buttonId==='save-page'?'Save page':'Save presentation');if(status){status.textContent=saved?'Saved in this browser at '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'.':'Could not save. Browser storage is unavailable; keep this window open and try again.';status.className=saved?'pass':'fail';}}
function savePage(){const title=$('page-title').value.trim();if(!title){notice('Enter a page title first.');$('page-title').focus();return false;}state.page={title,body:$('page-body').value};const saved=persist();if(saved){render();notice('Page saved: '+title);}saveConfirmation('save-page','page-save-status',saved);return saved;}
function startQuiz(phase){
 if(phase==='final'&&!state.attempts.some(a=>a.phase==='practice'&&a.version===2)){notice('Complete the guided lesson quiz before the final check.');return;}
 const variant=phase==='final'?finalAttempts().length:0;
 state.quizSession={phase,index:0,answers:[],correct:[],variant,reviewed:false};persist();quiz();
}
function quiz(){
 const session=state.quizSession;
 if(!session){
  const learned=state.attempts.some(a=>a.phase==='practice'&&a.version===2),last=finalAttempts().at(-1);
  $('content').innerHTML='<span class="eyebrow">Learn, review, then demonstrate understanding</span><h1>Quiz as a learning tool</h1><p>Work through five questions after the lesson. Check each answer to receive feedback. If you are unsure, choose “I don’t know / explain” or check without selecting an answer.</p><p>After the guided quiz, answer five reworded questions testing the same ideas. Only this final check counts toward passing: <strong>90%</strong>. With five equally weighted questions, you need <strong>5 out of 5</strong>.</p>'+(last?'<p class="feedback">Last final check: '+last.percent+'% · '+(last.percent>=PASS_MARK?'Passed':'Below 90% — review and try again')+'</p>':'')+'<button id="start-practice">Start guided lesson quiz</button><button id="start-final" class="secondary" '+(!learned?'disabled':'')+'>Take reworded final check</button>';
  $('start-practice').onclick=()=>startQuiz('practice');$('start-final').onclick=()=>startQuiz('final');return;
 }
 const q=questionAt(session),isFinal=session.phase==='final';
 $('content').innerHTML='<span class="eyebrow">'+(isFinal?'Reworded final check · Pass mark 90%':'Guided lesson quiz · Learn from every answer')+'</span><h1>Question '+(session.index+1)+' of '+questions.length+'</h1><p class="muted">'+(isFinal?'These questions test the same concepts with different wording. Your first response to each question is scored.':'This is practice. Read the explanation before moving on; the final check determines your pass status.')+'</p><form id="quiz-form"><fieldset class="question"><legend>'+esc(q.q)+'</legend>'+q.options.map((o,j)=>'<label><input type="radio" name="answer" value="'+j+'" '+(session.reviewed?'disabled ':'')+(session.answers[session.index]===j?'checked':'')+'>'+esc(o)+'</label>').join('')+'</fieldset><button id="check-answer" '+(session.reviewed?'hidden':'')+'>Check answer</button><button id="explain-answer" type="button" class="secondary" '+(session.reviewed?'hidden':'')+'>I don’t know / explain</button></form><div id="answer-feedback" role="status" aria-live="polite"></div><button id="next-question" hidden>'+(session.index===questions.length-1?'Finish '+(isFinal?'final check':'guided quiz'):'Next question')+'</button>';
 function feedback(){const selected=session.answers[session.index],correct=session.correct[session.index];$('answer-feedback').innerHTML='<div class="feedback"><h2>'+(selected===null?'Let’s learn this together':correct?'Correct — here is why':'Not quite — here is why')+'</h2><p><strong>Your response:</strong> '+(selected===null?'Not answered':esc(q.options[selected]))+'</p>'+(!correct&&selected!==null?'<p><strong>Why this answer is incorrect:</strong> '+esc(q.rationale[selected])+'</p>':selected===null?'<p>No answer was selected. This response earns no point; read the explanation to prepare for the next check.</p>':'')+'<p><strong>Correct answer:</strong> '+esc(q.options[q.answer])+'</p><p><strong>Why it is correct:</strong> '+esc(q.why)+'</p></div>';$('next-question').hidden=false;}
 function check(selected){if(session.reviewed)return;session.answers[session.index]=selected;session.correct[session.index]=selected===q.answer;session.reviewed=true;persist();quiz();}
 $('quiz-form').onsubmit=e=>{e.preventDefault();const checked=document.querySelector('input[name="answer"]:checked');check(checked?Number(checked.value):null);};
 $('explain-answer').onclick=()=>check(null);
 $('next-question').onclick=()=>{if(!session.reviewed)return;if(session.index<questions.length-1){session.index++;session.reviewed=false;persist();quiz();}else finishQuiz(session);};
 if(session.reviewed)feedback();
}
function finishQuiz(session){
 const correct=session.correct.filter(Boolean).length,percent=Math.round(correct/questions.length*100),isFinal=session.phase==='final';
 state.attempts.push({version:2,phase:session.phase,variant:session.variant,date:new Date().toISOString(),correct,percent,answers:session.answers});
 state.quizSession=null;persist();render();
 $('content').innerHTML='<span class="eyebrow">'+(isFinal?'Final check result':'Guided quiz completed')+'</span><div class="score '+(isFinal&&percent<PASS_MARK?'fail':'pass')+'">'+percent+'%</div><h1>'+(isFinal?(percent>=PASS_MARK?'Passed — understanding demonstrated':'Not passed yet — keep learning'):'Now check what you learned')+'</h1><p>'+correct+' of '+questions.length+' correct. '+(isFinal?'Pass mark: 90%.':'This practice score does not determine your pass status.')+'</p><p>'+(isFinal?(percent>=PASS_MARK?'You met the 90% requirement.':'Review the lesson and explanations, then try another reworded final check. With five questions, you need 5 correct.'):'You have seen the reasoning behind each answer. The final check now asks about the same ideas using different wording.')+'</p><button id="next-final">'+(isFinal?'Retake with reworded questions':'Take reworded final check')+'</button><button id="review-lesson" class="secondary">Review lesson</button><button id="results" class="secondary">Teacher results</button>';
 $('next-final').onclick=()=>startQuiz('final');$('review-lesson').onclick=()=>go('lesson');$('results').onclick=()=>go('teacher');
}
function presentation(){$('content').innerHTML='<span class="eyebrow">Presentation studio · Practice</span><h1>Your presentation</h1>'+(state.slides.length?state.slides.map((s,i)=>'<div class="question"><label>Slide '+(i+1)+' title<input type="text" data-title="'+i+'" value="'+esc(s.title)+'"></label><label>Slide text<textarea data-body="'+i+'">'+esc(s.body)+'</textarea></label><button data-up="'+i+'" class="secondary" '+(i===0?'disabled':'')+'>Move up</button><button data-remove="'+i+'" class="secondary">Remove slide</button></div>').join(''):'<p>Create slides from My Page or add a blank slide.</p>')+'<div class="row"><button id="save-slides">Save presentation</button><span id="slides-save-status" role="status" aria-live="polite"></span><button id="add-slide" class="secondary">Add slide</button><button id="present" class="secondary" '+(!state.slides.length?'disabled':'')+'>Present slides</button><button id="export" class="secondary" '+(!state.slides.length?'disabled':'')+'>Download presentation JSON</button></div>';
$('content').oninput=e=>{if(e.target.matches('[data-title],[data-body]')){$('save-slides').textContent='Save presentation';$('slides-save-status').textContent='Unsaved changes';}};
const read=()=>{document.querySelectorAll('[data-title]').forEach(n=>state.slides[Number(n.dataset.title)].title=n.value);document.querySelectorAll('[data-body]').forEach(n=>state.slides[Number(n.dataset.body)].body=n.value);return persist();};$('save-slides').onclick=()=>{const saved=read();saveConfirmation('save-slides','slides-save-status',saved);if(saved)notice('Presentation saved in this browser.');};$('add-slide').onclick=()=>{read();state.slides.push({title:'New slide',body:''});persist();render();};document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{read();const i=Number(b.dataset.up);[state.slides[i-1],state.slides[i]]=[state.slides[i],state.slides[i-1]];persist();render();});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{read();state.slides.splice(Number(b.dataset.remove),1);persist();render();});$('present').onclick=()=>{read();slideIndex=0;showSlide();$('present-dialog').showModal();};$('export').onclick=()=>{read();const url=URL.createObjectURL(new Blob([JSON.stringify({title:state.page.title,slides:state.slides},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='research-presentation.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};}
function showSlide(){const s=state.slides[slideIndex];$('full-slide').replaceChildren();const h=document.createElement('h2'),p=document.createElement('p');h.textContent=s.title;p.textContent=s.body;$('full-slide').append(h,p);$('slide-counter').textContent=(slideIndex+1)+' / '+state.slides.length;$('prev-slide').disabled=slideIndex===0;$('next-slide').disabled=slideIndex===state.slides.length-1;}$('prev-slide').onclick=()=>{if(slideIndex>0){slideIndex--;showSlide();}};$('next-slide').onclick=()=>{if(slideIndex<state.slides.length-1){slideIndex++;showSlide();}};$('close-slides').onclick=()=>$('present-dialog').close();
function teacher(){const finals=finalAttempts(),best=Math.max(0,...finals.map(a=>a.percent));$('content').innerHTML='<span class="eyebrow">Teacher results · Demonstration only</span><h1>Practice gradebook</h1><p>This view uses only practice data in your browser. Real teacher access requires staff authorization and server-verified grades.</p><div class="feedback"><strong>Student:</strong> '+esc(state.name||'Not enrolled')+'<br><strong>Lesson:</strong> '+(state.lesson?'Completed':'Not completed')+'<br><strong>Pass mark:</strong> 90%<br><strong>Final checks:</strong> '+finals.length+'<br><strong>Best final score:</strong> '+best+'%<br><strong>Final status:</strong> '+(finals.length?(hasPassed()?'Passed':'Not passed'):'Not attempted')+'</div><h2>Learning and assessment history</h2><p class="muted">Guided practice and earlier demo attempts do not count toward the new final pass requirement.</p>'+(state.attempts.length?'<table><thead><tr><th>Type</th><th>Score</th><th>Result</th><th>Date</th></tr></thead><tbody>'+state.attempts.map(a=>'<tr><td>'+(a.version!==2?'Earlier demo':a.phase==='practice'?'Guided practice':'Reworded final')+'</td><td>'+a.correct+'/5 ('+a.percent+'%)</td><td>'+(a.version!==2?'Not counted':a.phase==='practice'?'Learning only':a.percent>=PASS_MARK?'Passed':'Below 90%')+'</td><td>'+esc(new Date(a.date).toLocaleString())+'</td></tr>').join('')+'</tbody></table>':'<p>No submissions yet. Complete the guided quiz, then take the reworded final check.</p>');}
render();})();
</script></body></html>
