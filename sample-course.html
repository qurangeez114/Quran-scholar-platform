<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Essentials · Sample classroom</title><style>
:root{--ink:#183d35;--green:#245d4b;--paper:#f5f3ea;--gold:#b58832;--line:#d9dfd5}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px/1.65 system-ui,sans-serif;color:var(--ink)}header{padding:22px max(20px,calc((100vw - 1100px)/2));background:var(--ink);color:white;display:flex;justify-content:space-between;align-items:center;gap:16px}header strong{font-size:19px}header small{color:#d8dfcb}main{max-width:1100px;margin:24px auto;padding:0 20px}.banner{background:#fff1cf;border:1px solid #e5d3a8;padding:12px 18px;border-radius:12px;margin-bottom:22px}.layout{display:grid;grid-template-columns:250px 1fr;gap:22px}aside,section.card{background:white;border:1px solid var(--line);border-radius:16px;padding:24px}aside{align-self:start}h1{font:700 32px/1.2 Georgia,serif;margin:12px 0 20px}h2{font:700 24px/1.3 Georgia,serif}button,.link{border:0;border-radius:8px;padding:11px 16px;background:var(--green);color:white;font:600 14px system-ui;cursor:pointer;display:inline-block;text-decoration:none;margin:5px 5px 5px 0}button.secondary{background:#edf2ec;color:var(--ink)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}aside button{display:block;width:100%;text-align:left;margin:8px 0;background:transparent;color:var(--ink);border:1px solid var(--line)}aside button.active{background:var(--green);color:white}label{display:block;margin:12px 0}input[type=text],textarea{width:100%;padding:12px;border:1px solid #a6b7ab;border-radius:8px;font:inherit}textarea{min-height:150px}progress{width:100%;height:12px;accent-color:var(--green)}.muted{color:#5b7067;font-size:14px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:#7f6426}.source{border-left:3px solid var(--gold);padding:10px 20px;background:#f7f7f1}.question{border-top:1px solid var(--line);padding:18px 0}fieldset{border:0;padding:0;margin:0}legend{font-weight:700;margin-bottom:8px}input[type=radio]{margin-right:9px;accent-color:var(--green)}.score{font-size:42px;font-weight:750;line-height:1.3}.pass{color:#245d4b}.fail{color:#a4352e}.feedback{background:#f1f5ee;padding:12px;border-radius:8px}.slide{background:#193d34;color:white;border-radius:12px;padding:35px;min-height:260px;white-space:pre-wrap}.slide h2{color:#e8d6a7}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 5px;border-bottom:1px solid var(--line);font-size:14px}[hidden]{display:none!important}#notice{min-height:24px}dialog{width:min(600px,95vw);border:0;border-radius:16px;padding:28px}dialog::backdrop{background:#0009}@media(max-width:720px){.layout{grid-template-columns:1fr}aside{padding:14px}aside nav{display:flex;gap:5px;flex-wrap:wrap}aside button{width:auto;font-size:12px}header{align-items:start;flex-direction:column}main{padding:0 12px}section.card{padding:20px}h1{font-size:28px}}@media print{header,aside,.banner,button,#notice{display:none}.layout{display:block}.slide{break-after:page;color:#000;background:white}}
</style></head><body><header><div><strong>Qur’anHikma · Sample classroom</strong><br><small>A complete practice journey</small></div><div><button id="student" class="secondary">Student view</button><button id="teacher" class="secondary">Teacher results</button></div></header><main><div class="banner">Practice course · No real login or enrollment. Progress, notes and quiz attempts stay in this browser. The teacher view shows your practice results only.</div><div class="layout"><aside><span class="eyebrow">Research Essentials</span><h2>Your classroom</h2><p id="learner" class="muted">Not enrolled yet</p><progress id="progress" max="4" value="0"></progress><p id="progress-label" class="muted">0 of 4 milestones</p><nav><button data-view="overview">01 · Enroll</button><button data-view="lesson">02 · Take the lesson</button><button data-view="page">03 · My Page</button><button data-view="quiz">04 · Take the quiz</button><button data-view="presentation">05 · Presentation</button></nav><button id="reset" class="secondary">Reset practice data</button></aside><section class="card"><p id="notice" role="status" aria-live="polite"></p><div id="content"></div></section></div></main><dialog id="present-dialog"><div id="full-slide" class="slide"></div><div class="row"><button id="prev-slide">Previous</button><button id="next-slide">Next</button><button id="close-slides" class="secondary">Close</button><span id="slide-counter"></span></div></dialog><script>
(()=>{'use strict';const key='qh-sample-course-v1';const fresh=()=>({name:'',enrolled:false,lesson:false,page:{title:'My Research Notes',body:''},attempts:[],slides:[]});let state;try{state=JSON.parse(localStorage.getItem(key))||fresh();if(!state.page||!Array.isArray(state.attempts)||!Array.isArray(state.slides))state=fresh();}catch{state=fresh();}let view='overview',slideIndex=0;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const questions=[{q:'Which item is a primary source for studying what a document says?',options:['A social-media comment about it','The original document itself','An anonymous summary'],answer:1,why:'A primary source is the original material relevant to the research question.'},{q:'What should you save alongside an excerpt?',options:['Only the copied words','Only your opinion','Its source reference and your own notes separately'],answer:2,why:'A reference lets readers locate the source. Separating notes prevents your interpretation being mistaken for the source.'},{q:'Two sources appear to disagree. What is the best first step?',options:['Compare wording, context, date and genre','Delete the source you dislike','Assume the shorter account is correct'],answer:0,why:'Context and careful comparison should come before a conclusion.'},{q:'Where should a quotation’s citation appear in a presentation?',options:['Nowhere','On or clearly linked to the relevant slide','Only in the file name'],answer:1,why:'A reader should be able to connect a quotation to its source.'},{q:'Four correct answers out of five give what percentage?',options:['4%','70%','80%'],answer:2,why:'4 ÷ 5 × 100 = 80%. This passes a 70% threshold.'}];
function persist(){try{localStorage.setItem(key,JSON.stringify(state));return true;}catch{$('notice').textContent='Browser storage is unavailable. Keep this window open; refresh may lose progress.';return false;}}
function notice(t){$('notice').textContent=t;}function render(){const milestones=Number(state.enrolled)+Number(state.lesson)+Number(state.page.body.trim().length>0)+Number(state.attempts.some(a=>a.percent>=70));$('progress').value=milestones;$('progress-label').textContent=milestones+' of 4 milestones';$('learner').textContent=state.enrolled?'Enrolled: '+state.name:'Not enrolled yet';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const c=$('content');if(view!=='overview'&&view!=='teacher'&&!state.enrolled){c.innerHTML='<h1>Start with enrollment</h1><p>Enroll in the practice course before opening your learning tools.</p><button id="begin">Go to enrollment</button>';$('begin').onclick=()=>go('overview');return;}({overview,lesson,page,quiz,presentation,teacher}[view])();}
function go(v){view=v;notice('');render();}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));$('student').onclick=()=>go(state.enrolled?'lesson':'overview');$('teacher').onclick=()=>go('teacher');$('reset').onclick=()=>{if(confirm('Clear this browser’s sample course, notes, slides and quiz attempts?')){state=fresh();persist();go('overview');}};
function overview(){$('content').innerHTML='<span class="eyebrow">Free practice course · About 10 minutes</span><h1>Research with clarity</h1><p>Learn to identify sources, save a cited note, compare claims, and turn your work into a short presentation.</p><ul><li>One short lesson</li><li>A private practice page</li><li>Five-question quiz · Pass mark: 70%</li><li>Editable presentation and teacher results</li></ul>'+(state.enrolled?'<p class="feedback">You are enrolled as <strong>'+esc(state.name)+'</strong>.</p><button id="continue">Continue learning</button>':'<form id="enroll"><label>Your practice name<input id="name" type="text" maxlength="60" required placeholder="Enter your name"></label><button>Enroll in sample course</button></form>');if(state.enrolled)$('continue').onclick=()=>go('lesson');else $('enroll').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;state.name=name;state.enrolled=true;persist();go('lesson');};}
function lesson(){$('content').innerHTML='<span class="eyebrow">Lesson 1 · Reading sources carefully</span><h1>From a claim to evidence</h1><h2>1. Start with the source</h2><p>A primary source is original material relevant to your question: a document, inscription, recorded speech, or first-hand account. A later explanation or analysis is usually a secondary source.</p><h2>2. Keep text and interpretation separate</h2><p>Save the exact excerpt, its author or collection, a date or locator, and a link when available. Put your own explanation under a separate note.</p><div class="source"><strong>Practice passage — fictional example</strong><p>“The council met in the town square on Monday. Several residents asked for a new well.”</p><small>Source: Fictional Town Record, entry 1. Created for this exercise.</small></div><h2>3. Compare before concluding</h2><p>If another account differs, compare wording, dates, context and genre. A difference can reflect perspective or scope; inspect the evidence before deciding.</p><h2>4. Present responsibly</h2><p>Use one clear idea per slide. Keep quotations faithful and attach their references. Label your conclusions as your own.</p><div class="row"><button id="save-excerpt">Save passage to My Page</button><button id="complete" class="secondary">'+(state.lesson?'Lesson completed ✓':'Mark lesson complete')+'</button><button id="to-quiz" class="secondary">Open quiz</button></div>';$('complete').onclick=()=>{state.lesson=true;persist();render();notice('Lesson completed.');};$('to-quiz').onclick=()=>go('quiz');$('save-excerpt').onclick=()=>{const excerpt='SOURCE EXCERPT\n“The council met in the town square on Monday. Several residents asked for a new well.”\nSource: Fictional Town Record, entry 1 (practice example).\n\nMY INTERPRETATION\n';if(!state.page.body.includes('Fictional Town Record'))state.page.body+=(state.page.body?'\n\n':'')+excerpt;persist();go('page');notice('Passage and reference added. Give your page a title and add your interpretation.');};}
function page(){$('content').innerHTML='<span class="eyebrow">My Pages · Practice workspace</span><h1>Your titled research page</h1><form id="page-form"><label>Page title<input id="page-title" type="text" maxlength="150" required value="'+esc(state.page.title)+'"></label><label>Content and notes<textarea id="page-body">'+esc(state.page.body)+'</textarea></label><button>Save page</button><button id="make-deck" type="button" class="secondary">Create presentation from this page</button></form><p class="muted">Saved in this browser for practice. You can edit this page and reopen it during the session.</p>';$('page-form').onsubmit=e=>{e.preventDefault();savePage();};$('make-deck').onclick=()=>{if(!savePage())return;state.slides=[{title:state.page.title,body:'By '+state.name},{title:'Research notes',body:state.page.body},{title:'Conclusion',body:'Add your conclusion here. Distinguish your interpretation from the source.'}];persist();go('presentation');notice('Three editable slides created from your page.');};}
function savePage(){const title=$('page-title').value.trim();if(!title){notice('Enter a page title first.');$('page-title').focus();return false;}state.page={title,body:$('page-body').value};const saved=persist();render();if(saved)notice('Page saved: '+title);return true;}
function quiz(){const last=state.attempts.at(-1);$('content').innerHTML='<span class="eyebrow">Knowledge check · Pass mark 70%</span><h1>Five-question quiz</h1><p>Each question is worth 20 points. Answer every question before submitting. You may retry; each attempt is recorded.</p>'+(last?'<p class="feedback">Last attempt: '+last.percent+'% · '+(last.percent>=70?'Passed':'Try again')+'</p>':'')+'<form id="quiz-form">'+questions.map((q,i)=>'<fieldset class="question"><legend>'+(i+1)+'. '+esc(q.q)+'</legend>'+q.options.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'" required>'+esc(o)+'</label>').join('')+'</fieldset>').join('')+'<button>Submit quiz for grading</button></form><div id="quiz-result" aria-live="polite"></div>';$('quiz-form').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target);if(questions.some((q,i)=>!data.has('q'+i))){notice('Answer all five questions.');return;}const answers=questions.map((q,i)=>Number(data.get('q'+i)));const correct=questions.filter((q,i)=>q.answer===answers[i]).length,percent=Math.round(correct/questions.length*100);state.attempts.push({date:new Date().toISOString(),correct,percent,answers});persist();e.target.hidden=true;$('quiz-result').innerHTML='<div class="score '+(percent>=70?'pass':'fail')+'">'+percent+'%</div><h2>'+(percent>=70?'Passed — well done.':'Not passed yet — review and retry.')+'</h2><p>'+correct+' of 5 correct · Pass mark 70%</p>'+questions.map((q,i)=>'<div class="question"><strong>'+(answers[i]===q.answer?'✓ Correct':'✗ Review')+' · '+esc(q.q)+'</strong><p>Your answer: '+esc(q.options[answers[i]])+'</p><p>Correct answer: '+esc(q.options[q.answer])+'</p><p class="muted">'+esc(q.why)+'</p></div>').join('')+'<button id="retry">Try again</button><button id="results" class="secondary">View teacher results</button>';$('retry').onclick=()=>go('quiz');$('results').onclick=()=>go('teacher');const n=Number(state.enrolled)+Number(state.lesson)+Number(state.page.body.trim().length>0)+Number(state.attempts.some(a=>a.percent>=70));$('progress').value=n;$('progress-label').textContent=n+' of 4 milestones';$('quiz-result').scrollIntoView({behavior:'smooth',block:'start'});};}
function presentation(){$('content').innerHTML='<span class="eyebrow">Presentation studio · Practice</span><h1>Your presentation</h1>'+(state.slides.length?state.slides.map((s,i)=>'<div class="question"><label>Slide '+(i+1)+' title<input type="text" data-title="'+i+'" value="'+esc(s.title)+'"></label><label>Slide text<textarea data-body="'+i+'">'+esc(s.body)+'</textarea></label><button data-up="'+i+'" class="secondary" '+(i===0?'disabled':'')+'>Move up</button><button data-remove="'+i+'" class="secondary">Remove slide</button></div>').join(''):'<p>Create slides from My Page or add a blank slide.</p>')+'<div class="row"><button id="save-slides">Save presentation</button><button id="add-slide" class="secondary">Add slide</button><button id="present" class="secondary" '+(!state.slides.length?'disabled':'')+'>Present slides</button><button id="export" class="secondary" '+(!state.slides.length?'disabled':'')+'>Download presentation JSON</button></div>';
const read=()=>{document.querySelectorAll('[data-title]').forEach(n=>state.slides[Number(n.dataset.title)].title=n.value);document.querySelectorAll('[data-body]').forEach(n=>state.slides[Number(n.dataset.body)].body=n.value);persist();};$('save-slides').onclick=()=>{read();notice('Presentation saved in this browser.');};$('add-slide').onclick=()=>{read();state.slides.push({title:'New slide',body:''});persist();render();};document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{read();const i=Number(b.dataset.up);[state.slides[i-1],state.slides[i]]=[state.slides[i],state.slides[i-1]];persist();render();});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{read();state.slides.splice(Number(b.dataset.remove),1);persist();render();});$('present').onclick=()=>{read();slideIndex=0;showSlide();$('present-dialog').showModal();};$('export').onclick=()=>{read();const url=URL.createObjectURL(new Blob([JSON.stringify({title:state.page.title,slides:state.slides},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='research-presentation.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};}
function showSlide(){const s=state.slides[slideIndex];$('full-slide').replaceChildren();const h=document.createElement('h2'),p=document.createElement('p');h.textContent=s.title;p.textContent=s.body;$('full-slide').append(h,p);$('slide-counter').textContent=(slideIndex+1)+' / '+state.slides.length;$('prev-slide').disabled=slideIndex===0;$('next-slide').disabled=slideIndex===state.slides.length-1;}$('prev-slide').onclick=()=>{if(slideIndex>0){slideIndex--;showSlide();}};$('next-slide').onclick=()=>{if(slideIndex<state.slides.length-1){slideIndex++;showSlide();}};$('close-slides').onclick=()=>$('present-dialog').close();
function teacher(){const best=Math.max(0,...state.attempts.map(a=>a.percent));$('content').innerHTML='<span class="eyebrow">Teacher results · Demonstration only</span><h1>Practice gradebook</h1><p>This view uses only the practice data in your browser. Real teacher access requires staff authorization and server-verified grades.</p><div class="feedback"><strong>Student:</strong> '+esc(state.name||'Not enrolled')+'<br><strong>Lesson:</strong> '+(state.lesson?'Completed':'Not completed')+'<br><strong>Quiz attempts:</strong> '+state.attempts.length+'<br><strong>Best score:</strong> '+best+'%<br><strong>Quiz status:</strong> '+(state.attempts.length?(best>=70?'Passed':'Not passed'):'Not attempted')+'</div><h2>Attempt history</h2>'+(state.attempts.length?'<table><thead><tr><th>Attempt</th><th>Score</th><th>Result</th><th>Date</th></tr></thead><tbody>'+state.attempts.map((a,i)=>'<tr><td>'+(i+1)+'</td><td>'+a.correct+'/5 ('+a.percent+'%)</td><td>'+(a.percent>=70?'Passed':'Not passed')+'</td><td>'+esc(new Date(a.date).toLocaleString())+'</td></tr>').join('')+'</tbody></table>':'<p>No submissions yet. Switch to Student view and complete the quiz.</p>');}
render();})();
</script></body></html>
