<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narrative Comparison — Quran Hikma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./hadith-toolbar.css"><script src="./hadith-toolbar-state.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'EB Garamond','Georgia',serif; background:#FDFAF4; color:#1A1A1A; }
  .topbar { position:sticky; top:0; z-index:200; background:#FDF8EE; border-bottom:2px solid #E8C97B;
            padding:10px 14px; display:flex; align-items:center; gap:10px; }
  .topbar h1 { font-size:15px; margin:0; color:#B8902A; font-weight:700; flex:1; }
  .btn-outline { padding:6px 12px; background:#FDF8EE; color:#B8902A; border:1.5px solid #B8902A;
                 border-radius:16px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; text-decoration:none; }
  .core { padding:14px; border-bottom:1px solid #E8D8A0; background:#fff; font-size:13.5px; line-height:1.5; }
  .core strong { display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#9C8354; margin-bottom:4px; }
  .tabs { display:flex; border-bottom:1px solid #E8D8A0; background:#fff; position:sticky; top:45px; z-index:100; }
  .tab { flex:1; padding:11px 4px; font-size:12.5px; font-weight:700; border:none; background:transparent;
         color:#9C8354; border-bottom:2px solid transparent; cursor:pointer; font-family:inherit; }
  .tab.active { color:#B8902A; border-bottom-color:#B8902A; }
  .body { padding:14px; }
  .card { background:#fff; border:1px solid #E8D8A0; border-radius:10px; padding:12px; margin-bottom:10px; }
  .badge { border-radius:999px; padding:2px 10px; font-size:11px; font-weight:700; color:#fff; white-space:nowrap; }
  .tag { display:inline-block; border-radius:6px; padding:1px 8px; font-size:10.5px; font-weight:700; margin:0 6px 4px 0; }
  .row { display:flex; gap:8px; margin-bottom:6px; font-size:13px; }
  .row .label { width:130px; flex-shrink:0; color:#9C8354; font-size:11px; text-transform:uppercase; padding-top:2px; }
  .empty { border:1px dashed #D8C79A; border-radius:10px; padding:22px; text-align:center; color:#9C8354; font-size:13px; }
  .status { display:none; padding:20px; text-align:center; color:#9C8354; font-size:13px; }
  .hadith-action-btn { padding:7px 14px; border:1.5px solid #C9A94E; border-radius:8px; background:#FFF; color:#B8902A; 
                       font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; transition:all 0.2s;
                       display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .hadith-action-btn:hover { background:#C9A94E; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.12); }
  .hadith-action-btn:active { transform:scale(0.98); }
  .hadith-action-btn.save-btn:hover { background:#B8902A; }
  .hadith-action-btn.highlight-btn:hover { background:#C99A2E; }
  .hadith-action-btn.share-btn:hover { background:#9C8354; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="btn-outline">&larr; Back</a>
  <h1 id="pageTitle">Narrative Comparison</h1>
</div>
<div id="hadith-toolbar-container"></div>
<div class="core" id="coreBox" style="display:none">
  <strong>Shared historical core</strong>
  <div id="coreText"></div>
</div>
<div class="tabs" id="tabs" style="display:none">
  <button class="tab active" data-tab="source">Narrations</button>
  <button class="tab" data-tab="compare">Comparison</button>
  <button class="tab" data-tab="claims">Atomic claims</button>
</div>
<div class="status" id="status">Loading&hellip;</div>
<div class="body" id="body" style="display:none"></div>

<script>
const SUPABASE_URL = "https://ylosytbxpzxzwfzjpaej.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs";

const SEVERITY_COLOR = ["#8C7A52","#7AA6D6","#3E8E4F","#C99A2E","#D9772E","#C0392B"];
const SCORE_LABEL = ["Ordinary","Unusual","Weakly supported","Extraordinary","Highly extraordinary","Extreme"];
const CATEGORY_COLOR = {
  "Historical claim": "#8C7A52", "Legal claim": "#4472B0", "Ritual-effect claim": "#4472B0",
  "Angelic intervention": "#7B4FA0", "Counterfactual miracle": "#7B4FA0",
  "Logically problematic claim": "#C99A2E"
};

function scoreBadge(score) {
  if (score === null || score === undefined) return '<span style="color:#B0A480;font-size:11px">n/a</span>';
  return `<span class="badge" style="background:${SEVERITY_COLOR[score]}">${score} &middot; ${SCORE_LABEL[score]}</span>`;
}
function categoryTag(name) {
  const c = CATEGORY_COLOR[name] || "#8C7A52";
  return `<span class="tag" style="border:1px solid ${c};color:${c}">${name}</span>`;
}

async function sb(path) {
  const res = await fetch(`${SUPABASE_URL}${path}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

let versions = [];

async function load() {
  const params = new URLSearchParams(location.search);
  const slug = params.get('story') || 'maiz-ibn-malik-stoning';
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_narrative_group_versions`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ group_slug: slug })
  });
  const json = await res.json();
  document.getElementById('status').style.display = 'none';

  if (!json || !json.group) {
    document.getElementById('body').style.display = 'block';
    document.getElementById('body').innerHTML = `<div class="empty">No narrative group found for &quot;${slug}&quot;. <a href="narrations.html">Browse all comparisons</a></div>`;
    return;
  }

  const g = json.group;
  versions = json.versions || [];
  document.getElementById('pageTitle').textContent = g.title;
  document.getElementById('coreBox').style.display = 'block';
  document.getElementById('coreText').textContent = g.historical_core || '(not yet documented)';
  document.getElementById('tabs').style.display = 'flex';
  document.getElementById('body').style.display = 'block';

  renderTab('source');

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTab(btn.dataset.tab);
    });
  });
}

function renderTab(tab) {
  const body = document.getElementById('body');
  if (!versions.length) { body.innerHTML = '<div class="empty">No versions recorded yet.</div>'; return; }
  const v = versions[0];

  if (tab === 'claims') {
    const claims = (v.claims || []).sort((a,b) => a.claim_order - b.claim_order);
    if (!claims.length) { body.innerHTML = '<div class="empty">An atomic-claim breakdown has not been generated for this group yet.<br>See the full narrations under <strong>Narrations</strong>.</div>'; return; }
    body.innerHTML = claims.map(c => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="font-size:11px;color:#B0A480;font-weight:700">#${c.claim_order}</div>
          ${scoreBadge(c.extraordinary_claim_score)}
        </div>
        <div style="font-size:14px;margin-top:4px">
          <strong>${c.actor || c.speaker || '&mdash;'}</strong> &mdash; ${c.action || ''}
          <div style="font-size:12.5px;color:#8C7A52;margin-top:2px">${c.condition ? 'Condition: ' + c.condition + '. ' : ''}${c.result || c.text_span || ''}</div>
        </div>
        <div style="margin-top:8px">${(c.claim_category || []).map(categoryTag).join('')}</div>
      </div>
    `).join('');
  }

  if (tab === 'source') {
    body.innerHTML = versions.map(versionCard).join('');
  }

  if (tab === 'compare') {
    if (versions.length < 2) {
      body.innerHTML = `<div class="empty">Only one narration of this incident has been located so far.<br>A second version is required before a side-by-side comparison can be generated.</div>`;
    } else {
      body.innerHTML = `<div style="font-size:12px;color:#8C7A52;margin:0 0 10px">Side-by-side of the ${versions.length} narrations / positions &mdash; compare the wording and where they diverge.</div>` +
        versions.map(compareCard).join('');
    }
  }
}

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function gradeBadge(v){
  const g = (v.hadith_grade||'').trim();
  const bits = [];
  if (g && g.toLowerCase().indexOf('not applicable') === -1) bits.push(esc(g));
  if (v.grade_disputed) bits.push('grade disputed');
  if (!bits.length) return '';
  return `<span style="display:inline-block;font-size:10.5px;padding:2px 8px;border:1px solid #D8C88A;border-radius:10px;color:#8C7A52;white-space:nowrap">${bits.join(' &middot; ')}</span>`;
}

function versionCard(v){
  const label = v.narrator || v.source_collection || ('Version ' + (v.sequence_order||''));
  const src = [v.source_collection, v.source_reference].filter(Boolean).join(' ');
  const type = (v.content_type && v.content_type !== 'hadith') ? ' &middot; ' + esc(v.content_type) : '';
  const eng = v.english_translation || v.version_summary || '';
  const ar = v.original_text || '';
  const note = v.verification_notes || '';
  const vid = 'hadith-' + (v.id || v.sequence_order);
  
  return `<div class="card" id="${vid}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div><span style="font-size:11px;color:#B0A480;font-weight:700">#${esc(v.sequence_order||'')}</span> <strong style="margin-left:4px">${esc(label)}</strong></div>
      ${gradeBadge(v)}
    </div>
    ${src ? `<div style="font-size:12.5px;color:#9C8354;margin-top:2px">${esc(src)}${type}</div>` : ''}
    ${ar ? `<div dir="rtl" lang="ar" style="margin-top:9px;font-size:19px;line-height:2;color:#3a2f14">${esc(ar)}</div>` : ''}
    ${eng ? `<div style="margin-top:9px;font-size:14px;line-height:1.6">${esc(eng)}</div>` : ''}
    ${note ? `<div style="margin-top:9px;padding-top:8px;border-top:1px solid #E8D8A0;font-size:11.5px;color:#8C7A52">${esc(note)}</div>` : ''}
    
    <!-- Full Toolbar with All Features -->
    <div style="margin-top:12px;padding-top:10px;border-top:1px solid #E8D8A0;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="hadith-toolbar-btn audio-btn" onclick="speakHadithEntry('${vid}')" title="Play audio" style="padding:6px 10px;border:1.5px solid #C9A94E;border-radius:8px;background:#FFF;color:#B8902A;font-size:12px;cursor:pointer;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:4px">
        <span style="font-size:14px">🔊</span>
      </button>
      <select class="hadith-toolbar-select language-select" onchange="setHadithLanguage(this.value)" style="padding:6px 10px;border:1.5px solid #C9A94E;border-radius:8px;background:#FFF;color:#B8902A;font-size:11px;cursor:pointer;font-weight:700;font-family:inherit">
        <option value="english">English</option>
        <option value="arabic">العربية</option>
        <option value="tigrinya">ትግርኛ</option>
      </select>
      <button class="hadith-toolbar-btn tags-btn" onclick="toggleHadithTags('${vid}')" title="Show tags" style="padding:6px 10px;border:1.5px solid #C9A94E;border-radius:8px;background:#FFF;color:#B8902A;font-size:12px;cursor:pointer;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:4px">
        <span style="font-size:14px">🏷️</span> Tags
      </button>
      <button class="hadith-toolbar-btn edit-btn" onclick="editHadithEntry('${vid}')" title="Edit hadith" style="padding:6px 10px;border:1.5px solid #C9A94E;border-radius:8px;background:#FFF;color:#B8902A;font-size:12px;cursor:pointer;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:4px">
        <span style="font-size:14px">✏️</span> Edit
      </button>
      <button class="hadith-toolbar-btn document-btn" onclick="exportHadithAsDoc('${vid}')" title="View as document" style="padding:6px 10px;border:1.5px solid #C9A94E;border-radius:8px;background:#FFF;color:#B8902A;font-size:12px;cursor:pointer;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:4px">
        <span style="font-size:14px">📄</span> Doc
      </button>
      <button class="hadith-toolbar-btn save-btn" onclick="saveHadith('${vid}')" title="Save hadith" style="padding:6px 10px;border:1.5px solid #C9A94E;border-radius:8px;background:#FFF;color:#B8902A;font-size:12px;cursor:pointer;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:4px">
        <span style="font-size:14px">💾</span> Save
      </button>
      <button class="hadith-toolbar-btn highlight-btn" onclick="highlightHadith('${vid}')" title="Highlight text" style="padding:6px 10px;border:1.5px solid #C9A94E;border-radius:8px;background:#FFF;color:#B8902A;font-size:12px;cursor:pointer;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:4px">
        <span style="font-size:14px">🔆</span> Highlight
      </button>
      <button class="hadith-toolbar-btn share-btn" onclick="shareHadith('${vid}')" title="Share hadith" style="padding:6px 10px;border:1.5px solid #C9A94E;border-radius:8px;background:#FFF;color:#B8902A;font-size:12px;cursor:pointer;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:4px">
        <span style="font-size:14px">🔗</span> Share
      </button>
    </div>
  </div>`;
}

function compareCard(v){
  const label = v.narrator || v.source_collection || ('Version ' + (v.sequence_order||''));
  const src = [v.source_collection, v.source_reference].filter(Boolean).join(' ');
  const eng = v.english_translation || v.version_summary || '';
  return `<div class="card" style="border-left:4px solid #C9A94E">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <strong style="font-size:13px">${esc(label)}</strong>
      <span style="font-size:10.5px;color:#9C8354;white-space:nowrap">${esc(src)}</span>
    </div>
    <div style="margin-top:6px;font-size:13.5px;line-height:1.55">${esc(eng)}</div>
    <div style="margin-top:8px">${gradeBadge(v)}</div>
  </div>`;
}

function row(label, value) {
  return `<div class="row"><div class="label">${label}</div><div>${value || '&mdash;'}</div></div>`;
}

// ============================================
// HADITH TOOLBAR INITIALIZATION
// ============================================
// Initialize toolbar - state manager loaded via <script src> tag
if (typeof ToolbarState !== 'undefined') {
(function() {
  try {
    const state = ToolbarState.getInstance();
    
    // Create toolbar HTML
    const toolbarHTML = `
      <div class="hadith-toolbar" id="main-hadith-toolbar">
        <button class="toolbar-btn audio-btn" id="btn-audio" title="Play audio">
          <span class="icon">🔊</span>
        </button>
        <div class="toolbar-select-group">
          <select class="toolbar-select language-select" id="language-select">
            <option value="english">English</option>
            <option value="arabic">العربية</option>
            <option value="tigrinya">ትግርኛ</option>
            <option value="french">Français</option>
            <option value="spanish">Español</option>
            <option value="urdu">اردو</option>
          </select>
        </div>
        <button class="toolbar-btn tags-btn" id="btn-tags" title="Show tags">
          <span class="icon">🏷️</span>
        </button>
        <button class="toolbar-btn edit-btn" id="btn-edit" title="Edit hadith">
          <span class="icon">✏️</span>
        </button>
        <button class="toolbar-btn document-btn" id="btn-document" title="View as document">
          <span class="icon">📄</span>
        </button>
        <button class="toolbar-btn tafsir-btn" id="btn-tafsir" title="View tafsir">
          <span class="icon">📚</span>
        </button>
        <button class="toolbar-btn words-btn" id="btn-words" title="Word analysis">
          <span class="icon">abc</span><span>Words</span>
        </button>
        <button class="toolbar-btn study-btn" id="btn-study" title="Study mode">
          <span class="icon">📖</span><span>Study</span>
        </button>
      </div>
    `;
    
    document.getElementById('hadith-toolbar-container').innerHTML = toolbarHTML;
    document.getElementById('language-select').value = state.getLanguage();
    
    // Bind events
    document.getElementById('language-select').addEventListener('change', (e) => {
      state.setLanguage(e.target.value);
    });
    
    document.getElementById('btn-study').addEventListener('click', () => {
      state.toggleStudyMode();
      document.getElementById('btn-study').classList.toggle('active', state.getState().studyMode);
    });
    
    // Subscribe to state changes
    state.subscribe((newState) => {
      document.getElementById('language-select').value = newState.language;
      updateAllHadithCards(newState);
    });
  }
} catch(e) { console.error("Toolbar init error:", e); }
})();

// Update hadith cards when language/state changes
function updateAllHadithCards(currentState) {
  const cards = document.querySelectorAll('.card');
  cards.forEach(card => {
    const source = card.querySelector('.row:first-child span');
    if (currentState.studyMode) {
      if (!card.querySelector('.study-badge')) {
        const badge = document.createElement('span');
        badge.className = 'study-badge';
        badge.textContent = '📖 STUDY';
        badge.style.cssText = 'background:#d4af37;color:#1a1a1a;padding:2px 8px;border-radius:4px;font-size:10px;margin-left:8px;';
        if (source && source.parentElement) {
          source.parentElement.parentElement.appendChild(badge);
        }
      }
    }
  });
}

// ============================================
// HADITH ACTION BUTTON HANDLERS
// ============================================

// ============================================
// HADITH FULL TOOLBAR HANDLERS
// ============================================

function speakHadithEntry(hadithId) {
  const card = document.getElementById(hadithId);
  if (!card || !('speechSynthesis' in window)) return;
  const text = card.innerText;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

function setHadithLanguage(lang) {
  if (typeof ToolbarState !== 'undefined') {
    ToolbarState.getInstance().setLanguage(lang);
  }
}

function toggleHadithTags(hadithId) {
  const card = document.getElementById(hadithId);
  if (!card) return;
  let tagBox = card.querySelector('.hadith-tags-box');
  if (!tagBox) {
    tagBox = document.createElement('div');
    tagBox.className = 'hadith-tags-box';
    tagBox.style.cssText = 'margin-top:10px;padding:10px;background:#FFF8E7;border-radius:6px;border:1px solid #D4C9A8';
    tagBox.innerHTML = '<div style="font-size:11px;color:#9C8354;font-weight:700">Tags: <span style="font-weight:400">hadith, authentic, islamic law, guidance, comparison</span></div>';
    card.appendChild(tagBox);
  } else {
    tagBox.remove();
  }
}

function editHadithEntry(hadithId) {
  const card = document.getElementById(hadithId);
  if (!card) return;
  const body = card.querySelector('.scholar-body') || card;
  if (body.contentEditable === 'true') {
    body.contentEditable = 'false';
    body.style.border = 'none';
  } else {
    body.contentEditable = 'true';
    body.style.border = '2px solid #C9A94E';
    body.style.padding = '8px';
    body.focus();
  }
}

function exportHadithAsDoc(hadithId) {
  const card = document.getElementById(hadithId);
  if (!card) return;
  const text = card.innerText;
  const element = document.createElement('a');
  element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
  element.setAttribute('download', 'hadith-' + hadithId + '.txt');
  element.style.display = 'none';
  document.body.appendChild(element);
  element.click();
  document.body.removeChild(element);
}

function saveHadith(hadithId) {
  const card = document.getElementById(hadithId);
  if (!card) return;
  
  const text = card.innerText;
  const savedItems = JSON.parse(localStorage.getItem('savedHadith') || '[]');
  
  if (!savedItems.find(item => item.id === hadithId)) {
    savedItems.push({ id: hadithId, text: text, savedAt: new Date().toISOString() });
    localStorage.setItem('savedHadith', JSON.stringify(savedItems));
    
    const btn = card.querySelector('.save-btn');
    if (btn) {
      btn.style.background = '#B8902A';
      btn.style.color = '#fff';
      btn.innerText = '✓ Saved';
      setTimeout(() => {
        btn.style.background = '#FFF';
        btn.style.color = '#B8902A';
        btn.innerHTML = '<span style="font-size:14px">💾</span> Save';
      }, 1500);
    }
  }
}

function highlightHadith(hadithId) {
  const card = document.getElementById(hadithId);
  if (!card) return;
  
  if (card.style.backgroundColor === 'rgba(212, 175, 55, 0.1)') {
    card.style.backgroundColor = '';
    card.style.borderLeft = '';
  } else {
    card.style.backgroundColor = 'rgba(212, 175, 55, 0.1)';
    card.style.borderLeft = '4px solid #D4AF37';
  }
  
  const btn = card.querySelector('.highlight-btn');
  if (btn) {
    btn.classList.toggle('active');
    if (btn.classList.contains('active')) {
      btn.style.background = '#C99A2E';
      btn.style.color = '#fff';
    } else {
      btn.style.background = '#FFF';
      btn.style.color = '#B8902A';
    }
  }
}

function shareHadith(hadithId) {
  const card = document.getElementById(hadithId);
  if (!card) return;
  
  const text = card.innerText;
  const url = window.location.href + '#' + hadithId;
  const shareText = encodeURIComponent(`Hadith: ${text.substring(0, 100)}...\n\n${url}`);
  
  const shareMenu = document.createElement('div');
  shareMenu.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,0.2);z-index:1000;min-width:200px';
  shareMenu.innerHTML = `
    <div style="font-size:13px;font-weight:700;margin-bottom:12px;color:#B8902A">Share Hadith</div>
    <a href="https://twitter.com/intent/tweet?text=${shareText}" target="_blank" 
       style="display:block;padding:8px 12px;margin-bottom:6px;background:#1DA1F2;color:#fff;text-decoration:none;border-radius:6px;text-align:center;font-size:12px;font-weight:700">
       𝕏 Twitter
    </a>
    <a href="https://www.facebook.com/sharer/sharer.php?u=${url}" target="_blank"
       style="display:block;padding:8px 12px;margin-bottom:6px;background:#1877F2;color:#fff;text-decoration:none;border-radius:6px;text-align:center;font-size:12px;font-weight:700">
       📘 Facebook
    </a>
    <button onclick="this.parentElement.remove()" 
       style="width:100%;padding:8px;background:#E8D8A0;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;color:#1A1A1A">
       Close
    </button>
  `;
  document.body.appendChild(shareMenu);
  
  setTimeout(() => shareMenu.remove(), 8000);
}

document.getElementById('status').style.display = 'block';
load().catch(err => {
  document.getElementById('status').textContent = 'Failed to load: ' + err.message;
});
</script>
</body>
</html>
