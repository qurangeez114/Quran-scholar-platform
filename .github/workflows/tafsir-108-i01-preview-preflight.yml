name: Validate Surah 108 isolated I01 integration preview
on:
  push:
    paths:
      - 'tools/preview-i01-integration.py'
      - 'tools/test-i01-preview.py'
      - 'tools/verify-i01-lifecycle.py'
      - 'scripts/*tabari-t01*.py'
      - 'scripts/*tabari-t02*.py'
      - 'scripts/*tabari-t11a*.py'
      - 'scripts/*tabari-t11c*.py'
      - 'data/tafsir/staging/tabari-108-t11c-*.json'
      - 'data/tafsir/staging/tabari-108-t11a-*.json'
      - '.github/workflows/tafsir-108-i01-preview-preflight.yml'
      - 'data/tafsir/staging/*108*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-i01-preview-preflight
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned post-T11A pre-T11C baseline
        uses: actions/checkout@v4
        with:
          ref: b551d9167b53a32e0c120d9096b56dc644e7b3dd
          path: .t11c-baseline
          persist-credentials: false
      - name: Read pinned post-T02 pre-T11A baseline
        uses: actions/checkout@v4
        with:
          ref: cf1bccf8793c6b8c381a052cc25213bde72849f6
          path: .t11a-baseline
          persist-credentials: false
      - name: Read pinned pre-integration baseline
        uses: actions/checkout@v4
        with:
          ref: e57ce1f68c3ae19296aac130e246ccd5f712c4aa
          path: .i01-baseline
          persist-credentials: false
      - name: Read pinned post-I01 pre-T01 baseline
        uses: actions/checkout@v4
        with:
          ref: 5517c14dbde1656932d55a7d310b458f7c1866f7
          path: .t01-baseline
          persist-credentials: false
      - name: Read pinned post-T01 pre-T02 baseline
        uses: actions/checkout@v4
        with:
          ref: f737063faf85198b8cf46286b8643681bba9687c
          path: .t02-baseline
          persist-credentials: false
      - name: Snapshot checked-out staging without database or network access
        shell: python
        run: |
          import hashlib, json, os, pathlib
          paths=["data/tafsir/staging/ibn-kathir-108-external-locators-2026-10-14.json","data/tafsir/staging/surah-108-voice-projection-2026-10-17.json","data/tafsir/staging/surah-108-chapter-manifest-2026-10-12.json","data/tafsir/staging/ibn-kathir-108-i01-replacement-overlay-2026-10-17.json","data/tafsir/staging/surah-108-voice-column-audit-2026-10-17.json","data/tafsir/staging/surah-108-link-schema-q06-mapping-2026-10-17.json","data/tafsir/staging/qurtubi-108-q06-bilingual-source-check-2026-10-17.json","data/tafsir/staging/surah-108-payload-assembly-2026-10-16.json","data/tafsir/staging/ibn-kathir-108-research-2026-10-12.json","data/tafsir/staging/ibn-kathir-108-i01-four-table-candidates-2026-10-17.json","data/tafsir/staging/ibn-kathir-108-evidence-voice-plan-2026-10-12.json"]
          for root,label in ((pathlib.Path('.i01-baseline'),'baseline'),(pathlib.Path('.t01-baseline'),'post'),(pathlib.Path('.'),'current')):
              snapshot={}
              for name in paths:
                  raw=(root/name).read_bytes()
                  snapshot[name]={'content':raw.decode('utf-8'),'sha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()}
              target=pathlib.Path(os.environ['RUNNER_TEMP'])/('i01-'+label+'.json')
              target.write_text(json.dumps(snapshot,ensure_ascii=False),encoding='utf-8')
      - name: Verify valid preview and six unsafe-input rejections
        run: python tools/test-i01-preview.py "$RUNNER_TEMP/i01-baseline.json"
      - name: Verify historical I01 split against pinned post-I01 baseline
        run: python tools/verify-i01-lifecycle.py "$RUNNER_TEMP/i01-baseline.json" "$RUNNER_TEMP/i01-post.json"
      - name: Verify historical T01 transition against pinned pre-T02 baseline
        run: python3 scripts/test-tabari-t01-coordinated-lifecycle.py --baseline .t01-baseline --current .t02-baseline
      - name: Verify current exact T02 transition
        run: python3 scripts/test-tabari-t02-coordinated-lifecycle.py --baseline .t02-baseline --current .t11a-baseline
      - name: Read pinned post-T11C baseline for historical guards
        uses: actions/checkout@v4
        with:
          ref: 66dbd7607e30db7f2bebfe774f0e828df4e61412
          path: .i02-baseline
          persist-credentials: false
      - name: Verify current T11C coordinated lifecycle
        run: python3 scripts/test-tabari-t11c-coordinated-lifecycle.py --baseline .t11c-baseline --current .i02-baseline
      - name: Verify historical coordinated T11A state
        run: python3 scripts/test-tabari-t11a-coordinated-lifecycle.py --baseline .t11a-baseline --current .t11c-baseline
      - name: Preserve every other historical I01 input
        shell: python
        run: |
          import json, os, pathlib
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          post=json.loads((base/'i01-post.json').read_text())
          current=json.loads((base/'i01-current.json').read_text())
          allowed={'data/tafsir/staging/surah-108-payload-assembly-2026-10-16.json','data/tafsir/staging/surah-108-voice-projection-2026-10-17.json','data/tafsir/staging/qurtubi-108-q06-bilingual-source-check-2026-10-17.json'}
          if set(post)!=set(current):
              raise SystemExit('Missing or unexpected I01 snapshot input')
          for path in set(post)-allowed:
              if post[path]!=current[path]:
                  raise SystemExit('Unrelated I01 input changed: '+path)
      - name: Verify staging files remain untouched
        run: git diff --exit-code -- data/tafsir/staging
      - name: Validate exact I02 coordinated transition
        run: python3 scripts/test-ibn-kathir-i02-coordinated-lifecycle.py --baseline .i02-baseline --current .
