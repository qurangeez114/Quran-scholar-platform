name: Sources screening index tests
on:
  pull_request:
    paths:
      - 'scripts/build_sources_screening_index.py'
      - 'tests/test_sources_screening_index.py'
      - '.github/workflows/sources-screening-index.yml'
  push:
    branches:
      - 'research/sources-coverage-reconciliation-audit-20261114'
    paths:
      - 'scripts/build_sources_screening_index.py'
      - 'tests/test_sources_screening_index.py'
      - '.github/workflows/sources-screening-index.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax validation
        run: python -m py_compile scripts/build_sources_screening_index.py tests/test_sources_screening_index.py
      - name: Regression tests (no production access)
        run: python -m unittest discover -s tests -p test_sources_screening_index.py -v
