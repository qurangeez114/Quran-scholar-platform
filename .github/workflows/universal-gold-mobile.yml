name: Universal gold design and phone checks
on:
  pull_request:
    paths:
      - site-chrome.js
      - site-motion.js
      - quranhikma-universal-gold.css
      - tests/universal-gold-smoke.py
      - .github/workflows/universal-gold-mobile.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 tests/universal-gold-smoke.py
      - name: Syntax-check shared browser scripts
        run: |
          node --check site-chrome.js
          node --check site-motion.js
