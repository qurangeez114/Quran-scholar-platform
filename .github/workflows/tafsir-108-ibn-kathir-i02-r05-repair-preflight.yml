name: Preflight Surah 108 Ibn Kathir I02 R05 repair review
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-ibn-kathir-i02-r05-repair-preflight.yml'
      - 'data/tafsir/staging/ibn-kathir-108-i02-r05-repair-review-2026-10-14.json'
      - 'data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-ibn-kathir-i02-r05-repair-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate R05 divergence and live Arabic witness
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import json,os,re,urllib.request,unicodedata
          rp='data/tafsir/staging/ibn-kathir-108-i02-r05-repair-review-2026-10-14.json'
          ep='data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json'
          review=json.load(open(rp,encoding='utf-8')); routes=json.load(open(ep,encoding='utf-8'))
          required={'schema_version':'quranhikma-tafsir-route-source-review-v1','surah':108,
            'scholar_key':'ibn_kathir','claim_id':'108-I02','route_id':'108-I02-R05',
            'status':'bounded_primary_comparison_complete_repair_required_not_publication_ready',
            'database_written':False,'publication_ready':False}
          for k,v in required.items():
              if review.get(k)!=v: raise SystemExit(f'Unsafe or mismatched {k}: {review.get(k)!r}')
          cmp=review.get('comparison',{})
          if cmp.get('decision')!='direct_tabari_match_with_material_live_transcription_divergence_repair_required':
              raise SystemExit('R05 repair decision missing')
          variant=cmp.get('material_name_variant',{})
          if variant!={'live_staged':'سليمان بن هلال','public_ibn_kathir_and_tabari':'سليمان بن بلال'}:
              raise SystemExit('R05 Hilal/Bilal divergence changed')
          if cmp.get('authentication_state')!='not_assessed' or cmp.get('proposition_count_effect')!=0:
              raise SystemExit('R05 scope or proposition count changed')
          if review['public_ibn_kathir_witness'].get('interface_locator')!='public text line 33':
              raise SystemExit('R05 Ibn Kathir locator missing')
          if review['direct_tabari_witness'].get('interface_locator')!='public text line 39':
              raise SystemExit('R05 Tabari locator missing')
          route_list=list(routes.get('follow_on_routes_recovered_from_bounded_context',[]))
          for group in routes.get('route_groups',[]): route_list.extend(group.get('routes',[]))
          r05=next((r for r in route_list if r.get('route_id')=='108-I02-R05'),None)
          if not r05: raise SystemExit('R05 missing from route extraction')
          route_anchor=r05.get('arabic_locator') or r05.get('arabic_anchor') or r05.get('chain_arabic') or r05.get('source_anchor')
          if route_anchor!=review['live_staged_witness']['arabic_anchor']:
              raise SystemExit('R05 route extraction and staged witness differ')
          key=os.environ.get('SUPABASE_SERVICE_KEY','')
          if not key: raise SystemExit('Missing protected database credential')
          headers={'apikey':key,'Authorization':'Bearer '+key}
          req=urllib.request.Request('https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/tafsir_entries?id=eq.48457&select=id,sura,aya,language,scholar_key,content&limit=1',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as resp: rows=json.load(resp)
          if len(rows)!=1: raise SystemExit('Expected live tafsir entry 48457')
          row=rows[0]
          if (row.get('id'),row.get('sura'),row.get('aya'),row.get('language'),row.get('scholar_key'))!=(48457,108,1,'ar','ibn_kathir'):
              raise SystemExit('Live identity mismatch')
          def norm(s):
              s=unicodedata.normalize('NFKC',s or '')
              s=re.sub(r'[\u064b-\u065f\u0670\u06d6-\u06ed]','',s)
              s=re.sub(r'[،؛:,.!?؟\"“”()\[\]]',' ',s)
              return re.sub(r'\s+',' ',s).strip()
          live=norm(row.get('content',''))
          missing=[a for a in review['validation']['required_live_anchors'] if norm(a) not in live]
          if missing: raise SystemExit('Missing live Arabic anchors: '+json.dumps(missing,ensure_ascii=False))
          if norm('سليمان بن بلال') in live:
              raise SystemExit('Live content unexpectedly already contains Ibn Bilal; review stale')
          print('AUDIT_MODE read-only; no writes')
          print('R05_DECISION',cmp['decision'])
          print('R05_LIVE_READING',variant['live_staged'])
          print('R05_EXTERNAL_READING',variant['public_ibn_kathir_and_tabari'])
          print('R05_AUTHENTICATION',cmp['authentication_state'])
          print('R05_PROPOSITION_COUNT_EFFECT',cmp['proposition_count_effect'])
          print('TAFSIR_108_IBN_KATHIR_I02_R05_REPAIR_PREFLIGHT_PASS')
