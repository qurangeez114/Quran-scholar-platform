name: Validate Surah 108 Tabari T02 coordinated staging preview
on:
  push:
    paths:
      - 'scripts/test-tabari-t02-overlay.py'
      - 'scripts/*tabari-t11a*.py'
      - 'scripts/*tabari-t11c*.py'
      - 'data/tafsir/staging/tabari-108-t11c-*.json'
      - 'data/tafsir/staging/tabari-108-t11a-*.json'
      - 'scripts/preview-tabari-t02-coordinated.py'
      - 'scripts/test-tabari-t02-coordinated-lifecycle.py'
      - 'data/tafsir/staging/surah-108-voice-projection-2026-10-17.json'
      - 'data/tafsir/staging/qurtubi-108-q06-bilingual-source-check-2026-10-17.json'
      - 'data/tafsir/staging/tabari-108-t02-four-table-draft-2026-10-19.json'
      - 'data/tafsir/staging/tabari-108-t02-readonly-preflight-2026-10-19.json'
      - 'data/tafsir/staging/tabari-108-t02-source-boundary-review-2026-10-19.json'
      - 'data/tafsir/staging/surah-108-payload-assembly-2026-10-16.json'
      - '.github/workflows/tafsir-108-tabari-t02-draft.yml'
  pull_request:
    paths:
      - 'scripts/test-tabari-t02-overlay.py'
      - 'scripts/*tabari-t11a*.py'
      - 'scripts/*tabari-t11c*.py'
      - 'data/tafsir/staging/tabari-108-t11c-*.json'
      - 'data/tafsir/staging/tabari-108-t11a-*.json'
      - 'scripts/preview-tabari-t02-coordinated.py'
      - 'scripts/test-tabari-t02-coordinated-lifecycle.py'
      - 'data/tafsir/staging/surah-108-voice-projection-2026-10-17.json'
      - 'data/tafsir/staging/qurtubi-108-q06-bilingual-source-check-2026-10-17.json'
      - 'data/tafsir/staging/tabari-108-t02-four-table-draft-2026-10-19.json'
      - 'data/tafsir/staging/tabari-108-t02-readonly-preflight-2026-10-19.json'
      - 'data/tafsir/staging/tabari-108-t02-source-boundary-review-2026-10-19.json'
      - 'data/tafsir/staging/surah-108-payload-assembly-2026-10-16.json'
      - '.github/workflows/tafsir-108-tabari-t02-draft.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-tabari-t02-draft-${{ github.ref }}
  cancel-in-progress: false
jobs:
  historical-assembly-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned post-T11A pre-T11C baseline
        uses: actions/checkout@v4
        with:
          ref: b551d9167b53a32e0c120d9096b56dc644e7b3dd
          path: .t11c-baseline
          persist-credentials: false
      - name: Read pinned post-T02 pre-T11A baseline
        uses: actions/checkout@v4
        with:
          ref: cf1bccf8793c6b8c381a052cc25213bde72849f6
          path: .t11a-baseline
          persist-credentials: false
      - name: Read pinned pre-T02 integration inputs
        uses: actions/checkout@v4
        with:
          ref: f737063faf85198b8cf46286b8643681bba9687c
          path: .t02-baseline
          persist-credentials: false
      - name: Confirm current research inputs match reviewed baseline
        shell: bash
        run: |
          cmp data/tafsir/staging/tabari-108-t02-four-table-draft-2026-10-19.json .t02-baseline/data/tafsir/staging/tabari-108-t02-four-table-draft-2026-10-19.json
          cmp data/tafsir/staging/tabari-108-t02-readonly-preflight-2026-10-19.json .t02-baseline/data/tafsir/staging/tabari-108-t02-readonly-preflight-2026-10-19.json
          cmp data/tafsir/staging/tabari-108-t02-source-boundary-review-2026-10-19.json .t02-baseline/data/tafsir/staging/tabari-108-t02-source-boundary-review-2026-10-19.json
      - name: Test historical assembly preview and nine unsafe changes
        run: python3 scripts/test-tabari-t02-overlay.py --root .t02-baseline
      - name: Test coordinated preview and stale consumer rejections
        run: python3 scripts/preview-tabari-t02-coordinated.py --root .t02-baseline
      - name: Validate current original or exact three-file state
        run: python3 scripts/test-tabari-t02-coordinated-lifecycle.py --baseline .t02-baseline --current .t11a-baseline
      - name: Read pinned post-T11C baseline for historical guards
        uses: actions/checkout@v4
        with:
          ref: 66dbd7607e30db7f2bebfe774f0e828df4e61412
          path: .i02-baseline
          persist-credentials: false
      - name: Verify current T11C coordinated lifecycle
        run: python3 scripts/test-tabari-t11c-coordinated-lifecycle.py --baseline .t11c-baseline --current .i02-baseline
      - name: Verify historical coordinated T11A state
        run: python3 scripts/test-tabari-t11a-coordinated-lifecycle.py --baseline .t11a-baseline --current .t11c-baseline
      - name: Confirm preview did not modify tracked files
        run: |
          git diff --exit-code
          git -C .t02-baseline diff --exit-code
# Validates T02's three linked staging files. Other I01/T01 and voice-projection
# workflow consumers still require review before integration.
# No secrets, database access, publication or source-authenticity approval.
      - name: Read pinned post-I02 baseline for historical guards
        uses: actions/checkout@v4
        with:
          ref: 52d17712d7f3138ec18471ab588813da8e04a15b
          path: .i03-baseline
          persist-credentials: false
      - name: Validate exact I02 coordinated transition
        run: python3 scripts/test-ibn-kathir-i02-coordinated-lifecycle.py --baseline .i02-baseline --current .i03-baseline
      - name: Validate exact I03 coordinated transition
        run: python3 scripts/test-ibn-kathir-i03-coordinated-lifecycle.py --baseline .i03-baseline --current .
