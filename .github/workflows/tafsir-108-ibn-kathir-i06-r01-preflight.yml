name: Preflight Surah 108 Ibn Kathir I06 R01 primary review
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-ibn-kathir-i06-r01-preflight.yml'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r01-primary-review-2026-10-15.json'
      - 'data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-ibn-kathir-i06-r01-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate I06 R01 direct comparison and live bilingual boundary
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import html,json,os,re,unicodedata,urllib.parse,urllib.request
          rp='data/tafsir/staging/ibn-kathir-108-i06-r01-primary-review-2026-10-15.json'
          ep='data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json'
          review=json.load(open(rp,encoding='utf-8')); extraction=json.load(open(ep,encoding='utf-8'))
          required={'schema_version':'quranhikma-tafsir-route-source-review-v1','surah':108,'verse':3,'scholar_key':'ibn_kathir','claim_id':'108-I06','route_id':'108-I06-R01','status':'bounded_primary_comparison_complete_not_publication_ready','human_verified':False,'database_written':False,'publication_ready':False}
          for k,v in required.items():
              if review.get(k)!=v: raise SystemExit(f'Unsafe or mismatched {k}: {review.get(k)!r}')
          cmp=review.get('comparison',{})
          if cmp.get('decision')!='direct_tabari_supports_all_four_named_attributions_as_separate_routes' or cmp.get('single_shared_chain') is not False:
              raise SystemExit('I06 R01 comparison guard failed')
          if cmp.get('authentication_state')!='not_assessed' or cmp.get('proposition_count_effect')!=0:
              raise SystemExit('Authentication or proposition-count scope changed')
          groups=extraction.get('route_groups',[])
          g=next((x for x in groups if x.get('claim_id')=='108-I06'),None)
          if not g: raise SystemExit('I06 route group missing')
          route=next((x for x in g.get('routes',[]) if x.get('route_id')=='108-I06-R01'),None)
          if not route: raise SystemExit('I06 R01 missing')
          if route.get('attributed_voices')!=["Ibn Abbas","Mujahid","Sa'id ibn Jubayr","Qatada"]:
              raise SystemExit('Extracted voice list changed')
          if route.get('arabic_locator')!=review['ibn_kathir_witness']['arabic_anchor']:
              raise SystemExit('Staged Arabic anchor changed')
          def norm(s):
              s=unicodedata.normalize('NFKC',html.unescape(s or ''))
              s=re.sub(r'[\u064b-\u065f\u0670\u06d6-\u06ed]','',s)
              s=re.sub(r'[،؛:,.!?؟\"“”()\[\]{}<>/=_-]',' ',s)
              return re.sub(r'\s+',' ',s).strip()
          src_url=review['direct_tabari_witness']['public_source_url']
          req=urllib.request.Request(src_url,headers={'User-Agent':'Mozilla/5.0 QuranHikma read-only source audit'})
          with urllib.request.urlopen(req,timeout=30) as resp: page=resp.read().decode('utf-8','replace')
          page=norm(re.sub(r'<[^>]+>',' ',page))
          direct_anchors=[r['route_anchor'] for r in review['direct_tabari_witness']['voice_routes']]
          missing=[a for a in direct_anchors if norm(a) not in page]
          if missing: raise SystemExit('Missing direct Tabari route anchors: '+json.dumps(missing,ensure_ascii=False))
          key=os.environ.get('SUPABASE_SERVICE_KEY','')
          if not key: raise SystemExit('Missing protected database credential')
          params=urllib.parse.urlencode({'id':'in.(48459,11081)','select':'id,sura,aya,language,scholar_key,content','order':'id.asc'})
          req=urllib.request.Request('https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/tafsir_entries?'+params,headers={'apikey':key,'Authorization':'Bearer '+key})
          with urllib.request.urlopen(req,timeout=30) as resp: rows=json.load(resp)
          byid={r['id']:r for r in rows}
          if set(byid)!={11081,48459}: raise SystemExit('Expected live entries 48459 and 11081')
          for eid,lang in ((48459,'ar'),(11081,'en')):
              row=byid[eid]
              if (row.get('sura'),row.get('aya'),row.get('language'),row.get('scholar_key'))!=(108,3,lang,'ibn_kathir'):
                  raise SystemExit('Live identity mismatch '+str(eid))
          ar=norm(byid[48459].get('content',''))
          if norm(review['ibn_kathir_witness']['arabic_anchor']) not in ar: raise SystemExit('Live Arabic I06 anchor missing')
          en=norm(byid[11081].get('content','')).lower()
          en=re.sub(r"['`‘’ʿʾ]",'',en)
          en=re.sub(r'[^a-z0-9]+',' ',en)
          en=re.sub(r'\s+',' ',en).strip()
          m=re.search(r'ibn abbas mujahid said bin jubayr and qatadah? all said',en)
          if not m: raise SystemExit('Four-name English attribution cluster missing')
          window=en[m.start():m.start()+300]
          if not re.search(r'al as (?:bin|ibn) wa ?il',window): raise SystemExit('Local al-As referent missing')
          matched='four-name cluster followed by al-As'; referent=True
          voices={name:True for name in ['Ibn Abbas','Mujahid',"Sa'id ibn Jubayr",'Qatada']}
          f=review['arabic_english_fidelity']
          if f.get('bounded_voice_markers_present')!=list(voices) or f.get('bounded_voice_markers_absent')!=[]:
              raise SystemExit('Stale English voice conclusion')
          print('AUDIT_MODE read-only; no writes')
          print('DIRECT_TABARI_VOICES',json.dumps([x['voice'] for x in review['direct_tabari_witness']['voice_routes']]))
          print('ENGLISH_REFERENT_MARKER',referent,matched)
          print('ENGLISH_BOUNDED_VOICE_MARKERS',json.dumps(voices,sort_keys=True))
          print('I06_R01_AUTHENTICATION',cmp['authentication_state'])
          print('I06_R01_PROPOSITION_COUNT_EFFECT',cmp['proposition_count_effect'])
          print('TAFSIR_108_IBN_KATHIR_I06_R01_PREFLIGHT_PASS')
