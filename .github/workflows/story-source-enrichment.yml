name: Story source enrichment tests
on:
  pull_request:
    paths:
      - 'compare.html'
      - 'story-source-dossier.js'
      - 'tests/story-source-dossier.test.mjs'
      - '.github/workflows/story-source-enrichment.yml'
  push:
    branches: [main]
    paths:
      - 'compare.html'
      - 'story-source-dossier.js'
      - 'tests/story-source-dossier.test.mjs'
      - '.github/workflows/story-source-enrichment.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check story-source-dossier.js
      - run: node --test tests/story-source-dossier.test.mjs
