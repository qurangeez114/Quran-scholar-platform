name: Validate Surah 108 provisional I04A speaker split
on:
  push:
    paths:
      - 'scripts/validate-ibn-kathir-i04a-combined.py'
      - 'data/tafsir/staging/ibn-kathir-108-i04a-combined-candidate-2026-10-22.json'
      - 'scripts/validate-ibn-kathir-i04a-route-projection.py'
      - 'data/tafsir/staging/ibn-kathir-108-i04a-route-projection-draft-2026-10-22.json'
      - 'scripts/validate-ibn-kathir-i04a-draft.py'
      - 'data/tafsir/staging/ibn-kathir-108-i04a-two-proposition-draft-2026-10-22.json'
      - 'data/tafsir/staging/ibn-kathir-108-i04a-clause-speaker-dossier-2026-10-22.json'
      - 'data/tafsir/staging/ibn-kathir-108-i04a-printed-route-scope-dossier-2026-10-22.json'
      - '.github/workflows/tafsir-108-ibn-kathir-i04a-draft.yml'
  pull_request:
    paths:
      - 'scripts/validate-ibn-kathir-i04a-combined.py'
      - 'data/tafsir/staging/ibn-kathir-108-i04a-combined-candidate-2026-10-22.json'
      - 'scripts/validate-ibn-kathir-i04a-route-projection.py'
      - 'data/tafsir/staging/ibn-kathir-108-i04a-route-projection-draft-2026-10-22.json'
      - 'scripts/validate-ibn-kathir-i04a-draft.py'
      - 'data/tafsir/staging/ibn-kathir-108-i04a-two-proposition-draft-2026-10-22.json'
      - 'data/tafsir/staging/ibn-kathir-108-i04a-clause-speaker-dossier-2026-10-22.json'
      - 'data/tafsir/staging/ibn-kathir-108-i04a-printed-route-scope-dossier-2026-10-22.json'
      - '.github/workflows/tafsir-108-ibn-kathir-i04a-draft.yml'
permissions:
  contents: read
concurrency:
  group: tafsir-108-i04a-draft-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate provisional speaker and evidence contract
        run: python scripts/validate-ibn-kathir-i04a-draft.py --root . --self-test
      - name: Validate route projection and reject unsafe scopes
        run: python scripts/validate-ibn-kathir-i04a-route-projection.py --root data/tafsir/staging --self-test
      - name: Validate combined candidate against both components
        run: python scripts/validate-ibn-kathir-i04a-combined.py --root data/tafsir/staging --self-test
      - name: Confirm staging remained unchanged
        run: git diff --exit-code -- data/tafsir/staging
# Offline validation only. No secrets, database connection or publication.
# Schema revalidation and physical transmission-route payload remain pending.
