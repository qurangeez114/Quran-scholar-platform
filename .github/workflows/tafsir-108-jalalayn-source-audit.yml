name: Audit Jalalayn Surah 108 source alignment
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-jalalayn-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only live English and external Arabic audit
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import hashlib,json,os,re,urllib.parse,urllib.request
          key=os.environ.get('SUPABASE_SERVICE_KEY','')
          if not key: raise SystemExit('Missing protected database credential')
          def get(url,headers=None):
              req=urllib.request.Request(url,headers=headers or {'User-Agent':'QuranHikma-source-audit/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          base='https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/tafsir_entries'
          params={'sura':'eq.108','scholar_key':'eq.jalalayn','language':'in.(ar,en)','select':'id,aya,language,content,source_name,source_url','order':'language.asc,aya.asc,id.asc','limit':'50'}
          rows=get(base+'?'+urllib.parse.urlencode(params),{'apikey':key,'Authorization':'Bearer '+key})
          print('AUDIT_MODE read-only; no writes')
          print('LIVE_ROW_COUNT',len(rows))
          for x in rows:
              c=x.get('content') or ''
              print('LIVE_IDENTITY',json.dumps({'id':x['id'],'aya':x['aya'],'language':x['language'],'chars':len(c),'sha256':hashlib.sha256(c.encode()).hexdigest(),'source_name':x.get('source_name'),'source_url':x.get('source_url')},ensure_ascii=False))
              print('LIVE_TEXT',x['aya'],re.sub(r'\s+',' ',c))
          resources=get('https://api.quran.com/api/v4/resources/tafsirs?language=ar')
          matches=[x for x in resources.get('tafsirs',[]) if 'jalal' in ((x.get('name') or '')+' '+(x.get('author_name') or '')).lower()]
          print('QURANCOM_MATCHES',json.dumps(matches,ensure_ascii=False))
          if not matches: raise SystemExit('No Arabic Jalalayn resource found')
          tid=matches[0]['id']
          for aya in (1,2,3):
              d=get(f'https://api.quran.com/api/v4/tafsirs/{tid}/by_ayah/108:{aya}')
              item=d.get('tafsir') or d
              text=re.sub(r'<[^>]+>',' ',item.get('text',''))
              text=re.sub(r'\s+',' ',text).strip()
              print('ARABIC_SOURCE',json.dumps({'aya':aya,'tafsir_id':tid,'chars':len(text),'sha256':hashlib.sha256(text.encode()).hexdigest(),'resource_name':matches[0].get('name'),'url':f'https://quran.com/108:{aya}/tafsirs/ar-tafsir-jalalayn'},ensure_ascii=False))
              print('ARABIC_TEXT',aya,text)
          if sorted({int(x['aya']) for x in rows if x['language']=='en'}) != [1,2,3]: raise SystemExit('Live English coverage incomplete')
          print('JALALAYN_108_SOURCE_ALIGNMENT_PASS')
