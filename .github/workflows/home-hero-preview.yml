name: QuranHikma home redesign smoke checks
on:
  pull_request:
    paths:
      - index.html
      - quranhikma-emerald-gold.css
      - tests/home-hero-smoke.py
      - .github/workflows/home-hero-preview.yml
permissions:
  contents: read
jobs:
  home-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate homepage essentials
        run: python3 tests/home-hero-smoke.py
