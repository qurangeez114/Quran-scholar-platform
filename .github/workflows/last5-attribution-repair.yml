name: Last Five Tafsir Attribution Repair
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/last5-attribution-repair.yml'
concurrency:
  group: last-five-surahs-tafsir
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair and verify existing attribution links
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python extract_last5_tafsir.py --repair-only
