name: Preflight Surah 108 Jalalayn evidence voice plan
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-jalalayn-plan-preflight.yml'
      - 'data/tafsir/staging/jalalayn-108-evidence-voice-plan-2026-10-13.json'
      - 'data/tafsir/staging/jalalayn-108-research-2026-10-12.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-jalalayn-plan-preflight
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate five Jalalayn rows without writes
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import hashlib, json, os, re, unicodedata, urllib.request
          key=os.environ.get("SUPABASE_SERVICE_KEY","")
          if not key:
              raise SystemExit("Missing protected database credential")
          plan=json.load(open("data/tafsir/staging/jalalayn-108-evidence-voice-plan-2026-10-13.json",encoding="utf-8"))
          stage=json.load(open("data/tafsir/staging/jalalayn-108-research-2026-10-12.json",encoding="utf-8"))
          rows=plan.get("rows",[])
          ids=[row.get("claim_id") for row in rows]
          expected_ids=["108-J01","108-J02","108-J03","108-J04","108-J05"]
          if ids!=expected_ids or len(set(ids))!=5:
              raise SystemExit("Jalalayn claim set/order mismatch: "+repr(ids))
          if plan.get("claim_count")!=5 or plan.get("database_written") is not False or plan.get("ready_for_database_import") is not False:
              raise SystemExit("Unsafe plan state")
          if stage.get("database_written") is not False:
              raise SystemExit("Unsafe staging state")
          for row in rows:
              p,v,e,s=row["proposition"],row["voice"],row["evidence"],row["source"]
              if p.get("speaker_name")!="al-Jalālayn" or p.get("claim_type_id")!=43:
                  raise SystemExit("Unexpected proposition attribution "+row["claim_id"])
              if p.get("verification_state")!="source_language_proposition_verified":
                  raise SystemExit("Unverified proposition "+row["claim_id"])
              if v.get("reporting_work_id")!=4 or v.get("originating_voice_type")!="exegete_own_view":
                  raise SystemExit("Unexpected Jalalayn voice "+row["claim_id"])
              if v.get("originating_voice_name") is not None or v.get("transmission_route_action")!="none":
                  raise SystemExit("Unsafe voice/route plan "+row["claim_id"])
              if e.get("unit_type")!="single_named_attribution" or e.get("attributed_authority_name")!="al-Jalālayn":
                  raise SystemExit("Unexpected evidence attribution "+row["claim_id"])
              if not s.get("evidence_anchor_ar") or not s.get("external_arabic_url","").startswith("https://quran.com/108:"):
                  raise SystemExit("Missing Arabic evidence locator "+row["claim_id"])
          for row in rows[:4]:
              if row["proposition"].get("mufassir_own_position")!="preferred":
                  raise SystemExit("Unexpected own-position state "+row["claim_id"])
          if rows[4]["proposition"].get("mufassir_own_position")!="reported_only":
              raise SystemExit("J05 must remain reported_only")
          if plan["validation"].get("transmission_routes_planned")!=0:
              raise SystemExit("Transmission route creation is forbidden")
          base="https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/"
          headers={"apikey":key,"Authorization":"Bearer "+key}
          def get(path):
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          live_entries=get("tafsir_entries?id=in.(23671,23672,23673)&select=id,sura,aya,scholar_key,language,content&order=id")
          by_id={row["id"]:row for row in live_entries}
          expected_identity={
              23671:(108,1,"jalalayn","en"),
              23672:(108,2,"jalalayn","en"),
              23673:(108,3,"jalalayn","en")}
          expected_hash={
              23671:"cbcef7915018869e68c64deb57a9ebb6fd18e1d2b417437b0e4a0ea1463823e0",
              23672:"926c19acf9d6aaca6265c89ca1ed6f835287e4cfbbee08437d151983e8fb1eb0",
              23673:"c87e16c462a22f83487462994014cd5c4628e5e427ad8474883f32ca63a9e8b8"}
          if set(by_id)!=set(expected_identity):
              raise SystemExit("Jalalayn source row inventory mismatch")
          for entry_id,identity in expected_identity.items():
              row=by_id[entry_id]
              actual=(row["sura"],row["aya"],row["scholar_key"],row["language"])
              if actual!=identity:
                  raise SystemExit("Source identity mismatch "+str(entry_id)+" "+repr(actual))
              digest=hashlib.sha256((row.get("content") or "").encode("utf-8")).hexdigest()
              if digest!=expected_hash[entry_id]:
                  raise SystemExit("Source hash drift "+str(entry_id)+" "+digest)
          def norm(value):
              value=unicodedata.normalize("NFKD",value or "").encode("ascii","ignore").decode().casefold()
              return re.sub(r"[^a-z0-9]+"," ",value).strip()
          existing=get("propositions?tafsir_entry_id=in.(23671,23672,23673)&select=id,tafsir_entry_id,statement_en,status&limit=1000")
          exact=[]; likely=[]
          for planned in rows:
              a=norm(planned["proposition"]["statement_en"]); aset=set(a.split())
              for saved in existing:
                  b=norm(saved.get("statement_en")); bset=set(b.split())
                  if a==b:
                      exact.append({"claim":planned["claim_id"],"proposition":saved["id"]})
                  elif aset and bset:
                      score=len(aset & bset)/len(aset | bset)
                      if score>=0.72:
                          likely.append({"claim":planned["claim_id"],"proposition":saved["id"],"jaccard":round(score,3)})
          if exact or likely:
              raise SystemExit("Duplicate review required exact="+json.dumps(exact)+" likely="+json.dumps(likely))
          print("AUDIT_MODE read-only; no writes")
          print("JALALAYN_PLAN_ROWS",len(rows))
          print("SOURCE_IDENTITIES_AND_HASHES_VERIFIED",sorted(by_id))
          print("EXTERNAL_ARABIC_LOCATORS_PRESENT",len(rows))
          print("TRANSMISSION_ROUTES_PLANNED",0)
          print("LIVE_EXACT_DUPLICATES",json.dumps(exact))
          print("LIVE_LIKELY_DUPLICATES",json.dumps(likely))
          print("JALALAYN_108_PLAN_PREFLIGHT_PASS")
