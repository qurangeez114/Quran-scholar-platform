name: Course management responsive UI
on:
  pull_request:
    paths:
      - 'admin/courses.html'
      - 'tests/lms/courses-responsive-ui.mjs'
      - '.github/workflows/courses-responsive-ui.yml'
  push:
    branches: [main]
    paths:
      - 'admin/courses.html'
      - 'tests/lms/courses-responsive-ui.mjs'
permissions:
  contents: read
jobs:
  course-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --no-save --ignore-scripts --no-audit --no-fund linkedom
      - name: Course management layout and interaction regression
        run: node --test tests/lms/courses-responsive-ui.mjs
