name: Repair muqattaat first-verse audio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-muqattaat-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-letter-verse-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio tools and SILMA
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install silma-tts

      - name: Generate only verified letter-opening verses
        run: |
          set -euo pipefail
          cat > /tmp/repair_muqattaa.py <<'PY'
          from pathlib import Path
          import site
          import subprocess
          import unicodedata
          from silma_tts.api import SilmaTTS

          def arabic_letters(text):
              normalized = unicodedata.normalize("NFKD", text)
              return "".join(
                  ch for ch in normalized
                  if unicodedata.category(ch).startswith("L")
                  and "\u0600" <= ch <= "\u06ff"
              )

          # The numbered verse text is only disjointed letters in these surahs.
          # Speak the letter names explicitly so no basmala is added or inferred.
          targets = {
              2: ("الم", "أَلِفْ لَامْ مِيمْ"),
              3: ("الم", "أَلِفْ لَامْ مِيمْ"),
              7: ("المص", "أَلِفْ لَامْ مِيمْ صَادْ"),
              19: ("كهيعص", "كَافْ هَا يَا عَيْنْ صَادْ"),
              20: ("طه", "طَا هَا"),
              26: ("طسم", "طَا سِينْ مِيمْ"),
              28: ("طسم", "طَا سِينْ مِيمْ"),
              29: ("الم", "أَلِفْ لَامْ مِيمْ"),
              30: ("الم", "أَلِفْ لَامْ مِيمْ"),
              31: ("الم", "أَلِفْ لَامْ مِيمْ"),
              32: ("الم", "أَلِفْ لَامْ مِيمْ"),
              36: ("يس", "يَا سِينْ"),
              40: ("حم", "حَا مِيمْ"),
              41: ("حم", "حَا مِيمْ"),
              42: ("حم", "حَا مِيمْ"),
              43: ("حم", "حَا مِيمْ"),
              44: ("حم", "حَا مِيمْ"),
              45: ("حم", "حَا مِيمْ"),
              46: ("حم", "حَا مِيمْ"),
          }

          out = Path("audio/simple-recitation")
          out.mkdir(parents=True, exist_ok=True)
          tts = SilmaTTS()
          ref_file = getattr(tts, "default_ref_audio", None)
          ref_text = "ويدقق النظر في القرآن الكريم وسائر الكتب السماوية ويتبع مسالك الرسل العظام عليهم الصلاة والسلام."
          if not ref_file:
              candidates = []
              for root in map(Path, site.getsitepackages()):
                  if root.exists():
                      candidates.extend(root.rglob("ar.ref.24k.wav"))
              if not candidates:
                  raise FileNotFoundError("SILMA Arabic reference audio ar.ref.24k.wav not found")
              ref_file = str(candidates[0])

          generated = []
          for surah, (verse_text, spoken_text) in targets.items():
              if arabic_letters(verse_text) != verse_text:
                  raise RuntimeError(f"Invalid letter sequence configured for {surah}:1")
              wav = out / f"{surah:03d}_001.wav"
              mp3 = out / f"{surah:03d}_001.mp3"
              tts.infer(
                  ref_file=str(ref_file),
                  ref_text=ref_text,
                  gen_text=spoken_text,
                  file_wave=str(wav),
                  seed=42,
                  speed=1,
              )
              subprocess.run([
                  "ffmpeg", "-y", "-i", str(wav), "-ar", "24000", "-ac", "1",
                  "-codec:a", "libmp3lame", "-b:a", "64k", str(mp3)
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              if not mp3.is_file() or mp3.stat().st_size < 1000:
                  raise RuntimeError(f"Generated audio is missing or too small: {mp3}")
              duration = float(subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1", str(mp3)
              ], text=True).strip())
              if not 0.3 < duration < 20:
                  raise RuntimeError(f"Unexpected duration for {surah}:1: {duration}")
              generated.append(mp3)
              wav.unlink()

          print(f"Generated and validated {len(generated)} letter-opening verse clips.")
          PY
          python /tmp/repair_muqattaa.py

      - name: Commit replacement verse clips
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/simple-recitation/*_001.mp3
          git commit -m "Correct audio for muqattaat opening verses"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
