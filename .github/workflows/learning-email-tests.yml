name: Instant learning invitation tests
on:
  pull_request:
    paths:
      - 'supabase/functions/lms-admin/**'
      - 'supabase/migrations/20261016_instructor_invitation_password_reset.sql'
      - 'accounts/lms-dashboard.js'
      - 'accounts/account.js'
      - 'admin/lms.html'
      - 'instructor-dashboard.html'
      - 'instructor-welcome.html'
      - 'student-welcome.html'
      - 'tests/lms/**'
      - '.github/workflows/learning-email-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/lms-admin/**'
      - 'supabase/migrations/20261016_instructor_invitation_password_reset.sql'
      - 'accounts/lms-dashboard.js'
      - 'accounts/account.js'
      - 'admin/lms.html'
      - 'instructor-dashboard.html'
      - 'student-welcome.html'
      - 'tests/lms/**'
      - '.github/workflows/learning-email-tests.yml'
permissions:
  contents: read
jobs:
  invitation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/lms
      - run: npm test --prefix tests/lms
