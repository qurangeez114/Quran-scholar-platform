name: Reader languages in place
on:
  pull_request:
    paths:
      - index.html
      - tests/inplace-lang.test.cjs
      - .github/workflows/inplace-lang-reader.yml
  workflow_dispatch:
jobs:
  inplace-lang:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Change languages mid-sura at phone and desktop widths
        run: node --test tests/inplace-lang.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inplace-lang-screens
          path: test-results/inplace-lang
