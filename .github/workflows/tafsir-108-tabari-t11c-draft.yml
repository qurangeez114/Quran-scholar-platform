name: Validate Surah 108 Tabari T11C draft

on:
  push:
    paths:
      - '.github/workflows/tafsir-108-tabari-t11c-draft.yml'
      - 'data/tafsir/staging/surah-108-payload-assembly-2026-10-16.json'
      - 'data/tafsir/staging/surah-108-voice-projection-2026-10-17.json'
      - 'data/tafsir/staging/qurtubi-108-q06-bilingual-source-check-2026-10-17.json'
      - 'scripts/validate-tabari-t11c-draft.py'
      - 'scripts/preview-tabari-t11c-coordinated.py'
      - 'scripts/test-tabari-t11c-coordinated-lifecycle.py'
      - 'data/tafsir/staging/tabari-108-t11c-five-table-draft-2026-10-20.json'
      - 'data/tafsir/staging/tabari-108-t11c-transmission-route-dossier-2026-10-20.json'
  pull_request:
    paths:
      - '.github/workflows/tafsir-108-tabari-t11c-draft.yml'
      - 'data/tafsir/staging/surah-108-payload-assembly-2026-10-16.json'
      - 'data/tafsir/staging/surah-108-voice-projection-2026-10-17.json'
      - 'data/tafsir/staging/qurtubi-108-q06-bilingual-source-check-2026-10-17.json'
      - 'scripts/validate-tabari-t11c-draft.py'
      - 'scripts/preview-tabari-t11c-coordinated.py'
      - 'scripts/test-tabari-t11c-coordinated-lifecycle.py'
      - 'data/tafsir/staging/tabari-108-t11c-five-table-draft-2026-10-20.json'
      - 'data/tafsir/staging/tabari-108-t11c-transmission-route-dossier-2026-10-20.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tafsir-108-t11c-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate isolated draft and reject unsafe mutations
        run: python scripts/validate-tabari-t11c-draft.py --root . --self-test
      - name: Read pinned post-T11A baseline
        uses: actions/checkout@v4
        with:
          ref: b551d9167b53a32e0c120d9096b56dc644e7b3dd
          path: .t11c-baseline
          persist-credentials: false
      - name: Verify deterministic coordinated preview
        run: |
          PYTHONHASHSEED=1 python scripts/preview-tabari-t11c-coordinated.py --root .t11c-baseline > /tmp/t11c-1.json
          PYTHONHASHSEED=77 python scripts/preview-tabari-t11c-coordinated.py --root .t11c-baseline > /tmp/t11c-77.json
          diff /tmp/t11c-1.json /tmp/t11c-77.json
          cat /tmp/t11c-1.json
      - name: Read pinned post-T11C baseline for historical guards
        uses: actions/checkout@v4
        with:
          ref: 66dbd7607e30db7f2bebfe774f0e828df4e61412
          path: .i02-baseline
          persist-credentials: false
      - name: Reject partial or divergent staging transitions
        run: python scripts/test-tabari-t11c-coordinated-lifecycle.py --baseline .t11c-baseline --current .i02-baseline
      - name: Read pinned post-I02 baseline for historical guards
        uses: actions/checkout@v4
        with:
          ref: 52d17712d7f3138ec18471ab588813da8e04a15b
          path: .i03-baseline
          persist-credentials: false
      - name: Validate exact I02 coordinated transition
        run: python3 scripts/test-ibn-kathir-i02-coordinated-lifecycle.py --baseline .i02-baseline --current .i03-baseline
      - name: Validate exact I03 coordinated transition
        run: python3 scripts/test-ibn-kathir-i03-coordinated-lifecycle.py --baseline .i03-baseline --current .
