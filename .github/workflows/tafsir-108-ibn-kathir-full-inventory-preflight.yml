name: Preflight Surah 108 Ibn Kathir full inventory audit
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-ibn-kathir-full-inventory-preflight.yml'
      - 'data/tafsir/staging/ibn-kathir-108-full-inventory-audit-2026-10-15.json'
      - 'data/tafsir/staging/ibn-kathir-108-research-2026-10-12.json'
      - 'data/tafsir/staging/ibn-kathir-108-i01-four-table-candidates-2026-10-17.json'
      - 'data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json'
      - 'data/tafsir/staging/ibn-kathir-108-i02-r01-r11-coverage-checkpoint-2026-10-15.json'
      - 'data/tafsir/staging/ibn-kathir-108-i06-i10-consolidation-2026-10-15.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-ibn-kathir-full-inventory-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete claim and route inventory
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import json,os,re,urllib.parse,urllib.request
          base='data/tafsir/staging/'
          a=json.load(open(base+'ibn-kathir-108-full-inventory-audit-2026-10-15.json',encoding='utf-8'))
          c=json.load(open(base+'ibn-kathir-108-research-2026-10-12.json',encoding='utf-8'))
          e=json.load(open(base+'ibn-kathir-108-route-extraction-2026-10-12.json',encoding='utf-8'))
          i02=json.load(open(base+'ibn-kathir-108-i02-r01-r11-coverage-checkpoint-2026-10-15.json',encoding='utf-8'))
          tail=json.load(open(base+'ibn-kathir-108-i06-i10-consolidation-2026-10-15.json',encoding='utf-8'))
          expected={'schema_version':'quranhikma-tafsir-scholar-inventory-audit-v1','surah':108,'scholar_key':'ibn_kathir','status':'route_inventory_complete_non_route_boundaries_open_scholar_not_complete','human_verified':False,'database_written':False,'database_write_count':0,'publication_ready':False,'scholar_complete':False,'staged_claim_count':73,'ibn_kathir_claim_count':14}
          for k,v in expected.items():
              if a.get(k)!=v: raise SystemExit(f'Unsafe or mismatched {k}: {a.get(k)!r}')
          claim_ids=[x['id'] for x in c['claims']]
          historical_ids=a['claim_inventory']['expected_ids']
          split_ids=['108-I01-A','108-I01-B']+historical_ids[1:]
          split_active=claim_ids==split_ids
          if historical_ids[0]!='108-I01' or len(set(historical_ids))!=14:
              raise SystemExit('Historical parent inventory changed')
          if claim_ids!=historical_ids and not split_active:
              raise SystemExit('Ibn Kathir claim inventory changed')
          if len(set(claim_ids))!=len(claim_ids):
              raise SystemExit('Duplicate current claim identity')
          if split_active:
              draft=json.load(open(base+'ibn-kathir-108-i01-four-table-candidates-2026-10-17.json',encoding='utf-8'))
              if draft.get('publication_ready') is not False or draft.get('database_written') is not False:
                  raise SystemExit('Unsafe I01 candidate provenance')
              for current,candidate in zip(c['claims'][:2],draft['candidates']):
                  if current['id']!=candidate['draft_label'] or current['statement_en']!=candidate['proposition']['statement_en']:
                      raise SystemExit('I01 split/candidate content mismatch')
                  if current['arabic_entry_id']!=48457 or current['english_entry_id']!=11079:
                      raise SystemExit('I01 split canonical identity mismatch')
              if len(draft['candidates'])!=2:
                  raise SystemExit('Expected exactly two I01 candidates')
          extracted=[]
          for g in e['route_groups']:
              extracted.extend(r['route_id'] for r in g.get('routes',[]))
          def collect_routes(v):
              out=[]
              if isinstance(v,dict):
                  for k,x in v.items():
                      if k=='route_id' and isinstance(x,str) and re.fullmatch(r'108-I\d\d-R\d\d',x): out.append(x)
                      else: out.extend(collect_routes(x))
              elif isinstance(v,list):
                  for x in v: out.extend(collect_routes(x))
              return out
          recovered=[x for x in collect_routes(e.get('follow_on_routes_recovered_from_bounded_context',{})) if x not in extracted]
          extracted_all=extracted+recovered
          expected_routes=a['route_inventory']['expected_route_ids']
          if set(extracted_all)!=set(expected_routes) or len(set(extracted_all))!=18:
              raise SystemExit('Extraction inventory differs from audit')
          reviewed=[r['route_id'] for r in i02['routes']]+[r['route_id'] for r in tail['routes']]
          if reviewed!=expected_routes:
              raise SystemExit('Consolidation inventory differs from audit')
          if i02['route_count']['reviewed']!=11 or i02['route_count']['unreviewed']!=0:
              raise SystemExit('I02 review coverage changed')
          if len(tail['routes'])!=7:
              raise SystemExit('I06-I10 consolidation coverage changed')
          boundaries=a['non_route_boundary_audit']
          if [x['claim_id'] for x in boundaries]!=a['claim_inventory']['non_route_claims']:
              raise SystemExit('Non-route boundary inventory changed')
          if any(x['state']!='bounded_review_recorded_not_publication_ready' for x in boundaries):
              raise SystemExit('Unexpected non-route review state')
          for x in boundaries:
              d=json.load(open(x['evidence_artifact'],encoding='utf-8'))
              if d.get('surah')!=108 or d.get('database_written') is not False:
                  raise SystemExit('Invalid non-route review provenance '+x['claim_id'])
          if len(boundaries)!=9:
              raise SystemExit('Expected nine bounded non-route review records')
          if c.get('database_written') is not False or i02.get('database_written') is not False or tail.get('database_written') is not False:
              raise SystemExit('Database boundary changed')
          key=os.environ.get('SUPABASE_SERVICE_KEY','')
          if not key: raise SystemExit('Missing protected database credential')
          ids=[48457,48458,48459,11079,11080,11081]
          params=urllib.parse.urlencode({'id':'in.('+','.join(map(str,ids))+')','select':'id,sura,aya,language,scholar_key','order':'id.asc'})
          req=urllib.request.Request('https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/tafsir_entries?'+params,headers={'apikey':key,'Authorization':'Bearer '+key})
          with urllib.request.urlopen(req,timeout=30) as resp: rows=json.load(resp)
          got={(r['id'],r['sura'],r['aya'],r['language'],r['scholar_key']) for r in rows}
          want={(48457,108,1,'ar','ibn_kathir'),(48458,108,2,'ar','ibn_kathir'),(48459,108,3,'ar','ibn_kathir'),(11079,108,1,'en','ibn_kathir'),(11080,108,2,'en','ibn_kathir'),(11081,108,3,'en','ibn_kathir')}
          if got!=want: raise SystemExit('Live bilingual identities changed')
          print('AUDIT_MODE read-only; no writes')
          print('HISTORICAL_AUDIT_IBN_KATHIR_CLAIMS',a['ibn_kathir_claim_count'])
          print('CURRENT_IBN_KATHIR_CLAIMS',len(claim_ids))
          print('I01_SPLIT_LINKED_TO_HISTORICAL_PARENT',split_active)
          print('EXTRACTED_ROUTES',len(set(extracted_all)))
          print('REVIEWED_ROUTES',len(reviewed))
          print('BOUNDED_NON_ROUTE_REVIEWS',len(boundaries))
          print('HISTORICAL_AUDIT_STAGED_CLAIMS',a['staged_claim_count'])
          print('DATABASE_WRITES',a['database_write_count'])
          print('SCHOLAR_COMPLETE',a['scholar_complete'])
          print('TAFSIR_108_IBN_KATHIR_FULL_INVENTORY_PASS')
