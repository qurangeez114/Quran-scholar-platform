name: Import Final Eight Tafsir Sources
on:
  push:
    paths:
      - 'import_last5_manual_pending.py'
      - '.github/workflows/last5-manual-pending.yml'
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate importer
        run: python -m py_compile import_last5_manual_pending.py
      - name: Import and verify final pending sources
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python import_last5_manual_pending.py
