name: Repair Partial Final-Five Tafsir Groups
on:
  push:
    paths:
      - 'import_last5_partial_repairs.py'
      - '.github/workflows/last5-partial-repair.yml'
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repair importer
        run: python -m py_compile import_last5_partial_repairs.py
      - name: Import and verify source-faithful repairs
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python import_last5_partial_repairs.py
