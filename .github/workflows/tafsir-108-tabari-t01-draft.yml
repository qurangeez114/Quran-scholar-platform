name: Validate Surah 108 Tabari T01 staging draft
on:
  push:
    paths:
      - 'scripts/validate-tabari-t01-draft.py'
      - 'scripts/*tabari-t02*.py'
      - 'scripts/*tabari-t11a*.py'
      - 'scripts/*tabari-t11c*.py'
      - 'data/tafsir/staging/tabari-108-t11c-*.json'
      - 'data/tafsir/staging/tabari-108-t11a-*.json'
      - 'data/tafsir/staging/tabari-108-t02-four-table-draft-2026-10-19.json'
      - 'data/tafsir/staging/tabari-108-t02-readonly-preflight-2026-10-19.json'
      - 'scripts/test-tabari-t01-overlay.py'
      - 'scripts/preview-tabari-t01-coordinated.py'
      - 'scripts/test-tabari-t01-coordinated-lifecycle.py'
      - 'data/tafsir/staging/qurtubi-108-q06-bilingual-source-check-2026-10-17.json'
      - 'data/tafsir/staging/tabari-108-t01-assembly-overlay-2026-10-18.json'
      - 'data/tafsir/staging/surah-108-payload-assembly-2026-10-16.json'
      - 'data/tafsir/staging/surah-108-voice-projection-2026-10-17.json'
      - '.github/workflows/tafsir-108-tabari-t01-draft.yml'
      - 'data/tafsir/staging/tabari-108-t01-four-table-draft-2026-10-18.json'
      - 'data/tafsir/staging/tabari-108-t01-stored-source-check-2026-10-18.json'
  pull_request:
    paths:
      - 'scripts/validate-tabari-t01-draft.py'
      - 'scripts/*tabari-t02*.py'
      - 'scripts/*tabari-t11a*.py'
      - 'scripts/*tabari-t11c*.py'
      - 'data/tafsir/staging/tabari-108-t11c-*.json'
      - 'data/tafsir/staging/tabari-108-t11a-*.json'
      - 'data/tafsir/staging/tabari-108-t02-four-table-draft-2026-10-19.json'
      - 'data/tafsir/staging/tabari-108-t02-readonly-preflight-2026-10-19.json'
      - 'scripts/test-tabari-t01-overlay.py'
      - 'scripts/preview-tabari-t01-coordinated.py'
      - 'scripts/test-tabari-t01-coordinated-lifecycle.py'
      - 'data/tafsir/staging/qurtubi-108-q06-bilingual-source-check-2026-10-17.json'
      - 'data/tafsir/staging/tabari-108-t01-assembly-overlay-2026-10-18.json'
      - 'data/tafsir/staging/surah-108-payload-assembly-2026-10-16.json'
      - 'data/tafsir/staging/surah-108-voice-projection-2026-10-17.json'
      - '.github/workflows/tafsir-108-tabari-t01-draft.yml'
      - 'data/tafsir/staging/tabari-108-t01-four-table-draft-2026-10-18.json'
      - 'data/tafsir/staging/tabari-108-t01-stored-source-check-2026-10-18.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-tabari-t01-draft-${{ github.ref }}
  cancel-in-progress: false
jobs:
  staging-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned post-T11A pre-T11C baseline
        uses: actions/checkout@v4
        with:
          ref: b551d9167b53a32e0c120d9096b56dc644e7b3dd
          path: .t11c-baseline
          persist-credentials: false
      - name: Read pinned post-T02 pre-T11A baseline
        uses: actions/checkout@v4
        with:
          ref: cf1bccf8793c6b8c381a052cc25213bde72849f6
          path: .t11a-baseline
          persist-credentials: false
      - name: Read pinned pre-T01 baseline
        uses: actions/checkout@v4
        with:
          ref: 5517c14dbde1656932d55a7d310b458f7c1866f7
          path: .t01-baseline
          persist-credentials: false
      - name: Read pinned post-T01 pre-T02 baseline
        uses: actions/checkout@v4
        with:
          ref: f737063faf85198b8cf46286b8643681bba9687c
          path: .t02-baseline
          persist-credentials: false
      - name: Verify historical T01 transition and partial-change rejections
        run: python3 scripts/test-tabari-t01-coordinated-lifecycle.py --baseline .t01-baseline --current .t02-baseline
      - name: Verify current exact T02 transition and partial-change rejections
        run: python3 scripts/test-tabari-t02-coordinated-lifecycle.py --baseline .t02-baseline --current .t11a-baseline
      - name: Read pinned post-T11C baseline for historical guards
        uses: actions/checkout@v4
        with:
          ref: 66dbd7607e30db7f2bebfe774f0e828df4e61412
          path: .i02-baseline
          persist-credentials: false
      - name: Verify current T11C coordinated lifecycle
        run: python3 scripts/test-tabari-t11c-coordinated-lifecycle.py --baseline .t11c-baseline --current .i02-baseline
      - name: Verify historical coordinated T11A state
        run: python3 scripts/test-tabari-t11a-coordinated-lifecycle.py --baseline .t11a-baseline --current .t11c-baseline
      - name: Check T01 draft and reject unsafe mutations
        run: python3 scripts/validate-tabari-t01-draft.py --root . --self-test
      - name: Check pinned assembly overlay without applying it
        run: python3 scripts/test-tabari-t01-overlay.py --root .t01-baseline
      - name: Confirm validator did not modify tracked files
        run: git diff --exit-code
# Offline staging-contract test only. No secrets, database connection,
# payload integration, publication, or claim of completed source review.
      - name: Validate exact I02 coordinated transition
        run: python3 scripts/test-ibn-kathir-i02-coordinated-lifecycle.py --baseline .i02-baseline --current .
