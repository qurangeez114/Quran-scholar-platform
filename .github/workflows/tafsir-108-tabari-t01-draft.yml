name: Validate Surah 108 Tabari T01 staging draft
on:
  push:
    paths:
      - 'scripts/validate-tabari-t01-draft.py'
      - 'scripts/test-tabari-t01-overlay.py'
      - 'scripts/preview-tabari-t01-coordinated.py'
      - 'scripts/test-tabari-t01-coordinated-lifecycle.py'
      - 'data/tafsir/staging/qurtubi-108-q06-bilingual-source-check-2026-10-17.json'
      - 'data/tafsir/staging/tabari-108-t01-assembly-overlay-2026-10-18.json'
      - 'data/tafsir/staging/surah-108-payload-assembly-2026-10-16.json'
      - 'data/tafsir/staging/surah-108-voice-projection-2026-10-17.json'
      - '.github/workflows/tafsir-108-tabari-t01-draft.yml'
      - 'data/tafsir/staging/tabari-108-t01-four-table-draft-2026-10-18.json'
      - 'data/tafsir/staging/tabari-108-t01-stored-source-check-2026-10-18.json'
  pull_request:
    paths:
      - 'scripts/validate-tabari-t01-draft.py'
      - 'scripts/test-tabari-t01-overlay.py'
      - 'scripts/preview-tabari-t01-coordinated.py'
      - 'scripts/test-tabari-t01-coordinated-lifecycle.py'
      - 'data/tafsir/staging/qurtubi-108-q06-bilingual-source-check-2026-10-17.json'
      - 'data/tafsir/staging/tabari-108-t01-assembly-overlay-2026-10-18.json'
      - 'data/tafsir/staging/surah-108-payload-assembly-2026-10-16.json'
      - 'data/tafsir/staging/surah-108-voice-projection-2026-10-17.json'
      - '.github/workflows/tafsir-108-tabari-t01-draft.yml'
      - 'data/tafsir/staging/tabari-108-t01-four-table-draft-2026-10-18.json'
      - 'data/tafsir/staging/tabari-108-t01-stored-source-check-2026-10-18.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-tabari-t01-draft-${{ github.ref }}
  cancel-in-progress: false
jobs:
  staging-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned pre-T01 baseline
        uses: actions/checkout@v4
        with:
          ref: 5517c14dbde1656932d55a7d310b458f7c1866f7
          path: .t01-baseline
          persist-credentials: false
      - name: Verify coordinated T01 transition and partial-change rejections
        run: python3 scripts/test-tabari-t01-coordinated-lifecycle.py --baseline .t01-baseline --current .
      - name: Check T01 draft and reject unsafe mutations
        run: python3 scripts/validate-tabari-t01-draft.py --root . --self-test
      - name: Check pinned assembly overlay without applying it
        run: python3 scripts/test-tabari-t01-overlay.py --root .t01-baseline
      - name: Confirm validator did not modify tracked files
        run: git diff --exit-code
# Offline staging-contract test only. No secrets, database connection,
# payload integration, publication, or claim of completed source review.
