name: Dump Last Five Pending Sources
on:
  push:
    paths:
      - 'dump_last5_pending.py'
      - '.github/workflows/last5-pending-dump.yml'
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dump pending source units
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python dump_last5_pending.py
      - name: Upload pending source dump
        uses: actions/upload-artifact@v4
        with:
          name: pending-last5
          path: |
            pending-last5.json
            last5-coverage-audit.json
            suspicious-last5-sources.json
          retention-days: 1
