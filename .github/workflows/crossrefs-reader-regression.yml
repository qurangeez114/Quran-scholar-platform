name: Cross-reference reader regression
on:
  pull_request:
    paths:
      - index.html
      - main.py
      - tests/crossrefs-reader.test.cjs
      - .github/workflows/crossrefs-reader-regression.yml
  workflow_dispatch:
jobs:
  test-crossrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cross-reference reader behavior
        run: node --test tests/crossrefs-reader.test.cjs
