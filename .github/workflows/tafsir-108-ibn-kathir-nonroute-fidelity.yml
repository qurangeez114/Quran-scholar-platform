name: Audit Surah 108 Ibn Kathir non-route fidelity
on:
  push:
    paths: ['.github/workflows/tafsir-108-ibn-kathir-nonroute-fidelity.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-ibn-kathir-nonroute-fidelity
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read bounded bilingual contexts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import json,os,urllib.request,urllib.parse,hashlib,re,unicodedata
          key=os.environ['SUPABASE_SERVICE_KEY']
          q=urllib.parse.urlencode({'id':'in.(48457,11079)','select':'id,sura,aya,language,scholar_key,content'})
          req=urllib.request.Request('https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/tafsir_entries?'+q,headers={'apikey':key,'Authorization':'Bearer '+key})
          with urllib.request.urlopen(req,timeout=30) as res: rows=json.load(res)
          assert {(r['id'],r['sura'],r['aya'],r['language'],r['scholar_key']) for r in rows}=={(48457,108,1,'ar','ibn_kathir'),(11079,108,1,'en','ibn_kathir')}
          for r in rows:
              s=''.join(ch for ch in unicodedata.normalize('NFKD',r['content']) if not unicodedata.combining(ch) and ch!='ـ')
              s=re.sub(r'\s+',' ',s)
              print('SOURCE_HASH',r['id'],hashlib.sha256(r['content'].encode()).hexdigest())
              if r['language']=='en':
                  # Print complete adjacent blocks; no keyword absence conclusion.
                  for label,start,end in [('I03_TRANSITION','you do not know what','This Hadith was recorded in this manner'),('I04_TRANSITION','Al-Bukhari also recorded','Then Allah says'),('I11_TRANSITION','It has been reported that','This is the end')]:
                      low=s.lower(); p=low.find(start.lower())
                      q=low.find(end.lower(),p+len(start))
                      if p<0 or q<0 or q<=p: raise SystemExit('Transition anchors missing '+label)
                      block=s[p:q+len(end)]
                      if len(block)>16000: raise SystemExit('Unexpected transition size '+label)
                      for i in range(0,len(block),1800):
                          print('TRANSITION_PART',label,i,json.dumps(block[i:i+1800],ensure_ascii=False))
                  print('ENGLISH_LENGTH',len(s))
              else:
                  for term in ['استدل','حتى قال مجاهد','وقال عكرمة:','وقال عطاء:','وهذا يعم']:
                      p=s.find(term)
                      if p<0: raise SystemExit('Arabic anchor missing '+term)
                      print('AR_TRANSITION',term,json.dumps(s[max(0,p-100):p+500],ensure_ascii=False))
          print('READ_ONLY_CONTEXT_AUDIT_PASS')
