name: Audit Ibn Kathir Surah 108 source coverage
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-ibn-kathir-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only Ibn Kathir 108 inventory, routes, translation coverage, and canonical mapping
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import hashlib,json,os,re,unicodedata,urllib.parse,urllib.request
          key=os.environ.get("SUPABASE_SERVICE_KEY","")
          if not key: raise SystemExit("Missing protected database credential")
          base="https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/tafsir_entries"
          params={"sura":"eq.108","scholar_key":"eq.ibn_kathir","language":"in.(ar,en)","select":"id,aya,language,content,source_name,source_url","order":"language.asc,aya.asc,id.asc","limit":"100"}
          req=urllib.request.Request(base+"?"+urllib.parse.urlencode(params),headers={"apikey":key,"Authorization":"Bearer "+key})
          with urllib.request.urlopen(req,timeout=30) as r: rows=json.load(r)
          def na(s):
              s="".join(c for c in unicodedata.normalize("NFKD",s or "") if not unicodedata.combining(c) and c!="ـ")
              return re.sub(r"\s+"," ",re.sub(r"[،؛؟:()\[\]{}﴿﴾]+"," ",s)).strip()
          print("AUDIT_MODE read-only; no writes")
          ar_rows=[x for x in rows if x["language"]=="ar"]
          en_rows=[x for x in rows if x["language"]=="en"]
          if len(ar_rows)!=3 or len(en_rows)!=3: raise SystemExit("Expected exactly three Arabic and three English rows")
          if len({hashlib.sha256(x["content"].encode()).hexdigest() for x in ar_rows})!=1: raise SystemExit("Arabic chapter block is not identical")
          if len({hashlib.sha256(x["content"].encode()).hexdigest() for x in en_rows})!=1: raise SystemExit("English chapter block is not identical")
          ar=na(ar_rows[0]["content"]); en=na(en_rows[0]["content"]).lower()
          checks={
            "I05_prayer_and_sacrifice":["فصل لربك وانحر","نحر البدن"],
            "I06_al_as":["العاص بن وائل"],
            "I07_lexical_and_competing":["شانئك","الأبتر"]
          }
          for cid,anchors in checks.items():
              print("CLAIM_ANCHORS",cid,json.dumps({a:(na(a) in ar) for a in anchors},ensure_ascii=False))
          for label,term in (("I05","فصل لربك وانحر"),("I06","العاص بن وائل"),("I07","إن شانئك هو الأبتر")):
              p=ar.find(na(term))
              if p<0: p=ar.find(na(term.split()[0]))
              if p<0: raise SystemExit("Missing context anchor "+label)
              print("CLAIM_CONTEXT",label,ar[max(0,p-300):p+1800])
          # Resolve the previously truncated Sa'id/Qatada route without printing the full source row.
          tail_anchor=na("وقال سعيد عن قتادة عن أنس")
          tail_pos=ar.find(tail_anchor)
          if tail_pos<0: raise SystemExit("Missing Sa'id/Qatada route anchor")
          print("ROUTE_CONTEXT I02_R06",ar[tail_pos:tail_pos+1800])
          route_arabic_checks={
            "I02_R02":["حدثنا عفان","حدثنا حماد","أخبرنا ثابت","عن أنس"],
            "I02_R03":["محمد بن أبي عدي","عن حميد","عن أنس"],
            "I02_R04":["شيبان بن عبد الرحمن","عن قتادة","عن أنس بن مالك"],
            "I02_R05":["حدثنا الربيع","أخبرنا ابن وهب","سليمان بن هلال","شريك بن أبي نمر"],
            "I02_R06":["وقال سعيد","عن قتادة","عن أنس"],
            "I09_R02":["وقال البزار","زياد بن يحيى الحساني","عن داود","عن عكرمة","عن ابن عباس"]
          }
          for rid,anchors in route_arabic_checks.items():
              found={a:(na(a) in ar) for a in anchors}
              print("ROUTE_ARABIC",rid,json.dumps(found,ensure_ascii=False))
              if not all(found.values()): raise SystemExit("Missing Arabic route segment "+rid)
          route_english_markers={
            "I02_R02":[["affan"],["hammad"],["thabit"]],
            "I02_R03":[["abi adi","abi 'adi","abu adi"],["humayd","humaid"]],
            "I02_R04":[["shayban"],["qatadah","qatada"]],
            "I02_R05":[["ibn jarir","at-tabari","al-tabari"],["sharik","shareek"]],
            "I02_R06":[["sa'id","said"],["qatadah","qatada"]],
            "I08":[["uqbah","uqba"],["mu'ayt","muayt"]],
            "I09":[["ka'b","kab"],["ashraf"]],
            "I10_ABU_LAHAB":[["abu lahab"]],
            "I10_ABU_JAHL":[["abu jahl"]]
          }
          for rid,groups in route_english_markers.items():
              found=[any(term in en for term in group) for group in groups]
              print("ROUTE_ENGLISH",rid,json.dumps({"groups":groups,"found":found,"all":all(found)}))
          english_markers={
            "I05":["pray","sacrifice"],
            "I06":["as bin wa'il","al-as"],
            "I07":["enemy","cut off"]
          }
          for cid,alts in english_markers.items():
              print("ENGLISH_COVERAGE",cid,json.dumps({a:(a in en) for a in alts}))
          canonical={
            "108-I01":48457,
            "108-I02":48457,
            "108-I03":48457,
            "108-I04":48457,
            "108-I05":48458,
            "108-I06":48459,
            "108-I07":48459
          }
          # The source text is a single duplicated chapter witness, but verse-specific
          # claims attach to the matching verse row; introduction and 108:1 attach to 108:1.
          byid={x["id"]:x for x in ar_rows}
          expected={"108-I01":1,"108-I02":1,"108-I03":1,"108-I04":1,"108-I05":2,"108-I06":3,"108-I07":3}
          for cid,eid in canonical.items():
              if int(byid[eid]["aya"])!=expected[cid]: raise SystemExit("Canonical mapping mismatch "+cid)
          print("CANONICAL_MAP",json.dumps(canonical,sort_keys=True))
          print("CANONICAL_POLICY one duplicated chapter witness; attach each atomic claim to its verse row; chapter introduction attaches to verse 1; never count duplicate rows as independent witnesses")
          print("IBN_KATHIR_108_CONTEXT_AUDIT_PASS")
