name: Backfill Final-Five Tafsir Evidence
on:
  push:
    paths:
      - 'repair_last5_missing_evidence.py'
      - '.github/workflows/last5-evidence-backfill.yml'
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate backfill
        run: python -m py_compile repair_last5_missing_evidence.py
      - name: Backfill and verify evidence links
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python repair_last5_missing_evidence.py
