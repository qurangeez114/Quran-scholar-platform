name: Correct plain audio for Quran 26:1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-26-1-audio.yml"

permissions:
  contents: write

jobs:
  replace-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate verified Husary verse audio
        run: |
          set -euo pipefail
          mkdir -p audio/simple-recitation
          curl --fail --location --retry 3 --retry-all-errors \
            "https://cdn.islamic.network/quran/audio/128/ar.husary/2933.mp3" \
            --output audio/simple-recitation/026_001.mp3
          test -s audio/simple-recitation/026_001.mp3
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 audio/simple-recitation/026_001.mp3)"
          python -c 'import sys; d=float(sys.argv[1]); assert 0.3 < d < 30, f"unexpected verse duration: {d}"' "$duration"
          file audio/simple-recitation/026_001.mp3

      - name: Commit the corrected verse
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/simple-recitation/026_001.mp3
          git commit -m "Replace incorrect audio for Quran 26:1"
          git push origin HEAD:main
