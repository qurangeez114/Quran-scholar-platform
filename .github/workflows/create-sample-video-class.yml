name: Create sample video class
on:
  push:
    paths: ['.github/workflows/create-sample-video-class.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add owner draft class and verify saved lesson and quiz records
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error,hashlib
          data=json.loads("{\"course\":{\"id\":\"c9c5bd84-0e8b-45ba-9597-7112cf5089b1\",\"title\":\"Debate Detective: The Bridge — sample video class\",\"description\":\"Neutral listening and source analysis. Watch 2:16–4:25 of the supplied Dr. Daf Show video; complete five challenges with explanations and a 90% pass mark. Interactive practice: https://quranhikma.com/sample-video-class.html\",\"is_published\":false},\"lessons\":[{\"id\":\"eed7b513-84bb-42ef-b73c-f096d0e98e91\",\"title\":\"Watch: identify claims, evidence and definitions\",\"lesson_type\":\"video\",\"video_url\":\"https://www.youtube.com/watch?v=IqOvw24pNGc\",\"content\":\"Focus on 2:16–4:25. Observe the opening claim, scriptural evidence, essence/person distinction, Nehemiah 9:6 citation, and request for clarification. This exercise reports the discussion without deciding religious truth.\",\"lesson_order\":1},{\"id\":\"5849bb79-d93a-42b3-932c-d65881dcc0ec\",\"title\":\"Detective toolkit and interactive five-question challenge\",\"lesson_type\":\"text\",\"content\":\"Open https://quranhikma.com/sample-video-class.html for the embedded video, five guided challenges, explanations for incorrect or unanswered responses, and a reworded final check. Pass mark: 90%; with five equally weighted questions you need five correct. Practice progress stays in your browser. Keep a speaker’s claims separate from your own interpretation. Automatic captions may contain errors.\",\"lesson_order\":2},{\"id\":\"9cbb4505-313f-45ba-af3e-b377e4844d4b\",\"title\":\"Five detective challenges — course quiz\",\"lesson_type\":\"quiz\",\"content\":\"Five comprehension questions about the opening discussion. Pass mark 90%. The interactive practice version with reworded final check is at https://quranhikma.com/sample-video-class.html.\",\"lesson_order\":3}],\"quiz\":{\"id\":\"4132d938-7511-4fac-bb76-13eab6dc4112\",\"lesson_id\":\"9cbb4505-313f-45ba-af3e-b377e4844d4b\",\"passing_score\":90,\"questions\":[{\"id\":\"claim\",\"question\":\"🎯 Claim catcher: what is Christina’s first discussion prompt?\",\"options\":[\"The Trinity is biblical\",\"Every participant agrees\",\"The discussion is about astronomy\"],\"correct_answer\":\"The Trinity is biblical\",\"explanation\":\"At 2:16–2:35 she introduces whether the Trinity is demonstrated in scripture. This identifies her claim; it does not establish that the claim is true.\",\"option_explanations\":[\"\",\"The participants explicitly disagree at 2:56–3:01.\",\"Astronomy is not the opening topic.\"],\"variant\":{\"q\":\"Which proposition opens the first debate round?\",\"options\":[\"All traditions agree\",\"The Trinity has a biblical basis\",\"The video compares planets\"],\"answer\":1,\"rationale\":[\"Disagreement is part of the discussion.\",\"\",\"The opening discussion concerns scripture.\"]}},{\"id\":\"evidence\",\"question\":\"🔎 Evidence explorer: what does Christina want to examine in the opening?\",\"options\":[\"Audience applause\",\"Only the popularity of a belief\",\"Whether scripture demonstrates the Trinity\"],\"correct_answer\":\"Whether scripture demonstrates the Trinity\",\"explanation\":\"At 2:22–2:35 she contrasts other approaches with the scriptural question she wants to discuss.\",\"option_explanations\":[\"Applause does not establish what a text teaches.\",\"Popularity is not the stated evidence standard.\",\"\"],\"variant\":{\"q\":\"What evidence focus does she request for the first prompt?\",\"options\":[\"Scriptural support\",\"The number of supporters\",\"Which speaker is louder\"],\"answer\":0,\"rationale\":[\"\",\"Supporter counts do not establish scriptural meaning.\",\"Volume is not evidence.\"]}},{\"id\":\"terms\",\"question\":\"🧩 Definition decoder: how is the Trinity described in this exchange?\",\"options\":[\"Three separate divine essences\",\"One divine essence and three distinct persons\",\"One person taking turns wearing three names\"],\"correct_answer\":\"One divine essence and three distinct persons\",\"explanation\":\"At 2:38–3:12 the speakers discuss one essence and distinct personhood. The challenge tests accurate reporting of their definition, not acceptance of the doctrine.\",\"option_explanations\":[\"This changes the one-essence definition stated in the exchange.\",\"\",\"The speakers explicitly distinguish persons; they do not give this description.\"],\"variant\":{\"q\":\"Which summary accurately represents the definition discussed at the start?\",\"options\":[\"Three unrelated gods\",\"One person only\",\"One essence, three distinct persons\"],\"answer\":2,\"rationale\":[\"This misrepresents the stated definition.\",\"The exchange refers to distinct persons.\",\"\"]}},{\"id\":\"reference\",\"question\":\"📍 Citation hunter: which passage is introduced around 3:31?\",\"options\":[\"Nehemiah 9:6\",\"Genesis 1:1\",\"Psalm 23\"],\"correct_answer\":\"Nehemiah 9:6\",\"explanation\":\"Nehemiah 9:6 is named around 3:31. A citation gives a passage to investigate; the speakers’ interpretations still require examination.\",\"option_explanations\":[\"\",\"Genesis 1:1 is not the citation introduced at this moment.\",\"Psalm 23 is not the citation introduced at this moment.\"],\"variant\":{\"q\":\"Which reference should you look up to check the passage raised around 3:31?\",\"options\":[\"Psalm 23\",\"Nehemiah 9:6\",\"Genesis 1:1\"],\"answer\":1,\"rationale\":[\"That is not the cited reference.\",\"\",\"That is not the cited reference.\"]}},{\"id\":\"clarify\",\"question\":\"🕵️ Meaning detective: what distinction does the reply ask about around 3:54–4:01?\",\"options\":[\"How many viewers watched\",\"Which speaker is older\",\"Whether the passage addresses divine essence or a person\"],\"correct_answer\":\"Whether the passage addresses divine essence or a person\",\"explanation\":\"The response asks whether the passage addresses essence or one of the persons. Clarifying the referent helps identify exactly where interpretations differ.\",\"option_explanations\":[\"Viewer counts do not answer the interpretive question.\",\"Age is not the distinction raised.\",\"\"],\"variant\":{\"q\":\"What clarification is requested in the response to Nehemiah 9:6?\",\"options\":[\"What the passage refers to: essence or person\",\"Who has more followers\",\"Who speaks first\"],\"answer\":0,\"rationale\":[\"\",\"Follower counts do not clarify a passage’s referent.\",\"Speaking order does not answer the textual question.\"]}}]}}")
          key=os.environ.get("SUPABASE_SERVICE_KEY","")
          if not key: raise SystemExit("Missing saved database credential")
          base="https://ylosytbxpzxzwfzjpaej.supabase.co"
          headers={"apikey":key,"Content-Type":"application/json"}
          if not key.startswith("sb_"): headers["Authorization"]="Bearer "+key
          def request(path,body=None):
              h=dict(headers)
              if body is not None: h["Prefer"]="resolution=ignore-duplicates,return=representation"
              req=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  print("Database request failed:",e.code,path.split("?")[0])
                  raise SystemExit(1)
          owner=None
          for page in range(1,101):
              users=request("/auth/v1/admin/users?page="+str(page)+"&per_page=100").get("users",[])
              owner=next((u for u in users if hashlib.sha256(u.get("email","").lower().encode()).hexdigest()=="58554a69ceb26f064a1440f2eac50ffb6f558228d3a8158b3106db4c46b6e504"),None)
              if owner or len(users)<100: break
          if not owner: raise SystemExit("Owner account not found")
          course=data["course"]; course["created_by"]=owner["id"]
          request("/rest/v1/qh_courses?on_conflict=id",course)
          for lesson in data["lessons"]:
              lesson["course_id"]=course["id"]
              request("/rest/v1/qh_lessons?on_conflict=id",lesson)
          request("/rest/v1/qh_quizzes?on_conflict=id",data["quiz"])
          saved=request("/rest/v1/qh_courses?id=eq."+course["id"]+"&select=id,is_published,created_by")
          lessons=request("/rest/v1/qh_lessons?course_id=eq."+course["id"]+"&select=id,lesson_type,video_url")
          quiz=request("/rest/v1/qh_quizzes?id=eq."+data["quiz"]["id"]+"&select=passing_score,questions")
          assert len(saved)==1 and saved[0]["created_by"]==owner["id"] and saved[0]["is_published"]==False
          assert len(lessons)==3 and any(l["video_url"]=="https://www.youtube.com/watch?v=IqOvw24pNGc" for l in lessons)
          assert len(quiz)==1 and quiz[0]["passing_score"]==90 and len(quiz[0]["questions"])==5
          print("VERIFIED: owner draft class, three lessons, supplied video, five questions, 90% pass mark.")
          print("COURSE_ID:",course["id"])
