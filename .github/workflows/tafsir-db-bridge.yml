name: Tafsir DB Bridge Diagnostic

on:
  push:
    branches:
      - debug/tafsir-db-bridge
    paths:
      - '.github/tafsir-db-bridge-trigger.txt'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query benchmark tables read-only
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from batch_tafsir_accuracy import SUPABASE_URL, SUPABASE_ANON_KEY

          key = os.environ.get('SUPABASE_SERVICE_ROLE_KEY') or SUPABASE_ANON_KEY
          headers = {'apikey': key, 'Authorization': 'Bearer ' + key}
          tables = ['propositions','proposition_voice_chain','evidence_units','transmission_routes','evidence_links','sources','tafsir_entries']
          out = {'auth_mode': 'service_role' if os.environ.get('SUPABASE_SERVICE_ROLE_KEY') else 'anon', 'tables': {}}
          for table in tables:
              url = f"{SUPABASE_URL}/rest/v1/{table}?select=*&limit=3"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read().decode('utf-8','replace')
                      try: data = json.loads(body)
                      except Exception: data = body
                      out['tables'][table] = {'status': r.status, 'sample': data}
              except urllib.error.HTTPError as e:
                  out['tables'][table] = {'status': e.code, 'error': e.read().decode('utf-8','replace')[:1200]}
              except Exception as e:
                  out['tables'][table] = {'status': 'error', 'error': repr(e)}
          os.makedirs('.github/diagnostics', exist_ok=True)
          with open('.github/diagnostics/tafsir-db-bridge.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Commit diagnostic result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/diagnostics/tafsir-db-bridge.json
          git commit -m 'chore: record tafsir DB bridge result [skip ci]' || exit 0
          git push
