name: Tafsir DB Bridge Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Netlify Supabase secret presence
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://deploy-preview-3--fascinating-sunburst-516df8.netlify.app/api/tafsir-db-probe'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=60) as r:
              obj=json.loads(r.read().decode())
          assert set(obj)=={'present'}
          print('TAFSIR_NETLIFY_SECRET_PRESENCE='+json.dumps(obj,sort_keys=True))
          PY
