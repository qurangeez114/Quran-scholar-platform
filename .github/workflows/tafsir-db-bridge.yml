name: Tafsir DB Bridge Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect benchmark vocabularies
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          from batch_tafsir_accuracy import SUPABASE_URL, SUPABASE_ANON_KEY
          H={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
          def get(table, params):
              q=urllib.parse.urlencode(params, safe='(),.*:')
              req=urllib.request.Request(f'{SUPABASE_URL}/rest/v1/{table}?{q}',headers=H)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())
          props=get('propositions',{'extracted_by':'ilike.*pilot*','select':'assertion_mode,extraction_validity,verification_state,attribution_fidelity,quranic_textual_support,mufassir_own_position,status','limit':'500'})
          voices=get('proposition_voice_chain',{'select':'originating_voice_type,reporting_work_id,originating_voice_name','limit':'500'})
          eus=get('evidence_units',{'select':'unit_type,independence_state','limit':'500'})
          def vals(rows,k): return sorted({str(x.get(k)) for x in rows})
          out={
            'assertion_mode':vals(props,'assertion_mode'),
            'extraction_validity':vals(props,'extraction_validity'),
            'verification_state':vals(props,'verification_state'),
            'attribution_fidelity':vals(props,'attribution_fidelity'),
            'quranic_textual_support':vals(props,'quranic_textual_support'),
            'mufassir_own_position':vals(props,'mufassir_own_position'),
            'status':vals(props,'status'),
            'voice_types':vals(voices,'originating_voice_type'),
            'work_ids':sorted({int(x['reporting_work_id']) for x in voices if x.get('reporting_work_id') is not None}),
            'evidence_unit_types':vals(eus,'unit_type'),
            'independence_states':vals(eus,'independence_state')
          }
          print('TAFSIR_DB_BRIDGE_RESULT='+json.dumps(out,ensure_ascii=False))
          PY
