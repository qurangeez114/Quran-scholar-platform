name: Tafsir DB Bridge Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Pilot L adjudication endpoints
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          from batch_tafsir_accuracy import SUPABASE_URL, SUPABASE_ANON_KEY
          H={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
          def get(id):
              q=urllib.parse.urlencode({'id':f'eq.{id}','select':'id,aya,scholar_key,language,content'})
              req=urllib.request.Request(f'{SUPABASE_URL}/rest/v1/tafsir_entries?{q}',headers=H)
              with urllib.request.urlopen(req,timeout=60) as r:return json.loads(r.read().decode())[0]
          specs=[
            (840,['قال أبو جعفر','والصواب','وأولى الأقوال','هارون']),
            (13486,['والصحيح','والأصح','قلت','هارون']),
            (847,['قال أبو جعفر','والصواب','قول الحق','بالرفع','بالنصب']),
            (54235,['يا أخت هارون','المغيرة','موسى','هارون']),
            (54237,['آتاني الكتاب','قضى','عبد الله','الكتاب']),
            (54241,['قول الحق','يمترون','النصارى','اليهود'])
          ]
          out=[]
          for id,terms in specs:
              r=get(id); txt=' '.join((r.get('content') or '').split()); hits=[]
              for term in terms:
                  start=0
                  while True:
                      i=txt.find(term,start)
                      if i<0:break
                      hits.append(txt[max(0,i-300):min(len(txt),i+len(term)+900)])
                      start=i+len(term)
                      if len(hits)>=14:break
                  if len(hits)>=14:break
              out.append({'id':id,'aya':r['aya'],'scholar_key':r['scholar_key'],'hits':hits,'tail':txt[-1800:]})
          print('PILOT_L_ENDPOINTS='+json.dumps(out,ensure_ascii=False))
          PY
