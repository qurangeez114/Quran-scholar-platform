name: Tafsir DB Bridge Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover safe privileged RPC paths
        run: |
          python - <<'PY'
          import json, urllib.request
          from batch_tafsir_accuracy import SUPABASE_URL, SUPABASE_ANON_KEY
          H={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Accept':'application/openapi+json'}
          req=urllib.request.Request(SUPABASE_URL+'/rest/v1/',headers=H)
          with urllib.request.urlopen(req,timeout=60) as r:
              spec=json.loads(r.read().decode())
          paths=sorted(p for p in spec.get('paths',{}) if p.startswith('/rpc/'))
          interesting=[p for p in paths if any(k in p.lower() for k in ['sql','admin','prop','evidence','tafsir','migration','exec','query','policy'])]
          print('TAFSIR_RPC_DISCOVERY='+json.dumps({'rpc_count':len(paths),'interesting':interesting,'all_rpc':paths},ensure_ascii=False))
          PY
