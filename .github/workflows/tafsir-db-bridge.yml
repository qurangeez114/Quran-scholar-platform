name: Tafsir DB Bridge Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit Pilot J through fixed Netlify bridge
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          url='https://deploy-preview-3--fascinating-sunburst-516df8.netlify.app/.netlify/functions/tafsir-pilot-j-commit'
          req=urllib.request.Request(url,data=b'{}',headers={'Content-Type':'application/json','Cache-Control':'no-cache'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=120) as r:
                  obj=json.loads(r.read().decode())
          except urllib.error.HTTPError as e:
              raise RuntimeError(f'Bridge HTTP {e.code}: '+e.read().decode('utf-8','replace'))
          print('TAFSIR_PILOT_J_BRIDGE_RESULT='+json.dumps(obj,sort_keys=True))
          assert obj.get('success') is True, obj
          PY
