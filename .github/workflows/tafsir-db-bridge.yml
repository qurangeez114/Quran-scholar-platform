name: Tafsir DB Bridge Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Pilot checkpoint and Pilot J source text
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          from collections import Counter
          from batch_tafsir_accuracy import SUPABASE_URL, SUPABASE_ANON_KEY
          H={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
          def get(table, params):
              q=urllib.parse.urlencode(params, safe='(),.*:')
              req=urllib.request.Request(f'{SUPABASE_URL}/rest/v1/{table}?{q}',headers=H)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())
          pilots=get('propositions',{'extracted_by':'ilike.*pilot*','select':'id,extracted_by,statement_en,verification_state,extraction_validity,tafsir_entry_id,quranic_textual_support,mufassir_own_position','order':'id.asc','limit':'500'})
          pc=Counter(p.get('extracted_by') or '(null)' for p in pilots)
          ids='26046,26047,26048,26049,26050,54224,19920,19921,19922,19923,19924,13499,13500,13501,13494,13502,32403,32404,32405,32406,32407,822,830,831,832,833'
          src=get('tafsir_entries',{'id':f'in.({ids})','select':'id,sura,aya,scholar_key,scholar_name,language,content','order':'scholar_key.asc,aya.asc','limit':'100'})
          out={'pilot_counts_by_extracted_by':dict(sorted(pc.items())),'pilot_prop_count':len(pilots),'pilot_id_min':min([p['id'] for p in pilots],default=None),'pilot_id_max':max([p['id'] for p in pilots],default=None),'pilot_j_sources':src}
          print('TAFSIR_DB_BRIDGE_RESULT='+json.dumps(out,ensure_ascii=False))
          PY
