name: Tafsir DB Bridge Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect evidence write schemas
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          from batch_tafsir_accuracy import SUPABASE_URL, SUPABASE_ANON_KEY
          H={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
          def get(table):
              req=urllib.request.Request(f'{SUPABASE_URL}/rest/v1/{table}?select=*&limit=3',headers=H)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())
          out={t:get(t) for t in ['evidence_units','evidence_transmission_routes','proposition_evidence']}
          print('TAFSIR_EVIDENCE_SCHEMA='+json.dumps(out,ensure_ascii=False))
          PY
