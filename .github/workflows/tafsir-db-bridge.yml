name: Tafsir DB Bridge Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Pilot K fixture against live benchmark
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          from batch_tafsir_accuracy import SUPABASE_URL, SUPABASE_ANON_KEY
          H={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
          def get(table, params):
              q=urllib.parse.urlencode(params,safe='(),.*:')
              req=urllib.request.Request(f'{SUPABASE_URL}/rest/v1/{table}?{q}',headers=H)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())
          with open('.github/tafsir-pilot-k-fixture.json',encoding='utf-8') as f: fx=json.load(f)
          ps,eus,links=fx['propositions'],fx['evidence_units'],fx['evidence_links']
          assert len(ps)==29 and len({p['key'] for p in ps})==29
          assert len(eus)==4 and sum(len(e['routes']) for e in eus)==6
          assert len(links)==5
          pkeys={p['key'] for p in ps}; ekeys={e['key'] for e in eus}
          assert all(l['proposition_key'] in pkeys and l['evidence_key'] in ekeys for l in links)
          work={1:'tabari',2:'ibn_kathir',3:'qurtubi',54:'jalalayn',55:'saadi',56:'ibn_abbas'}
          ids=','.join(str(p['tafsir_entry_id']) for p in ps)
          rows=get('tafsir_entries',{'id':f'in.({ids})','select':'id,scholar_key,language,sura,aya','limit':'100'})
          byid={r['id']:r for r in rows}
          assert len(byid)==len(set(p['tafsir_entry_id'] for p in ps)),(len(byid),len(set(p['tafsir_entry_id'] for p in ps)))
          mism=[]
          for p in ps:
              r=byid[p['tafsir_entry_id']]; want=work[p['voice']['reporting_work_id']]
              if r['scholar_key']!=want or r['sura']!=19 or r['aya'] not in (22,23,24,25,26): mism.append((p['key'],r,want))
          assert not mism,mism
          existing=get('propositions',{'extracted_by':'eq.claude-pilot-k','select':'id','limit':'100'})
          assert existing==[],f'Pilot K already exists: {len(existing)}'
          out={'propositions':len(ps),'unique_source_entries':len(byid),'evidence_units':len(eus),'routes':sum(len(e['routes']) for e in eus),'evidence_links':len(links),'existing_pilot_k':0,'languages':sorted({r['language'] for r in rows})}
          print('TAFSIR_PILOT_K_VALIDATION='+json.dumps(out,sort_keys=True))
          PY
