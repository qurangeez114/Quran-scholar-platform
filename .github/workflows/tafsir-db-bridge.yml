name: Tafsir DB Bridge Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect benchmark and Pilot J source rows
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          from collections import Counter
          from batch_tafsir_accuracy import SUPABASE_URL, SUPABASE_ANON_KEY
          H={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
          def get(table, params):
              q=urllib.parse.urlencode(params, safe='(),.*:')
              r=urllib.request.Request(f'{SUPABASE_URL}/rest/v1/{table}?{q}',headers=H)
              with urllib.request.urlopen(r,timeout=60) as x:
                  return json.loads(x.read().decode())
          props=get('propositions',{'select':'id,extracted_by,verification_state,extraction_validity,source_type,tafsir_entry_id','order':'id.asc','limit':'2000'})
          c=Counter((p.get('extracted_by') or '(null)') for p in props)
          pilot={k:v for k,v in sorted(c.items()) if 'pilot' in k.lower()}
          pids=[p['id'] for p in props if 'pilot' in (p.get('extracted_by') or '').lower()]
          rows=get('tafsir_entries',{'sura':'eq.19','aya':'in.(17,18,19,20,21)','select':'id,sura,aya,scholar_key,scholar_name,language,content','order':'aya.asc,scholar_key.asc,language.asc','limit':'500'})
          meta=[]
          for r in rows:
              txt=(r.get('content') or '').strip().replace('\n',' ')
              meta.append({'id':r['id'],'aya':r['aya'],'scholar_key':r.get('scholar_key'),'scholar_name':r.get('scholar_name'),'language':r.get('language'),'chars':len(txt),'preview':txt[:220]})
          pe=get('proposition_evidence',{'select':'*','limit':'3'})
          out={'pilot_extracted_by_counts':pilot,'pilot_prop_count':len(pids),'pilot_prop_id_min':min(pids) if pids else None,'pilot_prop_id_max':max(pids) if pids else None,'pilot_j_tafsir_rows':meta,'proposition_evidence_sample':pe}
          print('TAFSIR_DB_BRIDGE_RESULT='+json.dumps(out,ensure_ascii=False))
          PY
