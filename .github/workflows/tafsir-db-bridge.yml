name: Tafsir DB Bridge Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Pilot K source inventory 19:22-26
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          from batch_tafsir_accuracy import SUPABASE_URL, SUPABASE_ANON_KEY
          H={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
          def get(table, params):
              q=urllib.parse.urlencode(params,safe='(),.*:')
              req=urllib.request.Request(f'{SUPABASE_URL}/rest/v1/{table}?{q}',headers=H)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())
          rows=get('tafsir_entries',{'sura':'eq.19','aya':'in.(22,23,24,25,26)','select':'id,sura,aya,scholar_key,scholar_name,language,content','order':'aya.asc,scholar_key.asc,language.asc','limit':'500'})
          wanted={'tabari','ibn_kathir','qurtubi','saadi','jalalayn','ibn_abbas'}
          rows=[r for r in rows if r.get('scholar_key') in wanted]
          summary=[{'id':r['id'],'aya':r['aya'],'scholar_key':r['scholar_key'],'language':r['language'],'chars':len((r.get('content') or ''))} for r in rows]
          print('PILOT_K_INVENTORY='+json.dumps(summary,ensure_ascii=False))
          print('PILOT_K_SOURCES='+json.dumps(rows,ensure_ascii=False))
          PY
