name: Extract Hadith Verses (Scheduled)

on:
  schedule:
    # Every 2 days at 03:00 UTC — plan-independent fallback in case Netlify's
    # own scheduled-functions feature (Pro+) isn't active on this site.
    - cron: "0 3 */2 * *"
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    name: Hadith Verse Extraction
    timeout-minutes: 15

    steps:
      - name: Call extraction endpoint
        id: extract
        run: |
          ENDPOINT="https://quranhikma.com/.netlify/functions/extract-hadith-verses"
          echo "Calling extraction endpoint: $ENDPOINT"
          RESPONSE=$(curl -s -X POST "$ENDPOINT")
          echo "response=$RESPONSE" >> "$GITHUB_OUTPUT"
          echo "$RESPONSE"

      - name: Report status
        if: always()
        run: |
          RESPONSE='${{ steps.extract.outputs.response }}'
          echo "### Hadith Verse Extraction Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" | (jq '.' 2>/dev/null || cat) >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
