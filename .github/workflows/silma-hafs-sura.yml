name: SILMA Hafs plain-reading for one surah

on:
  workflow_dispatch:
    inputs:
      sura_id:
        description: "Surah number"
        required: true
        default: "2"
  push:
    paths:
      - ".github/workflows/silma-hafs-sura.yml"
      - "scripts/hafs_silma.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        offset: [0,30,60,90,120,150,180,210,240,270]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and SILMA TTS
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install silma-tts
      - name: Generate audio for this chunk
        env:
          SURA: ${{ github.event.inputs.sura_id || '2' }}
          OFFSET: ${{ matrix.offset }}
          LIMIT: "30"
        run: python scripts/hafs_silma.py
      - name: Commit MP3s
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/simple-recitation/*.mp3 || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Add Hafs plain-reading audio (offset ${{ matrix.offset }})"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
