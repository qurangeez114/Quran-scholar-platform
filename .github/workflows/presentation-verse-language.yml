name: Presentation verse language
on:
  pull_request:
    paths:
      - presentation.html
      - index.html
      - tests/presentation-verse-language.test.cjs
      - .github/workflows/presentation-verse-language.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentation-lang:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Pick verse languages in the builder and Present mode at phone and desktop widths
        run: node --test tests/presentation-verse-language.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-lang-screens
          path: test-results/presentation-lang
