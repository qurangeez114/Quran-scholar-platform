name: Export Qurtubi 109-1 repair inputs
on:
  push:
    paths:
      - '.github/workflows/tafsir-109-qurtubi-repair-input.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Read exact paired rows
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import os,json,urllib.request,base64,hashlib
          key=os.environ.get("SUPABASE_SERVICE_KEY","")
          if not key: raise SystemExit("Missing protected database credential")
          base="https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/tafsir_entries"
          url=base+"?id=in.(13292,38089)&select=id,aya,language,content,source_name,source_url&order=id.asc"
          req=urllib.request.Request(url,headers={"apikey":key,"Authorization":"Bearer "+key})
          with urllib.request.urlopen(req,timeout=30) as r: rows=json.load(r)
          if [x["id"] for x in rows] != [13292,38089]: raise SystemExit("Unexpected identity set")
          for x in rows:
            c=x["content"]
            print("ROW",x["id"],x["language"],len(c),hashlib.sha256(c.encode()).hexdigest())
            print("CONTENT_B64_"+str(x["id"]),base64.b64encode(c.encode()).decode())
          print("READ_ONLY_EXPORT_OK")
