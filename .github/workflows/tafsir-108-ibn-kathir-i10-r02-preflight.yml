name: Preflight Surah 108 Ibn Kathir I10 R02 source review
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-ibn-kathir-i10-r02-preflight.yml'
      - 'data/tafsir/staging/ibn-kathir-108-i10-r02-source-review-2026-10-15.json'
      - 'data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-ibn-kathir-i10-r02-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Ibn Abbas Abu Jahl trace and bilingual boundary
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import html,json,os,re,unicodedata,urllib.parse,urllib.request
          rp='data/tafsir/staging/ibn-kathir-108-i10-r02-source-review-2026-10-15.json'
          ep='data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json'
          review=json.load(open(rp,encoding='utf-8')); extraction=json.load(open(ep,encoding='utf-8'))
          expected={'schema_version':'quranhikma-tafsir-route-source-review-v1','surah':108,'verse':3,'scholar_key':'ibn_kathir','claim_id':'108-I10','route_id':'108-I10-R02','status':'bounded_suyuti_source_cluster_trace_complete_chains_unresolved_not_publication_ready','human_verified':True,'database_written':False,'publication_ready':False,'proposition_count_effect':0}
          for k,v in expected.items():
              if review.get(k)!=v: raise SystemExit(f'Unsafe or mismatched {k}: {review.get(k)!r}')
          cmp=review['comparison']
          if cmp['decision']!='retain_as_separate_bare_ibn_abbas_abu_jahl_attribution_with_source_cluster_traced_and_chains_unresolved':
              raise SystemExit('Attribution decision changed')
          if cmp['merge_with_108_I10_R01'] is not False or cmp['merge_with_adjacent_ibn_abbas_al_as_or_enemy_gloss'] is not False:
              raise SystemExit('Route separation changed')
          if cmp['authentication_state']!='not_assessed' or cmp['disagreement_explicit'] is not True:
              raise SystemExit('Authentication or disagreement boundary changed')
          group=next((x for x in extraction['route_groups'] if x.get('claim_id')=='108-I10'),None)
          route=next((x for x in group.get('routes',[]) if x.get('route_id')=='108-I10-R02'),None) if group else None
          if not route or route.get('attributed_voices')!=['Ibn Abbas'] or 'chain_absent' not in route.get('route_state',''):
              raise SystemExit('Extracted I10 R02 attribution changed')

          def norm(s):
              s=unicodedata.normalize('NFKC',html.unescape(s or ''))
              s=re.sub(r'[\u064b-\u065f\u0670\u06d6-\u06ed]','',s)
              s=re.sub(r'[،؛:,.!?؟\"“”()\[\]{}<>/=_-]',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          public_checks=((review['direct_suyuti_trace']['public_source_url'],('عبد بن حميد','ابن المنذر','ابن أبي حاتم','ابن مردويه','ابن عباس','قال أبو جهل')),(review['chronology_boundary']['public_source_url'],('عن ابن عباس','هو أبو جهل','هلاك اللعين أبي جهل','قبل وفاة إبراهيم')))
          for url,anchors in public_checks:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 QuranHikma read-only source audit'})
              with urllib.request.urlopen(req,timeout=30) as resp: page=resp.read().decode('utf-8','replace')
              page=norm(re.sub(r'<[^>]+>',' ',page))
              missing=[a for a in anchors if norm(a) not in page]
              if missing: raise SystemExit('Public source markers missing: '+json.dumps(missing,ensure_ascii=False)+' '+url)

          key=os.environ.get('SUPABASE_SERVICE_KEY','')
          if not key: raise SystemExit('Missing protected database credential')
          params=urllib.parse.urlencode({'id':'in.(48459,11081)','select':'id,sura,aya,language,scholar_key,content','order':'id.asc'})
          req=urllib.request.Request('https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/tafsir_entries?'+params,headers={'apikey':key,'Authorization':'Bearer '+key})
          with urllib.request.urlopen(req,timeout=30) as resp: rows=json.load(resp)
          byid={r['id']:r for r in rows}
          if set(byid)!={11081,48459}: raise SystemExit('Expected live entries 48459 and 11081')
          for eid,lang in ((48459,'ar'),(11081,'en')):
              row=byid[eid]
              if (row.get('sura'),row.get('aya'),row.get('language'),row.get('scholar_key'))!=(108,3,lang,'ibn_kathir'):
                  raise SystemExit('Live identity mismatch '+str(eid))
          ar=norm(byid[48459].get('content',''))
          if norm(review['ibn_kathir_witness']['arabic_anchor']) not in ar: raise SystemExit('Live Arabic I10 R02 anchor missing')
          en=norm(byid[11081].get('content','')).lower()
          markers={
            'ibn_abbas':any(x in en for x in ['ibn abbas','ibn abbaas']),
            'abu_jahl':any(x in en for x in ['abu jahl','abu jahil']),
            'your_enemy':any(x in en for x in ['your enemy','means your enemy'])}
          print('AUDIT_MODE read-only; no writes')
          print('SUYUTI_SOURCE_CLUSTER',json.dumps(review['direct_suyuti_trace']['source_cluster']))
          print('ENGLISH_BOUNDED_MARKERS',json.dumps(markers,sort_keys=True))
          print('I10_R02_CHAIN_PRESENT',review['ibn_kathir_witness']['chain_present'])
          print('I10_R02_AUTHENTICATION',cmp['authentication_state'])
          print('I10_R02_PROPOSITION_COUNT_EFFECT',review['proposition_count_effect'])
          print('TAFSIR_108_IBN_KATHIR_I10_R02_PREFLIGHT_PASS')
