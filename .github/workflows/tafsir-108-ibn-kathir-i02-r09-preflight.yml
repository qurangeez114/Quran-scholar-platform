name: Preflight Surah 108 Ibn Kathir I02 R09 primary review
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-ibn-kathir-i02-r09-preflight.yml'
      - 'data/tafsir/staging/ibn-kathir-108-i02-r09-primary-review-2026-10-14.json'
      - 'data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-ibn-kathir-i02-r09-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate R09 comparison and live Arabic witness
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import json,os,re,urllib.request,unicodedata
          rp='data/tafsir/staging/ibn-kathir-108-i02-r09-primary-review-2026-10-14.json'
          ep='data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json'
          review=json.load(open(rp,encoding='utf-8')); routes=json.load(open(ep,encoding='utf-8'))
          required={'schema_version':'quranhikma-tafsir-route-source-review-v1','surah':108,
            'scholar_key':'ibn_kathir','claim_id':'108-I02','route_id':'108-I02-R09',
            'status':'bounded_primary_comparison_complete_not_publication_ready',
            'database_written':False,'publication_ready':False}
          for k,v in required.items():
              if review.get(k)!=v: raise SystemExit(f'Unsafe or mismatched {k}: {review.get(k)!r}')
          cmp=review.get('comparison',{})
          if cmp.get('decision')!='direct_sahih_bukhari_match_same_report_not_independent_tafsir_proposition':
              raise SystemExit('R09 comparison decision missing')
          if not cmp.get('exact_chain_match') or cmp.get('textual_or_topological_variants')!=[]:
              raise SystemExit('R09 exact-match guard failed')
          if cmp.get('authentication_state')!='collection_placement_verified_no_independent_isnad_judgment':
              raise SystemExit('R09 authentication scope changed')
          if cmp.get('proposition_count_effect')!=0: raise SystemExit('R09 proposition count changed')
          direct=review.get('direct_bukhari_witness',{})
          if direct.get('work')!='Sahih al-Bukhari' or direct.get('canonical_display_number')!='4965':
              raise SystemExit('R09 collection locator missing')
          if set(direct.get('numbering_variants_observed',[]))!={'4965','4701','4681'}:
              raise SystemExit('R09 numbering variants changed')
          expected_urls={'https://dorar.net/h/P3EzB6Zi?osoul=1','https://islamicurdubooks.com/hadith/hadith-.php?bookid=1&hadith_number=4965'}
          if set(direct.get('public_source_urls',[]))!=expected_urls: raise SystemExit('R09 source locators changed')
          route_list=list(routes.get('follow_on_routes_recovered_from_bounded_context',[]))
          for group in routes.get('route_groups',[]): route_list.extend(group.get('routes',[]))
          r09=next((r for r in route_list if r.get('route_id')=='108-I02-R09'),None)
          if not r09: raise SystemExit('R09 missing from route extraction')
          route_anchor=r09.get('arabic_locator') or r09.get('arabic_anchor') or r09.get('chain_arabic') or r09.get('source_anchor')
          if route_anchor!=review['ibn_kathir_witness']['arabic_anchor']:
              raise SystemExit('R09 route extraction and staged witness differ')
          if direct.get('arabic_chain_anchor')!=route_anchor: raise SystemExit('R09 direct chain differs')
          key=os.environ.get('SUPABASE_SERVICE_KEY','')
          if not key: raise SystemExit('Missing protected database credential')
          headers={'apikey':key,'Authorization':'Bearer '+key}
          req=urllib.request.Request('https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/tafsir_entries?id=eq.48457&select=id,sura,aya,language,scholar_key,content&limit=1',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as resp: rows=json.load(resp)
          if len(rows)!=1: raise SystemExit('Expected live tafsir entry 48457')
          row=rows[0]
          if (row.get('id'),row.get('sura'),row.get('aya'),row.get('language'),row.get('scholar_key'))!=(48457,108,1,'ar','ibn_kathir'):
              raise SystemExit('Live identity mismatch')
          def norm(s):
              s=unicodedata.normalize('NFKC',s or '')
              s=re.sub(r'[\u064b-\u065f\u0670\u06d6-\u06ed]','',s)
              s=re.sub(r'[،؛:,.!?؟\"“”()\[\]]',' ',s)
              return re.sub(r'\s+',' ',s).strip()
          live=norm(row.get('content',''))
          missing=[a for a in review['validation']['required_live_anchors'] if norm(a) not in live]
          if missing: raise SystemExit('Missing live Arabic anchors: '+json.dumps(missing,ensure_ascii=False))
          print('AUDIT_MODE read-only; no writes')
          print('R09_DECISION',cmp['decision'])
          print('R09_COLLECTION_PLACEMENT',cmp['collection_placement'])
          print('R09_NUMBERING_VARIANTS',json.dumps(direct['numbering_variants_observed']))
          print('R09_AUTHENTICATION',cmp['authentication_state'])
          print('R09_PROPOSITION_COUNT_EFFECT',cmp['proposition_count_effect'])
          print('TAFSIR_108_IBN_KATHIR_I02_R09_PREFLIGHT_PASS')
