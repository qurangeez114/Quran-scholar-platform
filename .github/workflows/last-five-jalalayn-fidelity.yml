name: Save Final-Five Jalalayn Fidelity Reviews
on:
  workflow_dispatch:
  push:
    paths:
      - 'import_last_five_jalalayn_fidelity.py'
      - '.github/workflows/last-five-jalalayn-fidelity.yml'
concurrency:
  group: tafsir-fidelity-batch
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  save-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source hashes, save Jalalayn reviews, verify public readback
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python import_last_five_jalalayn_fidelity.py
