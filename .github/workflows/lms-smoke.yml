name: LMS Client Smoke
on:
  pull_request:
    paths:
      - 'lesson.html'
      - 'admin/lesson-manager.html'
      - 'admin/quiz-builder.html'
      - 'tests/lms-client-smoke.test.mjs'
      - '.github/workflows/lms-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'lesson.html'
      - 'admin/lesson-manager.html'
      - 'admin/quiz-builder.html'
      - 'tests/lms-client-smoke.test.mjs'
      - '.github/workflows/lms-smoke.yml'
permissions:
  contents: read
jobs:
  lms-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run LMS static checks
        run: node --test tests/lms-client-smoke.test.mjs
