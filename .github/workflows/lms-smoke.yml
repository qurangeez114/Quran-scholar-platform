name: LMS Client Smoke
on:
  pull_request:
    paths:
      - 'lesson.html'
      - 'student-dashboard.html'
      - 'course.html'
      - 'courses-api.js'
      - 'accounts/course-readiness.js'
      - 'accounts/instructor-support.js'
      - 'accounts/lms-dashboard.js'
      - 'instructor-dashboard.html'
      - 'admin/lms.html'
      - 'admin/courses.html'
      - 'supabase/functions/lms-admin/**'
      - 'tests/learning-flows.test.mjs'
      - 'admin/lesson-manager.html'
      - 'admin/quiz-builder.html'
      - 'tests/lms-client-smoke.test.mjs'
      - '.github/workflows/lms-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'lesson.html'
      - 'student-dashboard.html'
      - 'course.html'
      - 'courses-api.js'
      - 'accounts/course-readiness.js'
      - 'accounts/instructor-support.js'
      - 'accounts/lms-dashboard.js'
      - 'instructor-dashboard.html'
      - 'admin/lms.html'
      - 'admin/courses.html'
      - 'supabase/functions/lms-admin/**'
      - 'tests/learning-flows.test.mjs'
      - 'admin/lesson-manager.html'
      - 'admin/quiz-builder.html'
      - 'tests/lms-client-smoke.test.mjs'
      - '.github/workflows/lms-smoke.yml'
permissions:
  contents: read
jobs:
  lms-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run LMS static checks
        run: node --test tests/lms-client-smoke.test.mjs tests/learning-flows.test.mjs
