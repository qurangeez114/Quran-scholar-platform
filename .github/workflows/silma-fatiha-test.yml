name: SILMA Quran plain-reading production 49-30

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/silma-fatiha-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        surah: [49, 48, 47, 46, 45, 44, 43, 42, 41, 40, 39, 38, 37, 36, 35, 34, 33, 32, 31, 30]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SILMA and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install silma-tts
      - name: Fetch verified Uthmani verses and generate
        env:
          SURAH: ${{ matrix.surah }}
        run: |
          cat > /tmp/generate.py <<'PY'
          from pathlib import Path
          import json, os, site, urllib.request
          from silma_tts.api import SilmaTTS

          s = int(os.environ["SURAH"])
          url = f"https://api.alquran.cloud/v1/surah/{s}/quran-uthmani"
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = json.load(response)
          if payload.get("code") != 200:
              raise RuntimeError(f"Quran text API failed for surah {s}: {payload}")
          ayahs = payload["data"]["ayahs"]
          if not ayahs:
              raise RuntimeError(f"No ayahs returned for surah {s}")

          out = Path("quran-plain-audio") / f"{s:03d}"
          out.mkdir(parents=True, exist_ok=True)
          tts = SilmaTTS()
          ref_file = getattr(tts, "default_ref_audio", None)
          ref_text = "ويدقق النظر في القرآن الكريم وسائر الكتب السماوية ويتبع مسالك الرسل العظام عليهم الصلاة والسلام."
          if not ref_file:
              candidates = []
              for root in map(Path, site.getsitepackages()):
                  if root.exists():
                      candidates.extend(root.rglob("ar.ref.24k.wav"))
              if not candidates:
                  raise FileNotFoundError("SILMA Arabic reference audio ar.ref.24k.wav not found")
              ref_file = str(candidates[0])

          for ayah in ayahs:
              i = int(ayah["numberInSurah"])
              verse = ayah["text"]
              tts.infer(ref_file=str(ref_file), ref_text=ref_text, gen_text=verse,
                        file_wave=str(out / f"{s:03d}_{i:03d}.wav"),
                        seed=42, speed=1)
          PY
          python /tmp/generate.py
      - name: Convert to MP3 and build whole surah
        env:
          SURAH: ${{ matrix.surah }}
        run: |
          S="$(printf '%03d' "$SURAH")"
          D="quran-plain-audio/$S"
          for f in "$D"/*.wav; do
            ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -q:a 2 "${f%.wav}.mp3"
          done
          : > /tmp/concat.txt
          for f in "$D"/*.wav; do
            printf "file '%s'\n" "$PWD/$f" >> /tmp/concat.txt
          done
          ffmpeg -loglevel error -y -f concat -safe 0 -i /tmp/concat.txt -c:a libmp3lame -q:a 2 "$D/surah_${S}_complete.mp3"
      - name: Deploy MP3s to QuranHikma repository
        env:
          SURAH: ${{ matrix.surah }}
        run: |
          S="$(printf '%03d' "$SURAH")"
          mkdir -p audio/simple-recitation
          cp "quran-plain-audio/$S/"*.mp3 audio/simple-recitation/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/simple-recitation/
          git commit -m "Deploy SILMA plain-reading audio for Surah $SURAH"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-plain-audio-surah-${{ matrix.surah }}
          path: quran-plain-audio/
          retention-days: 30
