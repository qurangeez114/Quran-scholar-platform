name: SILMA Quran plain-reading production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/silma-fatiha-test.yml"
  workflow_dispatch:
    inputs:
      surah:
        description: "Surah number to generate"
        required: true
        default: "114"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install silma-tts
      - name: Generate selected surah
        env:
          SURAH: ${{ inputs.surah || '114' }}
        run: |
          cat > /tmp/generate.py <<'PY'
          from pathlib import Path
          import os, site
          from silma_tts.api import SilmaTTS

          # Production begins at the back of the Quran. Expand only after review.
          surahs = {
            114: [
              "قُلْ أَعُوذُ بِرَبِّ النَّاسِ",
              "مَلِكِ النَّاسِ",
              "إِلَٰهِ النَّاسِ",
              "مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ",
              "الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ",
              "مِنَ الْجِنَّةِ وَالنَّاسِ",
            ],
            113: [
              "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ",
              "مِن شَرِّ مَا خَلَقَ",
              "وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ",
              "وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ",
              "وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",
            ],
            112: [
              "قُلْ هُوَ اللَّهُ أَحَدٌ",
              "اللَّهُ الصَّمَدُ",
              "لَمْ يَلِدْ وَلَمْ يُولَدْ",
              "وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ",
            ],
            111: [
              "تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ",
              "مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ",
              "سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ",
              "وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ",
              "فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ",
            ],
            110: [
              "إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ",
              "وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا",
              "فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا",
            ],
          }
          s = int(os.environ["SURAH"])
          if s not in surahs:
              raise SystemExit(f"Surah {s} is not enabled yet.")
          out = Path("quran-plain-audio") / f"{s:03d}"
          out.mkdir(parents=True, exist_ok=True)
          tts = SilmaTTS()
          ref_file = getattr(tts, "default_ref_audio", None)
          ref_text = "ويدقق النظر في القرآن الكريم وسائر الكتب السماوية ويتبع مسالك الرسل العظام عليهم الصلاة والسلام."
          if not ref_file:
              candidates = []
              for root in map(Path, site.getsitepackages()):
                  if root.exists():
                      candidates.extend(root.rglob("ar.ref.24k.wav"))
              if not candidates:
                  raise FileNotFoundError("SILMA Arabic reference audio ar.ref.24k.wav not found")
              ref_file = str(candidates[0])
          for i, verse in enumerate(surahs[s], 1):
              tts.infer(ref_file=str(ref_file), ref_text=ref_text, gen_text=verse,
                        file_wave=str(out / f"{s:03d}_{i:03d}.wav"),
                        seed=42, speed=1)
          PY
          python /tmp/generate.py
      - name: Convert verses and build whole-surah MP3
        env:
          SURAH: ${{ inputs.surah || '114' }}
        run: |
          D="quran-plain-audio/$(printf '%03d' "$SURAH")"
          for f in "$D"/*.wav; do
            ffmpeg -y -i "$f" -codec:a libmp3lame -q:a 2 "${f%.wav}.mp3"
          done
          printf "file '%s'\n" "$PWD"/"$D"/*.wav > /tmp/concat.txt
          ffmpeg -y -f concat -safe 0 -i /tmp/concat.txt -c:a libmp3lame -q:a 2 "$D/surah_$(printf '%03d' "$SURAH")_complete.mp3"
      - name: Deploy MP3 audio to repository
        env:
          SURAH: ${{ inputs.surah || '114' }}
        run: |
          S="$(printf '%03d' "$SURAH")"
          mkdir -p audio/simple-recitation
          cp "quran-plain-audio/$S/"*.mp3 audio/simple-recitation/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/simple-recitation/
          if ! git diff --cached --quiet; then
            git commit -m "Deploy SILMA plain-reading audio for Surah $SURAH"
            git push
          fi
      - name: Upload production audio
        uses: actions/upload-artifact@v4
        with:
          name: quran-plain-audio-surah-${{ inputs.surah }}
          path: quran-plain-audio/
          retention-days: 30
