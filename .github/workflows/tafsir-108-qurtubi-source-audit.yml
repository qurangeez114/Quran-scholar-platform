name: Audit Qurtubi Surah 108 source coverage
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-qurtubi-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only Qurtubi 108 inventory and anchors
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import hashlib,json,os,re,unicodedata,urllib.parse,urllib.request
          key=os.environ.get('SUPABASE_SERVICE_KEY','')
          if not key: raise SystemExit('Missing protected database credential')
          base='https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/tafsir_entries'
          params={'sura':'eq.108','scholar_key':'eq.qurtubi','language':'in.(ar,en)','select':'id,aya,language,content,source_name,source_url','order':'language.asc,aya.asc,id.asc','limit':'100'}
          req=urllib.request.Request(base+'?'+urllib.parse.urlencode(params),headers={'apikey':key,'Authorization':'Bearer '+key})
          with urllib.request.urlopen(req,timeout=30) as r: rows=json.load(r)
          def na(s):
              s=''.join(c for c in unicodedata.normalize('NFKD',s or '') if not unicodedata.combining(c) and c!='ـ')
              return re.sub(r'\s+',' ',re.sub(r'[،؛؟:()\[\]{}﴿﴾]+',' ',s)).strip()
          print('AUDIT_MODE read-only; no writes')
          print('ROW_COUNT',len(rows))
          for x in rows:
              c=x.get('content') or ''
              print('IDENTITY',json.dumps({'id':x['id'],'aya':x['aya'],'language':x['language'],'chars':len(c),'sha256':hashlib.sha256(c.encode()).hexdigest(),'source_name':x.get('source_name'),'source_url':x.get('source_url')},ensure_ascii=False))
          for lang in ('ar','en'):
              groups={}
              for x in rows:
                  if x['language']==lang: groups.setdefault(hashlib.sha256((x.get('content') or '').encode()).hexdigest(),[]).append(int(x['aya']))
              print('CONTENT_GROUPS',lang,json.dumps(groups,sort_keys=True))
          ar=' '.join(na(x['content']) for x in rows if x['language']=='ar')
          en=' '.join((x.get('content') or '').lower() for x in rows if x['language']=='en')
          byaya={int(x['aya']):na(x['content']) for x in rows if x['language']=='ar'}
          anchors=['الكوثر','نهر في الجنة','الخير الكثير','الحوض','فصل لربك وانحر','الصلاة','النحر','شانئك','الأبتر','العاص بن وائل','عقبة بن أبي معيط','كعب بن الأشرف']
          for a in anchors: print('AR_ANCHOR',json.dumps({'text':a,'present':na(a) in ar},ensure_ascii=False))
          markers=['river','paradise','abundant good','prayer','sacrifice','enemy','cut off','posterity']
          for m in markers: print('EN_MARKER',json.dumps({'text':m,'present':m in en}))
          probes={1:['نهر في الجنة','الخير الكثير','قال ابن عباس','قال مجاهد','قال عكرمة','قال الحسن'],2:['الصلاة','النحر','قال علي','قال ابن عباس','قال عطاء','رفع يديه'],3:['العاص بن وائل','عقبة بن أبي معيط','كعب بن الأشرف','قال ابن عباس','قال عكرمة','الأبتر']}
          for aya,terms in probes.items():
              s=byaya.get(aya,'')
              for term in terms:
                  start=0; seen=0
                  while True:
                      p=s.find(na(term),start)
                      if p<0 or seen>=3: break
                      print('VERSE_CONTEXT',aya,term,seen+1,s[max(0,p-180):p+620])
                      start=p+len(na(term)); seen+=1
          arayas=sorted({int(x['aya']) for x in rows if x['language']=='ar'})
          enayas=sorted({int(x['aya']) for x in rows if x['language']=='en'})
          print('AYA_COVERAGE',json.dumps({'ar':arayas,'en':enayas}))
          if arayas != [1,2,3]: raise SystemExit('Arabic coverage incomplete')
          # Claim-level English coverage matrix. A positive marker matrix is evidence of
          # stored wording coverage, not proof that every Arabic chain was translated.
          en_byaya={int(x['aya']):(x.get('content') or '').lower() for x in rows if x['language']=='en'}
          claim_markers={
            '108-Q01':(1,[['abundance','abundant'],['number'],['measure','amount','quantity'],['importance','great']]),
            '108-Q02':(1,[['river'],['paradise'],['gold'],['pearl'],['ruby'],['sweeter'],['whiter']]),
            '108-Q03':(1,[['pool','cistern','basin'],['gathering','resurrection'],['community','nation']]),
            '108-Q04':(1,[['prophethood'],['book'],['quran'],['islam'],['intercession'],['testimony'],['five prayers','five prayer']]),
            '108-Q05':(2,[['obligatory prayer','prescribed prayer'],['festival','feast'],['sacrifice'],['dawn','morning'],['muzdalifah','muzdalifa'],['mina']]),
            '108-Q06':(2,[['malik'],['heard nothing','not heard'],['day of sacrifice'],['after']]),
            '108-Q07':(2,[['right hand'],['left'],['chest','breast'],['raise'],['qibla','qiblah']]),
            '108-Q08':(3,[['hate','hater'],['as ibn','as bin','al-as'],['cut off'],['world'],['hereafter']]),
            '108-Q09':(3,[['abu jahl'],['uqba'],['kab ibn','kab bin','ka b ibn'],['quraysh'],['cut off']])
          }
          for cid,(aya,groups) in claim_markers.items():
              s=en_byaya[aya]
              result=[{'alternatives':g,'present':any(term in s for term in g)} for g in groups]
              print('CLAIM_ENGLISH_MATRIX',cid,json.dumps(result,sort_keys=True))
          for aya,terms in {1:['abundance','prophethood','intercession'],2:['malik','right hand','qibla'],3:['abu jahl','uqba','quraysh']}.items():
              s=en_byaya[aya]
              for term in terms:
                  p=s.find(term)
                  if p>=0: print('ENGLISH_CONTEXT',aya,term,s[max(0,p-180):p+620].replace('\\n',' '))
          print('QURTUBI_108_CLAIM_TRANSLATION_AUDIT_PASS')
