name: Publish verified Jalalayn J05 and J08 for Surah 109
on:
  push:
    paths:
      - '.github/workflows/tafsir-109-jalalayn-j05-j08.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-109-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Import final two Jalalayn claims with rollback and readback
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import json,os,re,unicodedata,urllib.error,urllib.request
          key=os.environ.get("SUPABASE_SERVICE_KEY","")
          if not key: raise SystemExit("Missing protected database credential")
          base="https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/"
          h={"apikey":key,"Authorization":"Bearer "+key,"Content-Type":"application/json","Prefer":"return=representation"}
          def call(path,method="GET",body=None):
              req=urllib.request.Request(base+path,data=None if body is None else json.dumps(body,ensure_ascii=False).encode(),headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read(); return json.loads(raw) if raw else []
              except urllib.error.HTTPError as e: raise RuntimeError("HTTP "+str(e.code)+": "+e.read().decode(errors="replace")[:700]) from e
          def n(s): return re.sub(r"[^a-z0-9]+"," ",unicodedata.normalize("NFKD",s or "").encode("ascii","ignore").decode().casefold()).strip()
          specs=[
            ("J05",23678,5,"The use of inanimate ma for God is explained as correspondence with the preceding expression.",["inanimate ma","refer to god","counter"],"إطلاق ما على الله على وجه المقابلة"),
            ("J08",23679,6,"The seven readers omit the possessive ya in pause and continuation, while Yaqub retains it in both.",["seven","omit","yaqub","retains","both cases"],"القراء السبعة ... وأثبتها يعقوب")
          ]
          rows=call("tafsir_entries?id=in.(23678,23679)&select=id,sura,aya,scholar_key,language,content")
          by={r["id"]:r for r in rows}
          for code,eid,aya,statement,markers,arabic in specs:
              row=by.get(eid)
              if not row or row["sura"]!=109 or row["aya"]!=aya or row["scholar_key"]!="jalalayn" or row["language"]!="en": raise SystemExit(code+" identity mismatch")
              miss=[m for m in markers if n(m) not in n(row["content"])]
              if miss: raise SystemExit(code+" semantic markers missing: "+",".join(miss))
          existing=call("propositions?tafsir_entry_id=in.(23678,23679)&select=id,tafsir_entry_id,statement_en&limit=1000")
          made=[]; out=[]
          try:
              for code,eid,aya,statement,markers,arabic in specs:
                  matches=[r for r in existing if n(r["statement_en"])==n(statement)]
                  if len(matches)>1: raise RuntimeError("Multiple duplicates "+code)
                  tag="work-surah109-v1:source-reviewed:"+code
                  if matches:
                      pid=matches[0]["id"]; pe=call("proposition_evidence?proposition_id=eq."+str(pid)+"&select=evidence_unit_id")
                      vc=call("proposition_voice_chain?proposition_id=eq."+str(pid)+"&select=reporting_work_id")
                      if not pe or not vc: raise RuntimeError("Existing incomplete "+code)
                      evid=pe[0]["evidence_unit_id"]; state="existing"
                  else:
                      p=call("propositions","POST",{"claim_type_id":43,"statement_en":statement,"extracted_by":tag,"speaker_type":"unspecified","speaker_name":"al-Jalālayn","assertion_mode":"explicit","status":"active","source_type":"tafsir_entry","tafsir_entry_id":eid,"extraction_validity":"verified","verification_state":"source_language_proposition_verified","attribution_fidelity":"accurate_paraphrase","quranic_textual_support":"not_stated","mufassir_own_position":"preferred"})[0]
                      pid=p["id"]; item={"pid":pid,"evid":None}; made.append(item)
                      call("proposition_voice_chain","POST",{"proposition_id":pid,"reporting_work_id":4,"originating_voice_type":"exegete_own_view","originating_voice_name":None})
                      ev=call("evidence_units","POST",{"unit_type":"single_named_attribution","attributed_authority_name":"al-Jalālayn","content_summary":statement+" Arabic anchor: "+arabic+".","independence_state":"unknown"})[0]
                      evid=ev["id"]; item["evid"]=evid
                      call("proposition_evidence","POST",{"proposition_id":pid,"evidence_unit_id":evid,"semantic_link_note":"Arabic checked at quran.com/109:"+str(aya)+"/tafsirs/ar-tafsir-jalalayn; live English identity and bounded wording checked in read-only run 38196498967.","linked_by":tag}); state="inserted"
                  p=call("propositions?id=eq."+str(pid)+"&select=id,tafsir_entry_id"); v=call("proposition_voice_chain?proposition_id=eq."+str(pid)+"&select=reporting_work_id"); e=call("proposition_evidence?proposition_id=eq."+str(pid)+"&select=evidence_unit_id")
                  if len(p)!=1 or p[0]["tafsir_entry_id"]!=eid or len(v)!=1 or v[0]["reporting_work_id"]!=4 or len(e)!=1 or e[0]["evidence_unit_id"]!=evid: raise RuntimeError(code+" postflight mismatch")
                  out.append((code,pid,eid,evid,state))
              for x in out: print("JALALAYN_SAVED_VERIFIED",x[0],"proposition",x[1],"entry",x[2],"evidence",x[3],x[4])
          except Exception:
              for x in reversed(made):
                  call("proposition_evidence?proposition_id=eq."+str(x["pid"]),"DELETE"); call("proposition_voice_chain?proposition_id=eq."+str(x["pid"]),"DELETE"); call("propositions?id=eq."+str(x["pid"]),"DELETE")
                  if x["evid"] is not None: call("evidence_units?id=eq."+str(x["evid"]),"DELETE")
              raise
