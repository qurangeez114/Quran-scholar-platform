name: Visitor analytics smoke
on:
  pull_request:
    paths:
      - 'behavior.html'
      - 'behavior-collector.js'
      - 'admin/lms.html'
      - 'netlify/edge-functions/donate-inject.ts'
      - 'supabase/migrations/20261016_visitor_analytics_secure_ingest.sql'
      - 'tests/visitor-analytics.test.mjs'
      - '.github/workflows/visitor-analytics.yml'
  push:
    branches: [main]
    paths:
      - 'behavior.html'
      - 'behavior-collector.js'
      - 'admin/lms.html'
      - 'netlify/edge-functions/donate-inject.ts'
      - 'supabase/migrations/20261016_visitor_analytics_secure_ingest.sql'
      - 'tests/visitor-analytics.test.mjs'
      - '.github/workflows/visitor-analytics.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/visitor-analytics.test.mjs
