name: Validate Surah 108 I06 attribution boundaries
on:
  push:
    paths:
      - 'scripts/validate-ibn-kathir-i06-r01-symbolic-plan.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r01-symbolic-plan-2026-10-31.json'
      - 'scripts/validate-ibn-kathir-i06-r01-scope.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r01-scope-review-2026-10-30.json'
      - 'scripts/validate-ibn-kathir-i06-r02-evidence-links.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r02-evidence-link-review-2026-10-30.json'
      - 'scripts/validate-ibn-kathir-i06-r02-held-draft.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r02-held-proposition-draft-2026-10-30.json'
      - 'scripts/validate-ibn-kathir-i06-r02-assertions.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r02-refined-semantic-candidate-2026-10-30.json'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r02-clause-map-2026-10-30.json'
      - 'scripts/validate-ibn-kathir-i06-boundaries.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-separated-semantic-candidate-2026-10-30.json'
      - 'data/tafsir/staging/ibn-kathir-108-i06-paragraph-locators-2026-10-30.json'
      - '.github/workflows/tafsir-108-ibn-kathir-i06-boundaries.yml'
  pull_request:
    paths:
      - 'scripts/validate-ibn-kathir-i06-r01-symbolic-plan.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r01-symbolic-plan-2026-10-31.json'
      - 'scripts/validate-ibn-kathir-i06-r01-scope.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r01-scope-review-2026-10-30.json'
      - 'scripts/validate-ibn-kathir-i06-r02-evidence-links.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r02-evidence-link-review-2026-10-30.json'
      - 'scripts/validate-ibn-kathir-i06-r02-held-draft.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r02-held-proposition-draft-2026-10-30.json'
      - 'scripts/validate-ibn-kathir-i06-r02-assertions.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r02-refined-semantic-candidate-2026-10-30.json'
      - 'data/tafsir/staging/ibn-kathir-108-i06-r02-clause-map-2026-10-30.json'
      - 'scripts/validate-ibn-kathir-i06-boundaries.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-separated-semantic-candidate-2026-10-30.json'
      - 'data/tafsir/staging/ibn-kathir-108-i06-paragraph-locators-2026-10-30.json'
      - '.github/workflows/tafsir-108-ibn-kathir-i06-boundaries.yml'
permissions:
  contents: read
concurrency:
  group: tafsir-108-i06-boundaries-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact report boundaries and reject unsafe attribution
        run: python scripts/validate-ibn-kathir-i06-boundaries.py
      - name: Validate R02 exact assertion ownership and conditional meaning
        run: python scripts/validate-ibn-kathir-i06-r02-assertions.py
      - name: Validate R02 held propositions and mandatory voice holds
        run: python scripts/validate-ibn-kathir-i06-r02-held-draft.py
      - name: Validate R02 source-report evidence links and exact clauses
        run: python scripts/validate-ibn-kathir-i06-r02-evidence-links.py
      - name: Validate R01 parallel attributions and identification scope
        run: python scripts/validate-ibn-kathir-i06-r01-scope.py
      - name: Validate R01 symbolic pairs and unresolved physical mappings
        run: python scripts/validate-ibn-kathir-i06-r01-symbolic-plan.py
      - name: Confirm read-only validation
        run: git diff --exit-code
