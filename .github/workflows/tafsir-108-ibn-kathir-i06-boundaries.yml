name: Validate Surah 108 I06 attribution boundaries
on:
  push:
    paths:
      - 'scripts/validate-ibn-kathir-i06-boundaries.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-separated-semantic-candidate-2026-10-30.json'
      - 'data/tafsir/staging/ibn-kathir-108-i06-paragraph-locators-2026-10-30.json'
      - '.github/workflows/tafsir-108-ibn-kathir-i06-boundaries.yml'
  pull_request:
    paths:
      - 'scripts/validate-ibn-kathir-i06-boundaries.py'
      - 'data/tafsir/staging/ibn-kathir-108-i06-separated-semantic-candidate-2026-10-30.json'
      - 'data/tafsir/staging/ibn-kathir-108-i06-paragraph-locators-2026-10-30.json'
      - '.github/workflows/tafsir-108-ibn-kathir-i06-boundaries.yml'
permissions:
  contents: read
concurrency:
  group: tafsir-108-i06-boundaries-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact report boundaries and reject unsafe attribution
        run: python scripts/validate-ibn-kathir-i06-boundaries.py
      - name: Confirm read-only validation
        run: git diff --exit-code
