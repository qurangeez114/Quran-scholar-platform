name: Import Final-Five Arabic Jalalayn
on:
  push:
    paths:
      - 'import_last5_jalalayn_ar.py'
      - '.github/workflows/last5-jalalayn-ar.yml'
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate importer
        run: python -m py_compile import_last5_jalalayn_ar.py
      - name: Import and verify Arabic Jalalayn
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python import_last5_jalalayn_ar.py
