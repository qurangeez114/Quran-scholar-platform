name: Preflight Surah 108 Ibn Kathir I02 R08 primary review
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-ibn-kathir-i02-r08-preflight.yml'
      - 'data/tafsir/staging/ibn-kathir-108-i02-r08-primary-review-2026-10-14.json'
      - 'data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-ibn-kathir-i02-r08-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate R08 comparison and live Arabic witness
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import json,os,re,urllib.request,unicodedata
          review_path='data/tafsir/staging/ibn-kathir-108-i02-r08-primary-review-2026-10-14.json'
          routes_path='data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json'
          review=json.load(open(review_path,encoding='utf-8'))
          routes=json.load(open(routes_path,encoding='utf-8'))
          required={
            'schema_version':'quranhikma-tafsir-route-source-review-v1',
            'surah':108,'scholar_key':'ibn_kathir','claim_id':'108-I02',
            'route_id':'108-I02-R08',
            'status':'bounded_primary_comparison_complete_not_publication_ready',
            'database_written':False,'publication_ready':False}
          for k,v in required.items():
              if review.get(k)!=v: raise SystemExit(f'Unsafe or mismatched {k}: {review.get(k)!r}')
          cmp=review.get('comparison',{})
          if cmp.get('decision')!='same_report_family_direct_ahmad_match_with_material_chain_segmentation_variant':
              raise SystemExit('R08 comparison decision missing')
          if cmp.get('authentication_state')!='not_assessed' or cmp.get('proposition_count_effect')!=0:
              raise SystemExit('R08 scope guard failed')
          variants={(v.get('position'),v.get('ibn_kathir'),v.get('direct_ahmad')) for v in cmp.get('textual_or_topological_variants',[])}
          expected={
            ('Abu Salama to al-Layth','haddathana','akhbarana'),
            ('Abd al-Wahhab','Abd al-Wahhab','Abd al-Wahhab ibn Abi Bakr'),
            ('Abd Allah / Ibn Shihab link','Abd Allah ibn Muslim ibn Shihab -> Anas','Abd Allah ibn Muslim -> Ibn Shihab -> Anas')}
          if variants!=expected: raise SystemExit('R08 variants changed: '+repr(variants))
          direct=review.get('direct_ahmad_witness',{})
          if direct.get('work')!='Musnad Ahmad ibn Hanbal':
              raise SystemExit('Direct Ahmad work identity missing')
          urls=set(direct.get('public_source_urls',[]))
          expected_urls={'https://dorar.net/h/NtnkE393?osoul=1','https://islamicurdubooks.com/hadith/hadith-.php?bookid=24&hadith_number=13306'}
          if urls!=expected_urls: raise SystemExit('Direct source locators changed')
          if '13306' not in direct.get('displayed_number_variants',[]):
              raise SystemExit('Direct hadith number 13306 missing')
          route_list=list(routes.get('follow_on_routes_recovered_from_bounded_context',[]))
          for group in routes.get('route_groups',[]): route_list.extend(group.get('routes',[]))
          r08=next((r for r in route_list if r.get('route_id')=='108-I02-R08'),None)
          if not r08: raise SystemExit('R08 missing from route extraction')
          route_anchor=r08.get('arabic_locator') or r08.get('arabic_anchor') or r08.get('chain_arabic') or r08.get('source_anchor')
          if route_anchor!=review['ibn_kathir_witness']['arabic_anchor']:
              raise SystemExit('R08 route extraction and staged witness differ')
          key=os.environ.get('SUPABASE_SERVICE_KEY','')
          if not key: raise SystemExit('Missing protected database credential')
          base='https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/'
          headers={'apikey':key,'Authorization':'Bearer '+key}
          req=urllib.request.Request(base+'tafsir_entries?id=eq.48457&select=id,sura,aya,language,scholar_key,content&limit=1',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as resp: rows=json.load(resp)
          if len(rows)!=1: raise SystemExit('Expected live tafsir entry 48457')
          row=rows[0]
          identity=(row.get('id'),row.get('sura'),row.get('aya'),row.get('language'),row.get('scholar_key'))
          if identity!=(48457,108,1,'ar','ibn_kathir'): raise SystemExit('Live identity mismatch '+repr(identity))
          def norm(s):
              s=unicodedata.normalize('NFKC',s or '')
              s=re.sub(r'[\u064b-\u065f\u0670\u06d6-\u06ed]','',s)
              s=re.sub(r'[،؛:,.!?؟\"“”()\[\]]',' ',s)
              return re.sub(r'\s+',' ',s).strip()
          live=norm(row.get('content',''))
          missing=[a for a in review['validation']['required_live_anchors'] if norm(a) not in live]
          if missing: raise SystemExit('Missing live Arabic anchors: '+json.dumps(missing,ensure_ascii=False))
          print('AUDIT_MODE read-only; no writes')
          print('R08_DECISION',cmp['decision'])
          print('R08_VARIANTS',json.dumps(cmp['textual_or_topological_variants'],ensure_ascii=False,sort_keys=True))
          print('R08_AUTHENTICATION',cmp['authentication_state'])
          print('R08_PROPOSITION_COUNT_EFFECT',cmp['proposition_count_effect'])
          print('TAFSIR_108_IBN_KATHIR_I02_R08_PREFLIGHT_PASS')
