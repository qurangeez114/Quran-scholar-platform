name: Compact Themes UI
on:
  pull_request:
    paths:
      - 'themes.html'
      - 'tests/themes-compact.test.mjs'
      - '.github/workflows/themes-compact-ui.yml'
  push:
    branches: [main]
    paths:
      - 'themes.html'
      - 'tests/themes-compact.test.mjs'
      - '.github/workflows/themes-compact-ui.yml'
permissions:
  contents: read
jobs:
  themes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/themes-compact.test.mjs
