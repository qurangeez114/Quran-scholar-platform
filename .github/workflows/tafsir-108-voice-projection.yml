name: Validate Surah 108 voice projection
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-voice-projection.yml'
      - 'scripts/*tabari-t01*.py'
      - 'scripts/*tabari-t02*.py'
      - 'scripts/*tabari-t11a*.py'
      - 'scripts/*tabari-t11c*.py'
      - 'data/tafsir/staging/tabari-108-t11c-*.json'
      - 'data/tafsir/staging/tabari-108-t11a-*.json'
      - 'data/tafsir/staging/tabari-108-t02-*.json'
      - 'data/tafsir/staging/tabari-108-t01-*.json'
      - 'data/tafsir/staging/ibn-kathir-108-i01-four-table-candidates-2026-10-17.json'
      - 'data/tafsir/staging/surah-108-voice-projection-2026-10-17.json'
      - 'data/tafsir/staging/surah-108-payload-assembly-2026-10-16.json'
      - 'data/tafsir/staging/surah-108-link-schema-q06-mapping-2026-10-17.json'
      - 'data/tafsir/staging/surah-108-voice-column-audit-2026-10-17.json'
      - 'data/tafsir/staging/qurtubi-108-q06-bilingual-source-check-2026-10-17.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-voice-projection
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned pre-T01 baseline
        uses: actions/checkout@v4
        with:
          ref: 5517c14dbde1656932d55a7d310b458f7c1866f7
          path: .t01-baseline
          persist-credentials: false
      - name: Read pinned post-T01 pre-T02 baseline
        uses: actions/checkout@v4
        with:
          ref: f737063faf85198b8cf46286b8643681bba9687c
          path: .t02-baseline
          persist-credentials: false
      - name: Read pinned post-T02 pre-T11A baseline
        uses: actions/checkout@v4
        with:
          ref: cf1bccf8793c6b8c381a052cc25213bde72849f6
          path: .t11a-baseline
          persist-credentials: false
      - name: Read pinned post-T11A pre-T11C baseline
        uses: actions/checkout@v4
        with:
          ref: b551d9167b53a32e0c120d9096b56dc644e7b3dd
          path: .t11c-baseline
          persist-credentials: false
      - name: Read pinned post-T11C baseline for historical guards
        uses: actions/checkout@v4
        with:
          ref: 66dbd7607e30db7f2bebfe774f0e828df4e61412
          path: .i02-baseline
          persist-credentials: false
      - name: Validate current T11C lifecycle separately
        run: python scripts/test-tabari-t11c-coordinated-lifecycle.py --baseline .t11c-baseline --current .i02-baseline
      - name: Validate staging projection without network or database access
        shell: python
        run: |
          import json,hashlib,pathlib,subprocess,sys
          t11a=json.loads(subprocess.check_output([sys.executable,"scripts/test-tabari-t11a-coordinated-lifecycle.py","--baseline",".t11a-baseline","--current",".t11c-baseline"],text=True))
          assert t11a["status"]=="PASS"
          print("T11A coordinated state:",t11a["current_state"])
          base=pathlib.Path(".t11a-baseline/data/tafsir/staging")
          def read(name):
              raw=(base/name).read_bytes()
              return json.loads(raw),hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          projection,_=read("surah-108-voice-projection-2026-10-17.json")
          assembly,asha=read("surah-108-payload-assembly-2026-10-16.json")
          schema,ssha=read("surah-108-link-schema-q06-mapping-2026-10-17.json")
          audit,audsha=read("surah-108-voice-column-audit-2026-10-17.json")
          assert projection["inputs"]==dict(assembly_blob_sha=asha,schema_blob_sha=ssha,audit_blob_sha=audsha),"Stale projection input"
          for doc in (projection,assembly):
              assert doc["database_written"] is False and doc["publication_ready"] is False and doc["chapter_complete"] is False
          columns={x["column_name"] for x in schema["columns"] if x["table_name"]=="proposition_voice_chain"}
          original=set(["108-T01","108-T02","108-T03","108-T04A","108-T04B","108-T04C","108-T04D","108-T05","108-T06","108-T07","108-T08A","108-T08B","108-T09","108-T10","108-T11A","108-T11B","108-T11C","108-T11D","108-I01","108-I02","108-I03","108-I04A","108-I04B","108-I04C","108-I04D","108-I05","108-I06","108-I07","108-I08","108-I09","108-I10","108-I11","108-Q01","108-Q02","108-Q03","108-Q04A","108-Q04B","108-Q04C","108-Q04D","108-Q04E","108-Q04F","108-Q04G","108-Q04H","108-Q04I","108-Q04J","108-Q04K","108-Q04L","108-Q04M","108-Q04N","108-Q05","108-Q06","108-Q07","108-Q08A","108-Q08B","108-Q09","108-J01","108-J02","108-J03","108-J04","108-J05","108-S01","108-S02","108-S03","108-S04","108-S05","108-S06","108-W01","108-W02","108-W03","108-W04","108-W05","108-W06","108-W07"])
          actual={r["claim_id"] for r in assembly["rows"]}
          split=(original-{"108-I01"})|{"108-I01-A","108-I01-B"}
          assert actual==original or actual==split,"Partial or mixed I01 inventory"
          is_split=actual==split
          total=74 if is_split else 73
          if is_split:
              candidates,_=read("ibn-kathir-108-i01-four-table-candidates-2026-10-17.json")
              for candidate in candidates["candidates"]:
                  row=next(r for r in assembly["rows"] if r["claim_id"]==candidate["draft_label"])
                  for section in ("proposition","voice","evidence","link"):
                      assert row["proposed_payload"][section]==candidate[section],"I01 candidate divergence"
                  assert row["semantic_publication_hold"],"I01 split must retain hold"
          assert len(projection["rows"])==len(assembly["rows"])==total
          indexed={x["claim_id"]:x for x in projection["rows"]}
          assert len(indexed)==total
          projected=unmapped=metadata=holds=0
          for row in assembly["rows"]:
              saved=indexed[row["claim_id"]]
              assert saved["publication_ready"] is False
              payload=row.get("proposed_payload") or (row["plan_row"] if "proposition" in row.get("plan_row",{}) else None)
              if payload is None:
                  assert saved["state"]=="blocked_no_four_table_payload" and "database_fields" not in saved
                  unmapped+=1
                  continue
              projected+=1
              fields=saved["database_fields"]
              extra=saved["staging_metadata"]
              assert set(fields)<=columns
              assert not ({"id","proposition_id"} & set(fields))
              assert not (set(fields)&set(extra))
              assert dict(fields,**extra)==payload["voice"],"Lossy voice projection "+row["claim_id"]
              metadata+=bool(extra)
              assert saved["semantic_publication_hold"]==row.get("semantic_publication_hold")
              holds+=bool(saved["semantic_publication_hold"])
              assert saved["state"]=="staging_only_not_insertable" and saved["blockers"]
          assert projection["counts"]==dict(total_claims=total,projected=projected,unmapped=unmapped,rows_with_preserved_metadata=metadata,semantic_holds=holds)
          expected=(61,12,41,10)
          if is_split:
              historical=subprocess.check_output([sys.executable,"scripts/test-tabari-t01-coordinated-lifecycle.py","--baseline",".t01-baseline","--current",".t02-baseline"],text=True)
              assert "Current state: exact_three_file_preview" in historical,"Pinned T01 transition changed"
              lifecycle=json.loads(subprocess.check_output([sys.executable,"scripts/test-tabari-t02-coordinated-lifecycle.py","--baseline",".t02-baseline","--current",".t11a-baseline"],text=True))
              assert lifecycle["status"]=="PASS" and lifecycle["current_state"] in ("original_unapplied","exact_three_file_preview"),"Unknown T02 lifecycle"
              expected=(65,9,41,12) if lifecycle["current_state"]=="exact_three_file_preview" else (64,10,41,12)
          assert (projected,unmapped,metadata,holds)==expected
          source_check,_=read("qurtubi-108-q06-bilingual-source-check-2026-10-17.json")
          assert source_check["input_assembly_blob_sha"]==asha,"Stale Q06 source checkpoint"
          assert source_check["result"]=="source_hashes_and_bilingual_claim_scope_verified"
          assert source_check["database_written"] is False and source_check["publication_ready"] is False
          q06=next(x for x in assembly["rows"] if x["claim_id"]=="108-Q06")
          payload=q06["proposed_payload"]
          assert payload["voice"]["originating_voice_name"]=="Malik"
          assert payload["voice"]["originating_voice_type"]=="named_earlier_exegete"
          assert payload["evidence"]["attributed_authority_name"]=="Malik"
          assert payload["evidence"]["unit_type"]=="single_named_attribution"
          assert payload["proposition"]["mufassir_own_position"]=="reported_only"
          assert payload["proposition"]["statement_en"]==q06["authoritative_research_claim"]["statement_en"]
          assert "Ibn al-Arabi" in payload["link"]["semantic_link_note"]
          assert q06["semantic_publication_hold"],"Source check alone must not remove hold"
          witnesses={x["entry_id"]:x for x in source_check["locators"]}
          assert set(witnesses)=={13240,38031}
          for entry_id,lang,hash_field in ((13240,"ar","expected_sha256"),(38031,"en","translation_witness_expected_sha256")):
              witness=witnesses[entry_id]
              assert witness["language"]==lang and witness["sha256"]==payload["source"][hash_field]
              assert len(witness["spans"])==6
              for span in witness["spans"]:
                  assert span["anchor"] and span["end_codepoint_0"]-span["start_codepoint_0"]==len(span["anchor"])
                  assert witness["context_start_codepoint_0"]<=span["start_codepoint_0"]<span["end_codepoint_0"]<=witness["context_end_codepoint_0"]
          print("Q06 saved bilingual checkpoint and separate speaker/reporter mapping consistent; hold retained.")
          print(f"PASS: {projected} lossless voice projections; {unmapped} unmapped; {metadata} metadata envelopes; {holds} semantic holds.")
          print("Static integrity only; no live source verification, publication approval, or database writes.")
      - name: Read pinned post-I02 baseline for historical guards
        uses: actions/checkout@v4
        with:
          ref: 52d17712d7f3138ec18471ab588813da8e04a15b
          path: .i03-baseline
          persist-credentials: false
      - name: Validate exact I02 coordinated transition
        run: python3 scripts/test-ibn-kathir-i02-coordinated-lifecycle.py --baseline .i02-baseline --current .i03-baseline
      - name: Validate exact I03 coordinated transition
        run: python3 scripts/test-ibn-kathir-i03-coordinated-lifecycle.py --baseline .i03-baseline --current .
