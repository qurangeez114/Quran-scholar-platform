name: Global Equb review checks (no deployment)

on:
  push:
    branches:
      - 'ui/global-equb-group-detail-20261104'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      # Vite/TanStack generates src/routeTree.gen.ts during build. Build must
      # happen before static type-checking and route tests for new file routes.
      - name: Generate router tree and build (artifact only, no deploy)
        run: npm run build
      - name: TypeScript type-check
        run: npx tsc --noEmit
      - name: Vitest
        run: npm test
