name: Preflight Surah 108 I04 integrated replacements
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-i04-replacement-preflight.yml'
      - 'data/tafsir/staging/ibn-kathir-108-research-2026-10-12.json'
      - 'data/tafsir/staging/ibn-kathir-108-i04-replacement-candidates-2026-10-12.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-i04-replacement-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate integrated atomic replacements read-only
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import json,os,urllib.parse,urllib.request
          base='data/tafsir/staging/'
          source=json.load(open(base+'ibn-kathir-108-research-2026-10-12.json',encoding='utf-8'))
          replacement=json.load(open(base+'ibn-kathir-108-i04-replacement-candidates-2026-10-12.json',encoding='utf-8'))
          expected_ids=['108-I04A','108-I04B','108-I04C','108-I04D']
          ids=[c['id'] for c in source['claims']]
          if len(ids)!=14 or len(set(ids))!=14 or '108-I04' in ids:
              raise SystemExit('Expected integrated 14-claim Ibn Kathir inventory without retired parent')
          integrated=[c for c in source['claims'] if c['id'] in expected_ids]
          if [c['id'] for c in integrated]!=expected_ids:
              raise SystemExit('Integrated I04 IDs/order mismatch')
          if any(c.get('status')!='atomic_replacement_integrated_after_protected_preflight' for c in integrated):
              raise SystemExit('Integrated I04 status mismatch')
          candidates=replacement.get('candidates',[])
          if [c.get('id') for c in candidates]!=expected_ids:
              raise SystemExit('Replacement candidate IDs/order mismatch')
          for c in candidates:
              live=next(x for x in integrated if x['id']==c['id'])
              for k in ('verse_mapping','arabic_entry_id','english_entry_id','voice_position','statement_en','evidence_anchor_ar','translation_state','evidence_state'):
                  if c.get(k)!=live.get(k): raise SystemExit('Candidate/authoritative mismatch '+c['id']+' '+k)
          if replacement.get('status')!='replacement_integrated_after_protected_preflight_not_publication_ready':
              raise SystemExit('Replacement integration status mismatch')
          if replacement.get('database_written') is not False or replacement.get('publication_ready') is not False:
              raise SystemExit('Replacement safety flags invalid')
          integ=replacement.get('integration',{})
          if integ.get('integrated_claim_ids')!=expected_ids or integ.get('removed_parent_id')!='108-I04':
              raise SystemExit('Integration inventory mismatch')
          p=replacement.get('preflight',{})
          if any(p.get(k) for k in ('local_exact_duplicates','local_likely_duplicates','live_exact_duplicates','live_likely_duplicates')):
              raise SystemExit('Previously verified duplicate guard changed')
          key=os.environ.get('SUPABASE_SERVICE_KEY','')
          if not key: raise SystemExit('Missing protected database credential')
          params=urllib.parse.urlencode({'id':'in.(48457,11079)','select':'id,sura,aya,language,scholar_key','order':'id.asc'})
          req=urllib.request.Request('https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/tafsir_entries?'+params,headers={'apikey':key,'Authorization':'Bearer '+key})
          with urllib.request.urlopen(req,timeout=30) as resp: rows=json.load(resp)
          got={(x['id'],x['sura'],x['aya'],x['language'],x['scholar_key']) for x in rows}
          want={(48457,108,1,'ar','ibn_kathir'),(11079,108,1,'en','ibn_kathir')}
          if got!=want: raise SystemExit('Live verse-1 bilingual identities changed')
          print('AUDIT_MODE read-only; no writes')
          print('INTEGRATED_REPLACEMENTS',json.dumps(expected_ids))
          print('IBN_KATHIR_CLAIMS',len(ids))
          print('DATABASE_WRITES',0)
          print('PUBLICATION_READY',False)
          print('SURAH_108_I04_INTEGRATED_REPLACEMENT_PASS')
