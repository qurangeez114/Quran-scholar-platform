name: Validate Surah 108 Tabari T11A draft and preview
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-tabari-t11a-preview.yml'
      - 'scripts/*tabari-t11a*.py'
      - 'data/tafsir/staging/tabari-108-t11a-*.json'
      - 'data/tafsir/staging/surah-108-payload-assembly-2026-10-16.json'
      - 'data/tafsir/staging/surah-108-voice-projection-2026-10-17.json'
      - 'data/tafsir/staging/qurtubi-108-q06-bilingual-source-check-2026-10-17.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-tabari-t11a-preview
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned pre-T11A assembly
        uses: actions/checkout@v4
        with:
          ref: cf1bccf8793c6b8c381a052cc25213bde72849f6
          path: .t11a-baseline
          persist-credentials: false
      - name: Read pinned post-T11A pre-T11C staging
        uses: actions/checkout@v4
        with:
          ref: b551d9167b53a32e0c120d9096b56dc644e7b3dd
          path: .t11c-baseline
          persist-credentials: false
      - name: Validate draft and reject ten unsafe mutations
        run: python scripts/validate-tabari-t11a-draft.py --self-test
      - name: Verify preview is identical under two hash seeds
        shell: python
        run: |
          import json, os, subprocess, sys
          command=[sys.executable,"scripts/preview-tabari-t11a-coordinated.py","--root",".t11a-baseline","--draft-root","."]
          results=[]
          for seed in ("1","77"):
              env=dict(os.environ,PYTHONHASHSEED=seed)
              results.append(json.loads(subprocess.check_output(command,env=env,text=True)))
          assert results[0]==results[1], "Nondeterministic preview"
          assert results[0]["files_applied"] is False
          assert results[0]["database_written"] is False
          print(json.dumps(results[0]))
      - name: Reject partial or divergent staging transitions
        run: python scripts/test-tabari-t11a-coordinated-lifecycle.py --baseline .t11a-baseline --current .t11c-baseline
      - name: Read pinned post-T11C baseline for historical guards
        uses: actions/checkout@v4
        with:
          ref: 66dbd7607e30db7f2bebfe774f0e828df4e61412
          path: .i02-baseline
          persist-credentials: false
      - name: Validate current T11C lifecycle separately
        run: python scripts/test-tabari-t11c-coordinated-lifecycle.py --baseline .t11c-baseline --current .i02-baseline
      - name: Read pinned post-I02 baseline for historical guards
        uses: actions/checkout@v4
        with:
          ref: 52d17712d7f3138ec18471ab588813da8e04a15b
          path: .i03-baseline
          persist-credentials: false
      - name: Validate exact I02 coordinated transition
        run: python3 scripts/test-ibn-kathir-i02-coordinated-lifecycle.py --baseline .i02-baseline --current .i03-baseline
      - name: Validate exact I03 coordinated transition
        run: python3 scripts/test-ibn-kathir-i03-coordinated-lifecycle.py --baseline .i03-baseline --current .
