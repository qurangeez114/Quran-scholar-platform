name: Preflight Surah 108 Ibn Kathir I02 R04 Muslim locator review
on:
  push:
    paths:
      - '.github/workflows/tafsir-108-ibn-kathir-i02-r04-muslim-preflight.yml'
      - 'data/tafsir/staging/ibn-kathir-108-i02-r04-muslim-locator-review-2026-10-14.json'
      - 'data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tafsir-108-ibn-kathir-i02-r04-muslim-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate R04 locator comparison and live Arabic witness
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: python
        run: |
          import json,os,re,urllib.request,unicodedata
          p='data/tafsir/staging/ibn-kathir-108-i02-r04-muslim-locator-review-2026-10-14.json'
          review=json.load(open(p,encoding='utf-8'))
          routes=json.load(open('data/tafsir/staging/ibn-kathir-108-route-extraction-2026-10-12.json',encoding='utf-8'))
          required={'schema':'quranhikma-tafsir-route-source-review-v1','surah':108,'verse':1,'scholar':'ibn_kathir','claim_id':'108-I02','route_id':'108-I02-R04','status':'bounded_primary_comparison_complete_not_publication_ready','database_written':False,'publication_ready':False}
          for k,v in required.items():
              if review.get(k)!=v: raise SystemExit(f'Unsafe or mismatched {k}: {review.get(k)!r}')
          cmp=review.get('comparison',{})
          if cmp.get('decision')!='bukhari_exact_match_muslim_exact_locator_unresolved': raise SystemExit('R04 comparison decision missing')
          if cmp.get('authentication_assessment')!='not_assessed' or cmp.get('new_claim_propositions')!=0: raise SystemExit('R04 scope guard failed')
          b=review.get('primary_collection_checks',{}).get('bukhari',{})
          if b.get('locator')!='Sahih al-Bukhari 4964' or b.get('decision')!='exact_direct_match': raise SystemExit('Bukhari locator mismatch')
          if b.get('chain')!='Adam -> Shayban -> Qatada -> Anas ibn Malik': raise SystemExit('Bukhari chain changed')
          m=review.get('primary_collection_checks',{}).get('muslim_candidate',{})
          if m.get('locator')!='Sahih Muslim 164a' or m.get('candidate_scope')!='related_isra_report_not_exact_r04_witness': raise SystemExit('Muslim candidate scope mismatch')
          if 'Shayban ibn Abd al-Rahman' not in review.get('ibn_kathir_witness',{}).get('printed_attribution',''): raise SystemExit('Ibn Kathir printed attribution missing')
          route_list=list(routes.get('follow_on_routes_recovered_from_bounded_context',[]))
          for group in routes.get('route_groups',[]): route_list.extend(group.get('routes',[]))
          r04=next((r for r in route_list if r.get('route_id')=='108-I02-R04'),None)
          if not r04: raise SystemExit('R04 missing from route extraction')
          route_blob=json.dumps(r04,ensure_ascii=False)
          for anchor in ['شيبان بن عبد الرحمن','قتادة','أنس بن مالك']:
              if anchor not in route_blob: raise SystemExit('R04 extraction anchor missing: '+anchor)
          key=os.environ.get('SUPABASE_SERVICE_KEY','')
          if not key: raise SystemExit('Missing protected database credential')
          headers={'apikey':key,'Authorization':'Bearer '+key}
          req=urllib.request.Request('https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/tafsir_entries?id=eq.48457&select=id,sura,aya,language,scholar_key,content&limit=1',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as resp: rows=json.load(resp)
          if len(rows)!=1: raise SystemExit('Expected live tafsir entry 48457')
          row=rows[0]
          if (row.get('id'),row.get('sura'),row.get('aya'),row.get('language'),row.get('scholar_key'))!=(48457,108,1,'ar','ibn_kathir'): raise SystemExit('Live identity mismatch')
          def norm(s):
              s=unicodedata.normalize('NFKC',s or '')
              s=re.sub(r'[\u064b-\u065f\u0670\u06d6-\u06ed]','',s)
              return re.sub(r'\s+',' ',s).strip()
          live=norm(row.get('content',''))
          missing=[a for a in review['validation']['required_live_arabic_anchors'] if norm(a) not in live]
          if missing: raise SystemExit('Missing live Arabic anchors: '+json.dumps(missing,ensure_ascii=False))
          print('AUDIT_MODE read-only; no writes')
          print('R04_DECISION',cmp['decision'])
          print('R04_BUKHARI_LOCATOR',b['locator'])
          print('R04_MUSLIM_CANDIDATE',m['locator'],m['candidate_scope'])
          print('R04_AUTHENTICATION',cmp['authentication_assessment'])
          print('R04_NEW_PROPOSITIONS',cmp['new_claim_propositions'])
          print('TAFSIR_108_IBN_KATHIR_I02_R04_MUSLIM_PREFLIGHT_PASS')
