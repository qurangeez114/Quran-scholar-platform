name: Tafsir Fidelity Batch

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum new verse evaluations this run (0 = all missing)"
        required: true
        default: "100"
        type: string
      start:
        description: "Optional starting verse, e.g. 2:255"
        required: false
        default: ""
        type: string
      model:
        description: "Claude model used by the existing QuranHikma API"
        required: true
        default: "claude-sonnet-4-6"
        type: string
  push:
    paths:
      - ".github/tafsir-fidelity-run-trigger.txt"
  schedule:
    # Keep advancing automatically until no eligible Arabic-English pairs remain.
    # Once complete, later scheduled runs exit immediately with "Nothing to do."
    - cron: "*/30 * * * *"

concurrency:
  group: tafsir-fidelity-batch
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate evaluator syntax
        run: python -m py_compile batch_tafsir_accuracy.py

      - name: Evaluate next missing Ibn Kathir Arabic-English pairs
        shell: bash
        env:
          BATCH_LIMIT: ${{ inputs.limit || '100' }}
          BATCH_START: ${{ inputs.start || '' }}
          BATCH_MODEL: ${{ inputs.model || 'claude-sonnet-4-6' }}
        run: |
          set -uo pipefail
          args=(--limit "$BATCH_LIMIT" --model "$BATCH_MODEL")
          if [[ -n "$BATCH_START" ]]; then
            args+=(--start "$BATCH_START")
          fi
          set +e
          python batch_tafsir_accuracy.py "${args[@]}" 2>&1 | tee /tmp/evaluator_output.txt
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### Tafsir evaluator output (exit code $code)"
            echo ""
            echo '```'
            tail -c 8000 /tmp/evaluator_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$code" > /tmp/evaluator_exit_code.txt
          exit $code

      - name: Upload evaluator output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-output
          path: |
            /tmp/evaluator_output.txt
            /tmp/evaluator_exit_code.txt
          retention-days: 7

      # Temporary diagnostic: both job logs and artifacts are served from
      # *.blob.core.windows.net, unreachable from the diagnosis environment.
      # Committing the tail of the output back to the repo makes the real
      # error readable via git. Remove once the batch is confirmed working.
      - name: Commit evaluator output for diagnosis
        if: always()
        run: |
          set -e
          mkdir -p .github/diagnostics
          tail -c 6000 /tmp/evaluator_output.txt > .github/diagnostics/last-evaluator-output.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/last-evaluator-output.txt
          git commit -m "chore: record evaluator diagnostic output [skip ci]" || exit 0
          git push
