      - 'data/tafsir/staging/ibn-kathir-108-i05-adjacent-coverage-ledger-2026-10-23.json'
      - '.github/workflows/tafsir-108-ibn-kathir-i05-r01.yml'
permissions:
  contents: read
concurrency:
  group: tafsir-108-i05-r01-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate printed chain and nested speakers; reject unsafe mutations
        run: python scripts/validate-ibn-kathir-i05-r01.py --self-test
      - name: Validate reported attribution links and reject unsafe graphs
        run: python scripts/validate-ibn-kathir-i05-reported.py --self-test
      - name: Validate authorial clauses and reject unsafe attribution changes
        run: python scripts/validate-ibn-kathir-i05-authorial.py --self-test
      - name: Validate exact combined subset and preserve unfinished coverage
        run: python scripts/validate-ibn-kathir-i05-combined.py --self-test
      - name: Validate A01 exact clauses and source-criticism scope
        run: python scripts/validate-ibn-kathir-i05-a01.py --self-test
      - name: Validate A01 physical candidate fields and attribution links
        run: python scripts/validate-ibn-kathir-i05-a01-physical.py --self-test
      - name: Validate A02 al-Baqir attribution and opening-prayer scope
        run: python scripts/validate-ibn-kathir-i05-a02.py --self-test
      - name: Validate A03 bounded draft and mandatory anonymous voice hold
        run: python scripts/validate-ibn-kathir-i05-a03.py --self-test
      - name: Validate A04 Ata attribution and mandatory unresolved gloss hold
        run: python scripts/validate-ibn-kathir-i05-a04.py --self-test
      - name: Validate R02 reporting scope and mandatory dependency hold
        run: python scripts/validate-ibn-kathir-i05-r02.py --self-test
      - name: Validate P01 preference and mandatory bracket provenance hold
        run: python scripts/validate-ibn-kathir-i05-p01.py --self-test
      - name: Confirm read-only validation
        run: git diff --exit-code
