permissions:
  contents: read
concurrency:
  group: tafsir-108-i05-r01-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate printed chain and nested speakers; reject unsafe mutations
        run: python scripts/validate-ibn-kathir-i05-r01.py --self-test
      - name: Validate reported attribution links and reject unsafe graphs
        run: python scripts/validate-ibn-kathir-i05-reported.py --self-test
      - name: Validate authorial clauses and reject unsafe attribution changes
        run: python scripts/validate-ibn-kathir-i05-authorial.py --self-test
      - name: Validate exact combined subset and preserve unfinished coverage
        run: python scripts/validate-ibn-kathir-i05-combined.py --self-test
      - name: Validate A01 exact clauses and source-criticism scope
        run: python scripts/validate-ibn-kathir-i05-a01.py --self-test
      - name: Validate A01 physical candidate fields and attribution links
        run: python scripts/validate-ibn-kathir-i05-a01-physical.py --self-test
      - name: Validate A02 al-Baqir attribution and opening-prayer scope
        run: python scripts/validate-ibn-kathir-i05-a02.py --self-test
      - name: Validate A03 bounded draft and mandatory anonymous voice hold
        run: python scripts/validate-ibn-kathir-i05-a03.py --self-test
      - name: Validate A04 Ata attribution and mandatory unresolved gloss hold
        run: python scripts/validate-ibn-kathir-i05-a04.py --self-test
      - name: Validate R02 reporting scope and mandatory dependency hold
        run: python scripts/validate-ibn-kathir-i05-r02.py --self-test
      - name: Validate P01 preference and mandatory bracket provenance hold
        run: python scripts/validate-ibn-kathir-i05-p01.py --self-test
      - name: Validate R03 alternating voices and mandatory narrative hold
        run: python scripts/validate-ibn-kathir-i05-r03.py --self-test
      - name: Validate Q01 nested Ibn Jarir quotation and scope
        run: python scripts/validate-ibn-kathir-i05-q01.py --self-test
      - name: Validate P02 authorial comments and predecessor attribution limits
        run: python scripts/validate-ibn-kathir-i05-p02.py --self-test
      - name: Validate R01 bounded dialogue and mandatory route and narrative holds
        run: python scripts/validate-ibn-kathir-i05-r01-bounded.py --self-test
      - name: Validate R01 narrative attribution and reject unsafe completion
        run: python scripts/validate-ibn-kathir-i05-r01-narrative.py --self-test
      - name: Validate pinned R01 coordinated union and retained holds
        run: python scripts/validate-ibn-kathir-i05-r01-preview.py
      - name: Validate R01 printed-chain routes and reject unsafe attribution
        run: python scripts/validate-ibn-kathir-i05-r01-routes.py
      - name: Validate exact R01 proposition and route integration
        run: python scripts/validate-ibn-kathir-i05-r01-with-routes.py
      - name: Validate R03 reported Eid sequence and retained narrative hold
        run: python scripts/validate-ibn-kathir-i05-r03-sequence.py
      - name: Validate exact six-unit R03 dialogue and action union
        run: python scripts/validate-ibn-kathir-i05-r03-preview.py
      - name: Validate A04 exact gloss and unresolved attribution
        run: python scripts/validate-ibn-kathir-i05-a04-gloss.py
      - name: Validate P01 captured brackets and unresolved provenance
        run: python scripts/validate-ibn-kathir-i05-p01-bracket.py
      - name: Validate R02 pinned dependency and reject unprinted chain expansion
        run: python scripts/validate-ibn-kathir-i05-r02-dependency.py
      - name: Validate R02 separate citation and retained dependency limits
        run: python scripts/validate-ibn-kathir-i05-r02-citation.py
      - name: Validate R02 evidence projection and retained provenance holds
        run: python scripts/validate-ibn-kathir-i05-r02-projection.py
      - name: Validate exact R02 compiler and citation union with retained holds
        run: python scripts/validate-ibn-kathir-i05-r02-preview.py
      - name: Validate held I05 union and exact uncertain annotations
        run: python scripts/validate-ibn-kathir-i05-held-assembly.py
      - name: Confirm read-only validation
        run: git diff --exit-code
