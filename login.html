<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Quran Hikma</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Georgia, "Times New Roman", serif; background: #14110e; color: #f3ead8; }
    main { width: min(460px, calc(100% - 32px)); background: #1d1914; border: 1px solid #3d3428;
      border-radius: 14px; padding: 28px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    h1 { font-size: 1.45rem; margin: 0 0 6px; }
    p { color: #cbbfa8; line-height: 1.45; }
    label { display: block; font-size: .85rem; margin: 12px 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 8px;
      border: 1px solid #5a4d3b; background: #100e0c; color: #f3ead8; font-size: 1rem; }
    .row { display: flex; gap: 8px; margin-top: 16px; }
    button { flex: 1; padding: 11px 12px; border-radius: 8px; border: 0; cursor: pointer; font-weight: 600; }
    #signup { background: #c4a46a; color: #1a140c; }
    #signin { background: transparent; color: #f3ead8; border: 1px solid #5a4d3b; }
    #msg { min-height: 1.2em; margin-top: 14px; }
    a { color: #e2c98a; }
    .fine { font-size: .8rem; color: #a89880; }
  </style>
</head>
<body>
  <main>
    <h1>Quran Hikma</h1>
    <p>The email is the username. First name, last name, city, and country are required so a later donation form can be filled from the account.</p>
    <form id="auth">
      <label for="email">Email, used as the username</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="first">First name</label>
      <input id="first" autocomplete="given-name" required>
      <label for="last">Last name</label>
      <input id="last" autocomplete="family-name" required>
      <label for="city">City</label>
      <input id="city" autocomplete="address-level2" required>
      <label for="country">Country</label>
      <input id="country" autocomplete="country-name" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <div class="row">
        <button id="signup" type="button">Create account</button>
        <button id="signin" type="button">Sign in</button>
      </div>
    </form>
    <p id="msg" role="status"></p>
    <p class="fine"><a href="/">Back to the Quran</a></p>
  </main>
  <script>
    const SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
    const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
    const sb = window.supabase.createClient(SB_URL, SB_ANON);
    const msg = document.getElementById('msg');
    const val = id => document.getElementById(id).value.trim();

    document.getElementById('signup').onclick = async () => {
      if (!val('first') || !val('last') || !val('city') || !val('country')) {
        msg.textContent = 'First name, last name, city, and country are required.';
        return;
      }
      msg.textContent = 'Sending confirmation email…';
      const profile = { username: val('email'), first_name: val('first'), last_name: val('last'), city: val('city'), country: val('country') };
      const { error } = await sb.auth.signUp({
        email: val('email'),
        password: document.getElementById('password').value,
        options: { emailRedirectTo: location.origin + '/login.html', data: profile }
      });
      if (!error) localStorage.setItem('qh_donor_profile', JSON.stringify(profile));
      msg.textContent = error ? error.message : 'Check your email and open the confirmation link, then sign in here.';
    };

    document.getElementById('signin').onclick = async () => {
      msg.textContent = 'Signing in…';
      const { data, error } = await sb.auth.signInWithPassword({ email: val('email'), password: document.getElementById('password').value });
      if (error) { msg.textContent = error.message; return; }
      msg.textContent = 'Signed in as ' + data.user.email + '.';
    };
  </script>
</body>
</html>
