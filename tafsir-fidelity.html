<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tafsir Fidelity Evaluations — Quran Hikma</title><style>body{margin:0;background:#f6f1e4;color:#1a1a1a;font-family:Georgia,'Times New Roman',serif}.wrap{max-width:1000px;margin:auto;padding:24px}.top,.head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.back,.source-link{color:#8a6a17;font-weight:700}.back{text-decoration:none}.title{margin:8px 0 4px;font-size:32px}.sub{color:#665b48;line-height:1.5;margin-bottom:18px}.stats,.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.stat,.card{background:#fff;border:1px solid #d6c9a6;border-radius:10px}.stat{padding:10px 14px;font-weight:700}.controls input,.controls select{padding:11px 12px;border:1px solid #cbbd99;border-radius:8px;background:#fff;font-size:15px}.controls input{flex:1;min-width:220px}.card{padding:16px;margin:12px 0}.ref{font-size:20px;font-weight:700}.score,.evidence-status{font-weight:800;border-radius:18px;padding:5px 10px}.good{background:#e8f5e9;color:#236b27}.mid{background:#fff3e0;color:#a04b00}.low,.missing{background:#ffebee;color:#a51d2a}.row{margin-top:11px;line-height:1.55}.label{font-weight:700;color:#8a6a17}.empty,.loading{padding:30px;text-align:center;color:#6c6252}.detail{margin-top:10px;border-top:1px solid #eee;padding-top:10px}details summary{cursor:pointer;font-weight:700;color:#4b3d22}.evidence{margin-top:14px;padding:12px;background:#faf7ef;border-left:4px solid #c5a75b;border-radius:6px}.arabic{font-size:18px;line-height:1.9;direction:rtl;text-align:right}.english{line-height:1.65}.source-link{display:inline-block;margin-top:12px;padding:7px 10px;border:1px solid #cbbd99;border-radius:8px;text-decoration:none;background:#fff}@media(max-width:600px){.wrap{padding:15px}.title{font-size:26px}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="/">← Quran Hikma</a><strong>Public Research Record</strong></div><h1 class="title">Ibn Kathir Tafsir Translation Fidelity</h1><div class="sub">Saved Arabic ↔ English fidelity evaluations. Evidence completeness is shown separately from the fidelity score so unsupported records are immediately visible.</div><div class="stats"><div class="stat" id="count">Loading…</div><div class="stat" id="avg"></div><div class="stat" id="evidenceCount"></div></div><div class="controls"><input id="search" placeholder="Search verse, verdict, source text, omission, mistranslation…"><select id="filter"><option value="all">All scores</option><option value="reliable">8–10 Reliable</option><option value="moderate">6–7.9 Moderate</option><option value="low">0–5.9 Low</option><option value="missingEvidence">Missing source evidence</option></select></div><div id="results" class="loading">Loading saved evaluations…</div></div><script>
const SUPABASE_URL='https://ylosytbxpzxzwfzjpaej.supabase.co',SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiJ9.invalid';
// Use the site's existing public anon key when available; fallback is replaced below from the deployed public configuration.
const KEY=(window.SUPABASE_ANON_KEY||window.SUPABASE_KEY||'');let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const complete=r=>!!(String(r.arabic_excerpt||'').trim()&&String(r.english_excerpt||'').trim());function scoreClass(s){return s>=8?'good':s>=6?'mid':'low'}
function show(){const q=document.getElementById('search').value.trim().toLowerCase(),f=document.getElementById('filter').value;const filtered=rows.filter(r=>{const s=Number(r.accuracy_score);if(f==='reliable'&&s<8)return false;if(f==='moderate'&&(s<6||s>=8))return false;if(f==='low'&&s>=6)return false;if(f==='missingEvidence'&&complete(r))return false;if(!q)return true;return[r.sura+':'+r.aya,r.verdict,r.accurate_portions,r.omitted_content,r.mistranslated_sections,r.theological_concerns,r.arabic_excerpt,r.english_excerpt].join(' ').toLowerCase().includes(q)});const box=document.getElementById('results');if(!filtered.length){box.className='empty';box.textContent='No matching saved evaluations.';return}box.className='';box.innerHTML=filtered.map(r=>`<article class="card"><div class="head"><div class="ref">Qur'an ${esc(r.sura)}:${esc(r.aya)} · Ibn Kathir</div><div><span class="evidence-status ${complete(r)?'good':'missing'}">${complete(r)?'Evidence ✓':'Evidence missing'}</span> <span class="score ${scoreClass(Number(r.accuracy_score))}">${esc(r.accuracy_score)}/10</span></div></div><div class="row"><span class="label">Verdict:</span> ${esc(r.verdict||'—')}</div><details class="detail"><summary>View evidence & full fidelity analysis</summary><div class="evidence"><div class="label">Stored Arabic source excerpt</div><div class="arabic" lang="ar">${esc(r.arabic_excerpt||'Source excerpt not stored for this evaluation.')}</div></div><div class="evidence"><div class="label">Stored English source excerpt</div><div class="english">${esc(r.english_excerpt||'Source excerpt not stored for this evaluation.')}</div></div><a class="source-link" href="/?sura=${encodeURIComponent(r.sura)}&aya=${encodeURIComponent(r.aya)}">Open verse in Quran Hikma</a><div class="row"><span class="label">Accurately translated:</span> ${esc(r.accurate_portions||'—')}</div><div class="row"><span class="label">Omitted from English:</span> ${esc(r.omitted_content||'—')}</div><div class="row"><span class="label">Mistranslated / changed meaning:</span> ${esc(r.mistranslated_sections||'—')}</div><div class="row"><span class="label">Semantic / theological wording concerns:</span> ${esc(r.theological_concerns||'—')}</div></details></article>`).join('')}
async function load(){try{const publicKey='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';const p=new URLSearchParams({scholar_key:'eq.ibn_kathir',select:'sura,aya,accuracy_score,accurate_portions,omitted_content,mistranslated_sections,theological_concerns,verdict,arabic_excerpt,english_excerpt',order:'sura.asc,aya.asc',limit:'10000'});const res=await fetch(`${SUPABASE_URL}/rest/v1/tafsir_accuracy_analysis?${p}`,{headers:{apikey:publicKey,Authorization:'Bearer '+publicKey}});if(!res.ok)throw new Error('Database returned '+res.status);rows=await res.json();const nums=rows.map(r=>Number(r.accuracy_score)).filter(Number.isFinite),withEvidence=rows.filter(complete).length;document.getElementById('count').textContent=rows.length+' saved evaluations';document.getElementById('avg').textContent=nums.length?'Average '+(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2)+'/10':'';document.getElementById('evidenceCount').textContent=withEvidence+'/'+rows.length+' with Arabic + English evidence';show()}catch(e){document.getElementById('results').className='empty';document.getElementById('results').textContent='Unable to load saved evaluations: '+e.message;document.getElementById('count').textContent='Unavailable'}}document.getElementById('search').addEventListener('input',show);document.getElementById('filter').addEventListener('change',show);load();
</script></body></html>
