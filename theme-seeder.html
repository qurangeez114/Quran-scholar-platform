<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme Analysis Seeder</title>
<style>
  body{font-family:system-ui,sans-serif;background:#12100C;color:#EDE3C8;margin:0;padding:16px;}
  h1{font-size:18px;color:#D9B24A;margin-bottom:12px;}
  .card{background:#1E1A12;border:1px solid #3A3222;border-radius:12px;padding:16px;margin-bottom:14px;}
  input[type=text]{width:100%;box-sizing:border-box;background:#0C0A07;border:1px solid #5A4A22;border-radius:8px;color:#EDE3C8;padding:10px;font-size:14px;margin-bottom:10px;}
  button{background:#B8902A;color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;margin-right:8px;}
  button:disabled{opacity:.5;}
  .btn-stop{background:#7A2A2A;}
  .bar{height:14px;background:#2A2418;border-radius:8px;overflow:hidden;margin:10px 0;}
  .fill{height:100%;background:#D9B24A;width:0%;transition:width .3s;}
  #log{font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:55vh;overflow:auto;background:#0C0A07;border-radius:8px;padding:10px;margin-top:10px;}
  .stat{display:inline-block;margin-right:16px;font-size:13px;}
  .stat b{color:#D9B24A;font-size:18px;}
  .hint{font-size:11px;color:#7A6A4A;margin-top:4px;}
</style>
</head>
<body>
<h1>🌱 Theme Analysis Seeder</h1>

<div class="card">
  <label style="font-size:13px;color:#9A8E70;">Anthropic API Key (saved for this session)</label>
  <input type="text" id="api-key" placeholder="sk-ant-api03-..." autocomplete="off"
    oninput="sessionStorage.setItem('sk',this.value.trim())">
  <p class="hint">Enter once — saved for the whole session. Cleared when you close the tab.</p>
</div>

<div class="card">
  <div class="stat">Done: <b id="s-done">0</b></div>
  <div class="stat">Skipped: <b id="s-skip">0</b></div>
  <div class="stat">Failed: <b id="s-fail">0</b></div>
  <div class="stat">Total: <b id="s-total">0</b></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <button id="btn-start" onclick="run()">🚀 Seed ALL Theme Analyses</button>
  <button class="btn-stop" onclick="STOP=true">■ Stop</button>
  <p class="hint">Resumable — already-seeded themes are skipped. Safe to stop and re-run. Leave the tab open while running.</p>
</div>
<div id="log"></div>

<script>
// Restore key from session on load
window.addEventListener('load', () => {
  const saved = sessionStorage.getItem('sk');
  if (saved) document.getElementById('api-key').value = saved;
});

const SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
const HDR = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
let STOP = false;

const log = (m) => { const el=document.getElementById('log'); el.textContent += m + '\n'; el.scrollTop=el.scrollHeight; };
const setStat = (id,v) => document.getElementById(id).textContent = v;

async function sbGet(path) {
  const r = await fetch(SB_URL + '/rest/v1/' + path, { headers: HDR });
  return r.ok ? await r.json() : [];
}

async function getThemes() {
  // Uses a DB function to get all 444 distinct themes, bypassing Supabase's 1000-row limit
  const r = await fetch(SB_URL + '/rest/v1/rpc/get_all_themes', {
    method: 'POST', headers: HDR, body: JSON.stringify({})
  });
  const rows = r.ok ? await r.json() : [];
  return rows.map(r => r.theme);
}

async function alreadyDone(theme) {
  const rows = await sbGet('theme_analysis?theme=eq.' + encodeURIComponent(theme) + '&select=internal_comparison');
  return rows[0] && rows[0].internal_comparison;
}

async function getVerses(theme) {
  return await sbGet('theme_verses?theme=eq.' + encodeURIComponent(theme) + '&select=sura,aya,english&order=sura,aya&limit=12');
}

function buildPrompt(theme, verses) {
  const list = verses.map(v => v.sura+':'+v.aya+' — '+(v.english||'').slice(0,80)).join('\n');
  return `You are a critical Quranic scholar. The theme "${theme}" appears across multiple suras.\n\nVerses:\n${list}\n\nReturn ONLY a valid JSON object (no markdown):\n{"suras":["Sura X"],"score":0-100,"score_reason":"2 sentences","beats":[{"beat":"narrative beat","entries":[{"verse":"sura:aya","sura_label":"Sura X","text":"key phrase max 80 chars","grade":"SAME|SIMILAR|TENSION|UNIQUE|ABSENT","note":"max 100 chars"}],"verdict":"SAME|COMPATIBLE|TENSION|CONTRADICTION","verdict_note":"max 150 chars"}],"tensions":[{"title":"name","grade":"GENUINE|APPARENT|MINOR","detail":"max 200 chars"}]}\nCover 4-8 major beats. Be scholarly and honest.`;
}

async function callAI(apiKey, prompt) {
  // Direct API call — no proxy needed
  const key = apiKey || sessionStorage.getItem('sk') || '';
  if (!key) throw new Error('No API key — enter your sk-ant-... key above');
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 3000,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err?.error?.message || 'API error ' + resp.status);
  }
  const data = await resp.json();
  let raw = data?.content?.[0]?.text || '';
  raw = raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
  return JSON.parse(raw);
}

async function save(theme, parsed) {
  const check = await sbGet('theme_analysis?theme=eq.' + encodeURIComponent(theme) + '&select=id');
  const payload = { internal_comparison: parsed, internal_consistency_score: parsed.score };
  if (check.length) {
    await fetch(SB_URL + '/rest/v1/theme_analysis?theme=eq.' + encodeURIComponent(theme), {
      method: 'PATCH', headers: { ...HDR, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ ...payload, updated_at: new Date().toISOString() })
    });
  } else {
    await fetch(SB_URL + '/rest/v1/theme_analysis', {
      method: 'POST', headers: { ...HDR, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ theme, ...payload })
    });
  }
}

async function run() {
  const apiKey = document.getElementById('api-key').value.trim();
  if (apiKey) sessionStorage.setItem('sk', apiKey);
  const effectiveKey = apiKey || sessionStorage.getItem('sk') || '';
  if (!effectiveKey) {
    alert('Please enter your Anthropic API key (sk-ant-...) above');
    return;
  }
  STOP = false;
  document.getElementById('btn-start').disabled = true;
  let done=0, skip=0, fail=0;
  log('Loading theme list...');
  const themes = await getThemes();
  setStat('s-total', themes.length);
  log('Found ' + themes.length + ' themes. Starting (biggest first)...\n');

  for (let i=0; i<themes.length; i++) {
    if (STOP) { log('\n■ Stopped at ' + i + '/' + themes.length); break; }
    const theme = themes[i];
    try {
      if (await alreadyDone(theme)) {
        skip++; setStat('s-skip', skip);
        log('⏭  [' + (i+1) + '] ' + theme + ' — already done');
      } else {
        const verses = await getVerses(theme);
        if (!verses.length) { skip++; setStat('s-skip', skip); log('⏭  [' + (i+1) + '] ' + theme + ' — no verses'); continue; }
        const parsed = await callAI(effectiveKey, buildPrompt(theme, verses));
        await save(theme, parsed);
        done++; setStat('s-done', done);
        log('✅ [' + (i+1) + '] ' + theme + ' — score ' + parsed.score);
      }
    } catch(e) {
      fail++; setStat('s-fail', fail);
      log('❌ [' + (i+1) + '] ' + theme + ' — ' + e.message);
    }
    document.getElementById('fill').style.width = (((i+1)/themes.length)*100).toFixed(1) + '%';
    await new Promise(r => setTimeout(r, 300));
  }
  log('\n🎉 Done. ✅' + done + ' ⏭' + skip + ' ❌' + fail);
  document.getElementById('btn-start').disabled = false;
}
</script>
</body>
</html>
