<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature &amp; Creation Claims — Quran Hikma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'EB Garamond','Georgia',serif; background:#FDFAF4; color:#1A1A1A; }
  .topbar { position:sticky; top:0; z-index:200; background:#FDF8EE; border-bottom:2px solid #E8C97B;
            padding:10px 14px; display:flex; align-items:center; gap:10px; }
  .topbar h1 { font-size:15px; margin:0; color:#B8902A; font-weight:700; flex:1; }
  .btn-outline { padding:6px 12px; background:#FDF8EE; color:#B8902A; border:1.5px solid #B8902A;
                 border-radius:16px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; text-decoration:none; }
  .searchbar { padding:10px 14px; background:#fff; border-bottom:1px solid #E8D8A0; }
  .searchbar input { width:100%; padding:9px 12px; border:1px solid #D8C79A; border-radius:20px; font-family:inherit; font-size:14px; }
  .filter-group { border-bottom:1px solid #E8D8A0; background:#fff; }
  .filter-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#B0A480; padding:8px 14px 2px; }
  .filters { display:flex; gap:6px; overflow-x:auto; padding:4px 14px 10px; }
  .filters::-webkit-scrollbar { display:none; }
  .chip { flex-shrink:0; padding:5px 12px; border-radius:14px; font-size:12px; font-weight:600; border:1.5px solid #D8C79A;
          background:#fff; color:#6B5B3A; cursor:pointer; white-space:nowrap; }
  .chip.active { background:#B8902A; border-color:#B8902A; color:#fff; }
  .count { padding:8px 14px; font-size:12px; color:#9C8354; display:flex; justify-content:space-between; align-items:center; }
  .clear-btn { font-size:11px; color:#B8902A; font-weight:700; cursor:pointer; text-decoration:underline; }
  .list { padding:0 14px 20px; }
  .card { background:#fff; border:1px solid #E8D8A0; border-radius:10px; padding:12px; margin-bottom:10px; }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
  .badge { border-radius:999px; padding:2px 9px; font-size:10.5px; font-weight:700; white-space:nowrap; }
  .badge-source { background:#EFE7D0; color:#8C7A52; }
  .badge-verified { background:#DCEFE0; color:#2E7D46; }
  .badge-unverified { background:#F0EAD8; color:#9C8354; }
  .badge-conflict { background:#FBE3D3; color:#C0682E; }
  .claim-title { font-size:15px; font-weight:600; margin:0 0 4px; }
  .claim-summary { font-size:13.5px; color:#3A3226; line-height:1.5; margin-bottom:8px; }
  .meta-row { display:flex; flex-wrap:wrap; gap:5px; font-size:11px; }
  .tag { border:1px solid #D8C79A; color:#8C7A52; border-radius:6px; padding:1px 8px; }
  .tag-claimtype { border-color:#B8902A; color:#B8902A; font-weight:600; }
  .ref { font-size:11.5px; color:#9C8354; margin-top:6px; font-style:italic; }
  .notes-toggle { font-size:11px; color:#B8902A; font-weight:700; cursor:pointer; margin-top:6px; display:inline-block; }
  .notes-body { font-size:12px; color:#6B5B3A; line-height:1.5; margin-top:6px; padding-top:6px; border-top:1px dashed #E8D8A0; display:none; }
  .notes-body.open { display:block; }
  .status { padding:30px 14px; text-align:center; color:#9C8354; font-size:13px; }
  .empty { border:1px dashed #D8C79A; border-radius:10px; padding:24px; text-align:center; color:#9C8354; font-size:13px; margin:14px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="btn-outline">&larr; Back</a>
  <h1>Nature &amp; Creation Claims</h1>
</div>
<div class="searchbar">
  <input id="searchInput" type="text" placeholder="Search claims, references, narrators...">
</div>

<div class="filter-group">
  <div class="filter-label">Source</div>
  <div class="filters" id="typeFilters"></div>
</div>
<div class="filter-group">
  <div class="filter-label">Domain</div>
  <div class="filters" id="domainFilters"></div>
</div>
<div class="filter-group">
  <div class="filter-label">Claim type</div>
  <div class="filters" id="claimTypeFilters"></div>
</div>
<div class="filter-group">
  <div class="filter-label">Verification</div>
  <div class="filters" id="statusFilters"></div>
</div>

<div class="count">
  <span id="countLabel"></span>
  <span class="clear-btn" id="clearBtn" style="display:none">Clear filters</span>
</div>
<div class="status" id="status">Loading&hellip;</div>
<div class="list" id="list" style="display:none"></div>

<script>
const SUPABASE_URL = "https://ylosytbxpzxzwfzjpaej.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs";

let allClaims = [];
let active = { type: "All", domain: "All", claimType: "All", status: "All" };

async function load() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/creation_behavior_claims?select=*&order=id.asc`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  allClaims = await res.json();
  document.getElementById('status').style.display = 'none';
  document.getElementById('list').style.display = 'block';
  buildFilters();
  render();
}

// Broad claim-type buckets, since raw claim_type values are free-text and quite varied.
// This groups them into a manageable filter set rather than showing 30+ raw strings.
// Best-effort: parse a free-text reference string and build a real link to
// sunnah.com (hadith) or quran.com (verses). Falls back to a sunnah.com search
// link if no specific collection+number is recognized.
function buildSourceLink(sourceType, reference) {
  if (!reference) return null;
  const ref = reference;

  if (sourceType === 'Quran') {
    const m = ref.match(/(\d{1,3}):(\d{1,3})/);
    if (m) return `https://quran.com/${m[1]}/${m[2]}`;
    return null;
  }

  const collections = [
    { pat: /Bukhari/i, slug: 'bukhari' },
    { pat: /Muslim/i, slug: 'muslim' },
    { pat: /Tirmidhi/i, slug: 'tirmidhi' },
    { pat: /Abu\s*Dawud/i, slug: 'abudawud' },
    { pat: /Ibn\s*Majah/i, slug: 'ibnmajah' },
    { pat: /Nasa/i, slug: 'nasai' },
  ];
  for (const c of collections) {
    if (c.pat.test(ref)) {
      const numMatch = ref.match(new RegExp(c.pat.source + '[^\\d]*(\\d+)', 'i'));
      if (numMatch) return `https://sunnah.com/${c.slug}:${numMatch[1]}`;
      return `https://sunnah.com/${c.slug}`;
    }
  }
  // Ahmad/Musnad and anything else: no reliable direct-number URL scheme, so
  // link to a search rather than guessing wrong.
  return `https://sunnah.com/search?q=${encodeURIComponent(ref)}`;
}

function claimTypeBucket(ct) {
  if (!ct) return "Other";
  const s = ct.toLowerCase();
  if (s.includes('isra') || s.includes('athar') || s.includes('narrative expansion')) return "Athar / Isra'iliyyat";
  if (s.includes('personified')) return "Personified scripture";
  if (s.includes('prophecy')) return "Prophecy / End-times";
  if (s.includes('miracle')) return "Miracle claim";
  if (s.includes('counterfactual')) return "Counterfactual claim";
  if (s.includes('testif') || s.includes('body-part')) return "Testimony claim";
  if (s.includes('punishment') || s.includes('reward')) return "Punishment / Reward";
  if (s.includes('object') || s.includes('animal') || s.includes('speak')) return "Speaking entity";
  return "Other";
}

function buildFilters() {
  const types = ["All", ...new Set(allClaims.map(c => c.source_type))];
  const domains = ["All", ...new Set(allClaims.map(c => c.domain).filter(Boolean))];
  const claimTypes = ["All", ...new Set(allClaims.map(c => claimTypeBucket(c.claim_type)))];
  const statuses = ["All", "verified", "unverified", "disputed_reference"];
  const statusLabels = { All: "All", verified: "Verified", unverified: "Unverified", disputed_reference: "Conflicting" };

  document.getElementById('typeFilters').innerHTML = types.map(t =>
    `<button class="chip ${t === active.type ? 'active' : ''}" data-kind="type" data-val="${t}">${t}</button>`
  ).join('');
  document.getElementById('domainFilters').innerHTML = domains.map(d =>
    `<button class="chip ${d === active.domain ? 'active' : ''}" data-kind="domain" data-val="${d}">${d}</button>`
  ).join('');
  document.getElementById('claimTypeFilters').innerHTML = claimTypes.map(c =>
    `<button class="chip ${c === active.claimType ? 'active' : ''}" data-kind="claimType" data-val="${c}">${c}</button>`
  ).join('');
  document.getElementById('statusFilters').innerHTML = statuses.map(s =>
    `<button class="chip ${s === active.status ? 'active' : ''}" data-kind="status" data-val="${s}">${statusLabels[s]}</button>`
  ).join('');

  document.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      active[btn.dataset.kind] = btn.dataset.val;
      buildFilters();
      render();
    });
  });

  const anyActive = Object.values(active).some(v => v !== "All");
  document.getElementById('clearBtn').style.display = anyActive ? 'inline' : 'none';
}

function clearFilters() {
  active = { type: "All", domain: "All", claimType: "All", status: "All" };
  document.getElementById('searchInput').value = '';
  buildFilters();
  render();
}

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allClaims.filter(c => {
    if (active.type !== "All" && c.source_type !== active.type) return false;
    if (active.domain !== "All" && c.domain !== active.domain) return false;
    if (active.claimType !== "All" && claimTypeBucket(c.claim_type) !== active.claimType) return false;
    if (active.status !== "All" && c.verification_status !== active.status) return false;
    if (q) {
      const hay = `${c.claim} ${c.reference} ${c.summary} ${c.claim_type||''} ${c.source_collection||''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('countLabel').textContent = `${filtered.length} of ${allClaims.length} claims`;

  const list = document.getElementById('list');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">No claims match these filters.</div>';
    return;
  }

  const statusBadge = (s) => {
    if (s === 'verified') return '<span class="badge badge-verified">Verified</span>';
    if (s === 'disputed_reference') return '<span class="badge badge-conflict">Conflicting sources</span>';
    return '<span class="badge badge-unverified">Unverified</span>';
  };

  list.innerHTML = filtered.map((c, i) => `
    <div class="card">
      <div class="card-top">
        <span class="badge badge-source">${c.source_type}</span>
        ${statusBadge(c.verification_status)}
      </div>
      <div class="claim-title">${c.claim}</div>
      <div class="claim-summary">${c.summary}</div>
      <div class="meta-row">
        ${c.domain ? `<span class="tag">${c.domain}</span>` : ''}
        ${c.subdomain ? `<span class="tag">${c.subdomain}</span>` : ''}
        ${c.claim_type ? `<span class="tag tag-claimtype">${c.claim_type}</span>` : ''}
        ${(c.behavior_tags || []).map(b => `<span class="tag">${b}</span>`).join('')}
      </div>
      ${c.speaker ? `<div class="ref" style="font-style:normal;color:#6B5B3A;font-weight:600;">${c.speaker}</div>` : ''}
      <div class="ref">
        ${c.source_collection ? c.source_collection + ' &middot; ' : ''}${
          (() => {
            const link = buildSourceLink(c.source_type, c.reference);
            return link ? `<a href="${link}" target="_blank" rel="noopener" style="color:#B8902A;text-decoration:underline;">${c.reference}</a>` : c.reference;
          })()
        }${c.hadith_grade ? ' &middot; ' + c.hadith_grade : ''}
      </div>
      ${c.notes ? `
        <div class="notes-toggle" data-idx="${i}">Notes &darr;</div>
        <div class="notes-body" id="notes-${i}">${c.notes}</div>
      ` : ''}
    </div>
  `).join('');

  document.querySelectorAll('.notes-toggle').forEach(el => {
    el.addEventListener('click', () => {
      const body = document.getElementById('notes-' + el.dataset.idx);
      body.classList.toggle('open');
      el.textContent = body.classList.contains('open') ? 'Notes ↑' : 'Notes ↓';
    });
  });
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('clearBtn').addEventListener('click', clearFilters);
load().catch(err => {
  document.getElementById('status').textContent = 'Failed to load: ' + err.message;
});
</script>
</body>
</html>
