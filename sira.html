  var SB_URL = 'https://ylosytbxpzxzwfzjpaej.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs';
  var HDRS   = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

  function sbGet(table, params) {
    var url = new URL(SB_URL + '/rest/v1/' + table);
    Object.entries(params).forEach(function(kv){ url.searchParams.set(kv[0], kv[1]); });
    return fetch(url.toString(), { headers: HDRS })
      .then(function(r){ return r.ok ? r.json() : []; })
      .catch(function(){ return []; });
  }

  /* ── Navigate with back-stack ── */
  function xnavGo(url, fromLabel, fromIcon) {
    try {
      var stack = JSON.parse(sessionStorage.getItem('qnav_stack') || '[]');
      stack.push({ url: window.location.href, label: fromLabel, icon: fromIcon, scrollY: window.scrollY });
      sessionStorage.setItem('qnav_stack', JSON.stringify(stack));
      localStorage.setItem('qnav_restore_scroll', JSON.stringify(window.scrollY));
    } catch(e) {}
    window.location.href = url;
  }

  /* ── Build chips HTML ── */
  function chip(cls, icon, label, url, fromLabel, fromIcon) {
    return '<a class="xweb-chip ' + cls + '" href="' + url + '" '
      + 'onclick="event.preventDefault();xnavGo('' + url.replace(/'/g,"\'") + '',''
      + (fromLabel||'').replace(/'/g,"\'") + '','' + (fromIcon||'').replace(/'/g,"\'") + '')">'
      + icon + ' ' + label + '</a>';
  }

  /* ══ MAIN: build cross-web for a sura:aya pair ══
     Returns HTML string of chips.
     currentPage: 'index'|'research'|'sira'|'madhhab'
     context: { sura, aya, eventId, topicId, q }
  */
  W.xwebBuild = async function(container, currentPage, context) {
    var sura    = context.sura;
    var aya     = context.aya;
    var eventId = context.eventId;
    var topicQ  = context.topicQ;
    var q       = context.q || '';
    var fromLabel = context.fromLabel || '';
    var fromIcon  = context.fromIcon  || '';

    var chips = [];

    /* 1. Quran verse link (from any page that has sura+aya) */
    if (currentPage !== 'index' && sura) {
      var verseUrl = 'index.html?sura=' + sura + (aya ? '&aya=' + aya : '') + '&from=' + currentPage;
      chips.push(chip('xweb-quran', '📖', (aya ? sura+':'+aya : 'Sura '+sura), verseUrl, fromLabel, fromIcon));
    }

    /* 2. Research link (search by verse ref or topic) */
    if (currentPage !== 'research') {
      var rq = aya ? sura+':'+aya : (q || topicQ || '');
      if (rq) {
        var rUrl = 'research.html?q=' + encodeURIComponent(rq) + '&from=' + currentPage;
        chips.push(chip('xweb-research', '🔬', 'Research "'+rq+'"', rUrl, fromLabel, fromIcon));
      }
    }

    /* 3. Sīra link — find events mentioning this sura:aya */
    if (currentPage !== 'sira' && sura) {
      var ref = sura + (aya ? ':'+aya : '');
      var siraRows = await sbGet('sira_events', {
        select: 'id,title_en',
        or: '(quran_verses.ilike.*' + ref + '*,hadith_ref.ilike.*' + ref + '*,tafsir_ref.ilike.*' + ref + '*)',
        limit: 3
      });
      siraRows.forEach(function(ev) {
        var sUrl = 'sira.html?event=' + encodeURIComponent(ev.id) + '&from=' + currentPage;
        chips.push(chip('xweb-sira', '📜', ev.title_en.substring(0,28), sUrl, fromLabel, fromIcon));
      });
    }

    /* 4. Madhhab — search by verse ref, topic keyword, or inferred category */
    if (currentPage !== 'madhhab') {
      var mRef = sura ? (sura + (aya?':'+aya:'')) : '';
      var mSearch = mRef || topicQ || q;
      var mRows = [];
      if (mSearch) {
        mRows = await sbGet('madhhab_topics', {
          select: 'id,topic,category',
          or: '(topic.ilike.*' + encodeURIComponent(mSearch) + '*,brief_description.ilike.*' + encodeURIComponent(mSearch) + '*,subcategory.ilike.*' + encodeURIComponent(mSearch) + '*)',
          limit: 3
        });
        if (!mRows.length) {
          var kwMap = {
            'prayer':'Prayer and Worship','salah':'Prayer and Worship','wudu':'Purification and Ritual Purity',
            'marriage':'Marriage and Family Law','nikah':'Marriage and Family Law','divorce':'Divorce and Separation',
            'talaq':'Divorce and Separation','inherit':'Inheritance and Wills','woman':'Women','hijab':'Women: Dress',
            'slave':'Slavery','apostat':'Apostasy','jihad':'Jihad and Warfare','war':'Jihad and Warfare',
            'riba':'Banking and Riba','interest':'Banking and Riba','food':'Food and Drink','halal':'Halal and Haram',
            'music':'Music, Art, and Images','honor':'Honor and Family Violence','christian':'Christians and Jews',
            'jew':'Christians and Jews','punishment':'Hudud Punishments','gay':'LGBTQ','homosex':'LGBTQ',
            'heaven':'Eschatology','hell':'Eschatology','hadith':'Hadith Authenticity','sufi':'Sufism',
            'theology':'Theology of God','state':'State and Politics','politic':'State and Politics'
          };
          var ls = mSearch.toLowerCase();
          for (var kw in kwMap) {
            if (ls.indexOf(kw) !== -1) {
              var catRows = await sbGet('madhhab_topics', {
                select: 'id,topic,category',
                category: 'ilike.*' + encodeURIComponent(kwMap[kw]) + '*',
                limit: 3
              });
              if (catRows.length) { mRows = catRows; break; }
            }
          }
        }
      }
      mRows.forEach(function(t) {
        var mUrl = 'madhhab.html?topic=' + encodeURIComponent(t.id) + '&from=' + currentPage;
        chips.push(chip('xweb-madhhab', '⚖️', t.topic.substring(0,28), mUrl, fromLabel, fromIcon));
      });
    }

    if (!chips.length) return;

    var web = document.createElement('div');
    web.className = 'xweb';
    web.innerHTML = '<div class="xweb-label">🕸 Connected to</div>' + chips.join('');
    container.appendChild(web);
  };

  W.xnavGo = xnavGo;

})(window);
</script>

<script>
/* ═══ ACTIVITY HISTORY + FLOATING BUTTON ═══ */
(function(W) {
  var MAX = 60;

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function ago(ts){
    var s=Math.floor((Date.now()-ts)/1000);
    if(s<60) return 'just now';
    if(s<3600) return Math.floor(s/60)+'m ago';
    if(s<86400) return Math.floor(s/3600)+'h ago';
    return Math.floor(s/86400)+'d ago';
  }
  function getHist(){ try{ return JSON.parse(localStorage.getItem('qnav_hist')||'[]'); }catch(e){ return []; } }
  function saveHist(h){ try{ localStorage.setItem('qnav_hist',JSON.stringify(h)); }catch(e){} }

  /* Record a visit */
  function record(label, url, icon, sub) {
    var h = getHist().filter(function(x){ return x.url !== url; });
    h.unshift({ label: label||'Page', url: url||window.location.href, icon: icon||'📄', sub: sub||'', time: Date.now() });
    if(h.length > MAX) h = h.slice(0, MAX);
    saveHist(h);
    renderList();
    updateBadge();
  }
  W.qhistRecord = record;

  function renderList(){
    var el = document.getElementById('qhist-scroll');
    if(!el) return;
    var h = getHist();
    if(!h.length){ el.innerHTML='<div class="qhist-empty">No history yet — start exploring!</div>'; return; }
    el.innerHTML = h.map(function(item){
      return '<a class="qhist-item" href="'+esc(item.url)+'" onclick="event.preventDefault();qhistGo(''+esc(item.url)+'')">'
        +'<span class="qhist-ico">'+(item.icon||'📄')+'</span>'
        +'<span class="qhist-body">'
        +'<div class="qhist-lbl">'+esc(item.label)+'</div>'
        +'<div class="qhist-sub">'+esc(item.sub)+'</div>'
        +'</span>'
        +'<span class="qhist-ago">'+ago(item.time)+'</span>'
        +'</a>';
    }).join('');
  }

  function updateBadge(){
    var b = document.getElementById('qhist-badge');
    if(!b) return;
    var n = getHist().length;
    b.textContent = n; b.style.display = n ? 'flex' : 'none';
  }

  W.qnavToggleHist = function(){
    var d = document.getElementById('qhist-drawer');
    if(!d) return;
    d.classList.toggle('open');
    if(d.classList.contains('open')) renderList();
  };
  W.qnavClearHist = function(){
    saveHist([]); renderList(); updateBadge();
  };
  W.qhistGo = function(url){
    try{
      var stack = JSON.parse(sessionStorage.getItem('qnav_stack')||'[]');
      stack.push({ url: window.location.href, label: document.title, icon: '📄', scrollY: window.scrollY });
      sessionStorage.setItem('qnav_stack', JSON.stringify(stack));
    }catch(e){}
    window.location.href = url;
  };

  /* Inject HTML */
  function inject(){
    if(document.getElementById('qhist-btn')) return;

    var btn = document.createElement('button');
    btn.id = 'qhist-btn';
    btn.title = 'Your browsing history';
    btn.setAttribute('onclick','qnavToggleHist()');
    btn.style.position = 'relative';
    btn.innerHTML = '🕐<span id="qhist-badge" class="qhist-badge" style="position:absolute;top:-4px;right:-4px;background:#C03020;color:#fff;border-radius:10px;font-size:10px;font-weight:800;min-width:18px;height:18px;padding:0 4px;display:none;align-items:center;justify-content:center;"></span>';
    document.body.appendChild(btn);

    var drawer = document.createElement('div');
    drawer.id = 'qhist-drawer';
    drawer.innerHTML = '<div class="qhist-head"><span class="qhist-title">📖 Activity History</span><button class="qhist-clearall" onclick="qnavClearHist()">Clear all</button></div><div class="qhist-scroll" id="qhist-scroll"></div>';
    document.body.appendChild(drawer);

    document.addEventListener('click', function(e){
      var d = document.getElementById('qhist-drawer');
      var b = document.getElementById('qhist-btn');
      if(d && d.classList.contains('open') && !d.contains(e.target) && b && !b.contains(e.target))
        d.classList.remove('open');
    });

    updateBadge();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', inject);
  } else {
    inject();
  }
})(window);
</script>
