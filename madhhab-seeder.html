async function generateRuling(category, topic) {
  const prompt = `You are an Islamic scholar. Return ONLY a JSON object for the topic "${topic}" in category "${category}". No explanation, no markdown, no text before or after. Just the raw JSON object starting with { and ending with }:
{"topic":"${topic}","category":"${category}","hanafi_position":"[Hanafi ruling 1-2 sentences]","hanafi_evidence":"[evidence]","maliki_position":"[Maliki ruling]","maliki_evidence":"[evidence]","shafii_position":"[Shafii ruling]","shafii_evidence":"[evidence]","hanbali_position":"[Hanbali ruling]","hanbali_evidence":"[evidence]","jafari_position":"[Jafari/Shia ruling]","zaydi_position":"[Zaydi ruling]","ibadi_position":"[Ibadi ruling]","mutazila_position":"[Mutazila position]","salafi_position":"[Salafi position]","consensus":"[areas of agreement]","key_disagreement":"[main dispute]","practical_difference":"[real-world impact]","historical_consequences":"[persecution or conflict caused]","reformist_view":"[modern reformist view]","quran_verses":["2:190"],"hadith_refs":["relevant hadith"],"reflection_questions":["critical question?"]}`;

  let res, attempts = 0;
  while (attempts < 4) {
    attempts++;
    res = await fetch('/claude', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-haiku-4-5-20251001', max_tokens:800, messages:[{role:'user',content:prompt}]})
    });
    if (res.ok) break;
    if (res.status === 529 || res.status === 502 || res.status === 504 || res.status === 503) {
      const wait = attempts * 20000;
      log('⏳ Error '+res.status+', waiting ' + (wait/1000) + 's... (retry ' + attempts + '/4)');
      await new Promise(r => setTimeout(r, wait));
    } else { const e = await res.text(); throw new Error('Claude error '+res.status+': '+e.substring(0,100)); }
  }
  if (!res.ok) { const e = await res.text(); throw new Error('Failed after 4 attempts: '+res.status); }
  const data = await res.json();
  const raw = (data.content&&data.content[0]&&data.content[0].text)||'';
  // Strip markdown fences aggressively
  let cleaned = raw;
  cleaned = cleaned.replace(/^```json\s*/i, '').replace(/^```\s*/i, '');
  cleaned = cleaned.replace(/```\s*$/i, '').trim();
  // Find JSON object
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start === -1 || end === -1) throw new Error('No JSON in response: ' + raw.substring(0,80));
  const jsonStr = cleaned.substring(start, end + 1);
  try {
    return JSON.parse(jsonStr);
  } catch(e) {
    throw new Error('JSON parse failed: ' + e.message + ' | ' + jsonStr.substring(0,80));
  }
}

async function insertRuling(ruling) {
  const tr = await fetch(SB_URL+'/rest/v1/madhhab_topics', {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'},
    body: JSON.stringify({topic:ruling.topic, category:ruling.category, subcategory:ruling.topic})
  });
  const topics = await tr.json();
  const tid = topics[0]&&topics[0].id;
  if (!tid) throw new Error('No topic ID');

  await fetch(SB_URL+'/rest/v1/madhhab_rulings', {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=minimal'},
    body: JSON.stringify({
      topic_id:tid, category:ruling.category,
      hanafi_position:ruling.hanafi_position, hanafi_evidence:ruling.hanafi_evidence, hanafi_sources:ruling.hadith_refs||[],
      maliki_position:ruling.maliki_position, maliki_evidence:ruling.maliki_evidence, maliki_sources:[],
      shafii_position:ruling.shafii_position, shafii_evidence:ruling.shafii_evidence, shafii_sources:[],
      hanbali_position:ruling.hanbali_position, hanbali_evidence:ruling.hanbali_evidence, hanbali_sources:[],
      jafari_position:ruling.jafari_position, zaydi_position:ruling.zaydi_position,
      ibadi_position:ruling.ibadi_position, mutazila_position:ruling.mutazila_position, salafi_position:ruling.salafi_position,
      consensus:ruling.consensus, key_disagreement:ruling.key_disagreement,
      practical_difference:ruling.practical_difference, historical_consequences:ruling.historical_consequences,
      reformist_view:ruling.reformist_view,
      quran_verses:ruling.quran_verses||[], hadith_refs:ruling.hadith_refs||[],
      reflection_questions:ruling.reflection_questions||[]
    })
  });
  return tid;
}

async function seedCat(cat) {
  stopped = false;
  const btnId = 'btn-'+cat.replace(/[^a-z]/gi,'_');
  const btn = document.getElementById(btnId);
  if (btn) btn.className = 'btn-cat active';
  const topics = CATS[cat];
  log('▶ Starting: '+cat+' ('+topics.length+' topics)');
  document.getElementById('progress').textContent = 'Seeding: '+cat;
  let done = 0;
  for (const topic of topics) {
    if (stopped) { log('⏹ Stopped','err'); return; }
    try {
      const ruling = await generateRuling(cat, topic);
      await insertRuling(ruling);
      done++; totalDone++;
      log('✓ '+topic.substring(0,55), 'ok');
    } catch(e) {
      totalErr++;
      log('✗ '+topic.substring(0,45)+': '+e.message, 'err');
    }
    updateStats();
    await new Promise(r => setTimeout(r, 3000));
  }
  catsDone++;
  if (btn) btn.className = 'btn-cat done';
  log('✅ Done: '+cat+' — '+done+'/'+topics.length, 'ok');
  updateStats();
}

  log('🚀 Seeding ALL '+Object.keys(CATS).length+' categories...');
  for (const cat of Object.keys(CATS)) {
    if (stopped) break;
    await seedCat(cat);
    await new Promise(r => setTimeout(r, 5000));
  }
  if (!stopped) { log('🎉 ALL CATEGORIES DONE!', 'ok'); document.getElementById('progress').textContent = 'Complete!'; }
}

function stopSeed() { stopped = true; log('⏹ Stop requested','err'); }

<div id="madhhab-panel">
  <div id="madhhab-panel-header">
    <span style="font-size:20px;">⚖️</span>
    <h2>Madhhab Scholar</h2>
    <button onclick="closeMadhhabPanel()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#999;">✕</button>
    <a href="madhhab.html" style="background:#B8902A;color:#fff;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:700;text-decoration:none;">Full Page ↗</a>
  </div>
  <div id="madhhab-search-bar">
    <input id="mp-search" placeholder="🔍 Search topics..." oninput="searchMadhhabPanel(this.value)">
  </div>
  <div id="madhhab-cat-bar">
    <div class="mcat-chip active" onclick="filterMadhhabCat('all', this)">All</div>
  </div>
  <div id="madhhab-panel-body">
    <div class="mloading">Loading Madhhab topics...</div>
  </div>
</div>

<script>
let _mpTopics = [];
let _mpRulings = {};
let _mpLoaded = false;
let _mpCat = 'all';
let _mpSearch = '';

async function openMadhhabPanel(topicId) {
  document.getElementById('madhhab-panel').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (!_mpLoaded) await loadMadhhabPanel();
  if (topicId) scrollToMadhhabTopic(topicId);
}

function closeMadhhabPanel() {
  document.getElementById('madhhab-panel').classList.remove('open');
  document.body.style.overflow = '';
}

async function loadMadhhabPanel() {
  try {
    // Load topics
    const res = await fetch('https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/madhhab_topics?select=id,topic,category&order=category,topic&limit=2000', {
      headers: {'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs', 'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs'}
    });
    _mpTopics = await res.json();
    _mpLoaded = true;

    // Build category filter
    const cats = [...new Set(_mpTopics.map(t => t.category))].sort();
    const catBar = document.getElementById('madhhab-cat-bar');
    cats.forEach(cat => {
      const chip = document.createElement('div');
      chip.className = 'mcat-chip';
      chip.textContent = cat;
      chip.onclick = () => filterMadhhabCat(cat, chip);
      catBar.appendChild(chip);
    });

    renderMadhhabPanel();
  } catch(e) {
    document.getElementById('madhhab-panel-body').innerHTML = '<div class="mloading">Error loading topics: ' + e.message + '</div>';
  }
}

function renderMadhhabPanel() {
  const body = document.getElementById('madhhab-panel-body');
  let topics = _mpTopics;
  if (_mpCat !== 'all') topics = topics.filter(t => t.category === _mpCat);
  if (_mpSearch) topics = topics.filter(t => t.topic.toLowerCase().includes(_mpSearch.toLowerCase()) || t.category.toLowerCase().includes(_mpSearch.toLowerCase()));

  if (topics.length === 0) { body.innerHTML = '<div class="mloading">No topics found.</div>'; return; }

  body.innerHTML = topics.slice(0, 100).map(t => `
    <div class="mtopic-card" id="mtp-${t.id}">
      <div class="mtopic-header" onclick="toggleMadhhabTopic(${t.id})">
        <div>
          <div class="mtopic-title">${escapeHtml(t.topic)}</div>
          <div class="mtopic-cat">${escapeHtml(t.category)}</div>
        </div>
        <span class="mtopic-arr" id="marr-${t.id}">▼</span>
      </div>
      <div class="mtopic-body" id="mbody-${t.id}"></div>
    </div>
  `).join('') + (topics.length > 100 ? `<div class="mloading">Showing 100 of ${topics.length} topics. Search to narrow down.</div>` : '');
}

async function toggleMadhhabTopic(id) {
  const body = document.getElementById('mbody-' + id);
  const arr = document.getElementById('marr-' + id);
  const isOpen = body.classList.contains('open');

  if (isOpen) {
    body.classList.remove('open');
    arr.classList.remove('open');
    return;
  }

  body.classList.add('open');
  arr.classList.add('open');

  if (_mpRulings[id]) { body.innerHTML = _mpRulings[id]; return; }

  body.innerHTML = '<div style="color:#aaa;padding:8px;font-size:13px;">Loading ruling...</div>';

  try {
    const res = await fetch(`https://ylosytbxpzxzwfzjpaej.supabase.co/rest/v1/madhhab_rulings?topic_id=eq.${id}&select=hanafi_position,maliki_position,shafii_position,hanbali_position,jafari_position,zaydi_position,ibadi_position,salafi_position,consensus,key_disagreement,historical_consequences`, {
      headers: {'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs', 'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlsb3N5dGJ4cHp4endmempwYWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNDY1MjcsImV4cCI6MjA5MTcyMjUyN30.yqigL9ILlXkQ7zi37rX3AUs7vjQBobTKuV-KzkSsAAs'}
    });
    const rulings = await res.json();
    const r = rulings[0];
    if (!r) { body.innerHTML = '<div style="color:#aaa;padding:8px;font-size:13px;">No ruling found.</div>'; return; }

    const topic = _mpTopics.find(t => t.id === id);
    const schools = [
      ['Ḥanafī', r.hanafi_position], ['Mālikī', r.maliki_position],
      ['Shāfiʿī', r.shafii_position], ['Ḥanbalī', r.hanbali_position],
      ['Jaʿfarī', r.jafari_position], ['Zaydī', r.zaydi_position],
      ['Ibāḍī', r.ibadi_position], ['Salafī', r.salafi_position]
    ].filter(([,v]) => v);

    const html = schools.map(([name, text]) => `
      <div class="mschool-row">
        <div class="mschool-name">${name}</div>
        <div class="mschool-text">${escapeHtml(text)}</div>
      </div>
    `).join('') +
    (r.consensus ? `<div class="mschool-row" style="border-left-color:#4CAF50;"><div class="mschool-name" style="color:#2E7D32;">Consensus</div><div class="mschool-text">${escapeHtml(r.consensus)}</div></div>` : '') +
    (r.historical_consequences ? `<div class="mschool-row" style="border-left-color:#c62828;"><div class="mschool-name" style="color:#c62828;">Historical Impact</div><div class="mschool-text">${escapeHtml(r.historical_consequences)}</div></div>` : '') +
    `<a href="madhhab.html?topic=${id}" class="mopen-full">Open Full Page ↗</a>`;

    _mpRulings[id] = html;
    body.innerHTML = html;
  } catch(e) {
    body.innerHTML = '<div style="color:#c62828;padding:8px;font-size:13px;">Error: ' + e.message + '</div>';
  }
}

function filterMadhhabCat(cat, el) {
  _mpCat = cat;
  document.querySelectorAll('.mcat-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  renderMadhhabPanel();
}

function searchMadhhabPanel(q) {
  _mpSearch = q;
  renderMadhhabPanel();
}

function scrollToMadhhabTopic(id) {
  const el = document.getElementById('mtp-' + id);
  if (el) { el.scrollIntoView({behavior:'smooth'}); toggleMadhhabTopic(id); }
}

// Allow other pages to open panel with a topic
window.openMadhhabPanel = openMadhhabPanel;
</script>
</body>
